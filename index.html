<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerencial Comercial</title>
<script>/* aplica o tema salvo antes de pintar a tela, pra não piscar branco */
(function(){try{var t=localStorage.getItem('gc_tema');
if(!t)t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Institucional: superfícies neutras, marca dessaturada e fundo de chip quase branco —
     como os chips já têm borda, eles passam a ler como contornados em vez de preenchidos. */
  --wine:#7A2233;--wine-d:#5E1A27;--wine-l:#F3EDEE;--wine-ll:#FAF7F7;
  --cream:#EFEEEC;--card:#FFFFFF;--border:#DCD9D5;--border-l:#E7E4E0;
  --text:#1C1B1A;--muted:#87837E;--muted-l:#B3AFAA;
  --green:#1F5741;--green-bg:#F1F6F3;--green-b:#BCD2C8;
  --amber:#8A6320;--amber-bg:#F8F5EF;--amber-b:#DDD0B8;
  --red:#8C2F2F;--red-bg:#F9F2F2;--red-b:#D9BDBD;
  --blue:#2F6795;--blue-bg:#F1F4F7;--blue-b:#C2CFDA;
  --purple:#5E5896;--purple-bg:#F3F2F7;--purple-b:#CBC8DE;
  --surf2:#F7F6F4;--surf3:#EFEEEC;--hover:#F7F6F4;--accent-b:#C9C4BE;
  --sb:#2E2523;--sb-txt:rgba(233,229,226,.72);
}
/* ══ MODO ESCURO ══ */
html[data-theme="dark"]{
  --wine:#D4586C;--wine-d:#EE93A2;--wine-l:#3B1F25;--wine-ll:#2A1519;
  --cream:#141011;--card:#1E1719;--border:#3A2D30;--border-l:#2E2427;
  --text:#F2E8E6;--muted:#B49AA1;--muted-l:#7D686E;
  --green:#4FD1A5;--green-bg:#12332C;--green-b:#2C6153;
  --amber:#F0B355;--amber-bg:#332612;--amber-b:#6B5121;
  --red:#F08A8A;--red-bg:#3A1E1E;--red-b:#6E3838;
  --blue:#6FB2F0;--blue-bg:#12283C;--blue-b:#2E5580;
  --purple:#A9A2F5;--purple-bg:#221F3D;--purple-b:#4A4590;
  --surf2:#251D1F;--surf3:#2A2124;--hover:#2C2224;--accent-b:#7A4A54;
  --sb:#241417;--sb-txt:rgba(242,232,230,.72);
  color-scheme:dark;
}
html[data-theme="dark"] body{background:var(--cream);color:var(--text)}
/* sombras claras não funcionam no escuro */
html[data-theme="dark"] .opp-card:hover,html[data-theme="dark"] .prio-item:hover,html[data-theme="dark"] .kb-card:hover{box-shadow:0 3px 14px rgba(0,0,0,.5)}
html[data-theme="dark"] .login-box,html[data-theme="dark"] .modal{box-shadow:0 24px 64px rgba(0,0,0,.6)}
html[data-theme="dark"] .topbar{box-shadow:0 1px 0 var(--border)}
/* campos de formulário */
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--surf2);color:var(--text);border-color:var(--border)}
html[data-theme="dark"] input::placeholder,html[data-theme="dark"] textarea::placeholder{color:var(--muted-l)}
/* remapeia as cores fixas que vivem em style="" gerado pelo JS */
html[data-theme="dark"] [style*="background:#fff"]{background:var(--card)!important}
/* o banner de boletas continua vinho escuro nos dois temas — o que está dentro dele não inverte */
html[data-theme="dark"] #banner-boletas [style*="background:#fff"]{background:#fff!important}
html[data-theme="dark"] [style*="background:#FBF6EE"],
html[data-theme="dark"] [style*="background:#FCFAF8"],
html[data-theme="dark"] [style*="background:#FAF5F3"],
html[data-theme="dark"] [style*="background:#FBF8F4"]{background:var(--surf2)!important}
html[data-theme="dark"] [style*="background:#FEF9F0"],
html[data-theme="dark"] [style*="background:#FDF6EC"],
html[data-theme="dark"] [style*="background:#FEF3E2"]{background:var(--amber-bg)!important}
html[data-theme="dark"] [style*="background:#FCEBEB"]{background:var(--red-bg)!important}
html[data-theme="dark"] [style*="background:#E1F5EE"]{background:var(--green-bg)!important}
html[data-theme="dark"] [style*="#F5E3C2"],
html[data-theme="dark"] [style*="#F0DDBE"],
html[data-theme="dark"] [style*="#E8D9C4"]{border-color:var(--amber-b)!important}
html[data-theme="dark"] [style*="color:#085041"],
html[data-theme="dark"] [style*="color:#0F6E56"]{color:var(--green)!important}
html[data-theme="dark"] [style*="color:#854F0B"],
html[data-theme="dark"] [style*="color:#6B5310"],
html[data-theme="dark"] [style*="color:#8A6A3B"]{color:var(--amber)!important}
html[data-theme="dark"] [style*="color:#A32D2D"],
html[data-theme="dark"] [style*="color:#791F1F"]{color:var(--red)!important}
html[data-theme="dark"] [style*="color:#0C447C"],
html[data-theme="dark"] [style*="color:#185FA5"]{color:var(--blue)!important}
html[data-theme="dark"] [style*="color:#B0A89C"]{color:var(--muted)!important}
/* o banner de boletas e a sidebar já são escuros — só suavizamos */
html[data-theme="dark"] [style*="background:#7A2436"]{background:#4A1A24!important}
.theme-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:14px;line-height:1;cursor:pointer;padding:5px 9px;border-radius:5px;transition:all .15s}
.theme-btn:hover{background:var(--surf2);color:var(--text);border-color:var(--accent-b)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);font-size:14px;min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--sb);position:relative;overflow:hidden;padding:24px}
#login-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.login-wrap{position:relative;display:flex;align-items:center;gap:48px;flex-wrap:wrap;justify-content:center;max-width:900px;width:100%}
.login-msg{flex:1;min-width:280px;max-width:420px}
.login-msg .lm-tag{font-size:11px;font-weight:700;letter-spacing:.16em;color:#EF9F27;text-transform:uppercase;margin-bottom:16px}
.login-msg .lm-frase{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.35;color:#F5E9E3}
.login-msg .lm-sub{font-size:13px;color:rgba(245,233,227,.6);margin-top:18px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:38px 34px;max-width:340px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.35);text-align:center;position:relative}
@media(max-width:760px){
  .login-wrap{gap:26px}
  .login-msg{text-align:center;max-width:340px}
  .login-msg .lm-frase{font-size:22px}
  .login-msg #lm-logo{margin-left:auto;margin-right:auto}
}
.login-icon{font-size:52px;margin-bottom:14px;display:block}
.login-box h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .2s}
.pin-dot.on{background:var(--wine);border-color:var(--wine);transform:scale(1.1)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:230px;margin:0 auto 14px}
.pin-btn{padding:15px;border-radius:4px;border:1px solid var(--border);background:var(--card);font-size:20px;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s;user-select:none}
.pin-btn:hover{background:var(--wine-l);border-color:var(--wine);color:var(--wine)}
.pin-btn:active{transform:scale(.93)}
.pin-btn.del{color:var(--muted);font-size:16px}
#login-err{color:var(--red);font-size:12px;min-height:18px;margin-top:4px}
.login-checking{color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}

/* ── APP ── */
#app{display:none}
#app[style*="block"]{min-height:100vh}
.sidebar{width:58px;flex-shrink:0;background:var(--sb);display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;z-index:100;overflow:hidden;transition:width .18s ease;box-shadow:2px 0 12px rgba(74,14,22,.15)}
.sidebar:hover{width:200px;box-shadow:4px 0 24px rgba(74,14,22,.35)}
.sb-brand{padding:16px 0 12px;border-bottom:1px solid rgba(245,233,227,.15);display:flex;align-items:center;gap:10px;min-height:62px}
.sb-mini{width:34px;height:34px;border-radius:6px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;margin-left:12px}
.sb-brand h1{font-size:14px;font-weight:700;color:#fff;line-height:1.2;white-space:nowrap;opacity:0;transition:opacity .15s}
.sidebar:hover .sb-brand h1{opacity:1}
.sb-nav{flex:1;padding:12px 9px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden}
.main{min-width:0;width:auto;display:flex;flex-direction:column;margin-left:58px}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-brand h1{font-size:16px;font-weight:700;color:var(--text)}
.topbar-date{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-pill{display:flex;align-items:center;gap:6px;background:var(--wine-l);border:1px solid var(--accent-b);border-radius:4px;padding:4px 12px 4px 6px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--wine);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-name{font-size:12px;font-weight:600;color:var(--wine-d)}
.btn-logout{font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;padding:4px 8px;border-radius:4px}
.btn-logout:hover{background:var(--border-l);color:var(--text)}

/* ── NAV ── */
.nav{display:none}
.nav-tab{display:flex;align-items:center;gap:10px;padding:10px 0 10px 11px;font-size:13px;font-weight:600;color:var(--sb-txt);background:none;border:none;border-radius:6px;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;white-space:nowrap}
.nav-tab:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-tab.active{background:var(--wine);color:#fff}
.tab-ico{width:18px;flex-shrink:0;text-align:center;font-size:15px}
.tab-lb{opacity:0;transition:opacity .15s}
.sidebar:hover .tab-lb{opacity:1}
.nav-tab .badge{background:#fff;color:var(--wine);border-radius:4px;font-size:10px;padding:1px 6px;font-weight:700;margin-left:auto;margin-right:10px;opacity:0;transition:opacity .15s}
.sidebar:hover .nav-tab .badge{opacity:1}

/* ── CONTENT ── */
.content{padding:22px 26px;max-width:none;width:100%}

/* ── DIRECTOR DASHBOARD ── */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--border)}
.kpi.wine::before{background:var(--wine)}
.kpi.green::before{background:var(--green)}
.kpi.amber::before{background:#EF9F27}
.kpi.blue::before{background:#378ADD}
.kpi.purple::before{background:#7F77DD}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:700;color:var(--text);line-height:1}
.kpi.wine .kpi-val{color:var(--wine-d)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}

.area-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.area-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px 16px;border-left:3px solid var(--wine)}
.area-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-l);border:1px solid var(--border-l);border-radius:4px;overflow:hidden;margin-bottom:2px}
.area-cell{background:var(--surf2);padding:7px 4px;text-align:center}
.area-cell-l{font-size:8px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.area-cell-v{font-size:12px;font-weight:600;color:var(--text);margin-top:2px}
.area-empty{font-size:13px;color:var(--muted-l);padding:6px 0}

/* ── MEDIDOR COMPACTO POR PRODUTO (boletado sobre a trilha do pipe) ── */
.mgrp{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-l)}
.mgrp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.mgrp-t{font-size:12.5px;font-weight:700;color:var(--gc)}
.mgrp-v{font-size:13px;font-weight:700;color:var(--gc);white-space:nowrap}
.mgrp-p{font-size:10px;color:var(--muted);font-weight:400;margin-left:3px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.mrow:last-child{margin-bottom:0}
.mname{font-size:11px;font-weight:600;color:var(--text);width:82px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{flex:1;height:12px;position:relative;min-width:36px}
.mtrack{position:absolute;left:0;top:0;height:12px;border-radius:6px}
.mfill{position:absolute;left:0;top:3px;height:6px;border-radius:3px}
.mval{width:108px;flex-shrink:0;text-align:right;font-size:10.5px;white-space:nowrap}
.mval b{font-size:11px;font-weight:700}
.mval span{color:var(--muted);font-size:9.5px}
.mempty{font-size:12px;color:var(--muted)}
@media(max-width:420px){.mname{width:64px}.mval{width:92px;font-size:10px}}
.area-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.area-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.area-dot{width:10px;height:10px;border-radius:50%}
.area-bol{font-size:28px;font-weight:700;margin-bottom:4px}
.area-bol-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.area-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.area-stat{background:var(--cream);border-radius:4px;padding:8px;text-align:center}
.area-stat-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.area-stat-v{font-size:15px;font-weight:700;color:var(--text)}
.prog-wrap{margin-top:12px}
.prog-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:6px;border-radius:3px;transition:width .6s ease}
.prog-lbl{font-size:10px;color:var(--muted);text-align:right;margin-top:3px}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px}
.chart-card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative;height:220px}

.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── TABLE ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surf2);color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border-l);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hover)}
tr.bol td{background:var(--green-bg)}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-b)}
.b-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-b)}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-b)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b)}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-b)}
.b-wine{background:var(--wine-l);color:var(--wine-d);border:1px solid var(--accent-b)}
.b-gray{background:var(--surf2);color:var(--muted);border:1px solid var(--border)}
.b-teal{background:var(--green-bg);color:var(--green);border:1px solid var(--green-b)}

/* ── ASSESSOR CARDS ── */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.opp-card{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:all .2s}
.opp-card:hover{box-shadow:0 4px 20px rgba(139,28,42,.1);border-color:var(--accent-b)}
.opp-card.bol{border-left:4px solid var(--green);background:linear-gradient(to right,#F0FBF6,var(--card))}
.opp-card-header{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.opp-client{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.opp-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opp-card-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.opp-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opp-row-l{color:var(--muted);font-weight:500}
.opp-row-v{font-weight:600;color:var(--text)}
.opp-vol{font-size:18px;font-weight:700;color:var(--wine-d)}
.opp-obs{font-size:11px;color:var(--muted);font-style:italic;padding:8px 12px;background:var(--cream);border-radius:4px;margin:0 16px 10px;border-left:3px solid var(--border)}
.opp-actions{padding:10px 16px;background:var(--surf2);border-top:1px solid var(--border-l);display:flex;gap:6px;flex-wrap:wrap}
.opp-btn{padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.opp-btn.sc{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b)}
.opp-btn.sc:hover{background:var(--blue);color:#fff}
.opp-btn.bol{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.opp-btn.bol:hover{background:var(--green);color:#fff}
.opp-btn.obs{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.opp-btn.obs:hover{background:var(--amber);color:#fff}
.opp-btn.todo{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-b)}
.opp-btn.todo:hover{background:var(--purple);color:#fff}

/* ── COCKPIT / KANBAN ── */
.cockpit-hero{background:#5C1220;border-radius:4px;padding:22px 26px;color:#fff;margin-bottom:20px;box-shadow:0 8px 24px rgba(139,28,42,.2)}
.cockpit-hello{font-size:20px;font-weight:700}
.cockpit-sub{font-size:12px;opacity:.85;margin-top:2px}
.cockpit-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.cockpit-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:10px 14px;text-align:center}
.cockpit-stat-v{font-size:22px;font-weight:700}
.cockpit-stat-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-top:2px}
.prio-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin-bottom:8px;transition:all .15s}
.prio-item:hover{border-color:var(--accent-b);box-shadow:0 2px 12px rgba(139,28,42,.08)}
.prio-flag{width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prio-info{flex:1;min-width:0}
.prio-cli{font-size:13px;font-weight:700}
.prio-acao{font-size:12px;color:var(--muted);margin-top:2px}
.prio-vol{font-size:14px;font-weight:700;color:var(--wine-d);white-space:nowrap}
.tb-semana td,.tb-semana th{color:#fff !important;background:transparent;border:none}
.tb-semana tr:hover td{background:transparent !important}
.kb-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kb-col{min-width:262px;max-width:262px;background:var(--surf3);border-radius:6px;padding:10px;flex-shrink:0}
.kb-col-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kb-count{background:var(--card);border-radius:4px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--muted)}
.kb-add-etapa{width:100%;padding:14px 10px;background:transparent;border:2px dashed var(--border);border-radius:6px;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.03em;transition:all .15s}
.kb-add-etapa:hover{border-color:var(--wine);color:var(--wine)}
.kb-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:grab;transition:all .15s}
.kb-card:active{cursor:grabbing}
.kb-col{transition:background .15s,transform .15s}
.kb-card:hover{border-color:var(--accent-b);box-shadow:0 3px 10px rgba(139,28,42,.1);transform:translateY(-1px)}
.kb-cli{font-size:12px;font-weight:700;line-height:1.3}
.kb-meta{font-size:10px;color:var(--muted);margin-top:3px}
.kb-vol{font-size:13px;font-weight:700;color:var(--wine-d);margin-top:5px}
.kb-adv{width:100%;margin-top:8px;padding:5px;border-radius:4px;border:1px solid var(--border);background:var(--cream);font-size:10px;font-weight:700;cursor:pointer;color:var(--text);transition:all .15s}
.kb-adv:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
.kb-adv.bol{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.kb-adv.bol:hover{background:var(--green);color:#fff}

/* ── DAILY ── */
.daily-header{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:20px}
.daily-title{font-size:18px;font-weight:700;margin-bottom:4px}
.daily-subtitle{font-size:12px;color:var(--muted)}
.daily-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.daily-kpi{text-align:center;padding:12px;background:var(--cream);border-radius:6px}
.daily-kpi-v{font-size:22px;font-weight:700;color:var(--wine-d)}
.daily-kpi-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:2px}

.day-group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.day-group-count{background:currentColor;border-radius:4px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;opacity:.9}

.daily-opp{background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.daily-opp.sel{border-color:var(--wine);background:var(--wine-ll)}
.daily-opp-top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.daily-check{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--card)}
.daily-check.on{background:var(--wine);border-color:var(--wine)}
.daily-check.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.daily-info{flex:1}
.daily-cli{font-size:13px;font-weight:700}
.daily-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.daily-vol{font-size:13px;font-weight:700;color:var(--wine-d)}
.daily-actions{padding:10px 14px;background:var(--surf2);border-top:1px solid var(--border-l);display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.sel-tipo{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer}
select.sel-tipo:focus{outline:none;border-color:var(--wine)}
input.inp-acao{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit}
input.inp-acao:focus{outline:none;border-color:var(--wine)}

/* ── DAILY v2: banner + resumo do dia + quadrantes ── */
.dbanner{background:linear-gradient(135deg,#4A0E16,#7A1220 60%,#8B1C2A);border-radius:8px;padding:20px 22px;color:#fff;margin-bottom:20px;position:relative;overflow:hidden}
.dbanner::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.05)}
.dbanner-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.dbanner-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.dbanner-title{font-size:19px;font-weight:700}
.dstreak{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;white-space:nowrap}
.dstats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.dstat{background:rgba(255,255,255,.08);border-radius:8px;padding:9px 13px}
.dstat .v{font-size:21px;font-weight:700;line-height:1.15}
.dstat .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.75;margin-top:2px}
.dprog-wrap{display:flex;align-items:center;gap:12px}
.dprog-bar{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.dprog-fill{height:100%;background:#fff;border-radius:6px;transition:width .5s ease}
.dprog-txt{font-size:11px;font-weight:700;white-space:nowrap;opacity:.9}

.dlog-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:20px}
.dlog-quad{margin-bottom:16px}
.dlog-quad .dquad-body{gap:0;padding:12px 16px}
.dlog-empty{font-size:12px;color:var(--muted-l);text-align:center;padding:8px 0}
.dlog-item{display:flex;align-items:flex-start;gap:10px;font-size:12px;border-bottom:1px solid var(--border-l);padding-bottom:8px;margin-bottom:8px}
.dlog-item:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0}
.dlog-txt{flex:1;line-height:1.5}
.dlog-txt b{color:var(--text)}
.dlog-txt .d{color:var(--muted);display:block;font-size:11px;margin-top:1px}

.dquads{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:820px){.dquads{grid-template-columns:1fr}.dstats-row{grid-template-columns:1fr}}
.dquad{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.dquad-hdr{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);border-left:4px solid var(--qc)}
.dquad-title{font-size:13px;font-weight:700;flex:1}
.dquad-cnt{font-size:11px;font-weight:700;background:var(--qbg);color:var(--qc);border-radius:10px;padding:2px 9px}
.dquad-val{font-size:12px;font-weight:700;color:var(--qc)}
.dquad-hdr{cursor:pointer}
.dquad.vazio .dquad-hdr{cursor:default}
.dquad-chev{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0;width:14px;text-align:center;line-height:1}
.dquad.open .dquad-chev{transform:rotate(180deg)}
.dquad-body{display:none;padding:8px;flex-direction:column;gap:6px;min-height:36px}
.dquad.open .dquad-body,.dquad.vazio .dquad-body{display:flex}
.dquad-empty{font-size:11px;color:var(--muted-l);text-align:center;padding:14px 0}

/* card da oportunidade dentro do quadrante */
.oppd-row{border:1px solid var(--border);border-left:3px solid var(--qc);border-radius:8px;background:var(--card);box-shadow:0 1px 3px rgba(26,5,8,.05);transition:box-shadow .15s,transform .15s}
.oppd-row:hover{box-shadow:0 4px 14px rgba(26,5,8,.1);transform:translateY(-1px)}
html[data-theme="dark"] .oppd-row{box-shadow:0 1px 3px rgba(0,0,0,.4)}
html[data-theme="dark"] .oppd-row:hover{box-shadow:0 4px 16px rgba(0,0,0,.55)}
.oppd-row.done-hoje{background:var(--surf2)}
.oppd-top{padding:10px 11px;cursor:pointer}
.oppd-l1{display:flex;align-items:center;gap:9px}
.oppd-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;background:var(--card);transition:all .15s}
.oppd-check:hover{border-color:var(--green);color:var(--green-b)}
.oppd-check.done{background:var(--green);border-color:var(--green);color:#fff}
.oppd-avatar{width:26px;height:26px;border-radius:50%;background:var(--qc);color:var(--card);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.oppd-info{flex:1;min-width:0}
.oppd-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.oppd-sub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.oppd-valor{font-size:13px;font-weight:700;color:var(--qc);white-space:nowrap;flex-shrink:0}
.oppd-chev{font-size:13px;color:var(--muted);transition:transform .2s;flex-shrink:0;width:14px;text-align:center;line-height:1}
.oppd-row.open .oppd-chev{transform:rotate(180deg)}
.oppd-motivo{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--text);background:var(--qbg);border-radius:6px;padding:6px 8px;margin-top:8px;line-height:1.35}
.oppd-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.oppd-badge{font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 7px;letter-spacing:.02em;white-space:nowrap}
.oppd-detail{display:none;padding:0 11px 11px;border-top:1px solid var(--border-l);background:var(--surf2);border-radius:0 0 5px 5px}
.oppd-row.open .oppd-detail{display:block;padding-top:11px}
.oppd-nota-row{display:flex;gap:6px}
.oppd-nota-row input{flex:1;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;font-family:inherit;background:var(--card);color:var(--text)}
.oppd-nota-row input:focus{outline:none;border-color:var(--wine);background:var(--card)}
.oppd-work-toggle{margin-top:8px;font-size:10.5px;font-weight:700;color:var(--wine);cursor:pointer;display:inline-flex;align-items:center;gap:4px;user-select:none}
.oppd-work-toggle:hover{text-decoration:underline}
.oppd-work{display:none;margin-top:8px;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px}
.oppd-work.open{display:block}
.oppd-work-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.oppd-work-field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:3px}
.oppd-work-field label{font-size:9.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.oppd-work-field select,.oppd-work-field input{border:1px solid var(--border);border-radius:6px;padding:6px 7px;font-size:11.5px;font-family:inherit;background:var(--card);color:var(--text)}
.oppd-work-ftr{display:flex;gap:8px;align-items:center}
.oppd-full{font-size:10.5px;color:var(--muted);text-decoration:underline;cursor:pointer;flex-shrink:0;white-space:nowrap}

/* ── GERENCIAL DO ASSESSOR (meta × levantado × realizado) ── */
.ger-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.ger-kpi{background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:11px 13px;border-top:3px solid var(--kc)}
.ger-kpi .l{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ger-kpi .v{font-size:19px;font-weight:700;color:var(--kc);margin-top:3px;font-variant-numeric:tabular-nums}
.ger-kpi .s{font-size:10px;color:var(--muted);margin-top:2px}
.ger-seg{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.ger-seg-h{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;background:var(--card)}
.ger-seg-h:hover{background:var(--hover)}
.ger-seg-nm{font-size:12.5px;font-weight:700;flex:1;min-width:0}
.ger-seg-n{font-size:10px;color:var(--muted);font-weight:600}
.ger-barra{position:relative;height:20px;background:var(--border);border-radius:4px;overflow:visible;margin-top:7px}
.ger-lev{position:absolute;left:0;top:0;height:20px;background:var(--blue-b);border-radius:4px}
.ger-real{position:absolute;left:0;top:0;height:20px;border-radius:4px}
.ger-meta-marca{position:absolute;top:-3px;width:3px;height:26px;background:var(--text);border-radius:2px}
.ger-legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:6px}
.ger-legenda b{font-variant-numeric:tabular-nums}
.ger-chip{font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}
.ger-opps{border-top:1px solid var(--border-l);background:var(--surf2);padding:4px 13px 10px;display:none}
.ger-seg.open .ger-opps{display:block}
.ger-opp{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border-l);font-size:11.5px}
.ger-opp:last-child{border-bottom:none}
.ger-opp-nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ger-opp-st{font-size:9.5px;color:var(--muted);white-space:nowrap}
.ger-opp-v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ger-vazio{font-size:11px;color:var(--muted);padding:8px 0}

/* ── QUADRO DE ACORDOS ── */
.area-card.clicavel{cursor:pointer;transition:box-shadow .15s,transform .15s}
.area-card.clicavel:hover{box-shadow:0 6px 20px rgba(26,5,8,.12);transform:translateY(-2px)}
html[data-theme="dark"] .area-card.clicavel:hover{box-shadow:0 6px 20px rgba(0,0,0,.55)}
.ba-sec{margin-bottom:18px}
.ba-hdr{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ba-hdr .t{font-size:12.5px;font-weight:700;color:var(--bc)}
.ba-hdr .n{font-size:10px;font-weight:700;background:var(--bbg);color:var(--bc);border-radius:10px;padding:1px 8px}
.ba-hdr .v{margin-left:auto;font-size:13px;font-weight:700;color:var(--bc);font-variant-numeric:tabular-nums}
.ba-tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.ba-tbl th{background:var(--surf2);color:var(--muted);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:6px 9px;white-space:nowrap}
.ba-tbl th.r,.ba-tbl td.r{text-align:right}
.ba-tbl td{padding:7px 9px;border-bottom:1px solid var(--border-l);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.ba-tbl tr{cursor:pointer}
.ba-tbl tbody tr:hover td{background:var(--hover)}
.ba-tbl td.val{font-weight:700;font-variant-numeric:tabular-nums}
.ba-vazio{font-size:11.5px;color:var(--muted);padding:8px 0}
.quadro-ass{transition:box-shadow .15s,transform .15s}
.quadro-ass:hover{box-shadow:0 6px 20px rgba(26,5,8,.12);transform:translateY(-2px)}
html[data-theme="dark"] .quadro-ass:hover{box-shadow:0 6px 20px rgba(0,0,0,.55)}
.acordo-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:72vh}
.acordo-tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;min-width:840px}
.acordo-tbl th,.acordo-tbl td{padding:0;border-bottom:1px solid var(--border-l);border-right:1px solid var(--border-l);white-space:nowrap}
.acordo-tbl thead th{position:sticky;top:0;z-index:3;background:var(--wine);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;text-align:right;border-bottom:none}
.acordo-tbl thead th.lft{text-align:left}
.acordo-tbl thead th.ai{left:0;z-index:4;min-width:190px}
.acordo-tbl tbody td.ai{position:sticky;left:0;z-index:2;background:var(--surf2);font-weight:700;font-size:11.5px;padding:0 10px;color:var(--text)}
.acordo-tbl tbody tr:hover td{background:var(--hover)}
.acordo-tbl tbody tr:hover td.ai{background:var(--wine-l)}
.acordo-tbl td.inv{text-align:center;width:74px}
.acordo-tbl td.inv input{width:16px;height:16px;cursor:pointer;accent-color:var(--wine)}
.ac-in{width:100%;border:none;background:transparent;font-family:inherit;font-size:12px;color:var(--text);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
.ac-in:focus{outline:2px solid var(--wine);outline-offset:-2px;background:var(--card);border-radius:3px}
.ac-in::placeholder{color:var(--muted-l)}
.ac-in.preenchido{font-weight:700}
/* resumo por segmento — fica acima da tabela, como as linhas Metas/Acordos da planilha */
.ac-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ac-seg{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--wine);border-radius:6px;padding:10px 12px}
.ac-seg-t{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-seg-v{font-size:17px;font-weight:700;color:var(--text);margin-top:3px;font-variant-numeric:tabular-nums}
.ac-seg-m{display:flex;align-items:center;gap:5px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.ac-seg-m label{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;flex-shrink:0}
.ac-seg-m input{flex:1;min-width:0;border:1px solid var(--border);border-radius:4px;background:var(--surf2);color:var(--text);font-family:inherit;font-size:11px;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums}
.ac-seg-m input:focus{outline:none;border-color:var(--wine);background:var(--card)}
.ac-delta{font-size:10px;font-weight:700;margin-top:5px;display:block}

/* ── FUNIL DE EFETIVIDADE ── */
.fnl{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.fnl-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.fnl-lbl{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.fnl-per{font-size:11.5px;color:var(--muted-l);margin-top:2px}
.fnl-rec{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.fnl-rec span{font-size:10px;font-weight:700;background:var(--wine-l);color:var(--wine);border:1px solid var(--accent-b);border-radius:10px;padding:1px 9px}
.fnl-chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.fnl-chip{font-size:11px;font-weight:600;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:5px;padding:4px 11px;cursor:pointer;font-family:inherit}
.fnl-chip:hover{border-color:var(--accent-b);color:var(--text)}
.fnl-chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.fnl-et{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:14px;padding:8px 0}
.fnl-et.clic{cursor:pointer;border-radius:6px;margin:0 -8px;padding:8px;transition:background .12s}
.fnl-et.clic:hover{background:var(--hover)}
.fnl-et.clic:hover .fnl-barra{filter:brightness(1.08)}
.fnl-et.clic .fnl-nm small::after{content:' · ver lista';color:var(--muted-l);opacity:0}
.fnl-et.clic:hover .fnl-nm small::after{opacity:1}
.fn-ev{font-size:11px;color:var(--muted)}
.mk{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;
    border:1px dashed var(--accent-b);color:var(--muted-l);background:transparent;cursor:pointer;user-select:none;
    white-space:nowrap;transition:all .12s}
.mk:hover{border-style:solid;border-color:var(--wine);color:var(--wine)}
.mk.on{background:var(--green-bg);border:1px solid var(--green-b);color:var(--green)}
.mk.on::before{content:'✓ '}
.mk.lg{font-size:11.5px;padding:6px 12px}
.ag{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.ag-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ag-tit{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.ag-tit small{font-size:10.5px;font-weight:400;color:var(--muted)}
.ag-nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.ag-nav button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:5px;
  padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer}
.ag-nav button:hover{border-color:var(--wine);color:var(--wine)}
.ag-mes{font-size:12px;font-weight:700;min-width:132px;text-align:center}
.ag-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-bottom:13px}
.ag-real{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px;align-items:stretch}
.ag-rt{flex:1;min-width:340px;border-collapse:collapse;font-size:12px}
.ag-rt th{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
  text-align:right;padding:0 10px 5px;border-bottom:1px solid var(--border)}
.ag-rt th:first-child{text-align:left}
.ag-rt td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border-l);font-variant-numeric:tabular-nums;
  font-weight:700;font-size:15px}
.ag-rt td:first-child{text-align:left;font-weight:600;font-size:12px;color:var(--muted)}
.ag-rt td.zero{color:var(--muted-l);font-weight:400}
.ag-rt tr.mes td{background:var(--surf2);font-size:18px}
.ag-rt tr.mes td:first-child{font-weight:700;color:var(--text)}
.ag-rt tr.fora td{opacity:.4}
.ag-rt .per{font-size:9.5px;font-weight:400;color:var(--muted-l);display:block}
.ag-rt .vv{font-size:9.5px;font-weight:600;color:var(--green);display:block}
.ag-kpi{border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:var(--surf2)}
.ag-kpi .k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ag-kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.ag-kpi .s{font-size:10px;color:var(--muted)}
.ag-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ag-dow{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;padding-bottom:2px}
.ag-cel{border:1px solid var(--border-l);border-radius:6px;min-height:64px;padding:4px 5px;background:var(--card);
  display:flex;flex-direction:column;gap:2px;align-items:stretch;overflow:hidden}
.ag-item{font-size:9.5px;font-weight:600;line-height:1.3;border-radius:3px;padding:1px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ag-item.l{background:var(--wine-l);color:var(--wine)}
.ag-item.r{background:var(--blue-bg);color:var(--blue)}
.ag-item.furo{background:var(--red-bg);color:var(--red)}
.ag-item.ok::before{content:'✓ '}
.ag-mais{font-size:9px;color:var(--muted-l);font-weight:700;padding-left:2px}
.ag-cel.tem{cursor:pointer}
.ag-cel.tem:hover{border-color:var(--wine);background:var(--hover)}
.ag-cel.fora{opacity:.32}
.ag-cel.hoje{border:1.5px solid var(--wine);background:var(--wine-ll)}
.ag-cel.sel{border:1.5px solid var(--wine);box-shadow:0 0 0 2px var(--wine-l)}
.ag-num{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-cel.hoje .ag-num{color:var(--wine)}
.ag-tag{font-size:9.5px;font-weight:700;border-radius:4px;padding:1px 5px;white-space:nowrap}
.ag-tag.l{background:var(--wine-l);color:var(--wine)}
.ag-tag.r{background:var(--blue-bg);color:var(--blue)}
.ag-tag.pend{background:var(--red-bg);color:var(--red)}
.ag-lista{margin-top:12px;border-top:1px solid var(--border-l);padding-top:11px}
.ag-lin{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--border-l);flex-wrap:wrap}
.ag-lin .cli{font-weight:700;font-size:12.5px;cursor:pointer}
.ag-lin .cli:hover{color:var(--wine);text-decoration:underline}
.ag-lin .sub{font-size:10.5px;color:var(--muted)}
.ag-lin .vol{margin-left:auto;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.ag-nota{font-size:10.5px;color:var(--muted);margin-top:9px;line-height:1.45}
.ba-tbl td.fn-prova{white-space:normal;max-width:250px;line-height:1.35}
.fn-quando{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fnl-nm{font-size:12.5px;font-weight:700}
.fnl-nm small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:1px}
.fnl-trilho{position:relative;height:26px;background:var(--surf2);border-radius:3px;overflow:hidden}
.fnl-barra{position:absolute;left:0;top:0;height:26px;border-radius:3px;display:flex;align-items:center;padding-left:11px;transition:width .6s ease}
.fnl-barra b{font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.fnl-dir{text-align:right;font-size:11.5px;color:var(--muted)}
.fnl-dir b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.fnl-passo{display:grid;grid-template-columns:150px 1fr 150px;gap:14px}
.fnl-mid{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);padding-left:11px;flex-wrap:wrap}
.fnl-seta{color:var(--muted-l);font-size:13px;line-height:1}
.fnl-taxa{font-weight:800;font-variant-numeric:tabular-nums}
.fnl-perda{color:var(--red);font-size:10.5px}
.fnl-nota{font-size:11.5px;color:var(--muted);background:var(--surf2);border:1px solid var(--border-l);border-radius:7px;padding:10px 13px;margin-top:14px;line-height:1.5}
.fnl-nota strong{color:var(--text)}
.fnl-obs{display:block;margin-top:5px;font-size:10.5px;color:var(--muted-l)}
@media(max-width:760px){
  .fnl-et,.fnl-passo{grid-template-columns:110px 1fr}
  .fnl-dir{display:none}
}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,5,8,.35);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:8px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(139,28,42,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hdr h2{font-size:16px;font-weight:700}
.modal-x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal-x:hover{color:var(--text)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--wine)}
.fg textarea{min-height:72px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ftr{display:flex;gap:8px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border)}
.btn{padding:8px 18px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--cream)}
.btn.wine{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.wine:hover{background:var(--wine-d)}
.btn.sm{padding:5px 12px;font-size:11px}

/* ── MISC ── */
.mini-bar{height:4px;background:var(--border);border-radius:3px;margin-top:5px;overflow:hidden}
.mini-fill{height:4px;border-radius:3px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:12px;color:var(--muted);text-align:center;padding:40px}
.empty-icon{font-size:40px;opacity:.4}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--wine);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--wine);color:#fff;font-size:12px;font-weight:600;padding:10px 20px;border-radius:6px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:300px;box-shadow:0 4px 20px rgba(139,28,42,.3)}
.hist-item{font-size:11px;padding:6px 0;border-bottom:1px solid var(--border-l);color:var(--muted);line-height:1.5}
.hist-item:last-child{border:none}
.hist-item strong{color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-sel{padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.filter-sel:focus{border-color:var(--wine)}
.filter-inp{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;outline:none;flex:1;min-width:140px}
.filter-inp:focus{border-color:var(--wine)}
.upload-card{background:var(--card);border:2px dashed var(--border);border-radius:6px;padding:28px;text-align:center;cursor:pointer;transition:all .2s}
.upload-card:hover{border-color:var(--wine);background:var(--wine-ll)}
.upload-card.done{border-style:solid;border-color:var(--green-b);background:var(--green-bg)}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-title{font-size:14px;font-weight:700;margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted)}
.upload-status{font-size:12px;font-weight:600;margin-top:10px;min-height:18px}
@media(max-width:768px){
  .charts-row,.area-cards{grid-template-columns:1fr}
  .opp-grid{grid-template-columns:1fr}
  .daily-kpis{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
}
@media(max-width:860px){
  .sidebar{position:static;width:100%;height:auto;flex-direction:column;overflow:visible;box-shadow:none}
  .sidebar:hover{width:100%}
  .sb-brand{padding:12px 16px 8px;border-bottom:none;min-height:auto}
  .sb-brand h1{opacity:1}
  .sb-brand h1 br{display:none}
  .sb-nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px;gap:6px}
  .nav-tab{width:auto;white-space:nowrap;padding:8px 12px;font-size:12px}
  .tab-lb{opacity:1}
  .main{margin-left:0}
}
</style>

function corTexto(hex){

const ASSESSORES_OFICIAIS=["ALEXANDRA NASCIMENTO","CINTIA BRAGA","DAVI GAZZANI","MATEUS CASTRO","ANDRE ALVES","FELIPE SOUZA","LUIS SILVA","ROBSON SANTANA","ADRIANE POSSATTO","ALINE BACHI","BRED KUTZ","CARLOS CASTRO","CRISTIANE ARAMIZO","EDVALDO SERROTE","FABIO CARVALHO","JOAO GABRIEL","JORGE CARREIRO","LETICIA","LIZANDRA MOREIRA","LORENZO CAPELASSO","LUCCA MELO","LUIS BAPTISTELLA","OSWALD","PAOLA SOARES","PAULO MINEHIRA","RENAN SOUZA","RICARDO SILVA","RODRIGO LAURENZANO","ROGER MEDINA","ROSANIA SCHIAVO","SHEILA BELARMINO","THAIS MARTINS","THAISE MOURA","TIAGO COPIT","ARTUR SHIGUEFUZI","AUGUSTO MORAN","DIOGO ISHIBASHI","KEVIN ALVES","LIDIANE ZANOTTO"];
const stripAcc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fixMojibake=s=>s.replace(/Ã£/g,'ã').replace(/Ã©/g,'é').replace(/Ã§/g,'ç').replace(/Ã­/g,'í').replace(/Ãº/g,'ú').replace(/Ã³/g,'ó').replace(/Ã¡/g,'á').replace(/Ãª/g,'ê').replace(/Ã¢/g,'â').replace(/Ãµ/g,'õ').replace(/Ã´/g,'ô').replace(/Ã /g,'à');
function lev1(a,b){
  // true se distância de edição <= 1
  if(a===b)return true;
  const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,diff=0;
  while(i<la&&j<lb){
    if(a[i]===b[j]){i++;j++;continue}
    diff++;if(diff>1)return false;
    if(la>lb)i++;else if(lb>la)j++;else{i++;j++}
  }
  diff+=(la-i)+(lb-j);

}

  const n=parseFloat(t);
  return isNaN(n)?0:n;
}

// ── data da boleta: aceita aaaa-mm-dd, dd/mm/aaaa, dd/mm/aa e serial do Excel ──
function parseDataBoleta(v){
  if(!v)return null;
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
  if(/^\d{5}$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+parseInt(s,10)*86400000);return d.toISOString().slice(0,10);}
  return null;
}
const localISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const amanhaISO=()=>{const d=new Date();d.setDate(d.getDate()+1);return localISO(d);};
// dia em que a boleta foi fechada: 1º a linha do tempo, 2º o updated_at
function boletadoEmISO(r){
  const hs=[...(r.historico||[])].reverse();
  for(const h of hs){
    if(norm(h.para||'').includes('boletado')&&h.data){
      const m=String(h.data).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    }
  }
  return null; // sem registro de fechamento na linha do tempo = não dá pra afirmar o dia
}
// ── dias úteis (seg-sex) do mês corrente ──
function diasUteis(){
  const hoje=new Date(),ano=hoje.getFullYear(),mes=hoje.getMonth();
  const nDias=new Date(ano,mes+1,0).getDate();
  let tot=0,ate=0;
  for(let d=1;d<=nDias;d++){
    const dw=new Date(ano,mes,d).getDay();
    if(dw===0||dw===6)continue;
    tot++;
    if(d<=hoje.getDate())ate++;
  }
  return{tot,ate,rest:Math.max(tot-ate,0)};
}

// PATCH resiliente: colunas opcionais ausentes no banco não travam o salvamento
async function patchOppSeguro(dados,filtro){
  const OPCIONAIS=['escalado_para','escala_motivo','todo_hora'];
  try{
    await db('PATCH','oportunidades',dados,filtro);
  }catch(e){
    const msg=String(e.message||'');
    const faltantes=OPCIONAIS.filter(c=>msg.includes(c));
    if(!faltantes.length)throw e;
    faltantes.forEach(c=>delete dados[c]);
    await db('PATCH','oportunidades',dados,filtro);
    showToast('⚠️ Salvo, mas o banco não tem a(s) coluna(s): '+faltantes.join(', ')+'. Peça ao diretor para rodar o SQL no Supabase.');
  }
}
async function db(method,table,data,filter){
  let url=`${SUPA}/rest/v1/${table}`;
  if(filter)url+=`?${filter}`;
  const headers={'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':'return=minimal'};
  if(method==='GET')headers['Range']='0-9999';
  const r=await fetch(url,{method,headers,body:data?JSON.stringify(data):undefined});
  if(!r.ok){const e=await r.text();throw new Error(e)}
  if(r.status===204)return null;
  return r.json();
}

// ── PRESENÇA: último acesso + online agora ──
function tempoAtras(iso){
  if(!iso)return{txt:'nunca acessou',on:false};
  const ms=Date.now()-new Date(iso).getTime();
  if(isNaN(ms))return{txt:'—',on:false};
  const min=Math.floor(ms/60000);
  if(min<3)return{txt:'Online agora',on:true};
  if(min<60)return{txt:'há '+min+' min',on:false};
  const h=Math.floor(min/60);
  if(h<24)return{txt:'há '+h+' h',on:false};
  const d=Math.floor(h/24);
  return{txt:'há '+d+' dia'+(d>1?'s':''),on:false};
}

      if(!h.data)return;
      const dp=h.data.split(' ')[0].split('/');
      if(dp.length!==3)return;
      const iso=dp[2]+'-'+String(dp[1]).padStart(2,'0')+'-'+String(dp[0]).padStart(2,'0');
      const paraN=norm(h.para||'');
      const sub=subAreaOf(r);
      if(h.campo==='Pendência boleta'&&pbFechada(h.para)&&!pbFechada(h.de)){
        acts.push({date:iso,area:r.area,sub,tipo:'boleta',valor:r.atual||r.pipe||0,usuario:h.usuario,cliente:r.cliente});
      }else if(h.campo==='Status comercial'&&paraN.includes('reuni')){
        acts.push({date:iso,area:r.area,sub,tipo:'reuniao',valor:0,usuario:h.usuario,cliente:r.cliente});
      }else if((h.campo==='Status comercial'||h.campo==='Pendência boleta')&&h.para){
        acts.push({date:iso,area:r.area,sub,tipo:'avanco',valor:0,usuario:h.usuario,cliente:r.cliente});
      }
    });
  });
  return acts;
}

function lastNDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

// tint(hex, amount 0-1) -> passo mais claro (ou mais escuro, no modo escuro) da mesma cor.
// Usado na trilha do "pipe" atrás da barra de boletado.
function tint(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(temaAtual()==='dark'){
    // no escuro a trilha desce em direção ao fundo do card, senão fica gritando
    const alvo=32;
    r=Math.round(r+(alvo-r)*amt);g=Math.round(g+(alvo-g)*amt);b=Math.round(b+(alvo-b)*amt);
  }else{
    r=Math.round(r+(255-r)*amt);g=Math.round(g+(255-g)*amt);b=Math.round(b+(255-b)*amt);
  }
  return 'rgb('+r+','+g+','+b+')';
}
// Medidor compacto por produto: boletado (sólido) sobre a trilha do pipe (mesma cor, clara).
// Tudo em CSS — sem canvas, sem altura fixa: o bloco encolhe conforme o nº de produtos.
function prodMeterHtml(rowsArr,hue,titulo){
  const map={};
  rowsArr.forEach(r=>{const pk=r.produto||'Outros';if(!map[pk])map[pk]={bol:0,pipe:0};map[pk].pipe+=(r.pipe||0);if(isB(r))map[pk].bol+=(r.atual||0);});
  const entries=Object.entries(map).sort((x,y)=>(y[1].bol-x[1].bol)||(y[1].pipe-x[1].pipe));
  const totBol=entries.reduce((s,e)=>s+e[1].bol,0);
  const totPipe=entries.reduce((s,e)=>s+e[1].pipe,0);
  const maxP=Math.max(...entries.map(e=>Math.max(e[1].pipe,e[1].bol)),1);
  const track=tint(hue,.82);
  const linhas=entries.map(([nome,v])=>{
    const tw=v.pipe>0?Math.max(v.pipe/maxP*100,1.5):0;
    const fw=v.bol>0?Math.max(v.bol/maxP*100,1.5):0;
    return '<div class="mrow">'
      +'<span class="mname" title="'+String(nome).replace(/"/g,'&quot;')+'">'+nome+'</span>'
      +'<div class="mbar">'
      +(tw?'<div class="mtrack" style="width:'+tw.toFixed(1)+'%;background:'+track+'"></div>':'')
      +(fw?'<div class="mfill" style="width:'+fw.toFixed(1)+'%;background:'+hue+'"></div>':'')
      +'</div>'
      +'<span class="mval"><b style="color:'+hue+'">'+fmt(v.bol)+'</b> <span>/ '+fmt(v.pipe)+'</span></span>'
      +'</div>';
  }).join('');
  return '<div class="mgrp" style="--gc:'+hue+'">'
    +'<div class="mgrp-h"><span class="mgrp-t">'+titulo+'</span>'
    +'<span class="mgrp-v">'+fmt(totBol)+'<span class="mgrp-p">/ pipe '+fmt(totPipe)+'</span></span></div>'
    +(entries.length?linhas:'<div class="mempty">Nenhuma oportunidade</div>')
    +'</div>';
}

// ── DIA DE ATUAÇÃO: estudo diário por comercial ──
const brData=iso=>iso?iso.split('-')[2]+'/'+iso.split('-')[1]:'';
function oppsDoComercial(nome){
  return OPPS.filter(r=>!isB(r)&&!isPerdida(r)&&(norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome)));
}
function estudoDoDia(nome){
  const hj=localISO(new Date());
  const b={fechar:[],reunioes:[],fazer:[],atrasado:[],semData:[]};
  oppsDoComercial(nome).forEach(r=>{
    const db=parseDataBoleta(r.data_boleta);
    const dr=(r.reuniao_data||'').slice(0,10);
    const dt=(r.todo_data||'').slice(0,10);
    if(db===hj)b.fechar.push({r,m:'Boleta marcada para hoje — feche o negócio'});
    else if(db&&db<hj)b.atrasado.push({r,m:'Boleta venceu '+brData(db)+' — cobre e reagende a data'});
    if(dr===hj)b.reunioes.push({r,m:'Reunião hoje'+(r.sc?' · '+r.sc:'')});
    else if(dr&&dr<hj)b.atrasado.push({r,m:'Reunião era '+brData(dr)+' e não avançou — remarque já'});
    const dl=dataLigacao(r);
    if(dl===hj)b.fazer.push({r,m:'📞 Ligação marcada para hoje — ligue e confirme no card'});
    else if(dl&&dl<hj&&!cumpriu(r,dl,'lig'))b.atrasado.push({r,m:'📞 Ligação era '+brData(dl)+' e não há registro — ligue ou remarque'});
    if(dt===hj)b.fazer.push({r,m:r.todo||'TODO marcado para hoje'});
    else if(dt&&dt<hj)b.atrasado.push({r,m:(r.todo||'TODO')+' · vencido '+brData(dt)});
    const sck=norm(r.sc||'');
    const conhecidos=[...SC_CHAIN,...kbCustomCols(),'Cliente Negou','Não se Aplica'];
    if(!sck)b.semData.push({r,m:'Subiu sem status — organize e classifique'});
    else if(sck==='nao se aplica'){/* fora do jogo, sem cobrança */}
    else if(/r2/.test(sck)&&!dr)b.semData.push({r,m:'R2 sem data de reunião — marque no sistema'});
    else if(/r2/.test(sck)){/* R2 com data já cobrada acima */}
    else if(!conhecidos.some(x=>norm(x)===sck))b.semData.push({r,m:'Status "'+r.sc+'" fora do funil — classifique'});
    else if(/agendar/.test(sck)&&!dr)b.semData.push({r,m:'Status pede reunião e não há data marcada'});
    else if(/agendad/.test(sck)&&!dr)b.semData.push({r,m:'Reunião consta agendada mas sem data no sistema'});
    else if(/topou|confirmar/.test(sck)&&!db)b.semData.push({r,m:'Cliente quente sem data de boleta — marque a data'});
    else if(!db&&!dr&&!dt&&!dl)b.semData.push({r,m:'Nenhuma data em nada — defina o próximo passo'});
  });
  return b;
}
function totalEstudo(b){return b.fechar.length+b.reunioes.length+b.fazer.length+b.atrasado.length+b.semData.length}
// boletas do comercial por período (para os filtros da Daily)
function boletasDoPeriodo(nome,filtro){
  const hj=localISO(new Date());
  const am=amanhaISO();
  const semana=[];{const d0=new Date();const dow=(d0.getDay()+6)%7;const seg=new Date(d0);if(dow>4)seg.setDate(d0.getDate()+(7-dow));else seg.setDate(d0.getDate()-dow);for(let i=0;i<5;i++){const d=new Date(seg);d.setDate(seg.getDate()+i);semana.push(localISO(d));}}
  const base=OPPS.filter(r=>!isPerdida(r)&&(norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome)));
  return base.filter(r=>{
    const db=parseDataBoleta(r.data_boleta);
    if(filtro==='hoje')return db===hj;
    if(filtro==='amanha')return db===am;
    if(filtro==='semana')return db&&semana.includes(db);
    if(filtro==='atrasadas')return db&&db<hj&&!isB(r);
    if(filtro==='semdata')return !db&&!isB(r);
    return false;
  }).sort((x,y)=>String(parseDataBoleta(x.data_boleta)||'9999').localeCompare(String(parseDataBoleta(y.data_boleta)||'9999')));
}

function timeGerencialHtml(){
  if(!USER||(USER.perfil!=='gestor'&&USER.perfil!=='diretor'))return '';
  const membros=USUARIOS.filter(u=>u.ativo&&u.perfil!=='diretor'&&(USER.perfil==='diretor'||(u.areas||[]).some(a=>(USER.areas||[]).includes(a))));

  const dados=membros.map(u=>{
    const nome=u.nome;
    const todas=OPPS.filter(r=>norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome));
    // ranking e meta contam só o que foi efetivamente boletado; "A Boletar" fica à parte
    const bolRows=todas.filter(isBoletadoFirmado);
    const bol=bolRows.reduce((s,r)=>s+(r.atual||0),0);
    const aBolRows=todas.filter(isABoletar);
    const aBol=aBolRows.reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pipeV=todas.filter(r=>!isB(r)&&!isPerdida(r)).reduce((s,r)=>s+(r.pipe||0),0);

    const e=estudoDoDia(nome);

    const metaV=metas.reduce((s,m)=>s+(m.meta_valor||0),0);
    const pct=metaV>0?Math.min(Math.round(bol/metaV*100),100):0;
    return{nome,bol,bolN:bolRows.length,aBol,aBolN:aBolRows.length,pipeV,pend,atras:e.atrasado.length,semData:e.semData.length,metaV,pct,ativHoje:atividadeHojeDe(nome)};
  }).sort((a,b)=>b.bol-a.bol);
  const cards=dados.map(d=>{

// ── priorização da Daily: mais parado + maior valor primeiro ──
function sortPorValor(arr){return [...arr].sort((a,b)=>(b.r.atual||b.r.pipe||0)-(a.r.atual||a.r.pipe||0))}
function sortPorUrgencia(arr){
  return [...arr].sort((a,b)=>{
    const da=daysSince(getLastMoveDate(a.r)),db2=daysSince(getLastMoveDate(b.r));
    if(da!==db2)return db2-da;
    return (b.r.atual||b.r.pipe||0)-(a.r.atual||a.r.pipe||0);
  });
}
// tira duplicatas (a mesma oportunidade pode cair em duas regras da estudoDoDia ao mesmo tempo, ex: reunião hoje + todo hoje)
function dedupeItens(arr){
  const seen=new Set();
  return arr.filter(x=>{if(seen.has(x.r.id))return false;seen.add(x.r.id);return true;});
}
function normUsuario(u){return norm((u||'').replace(/\s*\(planilha\)\s*$/,''))}
function tocadoHojePor(r,nome){
  const hj=new Date().toLocaleDateString('pt-BR');
  return (r.historico||[]).some(h=>(h.data||'').indexOf(hj)===0&&normUsuario(h.usuario)===norm(nome));
}
function iconCampo(campo){
  if(campo==='Observação')return '📝';
  if(campo==='Ligação'||campo==='Ligação marcada')return '📞';
  if(campo==='Reunião')return '🤝';
  if(campo==='Reunião marcada')return '📅';
  if(campo==='Escala')return '🚨';
  if(campo==='TODO')return '📋';
  if(campo==='Criação')return '✨';
  return '⚙️';
}
function descHist(h){
  if(h.campo==='Observação')return '"'+h.para+'"';
  if(h.campo==='Ligação'||h.campo==='Reunião')return h.para;
  if(h.campo===CAMPO_LIG_DATA)return h.para?'Ligação marcada para '+brData(h.para):'Ligação desmarcada';
  if(h.campo==='Reunião marcada')return h.para?'Reunião marcada para '+brData(h.para):'Reunião desmarcada';
  if(h.para&&h.de)return h.campo+': '+h.de+' → '+h.para;
  if(h.para)return h.campo+': '+h.para;
  return h.campo||'atualizado';
}
// tudo que 'nome' registrou hoje, em qualquer oportunidade dele — a fonte de verdade do "o que já fez"
function logHojeDe(nome){
  const hj=new Date().toLocaleDateString('pt-BR');
  const itens=[];
  OPPS.forEach(r=>{
    if(norm(r.responsavel||'')!==norm(nome)&&norm(r.assessor||'')!==norm(nome))return;
    (r.historico||[]).forEach(h=>{
      if((h.data||'').indexOf(hj)!==0)return;
      if(normUsuario(h.usuario)!==norm(nome))return;
      itens.push({cliente:r.cliente||'—',ico:iconCampo(h.campo),desc:descHist(h),hora:(h.data||'').split(' ')[1]||'',data:h.data||''});
    });
  });
  return itens.sort((a,b)=>b.data.localeCompare(a.data));
}
// dias seguidos com pelo menos um registro — best-effort, calculado em cima do historico (sem tabela nova)
function streakDe(nome){
  const datas=new Set();
  OPPS.forEach(r=>{
    if(norm(r.responsavel||'')!==norm(nome)&&norm(r.assessor||'')!==norm(nome))return;
    (r.historico||[]).forEach(h=>{
      if(normUsuario(h.usuario)!==norm(nome))return;
      const d=(h.data||'').split(' ')[0];
      if(d)datas.add(d);
    });
  });
  let streak=0;const d=new Date();
  for(let i=0;i<90;i++){
    const ds=d.toLocaleDateString('pt-BR');
    if(datas.has(ds)){streak++;d.setDate(d.getDate()-1);continue;}
    if(i===0){d.setDate(d.getDate()-1);continue;} // hoje ainda pode não ter registro — não quebra a sequência
    break;
  }
  return streak;
}

// ── AGENDA DE CONTATOS: calendário de ligações e reuniões ──
// O compromisso vem do próprio card (data da ligação / data da reunião).
// O "feito" vem da MESMA prova do funil de efetividade — assim agenda e
// funil nunca contam coisas diferentes.
// ══════════════════════════════════════════════════════════
function todasDoComercial(nome){
  return OPPS.filter(r=>norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome));
}
const mesISO=iso=>(iso||'').slice(0,7);
const mesDeData=s=>{const k=dtKey(s);if(!k)return '';const d=new Date(k);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function agRef(){return window._agRef||localISO(new Date()).slice(0,7)}
function agNav(d){
  const [y,m]=agRef().split('-').map(Number);
  const nd=new Date(y,m-1+d,1);

function agHoje(){window._agRef=null;window._agDia='';renderDPipeline();}
function agDia(iso){window._agDia=(window._agDia===iso)?'':iso;renderDPipeline();}
function agendaDoComercial(nome){
  const mapa={};
  const add=(iso,k,r)=>{if(!iso)return;(mapa[iso]=mapa[iso]||{lig:[],reu:[]})[k].push(r)};
  todasDoComercial(nome).forEach(r=>{
    add(dataLigacao(r),'lig',r);
    add((r.reuniao_data||'').slice(0,10),'reu',r);
  });
  return mapa;
}
// Um compromisso marcado para o dia D só conta como cumprido se houver registro
// em D ou depois. "Já ligou algum dia" não paga a ligação combinada para ontem.
function cumpriu(r,iso,k){
  if(!iso)return true;
  const alvo=+new Date(iso+'T00:00:00');
  const mi=marcaInfo(r,k);
  if(mi&&dtKey(mi.data)>=alvo)return true;
  if(k==='reu'&&isBoletadoFirmado(r))return true;
  return (r.historico||[]).some(h=>
    (h.campo==='Observação'||h.campo==='Status comercial'||h.campo==='Pendência boleta')&&dtKey(h.data)>=alvo);
}
// O QUE FOI REALIZADO num intervalo. A data de "realizado" é a mesma prova
// que o funil de efetividade usa — confirmação no card, movimento de status
// ou a data da reunião que já passou.
function realizadoEntre(nome,de,ate){
  const rows=todasDoComercial(nome);
  const dentro=st=>{const k=dtKey(st);if(!k)return false;const d=localISO(new Date(k));return d>=de&&d<=ate};
  const bol=rows.filter(r=>{const d=parseDataBoleta(r.data_boleta);return isBoletadoFirmado(r)&&d&&d>=de&&d<=ate});
  return{
    lig:rows.filter(r=>teveLigacao(r)&&dentro(provaEtapa('ligacao',r).d)).length,
    reu:rows.filter(r=>teveReuniao(r)&&dentro(provaEtapa('reuniao',r).d)).length,
    bol:bol.length, vol:bol.reduce((a,r)=>a+(r.atual||0),0)};
}
function semanaDe(d){
  const dow=(d.getDay()+6)%7;                       // 0 = segunda
  const ini=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow);
  const fim=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+6);
  return [localISO(ini),localISO(fim)];
}
function resumoAgenda(nome,ref){
  const rows=todasDoComercial(nome), hj=localISO(new Date());
  const feitoNoMes=(r,k)=>{const p=provaEtapa(k,r);return mesDeData(p&&p.d)===ref};
  const ligFeitas=rows.filter(r=>teveLigacao(r)&&feitoNoMes(r,'ligacao'));
  const reuFeitas=rows.filter(r=>teveReuniao(r)&&feitoNoMes(r,'reuniao'));
  const ligAg=rows.filter(r=>mesISO(dataLigacao(r))===ref);
  const reuAg=rows.filter(r=>mesISO((r.reuniao_data||'').slice(0,10))===ref);
  const bol=rows.filter(r=>isBoletadoFirmado(r)&&mesISO(parseDataBoleta(r.data_boleta)||'')===ref);
  // compromissos que já venceram no mês: quantos têm registro
  const vencLig=ligAg.filter(r=>dataLigacao(r)<hj), vencReu=reuAg.filter(r=>(r.reuniao_data||'').slice(0,10)<hj);
  const cumpridos=vencLig.filter(r=>cumpriu(r,dataLigacao(r),'lig')).length
                 +vencReu.filter(r=>cumpriu(r,(r.reuniao_data||'').slice(0,10),'reu')).length;
  const vencidos=vencLig.length+vencReu.length;
  return{ligFeitas:ligFeitas.length,reuFeitas:reuFeitas.length,
    ligAg:ligAg.length,reuAg:reuAg.length,
    bol:bol.length,volBol:bol.reduce((a,r)=>a+(r.atual||0),0),
    vencidos,cumpridos,furos:vencidos-cumpridos,
    ader:vencidos?Math.round(cumpridos/vencidos*100):null};
}

    +(f.ader===null?'—':f.ader+'%')+'</div>'
