<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerencial Comercial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --wine:#8B1C2A;--wine-d:#6B0010;--wine-l:#F5EAE8;--wine-ll:#FDF5F4;
  --cream:#F5F0EB;--card:#FFFFFF;--border:#E5DCD4;--border-l:#F0E8E3;
  --text:#1A0508;--muted:#8A6A6E;--muted-l:#C4A8AC;
  --green:#085041;--green-bg:#E1F5EE;--green-b:#9FD5B0;
  --amber:#854F0B;--amber-bg:#FEF3E2;--amber-b:#FAC775;
  --red:#791F1F;--red-bg:#FCEBEB;--red-b:#E8B0B0;
  --blue:#0C447C;--blue-bg:#E6F1FB;--blue-b:#B5CEF0;
  --purple:#3C3489;--purple-bg:#EEEDFE;--purple-b:#C5C2F8;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);font-size:14px;min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#4A0E16;position:relative;overflow:hidden;padding:24px}
#login-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.login-wrap{position:relative;display:flex;align-items:center;gap:48px;flex-wrap:wrap;justify-content:center;max-width:900px;width:100%}
.login-msg{flex:1;min-width:280px;max-width:420px}
.login-msg .lm-tag{font-size:11px;font-weight:700;letter-spacing:.16em;color:#EF9F27;text-transform:uppercase;margin-bottom:16px}
.login-msg .lm-frase{font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1.35;color:#F5E9E3}
.login-msg .lm-sub{font-size:13px;color:rgba(245,233,227,.6);margin-top:18px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:38px 34px;max-width:340px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.35);text-align:center;position:relative}
@media(max-width:760px){
  .login-wrap{gap:26px}
  .login-msg{text-align:center;max-width:340px}
  .login-msg .lm-frase{font-size:22px}
  .login-msg #lm-logo{margin-left:auto;margin-right:auto}
}
.login-icon{font-size:52px;margin-bottom:14px;display:block}
.login-box h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .2s}
.pin-dot.on{background:var(--wine);border-color:var(--wine);transform:scale(1.1)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:230px;margin:0 auto 14px}
.pin-btn{padding:15px;border-radius:4px;border:1px solid var(--border);background:var(--card);font-size:20px;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s;user-select:none}
.pin-btn:hover{background:var(--wine-l);border-color:var(--wine);color:var(--wine)}
.pin-btn:active{transform:scale(.93)}
.pin-btn.del{color:var(--muted);font-size:16px}
#login-err{color:var(--red);font-size:12px;min-height:18px;margin-top:4px}
.login-checking{color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}

/* ── APP ── */
#app{display:none}
#app[style*="block"]{min-height:100vh}
.sidebar{width:58px;flex-shrink:0;background:#4A0E16;display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;z-index:100;overflow:hidden;transition:width .18s ease;box-shadow:2px 0 12px rgba(74,14,22,.15)}
.sidebar:hover{width:200px;box-shadow:4px 0 24px rgba(74,14,22,.35)}
.sb-brand{padding:16px 0 12px;border-bottom:1px solid rgba(245,233,227,.15);display:flex;align-items:center;gap:10px;min-height:62px}
.sb-mini{width:34px;height:34px;border-radius:6px;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;margin-left:12px}
.sb-brand h1{font-size:14px;font-weight:700;color:#fff;line-height:1.2;white-space:nowrap;opacity:0;transition:opacity .15s}
.sidebar:hover .sb-brand h1{opacity:1}
.sb-nav{flex:1;padding:12px 9px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden}
.main{min-width:0;width:auto;display:flex;flex-direction:column;margin-left:58px}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-brand h1{font-size:16px;font-weight:700;color:var(--text)}
.topbar-date{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-pill{display:flex;align-items:center;gap:6px;background:var(--wine-l);border:1px solid #C8A0A8;border-radius:4px;padding:4px 12px 4px 6px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--wine);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-name{font-size:12px;font-weight:600;color:var(--wine-d)}
.btn-logout{font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;padding:4px 8px;border-radius:4px}
.btn-logout:hover{background:var(--border-l);color:var(--text)}

/* ── NAV ── */
.nav{display:none}
.nav-tab{display:flex;align-items:center;gap:10px;padding:10px 0 10px 11px;font-size:13px;font-weight:600;color:rgba(245,233,227,.75);background:none;border:none;border-radius:6px;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;white-space:nowrap}
.nav-tab:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-tab.active{background:var(--wine);color:#fff}
.tab-ico{width:18px;flex-shrink:0;text-align:center;font-size:15px}
.tab-lb{opacity:0;transition:opacity .15s}
.sidebar:hover .tab-lb{opacity:1}
.nav-tab .badge{background:#fff;color:var(--wine);border-radius:4px;font-size:10px;padding:1px 6px;font-weight:700;margin-left:auto;margin-right:10px;opacity:0;transition:opacity .15s}
.sidebar:hover .nav-tab .badge{opacity:1}

/* ── CONTENT ── */
.content{padding:22px 26px;max-width:none;width:100%}

/* ── DIRECTOR DASHBOARD ── */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--border)}
.kpi.wine::before{background:var(--wine)}
.kpi.green::before{background:var(--green)}
.kpi.amber::before{background:#EF9F27}
.kpi.blue::before{background:#378ADD}
.kpi.purple::before{background:#7F77DD}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:700;color:var(--text);line-height:1}
.kpi.wine .kpi-val{color:var(--wine-d)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}

.area-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.area-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px 16px;border-left:3px solid var(--wine)}
.area-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-l);border:1px solid var(--border-l);border-radius:4px;overflow:hidden;margin-bottom:2px}
.area-cell{background:#FBF8F5;padding:7px 4px;text-align:center}
.area-cell-l{font-size:8px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.area-cell-v{font-size:12px;font-weight:600;color:var(--text);margin-top:2px}
.area-empty{font-size:13px;color:var(--muted-l);padding:6px 0}
.area-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.area-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.area-dot{width:10px;height:10px;border-radius:50%}
.area-bol{font-size:28px;font-weight:700;margin-bottom:4px}
.area-bol-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.area-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.area-stat{background:var(--cream);border-radius:4px;padding:8px;text-align:center}
.area-stat-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.area-stat-v{font-size:15px;font-weight:700;color:var(--text)}
.prog-wrap{margin-top:12px}
.prog-bg{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:6px;border-radius:3px;transition:width .6s ease}
.prog-lbl{font-size:10px;color:var(--muted);text-align:right;margin-top:3px}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px}
.chart-card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative;height:220px}

.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── TABLE ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#FAF5F3;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border-l);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FDF8F6}
tr.bol td{background:var(--green-bg)}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-b)}
.b-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-b)}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-b)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b)}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-b)}
.b-wine{background:var(--wine-l);color:var(--wine-d);border:1px solid #C8A0A8}
.b-gray{background:#F5F0EB;color:var(--muted);border:1px solid var(--border)}
.b-teal{background:#E1F5EE;color:#085041;border:1px solid #9FD5B0}

/* ── ASSESSOR CARDS ── */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.opp-card{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:all .2s}
.opp-card:hover{box-shadow:0 4px 20px rgba(139,28,42,.1);border-color:#C8A0A8}
.opp-card.bol{border-left:4px solid var(--green);background:linear-gradient(to right,#F0FBF6,var(--card))}
.opp-card-header{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.opp-client{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.opp-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opp-card-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.opp-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opp-row-l{color:var(--muted);font-weight:500}
.opp-row-v{font-weight:600;color:var(--text)}
.opp-vol{font-size:18px;font-weight:700;color:var(--wine-d)}
.opp-obs{font-size:11px;color:var(--muted);font-style:italic;padding:8px 12px;background:var(--cream);border-radius:4px;margin:0 16px 10px;border-left:3px solid var(--border)}
.opp-actions{padding:10px 16px;background:#FAF5F3;border-top:1px solid var(--border-l);display:flex;gap:6px;flex-wrap:wrap}
.opp-btn{padding:6px 12px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.opp-btn.sc{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b)}
.opp-btn.sc:hover{background:var(--blue);color:#fff}
.opp-btn.bol{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.opp-btn.bol:hover{background:var(--green);color:#fff}
.opp-btn.obs{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.opp-btn.obs:hover{background:var(--amber);color:#fff}
.opp-btn.todo{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-b)}
.opp-btn.todo:hover{background:var(--purple);color:#fff}

/* ── COCKPIT / KANBAN ── */
.cockpit-hero{background:#5C1220;border-radius:4px;padding:22px 26px;color:#fff;margin-bottom:20px;box-shadow:0 8px 24px rgba(139,28,42,.2)}
.cockpit-hello{font-size:20px;font-weight:700}
.cockpit-sub{font-size:12px;opacity:.85;margin-top:2px}
.cockpit-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.cockpit-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:10px 14px;text-align:center}
.cockpit-stat-v{font-size:22px;font-weight:700}
.cockpit-stat-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-top:2px}
.prio-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin-bottom:8px;transition:all .15s}
.prio-item:hover{border-color:#C8A0A8;box-shadow:0 2px 12px rgba(139,28,42,.08)}
.prio-flag{width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prio-info{flex:1;min-width:0}
.prio-cli{font-size:13px;font-weight:700}
.prio-acao{font-size:12px;color:var(--muted);margin-top:2px}
.prio-vol{font-size:14px;font-weight:700;color:var(--wine-d);white-space:nowrap}
.kb-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kb-col{min-width:262px;max-width:262px;background:#F1E9E4;border-radius:6px;padding:10px;flex-shrink:0}
.kb-col-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kb-count{background:var(--card);border-radius:4px;padding:1px 8px;font-size:10px;font-weight:700;color:var(--muted)}
.kb-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;cursor:grab;transition:all .15s}
.kb-card:active{cursor:grabbing}
.kb-col{transition:background .15s,transform .15s}
.kb-card:hover{border-color:#C8A0A8;box-shadow:0 3px 10px rgba(139,28,42,.1);transform:translateY(-1px)}
.kb-cli{font-size:12px;font-weight:700;line-height:1.3}
.kb-meta{font-size:10px;color:var(--muted);margin-top:3px}
.kb-vol{font-size:13px;font-weight:700;color:var(--wine-d);margin-top:5px}
.kb-adv{width:100%;margin-top:8px;padding:5px;border-radius:4px;border:1px solid var(--border);background:var(--cream);font-size:10px;font-weight:700;cursor:pointer;color:var(--text);transition:all .15s}
.kb-adv:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
.kb-adv.bol{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.kb-adv.bol:hover{background:var(--green);color:#fff}

/* ── DAILY ── */
.daily-header{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:20px}
.daily-title{font-size:18px;font-weight:700;margin-bottom:4px}
.daily-subtitle{font-size:12px;color:var(--muted)}
.daily-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.daily-kpi{text-align:center;padding:12px;background:var(--cream);border-radius:6px}
.daily-kpi-v{font-size:22px;font-weight:700;color:var(--wine-d)}
.daily-kpi-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:2px}

.day-group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.day-group-count{background:currentColor;border-radius:4px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;opacity:.9}

.daily-opp{background:var(--card);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.daily-opp.sel{border-color:var(--wine);background:var(--wine-ll)}
.daily-opp-top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.daily-check{width:20px;height:20px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--card)}
.daily-check.on{background:var(--wine);border-color:var(--wine)}
.daily-check.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.daily-info{flex:1}
.daily-cli{font-size:13px;font-weight:700}
.daily-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.daily-vol{font-size:13px;font-weight:700;color:var(--wine-d)}
.daily-actions{padding:10px 14px;background:#FAF5F3;border-top:1px solid var(--border-l);display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.sel-tipo{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer}
select.sel-tipo:focus{outline:none;border-color:var(--wine)}
input.inp-acao{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit}
input.inp-acao:focus{outline:none;border-color:var(--wine)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,5,8,.35);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:8px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(139,28,42,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hdr h2{font-size:16px;font-weight:700}
.modal-x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal-x:hover{color:var(--text)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--wine)}
.fg textarea{min-height:72px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ftr{display:flex;gap:8px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border)}
.btn{padding:8px 18px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--cream)}
.btn.wine{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.wine:hover{background:var(--wine-d)}
.btn.sm{padding:5px 12px;font-size:11px}

/* ── MISC ── */
.mini-bar{height:4px;background:var(--border);border-radius:3px;margin-top:5px;overflow:hidden}
.mini-fill{height:4px;border-radius:3px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:12px;color:var(--muted);text-align:center;padding:40px}
.empty-icon{font-size:40px;opacity:.4}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--wine);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--wine);color:#fff;font-size:12px;font-weight:600;padding:10px 20px;border-radius:6px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:300px;box-shadow:0 4px 20px rgba(139,28,42,.3)}
.hist-item{font-size:11px;padding:6px 0;border-bottom:1px solid var(--border-l);color:var(--muted);line-height:1.5}
.hist-item:last-child{border:none}
.hist-item strong{color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-sel{padding:6px 10px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.filter-sel:focus{border-color:var(--wine)}
.filter-inp{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;outline:none;flex:1;min-width:140px}
.filter-inp:focus{border-color:var(--wine)}
.upload-card{background:var(--card);border:2px dashed var(--border);border-radius:6px;padding:28px;text-align:center;cursor:pointer;transition:all .2s}
.upload-card:hover{border-color:var(--wine);background:var(--wine-ll)}
.upload-card.done{border-style:solid;border-color:var(--green-b);background:var(--green-bg)}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-title{font-size:14px;font-weight:700;margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted)}
.upload-status{font-size:12px;font-weight:600;margin-top:10px;min-height:18px}
@media(max-width:768px){
  .charts-row,.area-cards{grid-template-columns:1fr}
  .opp-grid{grid-template-columns:1fr}
  .daily-kpis{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
}
@media(max-width:860px){
  .sidebar{position:static;width:100%;height:auto;flex-direction:column;overflow:visible;box-shadow:none}
  .sidebar:hover{width:100%}
  .sb-brand{padding:12px 16px 8px;border-bottom:none;min-height:auto}
  .sb-brand h1{opacity:1}
  .sb-brand h1 br{display:none}
  .sb-nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px;gap:6px}
  .nav-tab{width:auto;white-space:nowrap;padding:8px 12px;font-size:12px}
  .tab-lb{opacity:1}
  .main{margin-left:0}
}
</style>
</head>

<!-- ── MODAL EDITAR OPP ── -->
<div id="modal-edit" class="modal-bg" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="modal-edit-title">Atualizar oportunidade</h2>
      <button class="modal-x" onclick="closeModal('edit')">×</button>
    </div>
    <div class="form-row">
      <div class="fg"><label>Status comercial <span style="font-weight:400;text-transform:none;font-size:9px">(escolha ou digite um novo)</span></label>
        <input type="text" id="e-sc" list="dl-sc-opts" placeholder="Selecionar ou digitar...">
      </div>
      <div class="fg"><label>Pendência boleta <span style="font-weight:400;text-transform:none;font-size:9px">(escolha ou digite)</span></label>
        <input type="text" id="e-pb" list="dl-pb-opts" placeholder="Selecionar ou digitar...">
      </div>
    </div>
    <div class="form-row">
      <div class="fg"><label>Volume atual (R$)</label>
        <input type="number" id="e-atual" placeholder="0">
      </div>
      <div class="fg"><label>Data da boleta</label>
        <input type="date" id="e-data">
      </div>
    </div>
    <div class="form-row">
      <div class="fg" style="grid-column:1"><label>Próximo TODO</label>
        <input type="text" id="e-todo" placeholder="O que precisa ser feito...">
      </div>
      <div class="fg"><label>📅 Data do TODO</label>
        <input type="date" id="e-todo-data">
      </div>
    </div>
    <div class="form-row">
      <div class="fg"><label>📅 Reunião marcada (data e hora)</label>
        <input type="datetime-local" id="e-reuniao">
      </div>
      <div class="fg"><label>👤 Responsável (time)</label>
        <select id="e-resp"><option value="">Sem responsável</option></select>
      </div>
    </div>
    <div class="fg"><label>💬 Nova observação (entra na linha do tempo)</label>
      <textarea id="e-obs" placeholder="Escreva o que aconteceu nesse contato... Ex: 'Cliente pediu proposta revisada com prazo maior'"></textarea>
    </div>
    <div id="e-hist" style="margin-bottom:8px"></div>
    <div class="modal-ftr">
      <button class="btn" onclick="closeModal('edit')">Cancelar</button>
      <button class="btn wine" id="btn-save-edit" onclick="saveEdit()">💾 Salvar</button>
    </div>
  </div>
</div>

<!-- ── MODAL NOVO USUARIO ── -->
<div id="modal-user" class="modal-bg" style="display:none">
  <div class="modal" style="max-width:400px">
    <div class="modal-hdr"><h2>Novo usuário</h2><button class="modal-x" onclick="closeModal('user')">×</button></div>
    <div class="fg"><label>Nome completo</label><input type="text" id="u-nome" placeholder="Nome do assessor"></div>
    <div class="form-row">
      <div class="fg"><label>PIN (4 dígitos)</label><input type="text" id="u-pin" maxlength="4" placeholder="0000"></div>
      <div class="fg"><label>Perfil</label>
        <select id="u-perfil" onchange="toggleAreas()">
          <option value="assessor">Assessor</option>
          <option value="gestor">Gestor de área</option>
          <option value="diretor">Diretor</option>
        </select>
      </div>
    </div>
    <div id="u-areas-wrap" class="fg"><label>Áreas com acesso</label>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
        <label style="font-size:13px;display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer"><input type="checkbox" id="ua-inv" value="inv"> Investimentos</label>
        <label style="font-size:13px;display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer"><input type="checkbox" id="ua-cons" value="cons"> Consórcio</label>
        <label style="font-size:13px;display:flex;align-items:center;gap:5px;font-weight:normal;cursor:pointer"><input type="checkbox" id="ua-seg" value="seg"> Seguro de vida</label>
      </div>
    </div>
    <div class="modal-ftr">
      <button class="btn" onclick="closeModal('user')">Cancelar</button>
      <button class="btn wine" onclick="saveUser()">Salvar</button>
    </div>
  </div>
</div>

function lev1(a,b){
  // true se distância de edição <= 1
  if(a===b)return true;
  const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,diff=0;
  while(i<la&&j<lb){
    if(a[i]===b[j]){i++;j++;continue}
    diff++;if(diff>1)return false;
    if(la>lb)i++;else if(lb>la)j++;else{i++;j++}
  }
  diff+=(la-i)+(lb-j);
  return diff<=1;
}

  }
  _canonCache[nome]=result;
  return result;
}

function parseDataBoleta(v){
  if(!v)return null;
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}
  if(/^\d{5}$/.test(s)){const d=new Date(Date.UTC(1899,11,30)+parseInt(s,10)*86400000);return d.toISOString().slice(0,10);}
  return null;
}

function diasUteis(){
  const hoje=new Date(),ano=hoje.getFullYear(),mes=hoje.getMonth();
  const nDias=new Date(ano,mes+1,0).getDate();
  let tot=0,ate=0;
  for(let d=1;d<=nDias;d++){
    const dw=new Date(ano,mes,d).getDay();
    if(dw===0||dw===6)continue;
    tot++;
    if(d<=hoje.getDate())ate++;
  }
  return{tot,ate,rest:Math.max(tot-ate,0)};
}

async function db(method,table,data,filter){
  let url=`${SUPA}/rest/v1/${table}`;
  if(filter)url+=`?${filter}`;
  const headers={'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':'return=minimal'};
  if(method==='GET')headers['Range']='0-9999';
  const r=await fetch(url,{method,headers,body:data?JSON.stringify(data):undefined});
  if(!r.ok){const e=await r.text();throw new Error(e)}
  if(r.status===204)return null;
  return r.json();
}

      const dp=h.data.split(' ')[0].split('/');
      if(dp.length!==3)return;
      const iso=dp[2]+'-'+String(dp[1]).padStart(2,'0')+'-'+String(dp[0]).padStart(2,'0');
      const paraN=norm(h.para||'');
      const sub=subAreaOf(r);
      if(h.campo==='Pendência boleta'&&paraN==='boletado'){
        acts.push({date:iso,area:r.area,sub,tipo:'boleta',valor:r.atual||r.pipe||0,usuario:h.usuario,cliente:r.cliente});
      }else if(h.campo==='Status comercial'&&paraN.includes('reuni')){
        acts.push({date:iso,area:r.area,sub,tipo:'reuniao',valor:0,usuario:h.usuario,cliente:r.cliente});
      }else if((h.campo==='Status comercial'||h.campo==='Pendência boleta')&&h.para){
        acts.push({date:iso,area:r.area,sub,tipo:'avanco',valor:0,usuario:h.usuario,cliente:r.cliente});
      }
    });
  });
  return acts;
}

function lastNDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

const brData=iso=>iso?iso.split('-')[2]+'/'+iso.split('-')[1]:'';
function oppsDoComercial(nome){
  return OPPS.filter(r=>!isB(r)&&!isPerdida(r)&&(norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome)));
}
function estudoDoDia(nome){
  const hj=localISO(new Date());
  const b={fechar:[],reunioes:[],fazer:[],atrasado:[],semData:[]};
  oppsDoComercial(nome).forEach(r=>{
    const db=parseDataBoleta(r.data_boleta);
    const dr=(r.reuniao_data||'').slice(0,10);
    const dt=(r.todo_data||'').slice(0,10);
    if(db===hj)b.fechar.push({r,m:'Boleta marcada para hoje — feche o negócio'});
    else if(db&&db<hj)b.atrasado.push({r,m:'Boleta venceu '+brData(db)+' — cobre e reagende a data'});
    if(dr===hj)b.reunioes.push({r,m:'Reunião hoje'+(r.sc?' · '+r.sc:'')});
    else if(dr&&dr<hj)b.atrasado.push({r,m:'Reunião era '+brData(dr)+' e não avançou — remarque já'});
    if(dt===hj)b.fazer.push({r,m:r.todo||'TODO marcado para hoje'});
    else if(dt&&dt<hj)b.atrasado.push({r,m:(r.todo||'TODO')+' · vencido '+brData(dt)});
    const sck=norm(r.sc||'');
    if(/agendar/.test(sck)&&!dr)b.semData.push({r,m:'Status pede reunião e não há data marcada'});
    else if(/agendad/.test(sck)&&!dr)b.semData.push({r,m:'Reunião consta agendada mas sem data no sistema'});
    else if(!db&&!dr&&!dt)b.semData.push({r,m:'Nenhuma data em nada — defina o próximo passo'});
  });
  return b;
}
function totalEstudo(b){return b.fechar.length+b.reunioes.length+b.fazer.length+b.atrasado.length+b.semData.length}

// ── SELEÇÃO / EXCLUSÃO EM MASSA ──
function toggleSelect(id,checked){
  if(checked)SELECTED.add(id);else SELECTED.delete(id);
  applyFilter();
}
function toggleSelectAll(checked){
  if(checked){
    // Select all currently visible rows
    let rows=[...OPPS];
    const fA=document.getElementById('f-area')?.value;
    const fAss=document.getElementById('f-ass')?.value;
    const fSC=document.getElementById('f-sc')?.value;
    const fPB=document.getElementById('f-pb')?.value;
    const fCli=(document.getElementById('f-cli')?.value||'').toLowerCase();
    if(fA)rows=rows.filter(r=>r.area===fA);
    if(fAss)rows=rows.filter(r=>canonAssessor(r.assessor)===fAss);
    if(fSC)rows=rows.filter(r=>r.sc===fSC);
    if(fPB)rows=rows.filter(r=>r.pb===fPB);
    if(fCli)rows=rows.filter(r=>(r.cliente||'').toLowerCase().includes(fCli));
    rows.forEach(r=>SELECTED.add(r.id));
  }else{
    SELECTED.clear();
  }
  applyFilter();
}
function clearSelection(){SELECTED.clear();applyFilter();}
function toggleSelectG(id,checked,ev){if(ev)ev.stopPropagation();if(checked)SELECTED.add(id);else SELECTED.delete(id);renderAssessorOpps();}
function toggleSelectAllG(checked){
  const ids=window._listIds||[];
  if(checked)ids.forEach(id=>SELECTED.add(id));
  else ids.forEach(id=>SELECTED.delete(id));
  renderAssessorOpps();
}
function clearSelectionG(){SELECTED.clear();renderAssessorOpps();}

async function deleteSelected(){
  const n=SELECTED.size;
  if(!n)return;
  if(!confirm('Excluir '+n+' oportunidade'+(n>1?'s':'')+' permanentemente? Esta ação não pode ser desfeita.'))return;
  showToast('Excluindo '+n+' oportunidades...');
  try{
    const ids=[...SELECTED];
    for(let i=0;i<ids.length;i+=50){
      const batch=ids.slice(i,i+50);
      await db('DELETE','oportunidades','','id=in.('+batch.join(',')+')');
    }
    SELECTED.clear();
    showToast('✅ '+n+' oportunidades excluídas!',true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

// ── ASSESSOR: MINHAS OPORTUNIDADES ──
// ══════════════════════════════════════════════════════════
function fmtReuniao(s){
  if(!s)return'';
  const [d,h]=s.split('T');
  const p=d.split('-');
  return p[2]+'/'+p[1]+(h?' às '+h.substring(0,5):'');
}

function sugestaoAcao(r){
  if(r.todo)return r.todo;
  const sc=norm(r.sc||'');
  const pb=norm(r.pb||'');
  if(pb.includes('email'))return 'Enviar email/push para o cliente';
  if(pb==='a boletar')return 'Gerar a boleta!';
  if(pb.includes('to do'))return 'Resolver pendência da boleta';
  if(sc==='ligar cliente'||sc==='ligar cliente c ai')return 'Ligar para o cliente';
  if(sc==='agendar reunião')return 'Agendar a reunião';
  if(sc==='reunião agendada')return 'Realizar a reunião';
  if(sc==='cliente confirmar')return 'Cobrar confirmação do cliente';
  if(sc==='cliente topou')return 'Cliente topou — fechar a boleta!';
  return 'Definir próximo passo';
}

const SC_CHAIN=['Ligar Cliente','Agendar Reunião','Reunião Agendada','Cliente Confirmar','Cliente Topou'];
// Para os FUNIS: variantes de R2 contam junto da etapa de reunião equivalente
// (o Kanban continua mostrando as colunas R2 separadas)
function scFunil(sc){
  const k=norm(sc||'');
  if(!k)return '';
  const chain=SC_CHAIN.find(s=>norm(s)===k);
  if(chain)return norm(chain);
  if(/r2/.test(k)&&/agendar/.test(k))return norm('Agendar Reunião');
  if(/r2/.test(k)&&/agendad/.test(k))return norm('Reunião Agendada');
  return k;
}

// ── 🤖 INTELIGÊNCIA: análise da próxima ação ──
function analisarProximaAcao(r){
  const dias=daysSince(getLastMoveDate(r));
  const sc=norm(r.sc||''),pb=norm(r.pb||'');
  const vol=r.atual||r.pipe||0;
  const hist=r.historico||[];
  const nMoves=hist.filter(h=>h.campo==='Status comercial').length;
  const temReuniao=!!r.reuniao_data;
  const agora=new Date().toISOString().slice(0,16);
  const reuniaoPassada=temReuniao&&r.reuniao_data<agora;
  let acao='',motivo='',urg='media';

  if(isB(r)){acao='Oportunidade concluída';motivo='Boletada com sucesso. Nenhuma ação necessária.';urg='baixa';}
  else if(pb==='a boletar'){acao='Gerar a boleta AGORA';motivo='Cliente pronto para boletar. '+(dias>2?'Já se passaram '+dias+' dias — risco de esfriar!':'Aproveite o momento quente.');urg='alta';}
  else if(sc==='cliente topou'){acao='Resolver pendência e boletar';motivo='Cliente topou'+(r.pb?' mas há pendência: '+r.pb:'')+'.'+(dias>3?' '+dias+' dias parado — priorize hoje!':'');urg='alta';}
  else if(reuniaoPassada){acao='Registrar o resultado da reunião';motivo='A reunião de '+fmtReuniao(r.reuniao_data)+' já aconteceu. Atualize o status com o desfecho e a próxima etapa.';urg='alta';}
  else if(temReuniao){acao='Preparar a reunião de '+fmtReuniao(r.reuniao_data);motivo='Revise a proposta, o perfil do cliente e o material antes do encontro.';urg='media';}
  else if(sc==='cliente confirmar'){
    if(dias>3){acao='Cobrar resposta do cliente';motivo='Sem resposta há '+dias+' dias. Um follow-up educado recupera boa parte dos silêncios.';urg='alta';}
    else{acao='Aguardar confirmação (follow-up em '+(4-dias)+' dia'+(4-dias>1?'s':'')+')';motivo='Cliente está decidindo. Não pressione ainda.';urg='baixa';}
  }
  else if(sc==='reunião agendada'&&!temReuniao){acao='Registrar data e hora da reunião';motivo='Status indica reunião marcada mas sem data no sistema — registre para aparecer na agenda do dia.';urg='media';}
  else if(sc==='agendar reunião'){acao='Propor 2 horários ao cliente';motivo='Oferecer opções concretas acelera o agendamento.'+(dias>5?' Parado há '+dias+' dias.':'');urg=dias>5?'alta':'media';}
  else if(sc.includes('ligar')){
    if(dias>7){acao='Retomar contato (ligação + WhatsApp)';motivo='Sem avanço há '+dias+' dias'+(nMoves===0?' e nenhum contato registrado':'')+'. Tente um canal alternativo.';urg='alta';}
    else{acao='Ligar para o cliente';motivo='O primeiro contato define o ritmo da negociação.';urg='media';}
  }
  else if(pb.includes('email')){acao='Enviar: '+r.pb;motivo='Pendência operacional travando a boleta há '+dias+' dia'+(dias>1?'s':'')+'.';urg='alta';}
  else if(pb.includes('to do')||pb.includes('aguardando')){acao='Resolver: '+r.pb;motivo='Pendência aberta há '+dias+' dias.';urg=dias>3?'alta':'media';}
  else if(!r.sc){acao='Classificar a oportunidade';motivo='Sem status definido. Defina a etapa para ela entrar no funil e nas prioridades.';urg='media';}
  else{acao=sugestaoAcao(r);motivo=dias>7?'Parada há '+dias+' dias sem movimentação.':'Mantenha o ritmo de acompanhamento.';urg=dias>7?'alta':'baixa';}

  if(!isB(r)&&vol>=500000&&urg!=='alta')motivo+=' 💰 Ticket alto ('+fmt(vol)+') — merece atenção extra.';
  return{acao,motivo,urg};
}

async function advanceStatus(id,ev){
  if(ev)ev.stopPropagation();
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const cur=SC_CHAIN.findIndex(s=>norm(s)===norm(r.sc||''));
  const next=cur<0?SC_CHAIN[0]:SC_CHAIN[Math.min(cur+1,SC_CHAIN.length-1)];
  if(cur>=SC_CHAIN.length-1){quickBoletar(id);return;}
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:'Status comercial',de:r.sc||'',para:next,usuario:USER.nome,data:ds}];
  try{
    await db('PATCH','oportunidades',{sc:next,historico:hist,updated_at:now.toISOString()},'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+next,true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

function kbCustomCols(){try{return JSON.parse(localStorage.getItem('kb_custom_cols'))||[]}catch(e){return[]}}
async function setStatusManual(id,novo){
  if(!novo)return;
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:'Status comercial',de:r.sc||'',para:novo,usuario:USER.nome,data:ds}];
  try{
    await db('PATCH','oportunidades',{sc:novo,historico:hist,updated_at:now.toISOString()},'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+novo,true);
    await loadData();renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}
function promoteStatus(sc){
  const nome=String(sc||'').trim();
  if(!nome)return;
  const existentes=[...SC_CHAIN,...kbCustomCols()];
  if(existentes.some(s=>norm(s)===norm(nome))){showToast('Já existe uma coluna para esse status');return;}
  const cols=kbCustomCols();cols.push(nome);
  localStorage.setItem('kb_custom_cols',JSON.stringify(cols));
  showToast('✅ Coluna "'+nome+'" criada no Kanban',true);
  renderCurView();
}
function removeCustomCol(nome){
  const cols=kbCustomCols().filter(c=>norm(c)!==norm(nome));
  localStorage.setItem('kb_custom_cols',JSON.stringify(cols));
  renderCurView();
}

function initKbScrollTop(){
  document.querySelectorAll('.kb-board').forEach(board=>{
    if(board.scrollWidth<=board.clientWidth+4)return;
    if(board.previousElementSibling&&board.previousElementSibling.classList.contains('kb-scroll-top'))board.previousElementSibling.remove();
    const proxy=document.createElement('div');
    proxy.className='kb-scroll-top';
    proxy.style.cssText='overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:4px';
    const spacer=document.createElement('div');
    spacer.style.cssText='height:1px;width:'+board.scrollWidth+'px';
    proxy.appendChild(spacer);
    board.parentNode.insertBefore(proxy,board);
    let lock=false;
    proxy.addEventListener('scroll',()=>{if(lock){lock=false;return}lock=true;board.scrollLeft=proxy.scrollLeft});
    board.addEventListener('scroll',()=>{if(lock){lock=false;return}lock=true;proxy.scrollLeft=board.scrollLeft});
  });
}

function kbVerMais(k){
  window._kbMore=window._kbMore||{};
  window._kbMore[k]=!window._kbMore[k];
  renderAssessorOpps();
}
let _dragId=null;
function kbDragStart(ev,id){_dragId=id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',id)}catch(e){}}
function kbDragOver(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.style.background='#E4D2C6';ev.currentTarget.style.transform='scale(1.01)';}
// Auto-rolagem enquanto arrasta: perto das bordas do board rola horizontal; perto do topo/rodapé rola a página
document.addEventListener('dragover',ev=>{
  const M=90,S=30;
  const el=ev.target&&ev.target.closest?ev.target.closest('.kb-board'):null;
  if(el){
    const r=el.getBoundingClientRect();
    if(ev.clientX-r.left<M)el.scrollLeft-=S;
    else if(r.right-ev.clientX<M)el.scrollLeft+=S;
  }
  if(ev.clientY<110)window.scrollBy(0,-S);
  else if(window.innerHeight-ev.clientY<110)window.scrollBy(0,S);
});
function kbDragLeave(ev){ev.currentTarget.style.background='';ev.currentTarget.style.transform='';}
async function kbDrop(ev,statusKey){
  if(statusKey==='__PERD__')statusKey='Cliente Negou';
  ev.preventDefault();
  ev.currentTarget.style.background='';ev.currentTarget.style.transform='';
  const id=_dragId;_dragId=null;
  if(!id)return;
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[])];
  const patch={updated_at:now.toISOString()};
  if(statusKey==='__BOL__'){
    if(isB(r))return;
    hist.push({campo:'Pendência boleta',de:r.pb||'',para:'Boletado',usuario:USER.nome,data:ds});
    patch.pb='Boletado';
  }else{
    if(norm(r.sc||'')===norm(statusKey)&&!isB(r))return;
    if(isB(r)){
      hist.push({campo:'Pendência boleta',de:r.pb||'',para:'(desfeita)',usuario:USER.nome,data:ds});
      patch.pb='';
    }
    hist.push({campo:'Status comercial',de:r.sc||'',para:statusKey,usuario:USER.nome,data:ds});
    patch.sc=statusKey;
  }
  patch.historico=hist;
  try{
    await db('PATCH','oportunidades',patch,'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+(statusKey==='__BOL__'?'Boletado':statusKey),true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

function renderAssessorOpps(c=document.getElementById('main-content')){
  const isDir=USER.perfil==='diretor'||USER.perfil==='gestor';
  const myOpps=isDir?[...OPPS]:OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;

  });
  const hoje=today();
  const hora=new Date().getHours();
  const saud=hora<12?'Bom dia':hora<18?'Boa tarde':'Boa noite';

  const bolVol=myOpps.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
  const ativos=myOpps.filter(r=>!isB(r));

  // Priority buckets
  const reunioesHoje=ativos.filter(r=>r.reuniao_data&&r.reuniao_data.startsWith(hoje)).sort((a,b)=>(a.reuniao_data||'').localeCompare(b.reuniao_data||''));

  function prioLine(r,tipo){
    const cfg={
      reuniao:{icon:'📅',bg:'#E6F1FB',label:'reunião hoje '+(r.reuniao_data&&r.reuniao_data.includes('T')?'às '+r.reuniao_data.split('T')[1].substring(0,5):'')},
      atrasado:{icon:'🔴',bg:'#FCEBEB',label:'há '+(Math.floor((new Date(hoje)-new Date(r.todo_data))/(1000*60*60*24)))+'d atrasado'},
      hoje:{icon:'📅',bg:'#FEF3E2',label:'para hoje'},
      quase:{icon:'🔥',bg:'#E1F5EE',label:'quase lá!'},
      parado:{icon:'💤',bg:'#F5F0EB',label:daysSince(getLastMoveDate(r))+'d parado'}
    }[tipo];
    return '<div class="prio-item">'
      +'<div class="prio-flag" style="background:'+cfg.bg+'">'+cfg.icon+'</div>'

      +'<div class="prio-cli">'+r.cliente+' <span style="font-size:10px;font-weight:600;color:var(--muted)">· '+(SUBAREAS[subAreaOf(r)]?.name||'')+(r.produto?' · '+r.produto:'')+(r.responsavel?' · 👤'+r.responsavel:'')+'</span></div>'
      +'<div class="prio-acao">👉 '+analisarProximaAcao(r).acao+' <span style="font-weight:700">('+cfg.label+')</span></div>'
      +'</div>'
      +'<div class="prio-vol">'+fmt(r.atual||r.pipe)+'</div>'
      +'<button class="btn sm wine" onclick="openEdit(\''+r.id+'\')">Atualizar</button>'
      +'</div>';
  }

  const prioHtml=[
    ...reunioesHoje.map(r=>prioLine(r,'reuniao')),
    ...atrasados.map(r=>prioLine(r,'atrasado')),
    ...hojeList.map(r=>prioLine(r,'hoje')),
    ...quaseLa.map(r=>prioLine(r,'quase')),
    ...parados.slice(0,5).map(r=>prioLine(r,'parado'))

  // Kanban columns
  const _cust=kbCustomCols();
  const _custReuniao=_cust.filter(c=>/r2|reuni/.test(norm(c)));
  const _custOutras=_cust.filter(c=>!/r2|reuni/.test(norm(c)));
  const KB_COLS=[
    ['Ligar Cliente','📞','#5A3A3E'],
    ['Agendar Reunião','🗓️','#854F0B'],
    ['Reunião Agendada','📅','#3C3489'],
    ..._custReuniao.map(c=>[c,'📅','#3C3489']),
    ['Cliente Confirmar','⏳','#0C447C'],
    ['Cliente Topou','🤝','#085041'],
    ..._custOutras.map(c=>[c,'📌','#7A5C8A']),
    ['__BOL__','✅','#085041'],
    ['__PERD__','❌','#A32D2D']
  ];

  function kbCard(r){
    const dias=daysSince(getLastMoveDate(r));

      +(r.reuniao_data?'<div class="kb-meta" style="color:#0C447C;font-weight:700">📅 Reunião '+fmtReuniao(r.reuniao_data)+'</div>':'')
      +(r.todo?'<div class="kb-meta" style="color:var(--amber)">📋 '+r.todo.substring(0,40)+(r.todo_data?' ('+r.todo_data.split('-')[2]+'/'+r.todo_data.split('-')[1]+')':'')+'</div>':'')

      +'</div>'
      +(!isB(r)?'<button class="kb-adv'+(isTopou?' bol':'')+'" onclick="advanceStatus(\''+r.id+'\',event)">'+(isTopou?'✅ Boletar agora':'Avançar etapa →')+'</button>':'')
      +'</div>';
  }

  const fArea=window._kbArea||'';
  const fAssKb=window._kbAss||'';
  const fSCKb=window._kbSC||'';
  const fPBKb=window._kbPB||'';
  const fCliKb=window._kbCli||'';

  const fResp=window._kbResp||'';

  if(fCliKb)kbOpps=kbOpps.filter(r=>(r.cliente||'').toLowerCase().includes(fCliKb.toLowerCase()));

  function buildKanban(opps,seg){
    seg=seg||'';

      const mk=(seg+'|'+key).replace(/\\/g,'').replace(/'/g,'');

        +'<div style="font-size:10px;font-weight:700;color:'+cor+';padding:0 8px 8px">'+(fmt(vol)||'—')+'</div>'
        +(()=>{
          const exp=(window._kbMore||{})[mk];

              :'');
        })()

    }).join('');
  }

  function buildLista(opps){

// ── QUICK ACTIONS ──
async function quickBoletar(id){
  const r=OPPS.find(o=>o.id===id);
  if(!r||!confirm(`Marcar "${r.cliente}" como Boletado?`))return;
  const now=new Date();
  const hist=[...(r.historico||[]),{campo:'Pendência boleta',de:r.pb,para:'Boletado',usuario:USER.nome,data:now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}];
  try{
    await db('PATCH','oportunidades',{pb:'Boletado',historico:hist,updated_at:now.toISOString()},`id=eq.${id}`);
    showToast('✅ Marcado como Boletado!',true);
    await loadData();
    renderAssessorOpps();
  }catch(e){showToast('Erro: '+e.message)}
}

function renderAssessorDash(c=document.getElementById('main-content')){
  const myOpps=OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
  const bolRows=myOpps.filter(isB);
  const bolV=bolRows.reduce((s,r)=>s+(r.atual||0),0);
  const ativos=myOpps.filter(r=>!isB(r));
  const pipeV=ativos.reduce((s,r)=>s+(r.pipe||0),0);
  const pend=ativos.filter(isPend).length;
  const efet=myOpps.length?Math.round(bolRows.length/myOpps.length*100):0;

  // Minhas metas (responsável = eu)
  const minhasMetas=METAS.filter(m=>norm(m.assessor)===norm(USER.nome)).map(m=>{
    const rows=OPPS.filter(r=>{
      if(m.area&&r.area!==m.area)return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const pct=m.meta_valor>0?Math.min(Math.round(boletado/m.meta_valor*100),999):0;
    return{...m,boletado,pct};
  });

  // Por segmento
  const segCards=subareasVis().map(([sk,a])=>{
    const so=myOpps.filter(r=>subAreaOf(r)===sk);
    if(!so.length)return'';
    const sb=so.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const sbN=so.filter(isB).length;
    const sp=so.filter(r=>!isB(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const spN=so.filter(r=>!isB(r)).length;
    return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;border-top:4px solid '+a.color+'">'
      +'<div style="font-size:12px;font-weight:700;color:'+a.color+';text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px">'+a.name+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +'<div style="background:var(--green-bg);border-radius:4px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase">✓ Boletado</div>'
      +'<div style="font-size:16px;font-weight:700;color:var(--green)">'+(fmt(sb)||'R$0')+'</div>'
      +'<div style="font-size:10px;color:var(--green)">'+sbN+' opor.</div>'
      +'</div>'
      +'<div style="background:var(--cream);border-radius:4px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">🔄 Em esteira</div>'
      +'<div style="font-size:16px;font-weight:700;color:'+a.color+'">'+(fmt(sp)||'—')+'</div>'
      +'<div style="font-size:10px;color:var(--muted)">'+spN+' opor.</div>'
      +'</div>'
      +'</div></div>';
  }).join('');

  // Esteira por etapa (mini funil)
  const funilRows=SC_CHAIN.map(s=>{
    const rows=ativos.filter(r=>scFunil(r.sc)===norm(s));
    return{s,n:rows.length,v:rows.reduce((s2,r)=>s2+(r.pipe||0),0)};
  });
  const perdRowsF=OPPS.filter(r=>!isB(r)&&isPerdida(r));
  funilRows.push({s:'❌ Perdido',n:perdRowsF.length,v:perdRowsF.reduce((s2,r)=>s2+(r.pipe||0),0),perd:true});
  const maxF=Math.max(...funilRows.map(f=>f.n),1);

  c.innerHTML=''
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">'
    +'<div class="kpi green"><div class="kpi-lbl">✓ Boletado</div><div class="kpi-val">'+(fmt(bolV)||'R$0')+'</div><div class="kpi-sub">'+bolRows.length+' oportunidades</div></div>'
    +'<div class="kpi wine"><div class="kpi-lbl">🔄 Em esteira</div><div class="kpi-val">'+(fmt(pipeV)||'R$0')+'</div><div class="kpi-sub">'+ativos.length+' em andamento</div></div>'
    +'<div class="kpi amber"><div class="kpi-lbl">⚡ Pendências</div><div class="kpi-val">'+pend+'</div><div class="kpi-sub">aguardando ação</div></div>'
    +'<div class="kpi blue"><div class="kpi-lbl">Efetivação</div><div class="kpi-val">'+efet+'%</div><div class="kpi-sub">boletadas / total</div></div>'
    +'</div>'

    // Minhas metas
    +(minhasMetas.length?'<div class="section-label">🏆 Minhas metas do mês</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:22px">'
      +minhasMetas.map(m=>{
        const a=AREAS[m.area]||{color:'#8B1C2A',name:m.area};
        const pctColor=m.pct>=100?'#085041':m.pct>=60?'#854F0B':a.color;
        return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;border-left:4px solid '+a.color+'">'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
          +'<span style="font-size:12px;font-weight:700;color:'+a.color+'">'+a.name+(m.produto?' · '+m.produto:'')+'</span>'
          +'<span style="font-size:16px;font-weight:700;color:'+pctColor+'">'+m.pct+'%</span>'
          +'</div>'
          +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:8px">'
          +'<span style="font-size:20px;font-weight:700;color:'+pctColor+'">'+(fmt(m.boletado)||'R$0')+'</span>'
          +'<span style="font-size:12px;color:var(--muted)">/ '+fmt(m.meta_valor)+'</span>'
          +'</div>'
          +'<div style="height:8px;background:var(--border);border-radius:3px;overflow:hidden">'
          +'<div style="width:'+Math.min(m.pct,100)+'%;height:8px;background:'+pctColor+';border-radius:3px"></div>'
          +'</div>'
          +'<div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:right">'+(m.meta_valor>m.boletado?'falta '+fmt(m.meta_valor-m.boletado):'✅ meta atingida!')+'</div>'
          +'</div>';
      }).join('')+'</div>':'')

    // Por segmento
    +'<div class="section-label">Por segmento</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px">'+segCards+'</div>'

    // Esteira por etapa
    +'<div class="section-label">🔄 O que está na esteira</div>'
    +'<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin-bottom:20px">'
    +funilRows.map(f=>{
      const w=Math.max(Math.round(f.n/maxF*100),3);
      const cf=f.perd?'#A32D2D':'var(--wine)';
      const bf=f.perd?'#FCEBEB':'var(--wine-l)';
      return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'
        +'<div style="min-width:130px;font-size:12px;font-weight:600;color:'+(f.perd?'#A32D2D':'inherit')+'">'+f.s+'</div>'
        +'<div style="flex:1;background:'+bf+';border-radius:4px;height:28px;overflow:hidden">'
        +'<div style="width:'+w+'%;height:28px;background:'+cf+';border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:30px">'
        +'<span style="color:#fff;font-size:11px;font-weight:700">'+f.n+'</span>'
        +'</div></div>'
        +'<div style="min-width:64px;text-align:right;font-size:12px;font-weight:700;color:var(--wine-d)">'+(fmt(f.v)||'—')+'</div>'
        +'</div>';
    }).join('')
    +'</div>';
}

async function toggleDaily(oppId,checked){
  const t=today();
  try{
    if(checked){
      const res=await db('POST','daily_selecoes',{data:t,assessor:USER.nome,oportunidade_id:oppId,tipo:'',acao:''});
      DAILY[oppId]={tipo:'',acao:'',id:res?.[0]?.id};
    }else{
      if(DAILY[oppId]?.id)await db('DELETE','daily_selecoes','',`id=eq.${DAILY[oppId].id}`);
      delete DAILY[oppId];
    }
    renderAssessorDaily();
  }catch(e){showToast('Erro: '+e.message)}
}

async function updateDaily(oppId,field,value){
  if(!DAILY[oppId]?.id)return;
  DAILY[oppId][field]=value;
  try{await db('PATCH','daily_selecoes',{[field]:value},`id=eq.${DAILY[oppId].id}`);}catch{}
}

function exportDailyPDF(){

    return true;
  });

// ── DEFINIÇÕES DO MÊS (METAS) ──
function renderMetas(c=document.getElementById('main-content')){
  const mesLabel=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

  // Compute progress for each meta (individual: by area+produto)
  const metasComProgresso=METAS.map(m=>{
    const rows=OPPS.filter(r=>{
      if(m.area){
        if(m.area==='rv'||m.area==='rf'){if(subAreaOf(r)!==m.area)return false;}
        else if(r.area!==m.area)return false;
      }
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const pipe=rows.reduce((s,r)=>s+(r.pipe||0),0);
    const pct=m.meta_valor>0?Math.min(Math.round(boletado/m.meta_valor*100),999):0;
    return{...m,boletado,pipe,pct,nOpps:rows.length};
  });

  // Group by area
  const porArea={};
  metasComProgresso.forEach(m=>{
    if(!porArea[m.area])porArea[m.area]=[];
    porArea[m.area].push(m);
  });
  const GRUPOS_META=[...subareasVis().filter(([k])=>k==='rv'||k==='rf'),...areasVis()].filter(([ak])=>porArea[ak]&&porArea[ak].length);
  const rowsGrupo=ak=>OPPS.filter(r=>(ak==='rv'||ak==='rf')?subAreaOf(r)===ak:r.area===ak);

  // Global totals
  const totalMeta=metasComProgresso.reduce((s,m)=>s+(m.meta_valor||0),0);
  const totalBolGlobal=Object.keys(porArea).reduce((s,ak)=>{
    const rows=OPPS.filter(r=>r.area===ak);
    return s+rows.filter(isB).reduce((s2,r)=>s2+(r.atual||0),0);
  },0);
  const totalPct=totalMeta>0?Math.round(totalBolGlobal/totalMeta*100):0;

  c.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">'
    +'<div><div style="font-size:18px;font-weight:700">🎯 Definições do mês</div>'
    +'<div style="font-size:12px;color:var(--muted);text-transform:capitalize">'+mesLabel+'</div></div>'
    +(USER.perfil==='diretor'?'<button class="btn wine" onclick="openNewMeta()">+ Nova meta</button>':'')
    +'</div>'

    // Global summary
    +(METAS.length?(()=>{
      const areaLine=(getVal)=>'<div style="display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-l);flex-wrap:wrap">'
        +GRUPOS_META.map(([ak,a])=>{
          const metasA=porArea[ak]||[];
          const metaA=metasA.reduce((s,m)=>s+(m.meta_valor||0),0);
          const bolA=rowsGrupo(ak).filter(isB).reduce((s,r)=>s+(r.atual||0),0);
          const pctA=metaA>0?Math.round(bolA/metaA*100):0;
          return '<div style="display:flex;align-items:center;gap:4px" title="'+a.name+'">'
            +'<span style="width:8px;height:8px;border-radius:50%;background:'+a.color+';flex-shrink:0"></span>'
            +'<span style="font-size:11px;font-weight:700;color:'+a.color+'">'+getVal(metaA,bolA,pctA)+'</span>'
            +'</div>';
        }).join('')+'</div>';
      return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px">'
      +'<div class="kpi wine"><div class="kpi-lbl">Meta total do mês</div><div class="kpi-val">'+fmt(totalMeta)+'</div>'+areaLine((m,b,p)=>fmt(m))+'</div>'
      +'<div class="kpi green"><div class="kpi-lbl">Realizado</div><div class="kpi-val">'+(fmt(totalBolGlobal)||'R$0')+'</div>'+areaLine((m,b,p)=>fmt(b)||'R$0')+'</div>'
      +'<div class="kpi '+(totalPct>=100?'green':totalPct>=60?'amber':'')+'"><div class="kpi-lbl">Atingimento</div><div class="kpi-val">'+totalPct+'%</div>'+areaLine((m,b,p)=>p+'%')+'</div>'
      +'</div>';
    })():'')

    // ── RITMO DO MÊS: pace por dia útil + boletas fechadas ──
    +(METAS.length?(()=>{
      const du=diasUteis();
      const paceCards=GRUPOS_META.map(([ak,a])=>{
        const metaA=(porArea[ak]||[]).reduce((s,m)=>s+(m.meta_valor||0),0);
        if(!metaA)return '';
        const bolA=rowsGrupo(ak).filter(isB).reduce((s,r)=>s+(r.atual||0),0);
        const esperado=metaA/du.tot*du.ate;
        const delta=bolA-esperado;
        const porDia=metaA/du.tot;
        const precisaDia=Math.max(metaA-bolA,0)/Math.max(du.rest,1);
        const pctReal=Math.min(Math.round(bolA/metaA*100),100);
        const pctEsp=Math.min(Math.round(esperado/metaA*100),100);
        const batida=bolA>=metaA;
        const badge=batida
          ?'<span style="background:#E1F5EE;color:#085041;border:1px solid #9FE1CB;border-radius:3px;padding:3px 12px;font-size:12px;font-weight:700">🏁 Meta batida!</span>'
          :delta>=0
          ?'<span style="background:#E1F5EE;color:#085041;border:1px solid #9FE1CB;border-radius:3px;padding:3px 12px;font-size:12px;font-weight:700">🔥 Adiantado '+fmt(delta)+'</span>'
          :'<span style="background:#FCEBEB;color:#A32D2D;border:1px solid #F7C1C1;border-radius:3px;padding:3px 12px;font-size:12px;font-weight:700">⚠️ Atrasado '+fmt(-delta)+'</span>';
        return '<div style="background:var(--card);border:1px solid var(--border);border-left:3px solid '+a.color+';border-radius:6px;padding:16px 18px;margin-bottom:12px">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
          +'<div style="font-size:13px;font-weight:700;color:'+a.color+';text-transform:uppercase;letter-spacing:.03em">'+a.name+'</div>'
          +badge
          +'</div>'
          +'<div style="position:relative;height:14px;background:var(--border);border-radius:3px;margin-bottom:6px">'
          +'<div style="width:'+pctReal+'%;height:14px;border-radius:3px;background:'+(batida?'#085041':delta>=0?'#1D9E75':'#E24B4A')+';transition:width .6s"></div>'
          +(!batida?'<div title="onde você deveria estar hoje" style="position:absolute;top:-3px;left:'+pctEsp+'%;width:3px;height:20px;background:#2C2C2A;border-radius:2px"></div>':'')
          +'</div>'
          +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:10px">'

function fillMetaSelects(){
  // Responsável = membro do time de vendas (usuários cadastrados no sistema)
  const time=USUARIOS.filter(u=>u.ativo).map(u=>u.nome).sort();
  const selA=document.getElementById('m-assessor');
  selA.innerHTML='<option value="">Selecionar responsável...</option>'+time.map(a=>'<option>'+a+'</option>').join('');
  updateMetaProdutos();
}

function updateMetaProdutos(){
  const area=document.getElementById('m-area').value;
  const base=(area==='rv'||area==='rf')?OPPS.filter(r=>subAreaOf(r)===area):OPPS.filter(r=>!area||r.area===area);
  const produtos=[...new Set(base.map(r=>r.produto).filter(Boolean))].sort();
  const selP=document.getElementById('m-produto');
  selP.innerHTML='<option value="">Todos os produtos</option>'+produtos.map(p=>'<option>'+p+'</option>').join('');
}

let _metaEditId=null;
function openNewMeta(){
  _metaEditId=null;
  document.getElementById('m-title').textContent='🎯 Nova meta do mês';
  fillMetaSelects();
  document.getElementById('m-valor').value='';
  document.getElementById('modal-meta').style.display='flex';
}
function openEditMeta(id){
  const m=METAS.find(x=>x.id===id);
  if(!m)return;
  _metaEditId=id;
  document.getElementById('m-title').textContent='✏️ Editar meta';
  fillMetaSelects();
  document.getElementById('m-assessor').value=m.assessor||'';
  document.getElementById('m-area').value=m.area||'inv';
  updateMetaProdutos();
  document.getElementById('m-produto').value=m.produto||'';
  document.getElementById('m-valor').value=m.meta_valor||'';
  document.getElementById('modal-meta').style.display='flex';
}
async function saveMeta(){
  const assessor=document.getElementById('m-assessor').value;
  const area=document.getElementById('m-area').value;
  const produto=document.getElementById('m-produto').value;
  const valor=parseFloat(document.getElementById('m-valor').value)||0;
  if(!assessor||!area||valor<=0){showToast('Preencha assessor, área e valor da meta!');return}
  const mes=new Date().toISOString().slice(0,7);
  try{
    if(_metaEditId){
      await db('PATCH','metas',{assessor,area,produto,meta_valor:valor},'id=eq.'+_metaEditId);
      showToast('✅ Meta atualizada!',true);
    }else{
      await db('POST','metas',{mes,assessor,area,produto,meta_valor:valor});
      showToast('✅ Meta criada!',true);
    }
    _metaEditId=null;
    closeModal('meta');
    document.getElementById('m-valor').value='';
    await loadData();
    renderMetas();
  }catch(e){showToast('Erro: '+e.message)}
}

async function delMeta(id){
  if(!confirm('Remover esta meta?'))return;
  try{
    await db('DELETE','metas','','id=eq.'+id);
    showToast('Meta removida',true);
    await loadData();
    renderMetas();
  }catch(e){showToast('Erro: '+e.message)}
}

async function doUploadMain(input){
  const file=input.files[0];if(!file)return;input.value='';
  const st=document.getElementById('us-main');
  const uc=document.getElementById('uc-main');
  st.textContent='⏳ Lendo planilha...';st.style.color='var(--muted)';

  const SHEET_MAP={
    'rv':'inv','RV':'inv','Rv':'inv',
    'rf':'inv','RF':'inv','Rf':'inv',
    'Consórcio':'cons','Consorcio':'cons','CONSÓRCIO':'cons','CONSORCIO':'cons',
    'Seguro de Vida':'seg','SEGURO DE VIDA':'seg','Seguro':'seg','SEG':'seg'
  };

  const SHEET_CFG={
    rv:{area:'inv',aai:['AAI','AI'],pipe:['RV Pipe'],atual:['RV Atual'],sc:['Status Comercial','Status Comercial RV'],pb:['Pendencia Boleta','Pendencia Boleta RV'],todo:['ToDo','TO DO'],obs:['Obs']},
    rf:{area:'inv',aai:['AI','AAI'],pipe:['RF Pipe'],atual:['RF Atual'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['Obs']},
    cons:{area:'cons',aai:['AI','AAI'],pipe:['Pipe Atual','Carta'],atual:['Pipe Atual'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo','OBS'],obs:['OBS']},
    seg:{area:'seg',aai:['AI','AAI'],pipe:['Seg Pipe'],atual:['Seg atual','Seg Atual'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp','Dono']}
  };

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const results={inv:{rows:[],new:0,upd:0},cons:{rows:[],new:0,upd:0},seg:{rows:[],new:0,upd:0}};

      // Process each relevant sheet
      for(const sname of wb.SheetNames){
        let cfgKey=null;
        const sl=sname.toLowerCase().trim();
        if(sl==='rv')cfgKey='rv';
        else if(sl==='rf')cfgKey='rf';
        else if(sl.includes('cons'))cfgKey='cons';
        else if(sl.includes('seguro')||sl.includes('seg vida')||sl==='seg')cfgKey='seg';
        if(!cfgKey)continue;

        const cfg=SHEET_CFG[cfgKey];
        const raw=XLSX.utils.sheet_to_json(wb.Sheets[sname],{header:1,defval:''});
        const rows=parsePipeCfg(raw,cfg.area,cfg);
        results[cfg.area].rows=[...results[cfg.area].rows,...rows];
      }

      const nadaReconhecido=Object.values(results).every(res=>!res.rows.length);
      if(nadaReconhecido){
        st.textContent='⚠️ Nenhuma aba reconhecida (esperado: RV, RF, Consórcio, Seguro de Vida). A planilha tem: '+wb.SheetNames.join(', ')+'. 👉 Use os cards de área única abaixo!';
        st.style.color='var(--red)';
        return;
      }
      let totalNew=0,totalUpd=0,totalRows=0;
      for(const[area,res]of Object.entries(results)){
        if(!res.rows.length)continue;
        const existing=OPPS.filter(r=>r.area===area);
        const toInsert=[],toUpdate=[];
        let skipped=0;
        res.rows.forEach(nr=>{
          const ex=existing.find(e=>norm(e.assessor)===norm(nr.assessor)&&norm(e.cliente)===norm(nr.cliente)&&norm(e.produto||'')===norm(nr.produto||''));
          // Boletas antigas da planilha NÃO entram como novas (histórico de meses anteriores).
          // Boletas do mês devem ser marcadas dentro do sistema.
          if(!ex&&norm(nr.pb||'')==='boletado'){skipped++;return;}
          if(ex){
            // MERGE DIÁRIO: preserva o trabalho do time no sistema.
            // Só atualiza pipe (volume). Campos vazios no sistema são preenchidos pela planilha.
            const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
            if(!ex.sc&&nr.sc)upd.sc=nr.sc;
            if(!ex.pb&&nr.pb)upd.pb=nr.pb;
            if(!ex.todo&&nr.todo)upd.todo=nr.todo;
            if(!ex.obs&&nr.obs)upd.obs=nr.obs;
            if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
            if(nr.responsavel)upd.responsavel=nr.responsavel;
            toUpdate.push(upd);
          }
          else toInsert.push(nr);
        });
        if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
        for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,`id=eq.${id}`);}
        res.new=toInsert.length;res.upd=toUpdate.length;
        totalNew+=toInsert.length;totalUpd+=toUpdate.length;totalRows+=res.rows.length;
      }

      uc.classList.add('done');
      st.textContent=`✅ ${totalNew+totalUpd} processadas (${totalNew} novas · ${totalUpd} atualizadas)${totalRows-totalNew-totalUpd>0?' · '+(totalRows-totalNew-totalUpd)+' boletas antigas ignoradas':''}`;
      st.style.color='var(--green)';

      // Show per-area results
      const resEl=document.getElementById('upload-results');
      if(resEl){
        resEl.style.display='grid';
        resEl.innerHTML=Object.entries(results).map(([ak,res])=>res.rows.length?`
          <div style="background:var(--green-bg);border:1px solid var(--green-b);border-radius:6px;padding:12px 14px">
            <div style="font-weight:700;color:${AREAS[ak].color};margin-bottom:4px">${AREAS[ak].name}</div>
            <div style="font-size:13px;font-weight:700;color:var(--green)">${res.rows.length} oportunidades</div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px">${res.new} novas · ${res.upd} atualizadas</div>
          </div>`:'').join('');
      }

      showToast(`✅ ${totalRows} oportunidades importadas!`,true);
      const log=document.getElementById('upload-log');
      if(log){const d=document.createElement('div');d.style.cssText='background:var(--green-bg);border:1px solid var(--green-b);border-radius:4px;padding:10px 14px;margin-bottom:8px;font-size:12px;color:var(--green)';d.innerHTML=`<strong>${file.name}</strong> — ${totalRows} oportunidades importadas em ${new Date().toLocaleTimeString('pt-BR')}`;log.prepend(d)}
      await loadData();
    }catch(err){
      st.textContent='❌ Erro: '+err.message;st.style.color='var(--red)';
      showToast('Erro: '+err.message);
      console.error(err);
    }
  };
  reader.readAsBinaryString(file);
}

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const rows=parsePipeCfg(raw,cfg.area,cfg);
      if(!rows.length){st.textContent='⚠️ Nenhuma linha reconhecida';st.style.color='var(--red)';return;}
      st.textContent='⏳ Processando '+rows.length+'...';

      const existing=OPPS.filter(r=>r.area===cfg.area);
      const toInsert=[],toUpdate=[];let skipped=0;
      rows.forEach(nr=>{
        const ex=existing.find(x=>norm(x.assessor)===norm(nr.assessor)&&norm(x.cliente)===norm(nr.cliente)&&norm(x.produto||'')===norm(nr.produto||''));
        if(!ex&&norm(nr.pb||'')==='boletado'){skipped++;return;}
        if(ex){
          const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
          if(!ex.sc&&nr.sc)upd.sc=nr.sc;
          if(!ex.pb&&nr.pb)upd.pb=nr.pb;
          if(!ex.todo&&nr.todo)upd.todo=nr.todo;
          if(!ex.obs&&nr.obs)upd.obs=nr.obs;
          if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
          if(nr.responsavel)upd.responsavel=nr.responsavel;
          toUpdate.push(upd);
        }else toInsert.push(nr);
      });
      if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
      for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,'id=eq.'+id);}

      uc.classList.add('done');
      st.textContent='✅ '+toInsert.length+' novas · '+toUpdate.length+' atualizadas'+(skipped?' · '+skipped+' boletas antigas ignoradas':'');
      st.style.color='var(--green)';
      showToast('✅ Área importada!',true);
      await loadData();
    }catch(err){st.textContent='❌ '+err.message.substring(0,60);st.style.color='var(--red)';}
  };
  reader.readAsBinaryString(file);
}

function parsePipeCfg(raw,area,cfg){
  // Find header row
  let hr=-1;
  for(let i=0;i<Math.min(raw.length,6);i++){
    const v=raw[i].map(x=>String(x).trim().toLowerCase());
    if(v.some(x=>x==='ai'||x==='aai'||x.includes('assessor'))){hr=i;break;}
  }
  if(hr<0)return[];
  const h=raw[hr].map(x=>String(x).trim());
  const fi=als=>{for(const a of als){const i=h.findIndex(x=>x.toLowerCase().includes(a.toLowerCase()));if(i>=0)return i;}return -1};
  const ci={
    aai:fi(cfg.aai),cli:fi(['Cliente']),prod:fi(['Produto']),
    pipe:fi(cfg.pipe),atual:fi(cfg.atual||cfg.pipe),
    fonte:fi(['Fonte do $','Fonte']),sc:fi(cfg.sc),pb:fi(cfg.pb),
    data:fi(['DATA DA BOLETA','Data Boleta','data_boleta']),
    todo:fi(cfg.todo),obs:fi(cfg.obs||['Obs']),
    resp:fi(cfg.resp||['Responsável','Responsavel','Resp'])
  };
  const pn=v=>{const s=String(v||0).replace(/[^0-9.,]/g,'').replace(',','.');return parseFloat(s)||0};
  return raw.slice(hr+1).filter(r=>{
    const a=String(r[ci.aai]||'').trim();
    return a&&!['nan','assessor','ai','aai','total',''].includes(a.toLowerCase());
  }).map(r=>({
    area,
    assessor:String(r[ci.aai]||'').trim(),
    cliente:String(r[ci.cli]||'').trim(),
    produto:String(r[ci.prod]||'').trim(),
    pipe:pn(r[ci.pipe]),
    atual:pn(r[ci.atual]),
    fonte:String(r[ci.fonte]||'').trim(),
    sc:String(r[ci.sc]||'').trim(),
    pb:String(r[ci.pb]||'').trim(),
    data_boleta:ci.data>=0&&r[ci.data]&&String(r[ci.data]).trim()!=='nan'?String(r[ci.data]).trim():null,
    todo:String(r[ci.todo]||'').trim(),
    obs:String(r[ci.obs]||'').trim(),
    responsavel:ci.resp>=0?String(r[ci.resp]||'').trim():'',
    historico:[]
  })).filter(r=>r.assessor&&r.cliente);
}

function parsePipe(raw,area){
  const cfg={aai:['assessor','ai','aai'],pipe:['volume acordado','pipe atual','rf pipe','rv pipe','seg pipe','pipe','volume'],atual:['atual'],sc:['status comercial'],pb:['pendencia boleta'],todo:['todo'],obs:['obs']};
  return parsePipeCfg(raw,area,cfg);
}

// ── USUARIOS ──
function renderUsuarios(c=document.getElementById('main-content')){
  c.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:14px;font-weight:700">${USUARIOS.length} usuários cadastrados</div>
    <button class="btn wine" onclick="document.getElementById('modal-user').style.display='flex'">+ Novo usuário</button>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Perfil</th><th>Áreas</th><th>PIN</th><th>Status</th><th></th></tr></thead>
  <tbody>${USUARIOS.map(u=>`<tr>
    <td style="font-weight:700">${u.nome}</td>
    <td><span class="badge ${u.perfil==='diretor'?'b-wine':u.perfil==='gestor'?'b-purple':'b-gray'}">${u.perfil}</span></td>
    <td>${u.perfil==='diretor'?'<span class="badge b-wine">Todas</span>':(u.areas||[]).map(a=>`<span class="badge b-gray" style="margin-right:3px">${AREAS[a]?.name||a}</span>`).join('')||'—'}</td>
    <td><code style="background:var(--cream);padding:2px 8px;border-radius:4px;font-size:12px;border:1px solid var(--border)">${u.pin}</code></td>
    <td><span class="badge ${u.ativo?'b-green':'b-red'}">${u.ativo?'Ativo':'Inativo'}</span></td>
    <td><div style="display:flex;gap:6px">
      ${u.perfil!=='diretor'?`<button class="btn sm" onclick="setPerfil('${u.id}','${u.perfil==='gestor'?'assessor':'gestor'}')">${u.perfil==='gestor'?'↓ Voltar a assessor':'★ Tornar gestor'}</button>`:''}
      <button class="btn sm" onclick="toggleUser('${u.id}',${!u.ativo})">${u.ativo?'Desativar':'Ativar'}</button>
      <button class="btn sm" style="border-color:var(--red-b);background:var(--red-bg);color:var(--red)" onclick="delUser('${u.id}')">Remover</button>
    </div></td>
  </tr>`).join('')}</tbody></table></div>`;
}

function toggleAreas(){
  document.getElementById('u-areas-wrap').style.display=document.getElementById('u-perfil').value==='diretor'?'none':'flex';
}

async function saveUser(){
  const nome=document.getElementById('u-nome').value.trim();
  const pin2=document.getElementById('u-pin').value.trim();
  const perfil=document.getElementById('u-perfil').value;
  if(!nome||!pin2||pin2.length!==4||isNaN(pin2)){showToast('Nome e PIN de 4 dígitos obrigatórios!');return}
  const areas=perfil==='diretor'?['inv','cons','seg']:['inv','cons','seg'].filter(a=>document.getElementById('ua-'+a)?.checked);
  try{
    await db('POST','usuarios',{nome,pin:pin2,perfil,areas,ativo:true});
    showToast('✅ Usuário criado!',true);
    closeModal('user');
    USUARIOS=await db('GET','usuarios','','order=nome.asc');
    renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}

async function toggleUser(id,ativo){
  try{await db('PATCH','usuarios',{ativo},`id=eq.${id}`);USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
async function setPerfil(id,perfil){
  const u=USUARIOS.find(x=>x.id===id);
  if(perfil==='gestor'&&u&&!(u.areas||[]).length){showToast('Defina ao menos uma área para este usuário antes de torná-lo gestor');return}
  try{
    await db('PATCH','usuarios',{perfil},`id=eq.${id}`);
    showToast('✅ '+(u?u.nome:'Usuário')+' agora é '+(perfil==='gestor'?'gestor de área':'assessor'),true);
    USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}
async function delUser(id){
  if(!confirm('Remover este usuário?'))return;
  try{await db('DELETE','usuarios','',`id=eq.${id}`);USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
