// ── DEFINIÇÕES DO MÊS (METAS) ──
function renderMetas(c=document.getElementById('main-content')){
  const ml=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const mesLabel=ml.charAt(0).toUpperCase()+ml.slice(1);
  const du=diasUteis();
  const ehDiretor=USER.perfil==='diretor';

  // oportunidades de um comercial (mesma regra da Gestão do time)
  const oppsDe=nome=>OPPS.filter(r=>norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome));
  const rowsGrupo=ak=>OPPS.filter(r=>(ak==='rv'||ak==='rf')?subAreaOf(r)===ak:r.area===ak);
  const noGrupo=(r,ak)=>(ak==='rv'||ak==='rf')?subAreaOf(r)===ak:r.area===ak;

  // progresso de cada meta — AGORA filtrando pela pessoa dona da meta
  const metasComProgresso=metasDoMes().map(m=>{
    const rows=oppsDe(m.assessor).filter(r=>{
      if(m.area&&!noGrupo(r,m.area))return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
    const aBoletar=rows.filter(isABoletar).reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pipe=rows.filter(r=>!isB(r)&&!isPerdida(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const pct=m.meta_valor>0?Math.round(boletado/m.meta_valor*100):0;
    return{...m,boletado,aBoletar,pipe,pct,nOpps:rows.length};
  });

  if(!metasComProgresso.length){
    c.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">'
      +'<div><div style="font-size:18px;font-weight:700">Definições do mês</div>'
      +'<div style="font-size:12px;color:var(--muted)">'+mesLabel+'</div></div>'
      +(ehDiretor?'<button class="btn wine" onclick="openNewMeta()">+ Nova meta</button>':'')
      +'</div>'
      +'<div class="empty"><div class="empty-icon">🎯</div><p>Nenhuma meta definida para este mês ainda.<br>Clique em <strong>+ Nova meta</strong> para começar.</p></div>';
    return;
  }

  // ── agrupamentos ──
  const porArea={};
  metasComProgresso.forEach(m=>{(porArea[m.area]=porArea[m.area]||[]).push(m)});
  const GRUPOS=[...subareasVis().filter(([k])=>k==='rv'||k==='rf'),...areasVis()].filter(([ak])=>porArea[ak]&&porArea[ak].length);

  const areas=GRUPOS.map(([ak,a])=>{
    const meta=porArea[ak].reduce((s,m)=>s+(m.meta_valor||0),0);
    const rows=rowsGrupo(ak);
    const real=rows.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
    const aBol=rows.filter(isABoletar).reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pipe=rows.filter(r=>!isB(r)&&!isPerdida(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const pct=meta>0?Math.round(real/meta*100):0;
    const esperado=meta/du.tot*du.ate;
    return{ak,a,meta,real,aBol,pipe,pct,esperado,delta:real-esperado,precisaDia:Math.max(meta-real,0)/Math.max(du.rest,1)};
  });

  // totais globais somando os GRUPOS (rv/rf entram certo, sem dupla contagem com inv)
  const tMeta=areas.reduce((s,x)=>s+x.meta,0);
  const tReal=areas.reduce((s,x)=>s+x.real,0);
  const tPipe=areas.reduce((s,x)=>s+x.pipe,0);
  const tABol=areas.reduce((s,x)=>s+x.aBol,0);
  const tPct=tMeta>0?Math.round(tReal/tMeta*100):0;
  const tEsp=tMeta/du.tot*du.ate;
  const tDelta=tReal-tEsp;
  const falta=Math.max(tMeta-tReal,0);
  const precisaDia=falta/Math.max(du.rest,1);

  // ── BLOCO DE RITMO (o mesmo desenho para o total do mês e para cada área) ──
  // quebra por produto: trilha clara = pipe em aberto, barra cheia = boletado
  const produtosDaArea=(ak,cor)=>{
    const map={};
    rowsGrupo(ak).forEach(r=>{
      const pk=r.produto||'Outros';
      if(!map[pk])map[pk]={real:0,pipe:0};
      if(isBoletadoFirmado(r))map[pk].real+=(r.atual||0);
      if(!isB(r)&&!isPerdida(r))map[pk].pipe+=(r.pipe||0);
    });
    const itens=Object.entries(map).sort((a,b)=>(b[1].real-a[1].real)||(b[1].pipe-a[1].pipe));
    if(itens.length<2)return '';
    const base=Math.max(...itens.map(([,v])=>v.real+v.pipe),1);
    const track=tint(cor,.82);
    return '<div style="margin-top:16px;padding-top:13px;border-top:1px solid var(--border-l)">'
      +'<div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Por produto</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,340px));gap:5px 26px">'
      +itens.map(([nome,v])=>{
        const wT=Math.min((v.real+v.pipe)/base*100,100);
        const wR=Math.min(v.real/base*100,100);
        return '<div style="display:flex;align-items:center;gap:8px">'
          +'<span title="'+String(nome).replace(/"/g,'&quot;')+'" style="font-size:10.5px;font-weight:600;width:88px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nome+'</span>'
          +'<div style="flex:1;position:relative;height:9px;min-width:40px">'
          +(wT?'<div style="position:absolute;left:0;top:0;height:9px;width:'+wT.toFixed(1)+'%;background:'+track+';border-radius:3px"></div>':'')
          +(wR?'<div style="position:absolute;left:0;top:0;height:9px;width:'+wR.toFixed(1)+'%;background:'+cor+';border-radius:3px"></div>':'')
          +'</div>'
          +'<span style="font-size:10.5px;font-weight:700;width:58px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;color:'+(v.real?cor:'var(--muted-l)')+'">'+(v.real?fmt(v.real):'—')+'</span>'
          +'</div>';
      }).join('')
      +'</div></div>';
  };

  // rotulo/corBorda mudam; todo o resto do desenho é idêntico entre o total e as áreas
  const blocoRitmo=o=>{
    const meta=o.meta||0, real=o.real||0;
    const pct=meta>0?Math.round(real/meta*100):0;
    const esperado=meta/du.tot*du.ate;
    const delta=real-esperado;
    const falta=Math.max(meta-real,0);
    const precisaDia=falta/Math.max(du.rest,1);
    const cor=corPct(pct);
    const selo=real>=meta&&meta>0

      +'<div style="margin:12px 0 6px">'+barraRitmo(real,meta,esperado,cor,12)+'</div>'

    return '<div style="display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border-l)">'
      +'<div style="width:28px;text-align:center;font-size:19px;line-height:1;flex-shrink:0">'+(medalha[ix]||'<span style="font-size:11px;color:var(--muted-l);font-weight:700">'+(ix+1)+'º</span>')+'</div>'
      +'<div style="width:38px;height:38px;border-radius:50%;background:'+cor+';color:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+inits+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">'
      +'<span style="font-size:13.5px;font-weight:700">'+p.nome+'</span>'
      +'<span style="font-size:12px;white-space:nowrap"><strong style="color:'+cor+'">'+(fmt(p.real)||'R$0')+'</strong>'
      +'<span style="color:var(--muted)"> / '+fmt(p.meta)+'</span>'
      +'<strong style="color:'+cor+';margin-left:8px;font-size:14px">'+p.pct+'%</strong></span>'
      +'</div>'

    +'</div>';

  c.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">'
    +'<div><div style="font-size:18px;font-weight:700">Definições do mês</div>'

    +(ehDiretor?'<button class="btn wine" onclick="openNewMeta()">+ Nova meta</button>':'')
    +'</div>'
    +hero
    +'<div class="section-label" style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">Por área'

// ══════════════════════════════════════════════════════════
// ── FUNIL DE EFETIVIDADE: geradas > ligação > reunião > conversão ──
// Lê a MAIOR etapa que a oportunidade já alcançou (histórico + status atual).
// Usar só o status de hoje mentiria a favor: quem teve reunião e depois virou
// "Cliente Negou" sumiria da etapa de reunião e inflaria a taxa de conversão.
// ══════════════════════════════════════════════════════════
const ETAPA_IDX=s=>{
  const k=scFunil(s);
  if(!k)return -1;
  const i=SC_CHAIN.findIndex(x=>norm(x)===k);
  return i;
};
function etapaMaxima(r){
  let max=ETAPA_IDX(r.sc);
  (r.historico||[]).forEach(h=>{
    if(h.campo!=='Status comercial')return;
    const a=ETAPA_IDX(h.para), b=ETAPA_IDX(h.de);
    if(a>max)max=a;
    if(b>max)max=b;
  });
  return max;
}
const veioDePlanilha=r=>(r.historico||[]).some(h=>/\(planilha\)\s*$/.test(h.usuario||''));

// ── MARCAÇÃO EXPLÍCITA: o assessor confirma no card que ligou / que reuniu ──
// Vale mais que qualquer inferência: é o próprio time afirmando o fato.
// Guardado no histórico (sem coluna nova no banco); a última marcação de cada
// tipo é a que vale, então desmarcar realmente desmarca.
const MARCAS={
  lig:{campo:'Ligação',on:'Ligou para o cliente',off:'Desmarcou a ligação',ico:'📞',rot:'Ligou'},
  reu:{campo:'Reunião',on:'Reunião aconteceu',off:'Desmarcou a reunião',ico:'🤝',rot:'Fez reunião'},
};
// Data em que o assessor VAI LIGAR. Guardada como marcador no histórico — a
// última entrada é a que vale — para não exigir coluna nova no banco.
const CAMPO_LIG_DATA='Ligação marcada';
function dataLigacao(r){
  let v='';
  (r.historico||[]).forEach(h=>{if(h.campo===CAMPO_LIG_DATA)v=parseDataBoleta(h.para)||''});
  return v;
}
// ── ARQUIVAMENTO (virada de mês) ──
// A oportunidade fechada — boletada ou perdida — sai do fluxo do dia e passa a
// viver no Histórico, carimbada com a competência em que foi fechada.
// Guardado no histórico da própria oportunidade: a última marca é a que vale,
// então reabrir é só gravar uma marca vazia.
// ── PRÓXIMO PASSO OBRIGATÓRIO ──
// Oportunidade que continua viva não pode ser salva sem TODO e sem data:
// sem próximo passo com prazo, ninguém cobra e o card apodrece no Kanban.
// Fechada (boletada, a boletar, negada ou "não se aplica") está dispensada.
function fechadaPor(sc,pb){
  const k=norm(pb||''), c=norm(sc||'');
  return k==='boletado'||k==='a boletar'||c==='cliente negou'||c==='nao se aplica';
}
function faltaProximoPasso(sc,pb,todo,todoData){
  if(fechadaPor(sc,pb))return '';
  if(!String(todo||'').trim())return {campo:'todo',msg:'Escreva o próximo TODO — toda oportunidade em aberto precisa de um próximo passo.'};
  if(!todoData)return {campo:'data',msg:'Defina a data do TODO — sem prazo ninguém cobra.'};
  return '';
}
function marcaObrig(idTodo,idData,qual){
  [idTodo,idData].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('obrig')});
  const el=document.getElementById(qual==='todo'?idTodo:idData);
  if(el){el.classList.add('obrig');el.focus();}
}
const CAMPO_ARQ='Arquivamento';
// Boleta fechada com data de mês anterior já nasce arquivada NA COMPETÊNCIA DELA:
// não suja o mês corrente e cai direto no Histórico do mês certo.
function arquivoRetroativo(r,sc,pb,dataBoleta,ds){
  if(!fechadaPor(sc,pb))return null;
  const d=parseDataBoleta(dataBoleta);
  if(!d)return null;                                  // sem data não dá pra saber a competência
  const comp=d.slice(0,7);
  if(comp>=localISO(new Date()).slice(0,7))return null;   // é do mês corrente: segue no fluxo
  if(arquivadaEm(r||{})===comp)return null;
  return{campo:CAMPO_ARQ,de:arquivadaEm(r||{}),para:comp,usuario:USER.nome,data:ds};
}
// procura em TUDO: o Histórico precisa abrir e reabrir oportunidade arquivada
const acharOpp=id=>(OPPS_ALL.length?OPPS_ALL:OPPS).find(o=>String(o.id)===String(id));
function mesExtenso(ym){
  if(!/^\d{4}-\d{2}$/.test(ym||''))return ym||'—';
  const [y,m]=ym.split('-').map(Number);
  const n=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return n.charAt(0).toUpperCase()+n.slice(1);
}
function arquivadaEm(r){
  let v='';
  (r.historico||[]).forEach(h=>{if(h.campo===CAMPO_ARQ)v=(h.para||'').slice(0,7)});
  return /^\d{4}-\d{2}$/.test(v)?v:'';
}
const arquivada=r=>!!arquivadaEm(r);
// competência natural da oportunidade: quando ela de fato fechou
function competenciaDe(r){
  if(isB(r)){const d=parseDataBoleta(r.data_boleta);if(d)return d.slice(0,7);}
  if(isPerdida(r)){
    const h=[...(r.historico||[])].reverse().find(x=>x.campo==='Status comercial'&&norm(x.para||'')==='cliente negou');
    if(h){const k=dtKey(h.data);if(k)return localISO(new Date(k)).slice(0,7);}
  }
  if(r.updated_at){const d=new Date(r.updated_at);if(!isNaN(d))return localISO(d).slice(0,7);}
  return localISO(new Date()).slice(0,7);
}
function marcaInfo(r,k){
  const M=MARCAS[k];let e=null;
  (r.historico||[]).forEach(h=>{if(h.campo===M.campo)e=(h.para===M.on)?h:null});
  return e;
}
const marcado=(r,k)=>!!marcaInfo(r,k);
async function toggleMarca(id,k,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  const r=acharOpp(id);if(!r)return;
  const M=MARCAS[k],liga=!marcado(r,k);
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:M.campo,de:'',para:liga?M.on:M.off,usuario:USER.nome,data:ds}];
  r.historico=hist;                 // pinta na hora, sem esperar o banco
  pintaMarcas();
  const stampAntes=window._funilStamp||0;
  try{
    await db('PATCH','oportunidades',{historico:hist,updated_at:now.toISOString()},'id=eq.'+r.id);
  }catch(e){showToast('Não consegui salvar a marcação: '+e.message);return;}
  await loadData();renderCurView();pintaMarcas();
  // o aviso mostra o número novo do quadro de efetividade — a agulha mexe na hora,
  // mesmo quando o quadro não está visível na tela em que o clique aconteceu
  const naTela=(window._funilStamp||0)!==stampAntes;
  const f=calcFunil(naTela?(window._funilRows||[]):opsDoPeriodo(oppsDoUsuario()));
  const n=(k==='lig'?f.comLig:f.comReu), tot=f.geradas;
  const pct=tot?Math.round(n/tot*100):0;
  const quadro=' · efetividade: '+n+' de '+tot+(k==='lig'?' ligadas':' com reunião')+' ('+pct+'%)';
  showToast((liga?M.ico+' '+M.rot+' em '+(r.cliente||'oportunidade'):'Marcação removida de '+(r.cliente||'oportunidade'))+quadro,liga);
}
// repinta todo chip [data-mk="id|tipo"] a partir do estado atual
function pintaMarcas(){
  document.querySelectorAll('[data-mk]').forEach(el=>{
    const [id,k]=el.getAttribute('data-mk').split('|');
    const r=acharOpp(id);
    el.classList.toggle('on',!!(r&&marcado(r,k)));
  });
}
function mkChip(r,k,grande){
  const M=MARCAS[k];
  return '<span class="mk'+(grande?' lg':'')+(marcado(r,k)?' on':'')+'" data-mk="'+r.id+'|'+k+'"'
    +' onclick="toggleMarca(\''+r.id+'\',\''+k+'\',event)"'
    +' title="'+(marcado(r,k)?'Marcado — clique para desmarcar':'Marcar que '+(k==='lig'?'ligou para o cliente':'a reunião aconteceu'))+'">'
    +M.ico+' '+(grande?(k==='lig'?'Ligou para o cliente':'Fez reunião'):M.rot)+'</span>';
}

// ── EVIDÊNCIA DE TOQUE REAL ──
// Uma ligação de verdade deixa rastro no card mesmo quando NÃO avança a etapa:
// o cliente não atendeu, pediu para ligar depois, e o card continua em "Ligar Cliente".
// Contam como toque: mexer no status saindo da etapa de ligação, escrever uma
// observação, marcar como feito na Daily (que grava observação) e agendar a reunião.
// Card parado em "Ligar Cliente" sem NENHUM registro é o único caso de "não ligou".
function teveAtividade(r){
  if(r.reuniao_data)return true;
  return (r.historico||[]).some(h=>{
    if(h.campo==='Observação')return !!String(h.para||'').trim();
    if(h.campo==='Status comercial')return ETAPA_IDX(h.de)===0&&norm(h.para||'')!==norm(h.de||'');
    return false;
  });
}
// LIGOU DE FATO = avançou de etapa, ou registrou atividade no card, ou já fechou.
const teveLigacao=r=>marcado(r,'lig')||etapaMaxima(r)>=1||teveAtividade(r)||isB(r);
// REUNIU DE FATO = a data da reunião já passou, ou o card SAIU da etapa de reunião
// (só sai depois do encontro acontecer), ou passou de "Cliente Confirmar", ou fechou.
// Reunião marcada para frente NÃO conta: ainda não aconteceu.
const reuniaoFutura=r=>!!r.reuniao_data&&r.reuniao_data.slice(0,10)>=today()&&!isB(r)&&!marcado(r,'reu');
function teveReuniao(r){
  if(marcado(r,'reu'))return true;   // o time confirmou: acabou a discussão
  if(isB(r))return true;
  if(r.reuniao_data&&r.reuniao_data.slice(0,10)<today())return true;   // a data já passou
  if(ETAPA_IDX(r.sc)>=3)return true;   // já passou de "Reunião Agendada"
  return (r.historico||[]).some(h=>h.campo==='Status comercial'&&ETAPA_IDX(h.de)>=2);
}

function calcFunil(rows){
  const geradas=rows.length;
  const comLig=rows.filter(teveLigacao).length;
  const comReu=rows.filter(teveReuniao).length;
  const conv=rows.filter(isBoletadoFirmado);
  const convN=conv.length;
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;
  return{
    geradas, comLig, comReu, convN,
    volume:conv.reduce((a,r)=>a+(r.atual||0),0),
    tLig:pct(comLig,geradas), tReu:pct(comReu,comLig), tConv:pct(convN,comReu),
    pontaAPonta:pct(convN,geradas),
    pDeLig:geradas-comLig, pDeReu:comLig-comReu, pDeConv:comReu-convN,
    dePlanilha:rows.filter(r=>veioDePlanilha(r)&&etapaMaxima(r)>=1).length,
    reuAgendada:rows.filter(r=>reuniaoFutura(r)&&!teveReuniao(r)).length,
  };
}

// período: 'mes' | 'tri' | 'ano' | 'tudo'
window._funilPer=window._funilPer||'mes';
function setFunilPer(p){window._funilPer=p;renderCurView();}
function opsDoPeriodo(rows){
  const p=window._funilPer;
  if(p==='tudo')return rows;
  const hoje=new Date();
  const ini=new Date(hoje);
  if(p==='mes')ini.setDate(1);
  else if(p==='tri')ini.setMonth(hoje.getMonth()-2,1);
  else if(p==='ano')ini.setMonth(0,1);
  ini.setHours(0,0,0,0);
  return rows.filter(r=>{
    if(!r.created_at)return true;           // sem data conhecida: não some do funil
    const d=new Date(r.created_at);
    return isNaN(d)?true:d>=ini;
  });
}

    +(perda>0?'<span class="fnl-perda">· '+perda+' '+(perda===1?pSing:pPlur)+'</span>':'')
    +'</div><div></div></div>';
  const corTaxa=t=>t>=70?'var(--green)':t>=45?'var(--amber)':'var(--red)';
  // a passagem mais fraca é o gargalo do período
  const passagens=[{n:'geradas → ligação',t:f.tLig},{n:'ligação → reunião',t:f.tReu},{n:'reunião → boleta',t:f.tConv}];
  const pior=passagens.reduce((a,b)=>b.t<a.t?b:a);

  return '<div class="fnl">'
    +'<div class="fnl-top">'
    +'<div><div class="fnl-lbl">Efetividade do funil</div>'
    +'<div class="fnl-per">'+f.geradas+(f.geradas===1?' oportunidade':' oportunidades')+' no período</div>'+rec+'</div>'
    +'<div class="fnl-chips">'+chips+'</div></div>'
    +etapa('Geradas','oportunidades criadas',f.geradas,'var(--wine)','100%','geradas')
    +passo(f.tLig,f.comLig,'foi trabalhada','foram trabalhadas',f.pDeLig,'sem nenhum registro','sem nenhum registro',corTaxa(f.tLig))
    +etapa('Ligaram','atividade registrada no card',f.comLig,'#8E4152',(f.geradas?Math.round(f.comLig/f.geradas*100):0)+'%','ligacao')
    +passo(f.tReu,f.comReu,'chegou à reunião','chegaram à reunião',f.pDeReu,'não virou reunião','não viraram reunião',corTaxa(f.tReu))
    +etapa('Fez reunião','encontro já realizado',f.comReu,'#A66070',(f.geradas?Math.round(f.comReu/f.geradas*100):0)+'%','reuniao')

    +(f.dePlanilha?'<span class="fnl-obs">'+f.dePlanilha+(f.dePlanilha===1?' veio':' vieram')+' de planilha já em estágio adiantado — as etapas anteriores aconteceram fora do sistema.</span>':'')

// ── DETALHE DA ETAPA: quem exatamente está dentro de cada barra ──
// O clique na barra abre a lista com a PROVA de cada linha: a observação
// registrada, o movimento de status ou a data da reunião que fez a
// oportunidade contar naquela etapa. Sem prova visível, o número é fé.
const dataBR=iso=>{if(!iso)return'';const p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''};
function dtKey(s){
  if(!s)return 0;
  const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m)return +new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  const d=new Date(s);return isNaN(d)?0:+d;
}
const aspas=t=>'“'+String(t).trim().replace(/\s+/g,' ').slice(0,90)+(String(t).trim().length>90?'…':'')+'”';
function provaEtapa(k,r){
  if(k==='geradas')return{d:dataBR(r.created_at),txt:'criada'+(veioDePlanilha(r)?' · veio de planilha':'')};
  if(k==='conv')return{d:dataBR(r.data_boleta)||dataBR(r.updated_at),txt:'boleta fechada'};
  const mi=marcaInfo(r,k==='ligacao'?'lig':k==='reuniao'?'reu':'');
  if(mi)return{d:mi.data,txt:'✓ confirmado no card',quem:mi.usuario};
  if(k==='ligacao'){
    for(const h of (r.historico||[])){
      if(h.campo==='Observação'&&String(h.para||'').trim())return{d:h.data,txt:'registrou '+aspas(h.para),quem:h.usuario};
      if(h.campo==='Status comercial'){
        if(ETAPA_IDX(h.de)===0&&norm(h.para||'')!==norm(h.de||''))return{d:h.data,txt:'moveu de “'+(h.de||'—')+'” para “'+(h.para||'—')+'”',quem:h.usuario};
        if(ETAPA_IDX(h.para)>=1)return{d:h.data,txt:'avançou para “'+(h.para||'—')+'”',quem:h.usuario};
      }
    }
    if(r.reuniao_data){
      // a reunião marcada prova que houve contato, mas o contato foi QUANDO ele marcou,
      // não na data da reunião. Sem esse registro, a data do toque é desconhecida.
      const hm=[...(r.historico||[])].reverse().find(h=>h.campo==='Reunião marcada');
      return hm?{d:hm.data,txt:'marcou a reunião de '+dataBR(r.reuniao_data),quem:hm.usuario}
               :{d:'',txt:'reunião agendada para '+dataBR(r.reuniao_data)+' — data do contato não registrada'};
    }
    if(isB(r))return{d:dataBR(r.data_boleta),txt:'⚠ inferido: boletada sem registro de contato'};
    return{d:'',txt:'status atual: '+(r.sc||'—')};
  }
  if(r.reuniao_data&&r.reuniao_data.slice(0,10)<today())return{d:dataBR(r.reuniao_data),txt:'reunião na agenda, data já passou'};
  const h=(r.historico||[]).find(x=>x.campo==='Status comercial'&&ETAPA_IDX(x.de)>=2);
  if(h)return{d:h.data,txt:'saiu de “'+h.de+'” para “'+(h.para||'—')+'”',quem:h.usuario};
  if(ETAPA_IDX(r.sc)>=3)return{d:'',txt:'status atual: '+(r.sc||'—')};
  return{d:dataBR(r.data_boleta),txt:'⚠ inferido: boletada sem registro de reunião'};
}
const ETAPA_DET={
  geradas:{ico:'📋',t:'Oportunidades geradas',sub:'tudo que entrou no período',cor:'var(--wine)',bg:'var(--wine-l)',fn:()=>true,col:'Criada em'},
  ligacao:{ico:'📞',t:'Ligações que aconteceram',sub:'oportunidades com atividade registrada pelo time',cor:'#8E4152',bg:'var(--wine-ll)',fn:r=>teveLigacao(r),col:'Primeiro toque'},

};

    +'<div style="font-size:10px;color:var(--muted)">'+E.sub+'</div></div>'
    +'<div style="flex:1;min-width:150px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 13px">'

    +'<div style="font-size:10px;color:var(--muted)">'+(k==='conv'?'boletado':'pipe ou realizado')+'</div></div>'
    +'</div>'
    +(lista.length
      ? '<div class="ba-sec" style="--bc:'+E.cor+';--bbg:'+E.bg+'"><div style="overflow-x:auto"><table class="ba-tbl">'
        +'<thead><tr><th>Cliente</th><th>Assessor</th><th>'+E.col+'</th><th>O que comprova</th><th>Status hoje</th><th class="r">Volume</th></tr></thead>'
        +'<tbody>'+linhas+'</tbody></table></div></div>'
      : '<div class="ba-vazio">Nenhuma oportunidade nesta etapa.</div>')
    +'<div style="font-size:10px;color:var(--muted-l);margin-top:6px">Clique em qualquer linha para abrir a oportunidade. A coluna “o que comprova” mostra o registro que fez a oportunidade contar nesta etapa.</div>';
  document.getElementById('modal-area').style.display='flex';
}

// ── GERENCIAL DO ASSESSOR: meta acordada × pipe levantado × realizado ──
// ══════════════════════════════════════════════════════════
// Meta × levantado × realizado por segmento — usado no card do assessor e no modal gerencial
function segmentosDoAssessor(nome){
  const minhas=OPPS.filter(r=>assDe(r)===nome);
  const segs=SEGMENTOS_ACORDO.map(seg=>{
    const rows=minhas.filter(r=>segmentoDaOpp(r)===seg);
    const meta=acordoDe(nome,seg);
    const levantado=rows.reduce((s,r)=>s+(r.pipe||r.atual||0),0);
    const realizado=rows.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
    const aBoletar=rows.filter(isABoletar).reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pct=meta>0?Math.round(realizado/meta*100):null;
    let st;
    if(meta<=0)st={k:'semacordo',txt:'sem acordo',cor:'var(--muted)',bg:'var(--surf3)'};
    else if(realizado>=meta)st={k:'batida',txt:'meta batida',cor:'var(--green)',bg:'var(--green-bg)'};
    else if(levantado<meta)st={k:'semlastro',txt:'pipe não cobre',cor:'var(--amber)',bg:'var(--amber-bg)'};
    else st={k:'converter',txt:'falta converter',cor:'var(--blue)',bg:'var(--blue-bg)'};
    return{seg,rows,meta,levantado,realizado,aBoletar,pct,st};
  }).filter(x=>x.meta>0||x.rows.length);
  const semSeg=minhas.filter(r=>!segmentoDaOpp(r));
  return{segs,semSeg,minhas};
}
// valor curto pra caber no card: "300k", "1.2M"
const fmtC=v=>{if(!v||isNaN(v))return'—';if(v>=1e6)return(v/1e6).toFixed(1).replace('.0','')+'M';if(v>=1e3)return Math.round(v/1e3)+'k';return String(Math.round(v))};

// bloco compacto de metas que aparece na cara do card do assessor
function metasCardHtml(nome){
  const {segs}=segmentosDoAssessor(nome);
  const comAcordo=segs.filter(x=>x.meta>0);
  if(!comAcordo.length){
    return '<div style="font-size:10px;color:var(--muted-l);padding:6px 0 2px">Sem acordo definido — configure na aba Acordos por AI</div>';
  }
  const tMeta=comAcordo.reduce((s,x)=>s+x.meta,0);
  const tReal=comAcordo.reduce((s,x)=>s+x.realizado,0);
  const tLev=comAcordo.reduce((s,x)=>s+x.levantado,0);
  const tPct=tMeta>0?Math.round(tReal/tMeta*100):0;
  return '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px">'
    +'<span style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Meta × levantado</span>'
    +'<span style="font-size:10px;color:var(--muted)">🎯'+fmtC(tMeta)+' · 📥'+fmtC(tLev)+' · <strong style="color:'+(tPct>=100?'var(--green)':tPct>=60?'var(--amber)':'var(--red)')+'">'+tPct+'%</strong></span>'
    +'</div>'
    +comAcordo.map(x=>{
      const base=Math.max(x.meta,x.levantado,1);
      const wLev=Math.min(x.levantado/base*100,100);
      const wReal=Math.min(x.realizado/base*100,100);
      const posMeta=Math.min(x.meta/base*100,100);
      return '<div style="margin-bottom:7px">'
        +'<div style="display:flex;align-items:baseline;gap:6px">'
        +'<span style="font-size:10.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+x.seg+'</span>'
        +'<span style="font-size:9px;font-weight:700;border-radius:4px;padding:1px 6px;background:'+x.st.bg+';color:'+x.st.cor+';white-space:nowrap">'+x.st.txt+'</span>'
        +'</div>'
        +'<div style="position:relative;height:11px;background:var(--border);border-radius:3px;margin-top:3px">'
        +'<div style="position:absolute;left:0;top:0;height:11px;width:'+wLev.toFixed(1)+'%;background:var(--blue-b);border-radius:3px"></div>'
        +'<div style="position:absolute;left:0;top:0;height:11px;width:'+wReal.toFixed(1)+'%;background:'+x.st.cor+';border-radius:3px"></div>'
        +'<div title="meta '+fmt(x.meta)+'" style="position:absolute;top:-2px;left:calc('+posMeta.toFixed(1)+'% - 1px);width:2px;height:15px;background:var(--text);border-radius:1px"></div>'
        +'</div>'
        +'<div style="font-size:9px;color:var(--muted);margin-top:2px">🎯'+fmtC(x.meta)+' · 📥'+fmtC(x.levantado)+' · ✅'+fmtC(x.realizado)
        +(x.aBoletar?' · <span style="color:var(--amber)">⏳'+fmtC(x.aBoletar)+'</span>':'')
        +' · '+x.rows.length+' opor.</div>'
        +'</div>';
    }).join('');
}

}

function formatarCelulaAcordo(el){
  const v=parseMoeda(el.value);
  el.value=v?fmtMoedaBR(v):'';
  el.classList.toggle('preenchido',!!v);
}

// soma as colunas e compara com a meta da casa, ao vivo enquanto digita
function recalcAcordos(){
  const ass=window._acordoAss||[];
  if(!document.getElementById('acsumtot'))return;
  const somaCol=SEGMENTOS_ACORDO.map(()=>0);
  let somaGeral=0,invN=0;
  ass.forEach((nome,i)=>{
    let totLinha=0;
    SEGMENTOS_ACORDO.forEach((seg,j)=>{
      const el=document.getElementById('ac-'+i+'-'+j);
      const v=el?parseMoeda(el.value):0;
      somaCol[j]+=v;totLinha+=v;
    });
    somaGeral+=totLinha;
    const cb=document.getElementById('acinv-'+i);
    if(cb&&cb.checked)invN++;
    const td=document.getElementById('actot-'+i);
    if(td)td.textContent=totLinha?fmtMoedaBR(totLinha):'';
  });
  const inv=document.getElementById('acinvtot');
  if(inv)inv.textContent=invN+' / '+ass.length;
  let metaGeral=0;
  SEGMENTOS_ACORDO.forEach((seg,j)=>{
    const sc=document.getElementById('acsum-'+j);
    if(sc)sc.textContent=somaCol[j]?fmtMoedaBR(somaCol[j]):'—';
    const mEl=document.getElementById('acmeta-'+j);
    const meta=mEl?parseMoeda(mEl.value):0;
    metaGeral+=meta;
    const dEl=document.getElementById('acdelta-'+j);
    if(dEl){
      if(!meta){dEl.innerHTML='<span style="color:var(--muted-l)">—</span>';}
      else{
        const d=somaCol[j]-meta;
        const cor=d>=0?'var(--green)':'var(--red)';
        dEl.innerHTML='<span style="color:'+cor+'">'+(d>=0?'+':'−')+fmtMoedaBR(Math.abs(d))+'</span>'
          +'<span class="ac-delta" style="color:'+cor+'">'+(d>=0?'acima da meta':'falta acordar')+'</span>';
      }
    }
  });
  const st=document.getElementById('acsumtot');if(st)st.textContent=somaGeral?fmtMoedaBR(somaGeral):'—';
  const mt=document.getElementById('acmetatot');if(mt)mt.textContent=metaGeral?fmtMoedaBR(metaGeral):'—';
  const dt=document.getElementById('acdeltatot');
  if(dt){
    if(!metaGeral)dt.innerHTML='<span style="color:var(--muted-l)">—</span>';
    else{const d=somaGeral-metaGeral;const cor=d>=0?'var(--green)':'var(--red)';
      dt.innerHTML='<span style="color:'+cor+'">'+(d>=0?'+':'−')+fmtMoedaBR(Math.abs(d))+'</span>';}
  }
}

async function salvarAcordos(){
  if(USER.perfil!=='diretor'){showToast('Só o diretor pode alterar os acordos.');return}
  const btn=document.getElementById('btn-salvar-acordos');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    const mes=new Date().toISOString().slice(0,7);
    const existentes=new Map();
    acordosDoMes().forEach(m=>existentes.set(norm(m.assessor)+'|'+norm(m.produto||''),m));

    // estado desejado a partir do que está na tela
    const desejado=[];
    (window._acordoAss||[]).forEach((nome,i)=>{
      SEGMENTOS_ACORDO.forEach((seg,j)=>{
        const el=document.getElementById('ac-'+i+'-'+j);
        desejado.push({assessor:nome,produto:seg,valor:el?parseMoeda(el.value):0});
      });
      const cb=document.getElementById('acinv-'+i);
      desejado.push({assessor:nome,produto:SEG_INVESTOR,valor:(cb&&cb.checked)?1:0});
    });
    SEGMENTOS_ACORDO.forEach((seg,j)=>{
      const el=document.getElementById('acmeta-'+j);
      desejado.push({assessor:LINHA_CASA,produto:seg,valor:el?parseMoeda(el.value):0});
    });

    const novos=[],patches=[],apagar=[];
    desejado.forEach(d=>{
      const k=norm(d.assessor)+'|'+norm(d.produto);
      const ex=existentes.get(k);
      if(ex){
        if((ex.meta_valor||0)!==d.valor){
          if(d.valor===0)apagar.push(ex.id);
          else patches.push({id:ex.id,valor:d.valor});
        }
      }else if(d.valor!==0){
        novos.push({mes,assessor:d.assessor,area:areaComEmpresa(AREA_ACORDO,empParaGravar()),produto:d.produto,meta_valor:d.valor});
      }
    });

    if(novos.length)await db('POST','metas',novos);
    for(const p of patches)await db('PATCH','metas',{meta_valor:p.valor},'id=eq.'+p.id);
    for(const id of apagar)await db('DELETE','metas','','id=eq.'+id);

    const mexidos=novos.length+patches.length+apagar.length;
    showToast(mexidos?'✓ Acordos salvos ('+mexidos+' alteraç'+(mexidos>1?'ões':'ão')+')':'Nada mudou.',true);
    await loadData();
    renderCurView();
  }catch(e){
    showToast('Erro ao salvar: '+(e.message||e));
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar acordos';}
  }
}

function fillMetaSelects(){
  // Responsável = membro do time de vendas (usuários cadastrados no sistema)
  const time=USUARIOS.filter(u=>u.ativo).map(u=>u.nome).sort();
  const selA=document.getElementById('m-assessor');
  selA.innerHTML='<option value="">Selecionar responsável...</option>'+time.map(a=>'<option>'+a+'</option>').join('');
  updateMetaProdutos();
}

function updateMetaProdutos(){
  const area=document.getElementById('m-area').value;
  const base=(area==='rv'||area==='rf')?OPPS.filter(r=>subAreaOf(r)===area):OPPS.filter(r=>!area||r.area===area);
  const produtos=[...new Set(base.map(r=>r.produto).filter(Boolean))].sort();
  const selP=document.getElementById('m-produto');
  selP.innerHTML='<option value="">Todos os produtos</option>'+produtos.map(p=>'<option>'+p+'</option>').join('');
}

async function saveMeta(){
  const assessor=document.getElementById('m-assessor').value;
  const area=document.getElementById('m-area').value;
  const produto=document.getElementById('m-produto').value;
  const valor=parseFloat(document.getElementById('m-valor').value)||0;
  if(!assessor||!area||valor<=0){showToast('Preencha assessor, área e valor da meta!');return}
  const mes=new Date().toISOString().slice(0,7);

async function doUploadMain(input){
  const file=input.files[0];if(!file)return;input.value='';
  const st=document.getElementById('us-main');
  const uc=document.getElementById('uc-main');
  st.textContent='⏳ Lendo planilha...';st.style.color='var(--muted)';

  const SHEET_MAP={
    'rv':'inv','RV':'inv','Rv':'inv',
    'rf':'inv','RF':'inv','Rf':'inv',
    'Consórcio':'cons','Consorcio':'cons','CONSÓRCIO':'cons','CONSORCIO':'cons',
    'Seguro de Vida':'seg','SEGURO DE VIDA':'seg','Seguro':'seg','SEG':'seg'
  };

  const SHEET_CFG={
    inv:{area:'inv',produtoFixo:PRODUTO_GERAL_INV,aai:['AI','AAI'],pipe:['Pipe','Valor'],atual:['Atual','Valor'],sc:['Status Comercial','Status'],pb:['Pendencia Boleta','Pendencia'],todo:['ToDo','TO DO'],obs:['Obs','OBS'],resp:['Responsável','Responsavel','Resp']},
    rv:{area:'inv',produtoPadrao:PRODUTO_GERAL_RV,aai:['AAI','AI'],pipe:['RV Pipe','Valor'],atual:['RV Atual','Valor'],sc:['Status Comercial','Status Comercial RV'],pb:['Pendencia Boleta','Pendencia Boleta RV'],todo:['ToDo','TO DO'],obs:['Obs']},
    rf:{area:'inv',produtoPadrao:PRODUTO_GERAL_RF,aai:['AI','AAI'],pipe:['RF Pipe','Valor'],atual:['RF Atual','Valor'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['Obs']},
    cons:{area:'cons',aai:['AI','AAI'],pipe:['Pipe Atual','Carta','Valor'],atual:['Pipe Atual','Valor'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo','OBS'],obs:['OBS']},
    seg:{area:'seg',aai:['AI','AAI'],pipe:['Seg Pipe','Valor'],atual:['Seg atual','Seg Atual','Valor'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp','Dono']},
    saude:{area:'saude',produtoPadrao:'PLANO DE SAÚDE',aai:['AI','AAI'],pipe:['Saude Pipe','Saúde Pipe','Pipe','Valor'],atual:['Saude Atual','Saúde Atual','Atual','Valor'],sc:['Status Comercial','Status'],pb:['Pendencia Boleta','Pendencia'],todo:['ToDo','TO DO'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp','Dono']}
  };

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const results={inv:{rows:[],new:0,upd:0},cons:{rows:[],new:0,upd:0},seg:{rows:[],new:0,upd:0},saude:{rows:[],new:0,upd:0}};

      // Process each relevant sheet
      for(const sname of wb.SheetNames){
        let cfgKey=null;
        const sl=sname.toLowerCase().trim();
        if(sl==='rv')cfgKey='rv';
        else if(sl==='rf')cfgKey='rf';
        else if(sl.includes('investimento'))cfgKey='inv';
        else if(sl.includes('cons'))cfgKey='cons';
        else if(sl.includes('saude')||sl.includes('saúde'))cfgKey='saude';
        else if(sl.includes('seguro')||sl.includes('seg vida')||sl==='seg')cfgKey='seg';
        if(!cfgKey)continue;

        const cfg=SHEET_CFG[cfgKey];
        const raw=XLSX.utils.sheet_to_json(wb.Sheets[sname],{header:1,defval:''});
        const rows=parsePipeCfg(raw,cfg.area,cfg);
        results[cfg.area].rows=[...results[cfg.area].rows,...rows];
      }

      const nadaReconhecido=Object.values(results).every(res=>!res.rows.length);
      if(nadaReconhecido){
        st.textContent='⚠️ Nenhuma aba reconhecida (esperado: RV, RF, Investimentos, Consórcio, Seguro de Vida, Plano de Saúde). A planilha tem: '+wb.SheetNames.join(', ')+'. 👉 Use os cards de área única abaixo!';
        st.style.color='var(--red)';
        return;
      }
      let totalNew=0,totalUpd=0,totalRows=0;
      for(const[area,res]of Object.entries(results)){
        if(!res.rows.length)continue;
        // casa contra TUDO, arquivadas inclusive: reimportar a planilha não pode duplicar o que já foi para o Histórico
        const existing=OPPS_ALL.filter(r=>r.area===area);
        const toInsert=[],toUpdate=[];
        let skipped=0;
        res.rows.forEach(nr=>{
          const ex=existing.find(e=>norm(e.assessor)===norm(nr.assessor)&&norm(e.cliente)===norm(nr.cliente)&&norm(e.produto||'')===norm(nr.produto||''));
          // Boletas antigas da planilha NÃO entram como novas (histórico de meses anteriores).
          // Boletas do mês devem ser marcadas dentro do sistema.
          // boletadas da planilha entram normalmente (regra removida a pedido do diretor)
          if(ex){
            // MERGE DIÁRIO: preserva o trabalho do time no sistema.
            // Só atualiza pipe (volume). Campos vazios no sistema são preenchidos pela planilha.
            const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
            if(!ex.sc&&nr.sc)upd.sc=nr.sc;
            if(!ex.pb&&nr.pb){upd.pb=nr.pb;if(pbFechada(nr.pb)&&!pbFechada(ex.pb)){const iso2=parseDataBoleta(nr.data_boleta);const dbr2=iso2?iso2.split('-').reverse().join('/'):new Date().toLocaleDateString('pt-BR');upd.historico=[...(ex.historico||[]),{campo:'Pendência boleta',de:ex.pb||'',para:nr.pb,usuario:(USER?USER.nome:'')+' (planilha)',data:dbr2}];}}
            if(nr.todo&&limpaTraco(nr.todo)&&nr.todo!==ex.todo)upd.todo=nr.todo;else if(!ex.todo&&nr.todo)upd.todo=nr.todo;if('todo' in upd){const hhT=upd.historico||[...(ex.historico||[])];hhT.push({campo:'TODO',de:ex.todo||'',para:upd.todo,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhT;}
            if(nr.obs&&limpaTraco(nr.obs)&&nr.obs!==ex.obs)upd.obs=nr.obs;else if(!ex.obs&&nr.obs)upd.obs=nr.obs;if('obs' in upd){const hhO=upd.historico||[...(ex.historico||[])];hhO.push({campo:'Observação',de:ex.obs||'',para:upd.obs,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhO;}
            if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
            // boleta de mês anterior vinda da planilha vai direto pro Histórico da competência dela
            {const rt=arquivoRetroativo(ex,upd.sc||ex.sc,upd.pb||ex.pb,nr.data_boleta||ex.data_boleta,
               new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
             if(rt){rt.usuario=(USER?USER.nome:'')+' (planilha)';upd.historico=[...(upd.historico||ex.historico||[]),rt];}}
            if(nr.responsavel)upd.responsavel=nr.responsavel;
            toUpdate.push(upd);
          }
          else toInsert.push(nr);
        });
        if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
        for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,`id=eq.${id}`);}
        res.new=toInsert.length;res.upd=toUpdate.length;
        totalNew+=toInsert.length;totalUpd+=toUpdate.length;totalRows+=res.rows.length;
      }

      uc.classList.add('done');
      st.textContent=`✅ ${totalNew+totalUpd} processadas (${totalNew} novas · ${totalUpd} atualizadas)${totalRows-totalNew-totalUpd>0?' · '+(totalRows-totalNew-totalUpd)+' boletas antigas ignoradas':''}`;
      st.style.color='var(--green)';

      // Show per-area results
      const resEl=document.getElementById('upload-results');
      if(resEl){
        resEl.style.display='grid';
        resEl.innerHTML=Object.entries(results).map(([ak,res])=>res.rows.length?`
          <div style="background:var(--green-bg);border:1px solid var(--green-b);border-radius:6px;padding:12px 14px">
            <div style="font-weight:700;color:${AREAS[ak].color};margin-bottom:4px">${AREAS[ak].name}</div>
            <div style="font-size:13px;font-weight:700;color:var(--green)">${res.rows.length} oportunidades</div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px">${res.new} novas · ${res.upd} atualizadas</div>
          </div>`:'').join('');
      }

      showToast(`✅ ${totalRows} oportunidades importadas!`,true);
      const log=document.getElementById('upload-log');
      if(log){const d=document.createElement('div');d.style.cssText='background:var(--green-bg);border:1px solid var(--green-b);border-radius:4px;padding:10px 14px;margin-bottom:8px;font-size:12px;color:var(--green)';d.innerHTML=`<strong>${file.name}</strong> — ${totalRows} oportunidades importadas em ${new Date().toLocaleTimeString('pt-BR')}`;log.prepend(d)}
      await loadData();
    }catch(err){
      st.textContent='❌ Erro: '+err.message;st.style.color='var(--red)';
      showToast('Erro: '+err.message);
      console.error(err);
    }
  };
  reader.readAsBinaryString(file);
}

function exportarOpps(){
  const isDir=USER.perfil==='diretor';
  const isGest=USER.perfil==='gestor';
  let rows=isDir?[...OPPS]
    :isGest?OPPS.filter(r=>(USER.areas||[]).length?(USER.areas||[]).includes(r.area):true)
    :OPPS.filter(r=>{
      if(norm(r.assessor)===norm(USER.nome))return true;
      if(!(USER.areas||[]).includes(r.area))return false;
      if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
      return true;
    });
  if(!rows.length){showToast('Nada para exportar no seu alcance');return}
  const br=iso=>iso&&/^\d{4}-\d{2}-\d{2}/.test(String(iso))?String(iso).slice(0,10).split('-').reverse().join('/'):(iso||'');
  const brDT=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
  const dados=[['Área','Segmento','Cliente','AI','Produto','Valor Pipe','Valor Atual','STATUS COMERCIAL','PENDENCIA BOLETA','Data Boleta','ToDo','Data ToDo','Reunião','Responsável','OBS','Escalada para','Motivo escala','Criada em','Atualizada em','Linha do tempo']];
  rows.sort((a,b)=>(a.area+a.cliente).localeCompare(b.area+b.cliente)).forEach(r=>{
    const seg=(SUBAREAS[subAreaOf(r)]||{}).name||'';
    const lt=(r.historico||[]).map(h=>(h.data||'')+' · '+(h.campo||'')+': '+(h.de?h.de+' → ':'')+(h.para||'')+(h.usuario?' ('+h.usuario+')':'')).join('  •  ');
    dados.push([(AREAS[r.area]||{}).name||r.area,seg,r.cliente||'',r.assessor||'',r.produto||'',r.pipe||0,r.atual||0,r.sc||'',r.pb||'',br(r.data_boleta),r.todo||'',br(r.todo_data),br(r.reuniao_data),r.responsavel||'',r.obs||'',r.escalado_para||'',r.escala_motivo||'',brDT(r.created_at),brDT(r.updated_at),lt]);
  });
  const ws=XLSX.utils.aoa_to_sheet(dados);
  ws['!cols']=[{wch:12},{wch:14},{wch:26},{wch:26},{wch:22},{wch:12},{wch:12},{wch:20},{wch:20},{wch:11},{wch:26},{wch:11},{wch:11},{wch:16},{wch:32},{wch:14},{wch:20},{wch:16},{wch:16},{wch:60}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Oportunidades');
  XLSX.writeFile(wb,'oportunidades-completo-'+new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')+'.xlsx');
  showToast('✅ '+rows.length+' oportunidades exportadas com tudo dentro!',true);
}

    rv:{area:'inv',produtoPadrao:PRODUTO_GERAL_RV,aai:['AAI','AI'],pipe:['RV Pipe','Pipe','Valor'],atual:['RV Atual','Atual','Valor'],sc:['Status Comercial','Status'],pb:['Pendencia Boleta','Pendencia'],todo:['ToDo','TO DO'],obs:['Obs'],resp:['Responsável','Responsavel','Resp']},
    rf:{area:'inv',produtoPadrao:PRODUTO_GERAL_RF,aai:['AI','AAI'],pipe:['RF Pipe','Pipe','Valor'],atual:['RF Atual','Atual','Valor'],sc:['Status Comercial RF','Status Comercial','Status'],pb:['Pendencia Boleta RF','Pendencia Boleta','Pendencia'],todo:['ToDo'],obs:['Obs'],resp:['Responsável','Responsavel','Resp']},
    cons:{area:'cons',aai:['AI','AAI'],pipe:['Pipe Atual','Carta','Pipe','Valor'],atual:['Pipe Atual','Atual','Valor'],sc:['Status Comercial RF','Status Comercial','Status'],pb:['Pendencia Boleta RF','Pendencia Boleta','Pendencia'],todo:['ToDo','OBS'],obs:['OBS'],resp:['Responsável','Responsavel','Resp']},
    seg:{area:'seg',aai:['AI','AAI'],pipe:['Seg Pipe','Pipe','Valor'],atual:['Seg atual','Seg Atual','Atual','Valor'],sc:['Status Comercial RF','Status Comercial','Status'],pb:['Pendencia Boleta RF','Pendencia Boleta','Pendencia'],todo:['ToDo'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp']},
    saude:{area:'saude',produtoPadrao:'PLANO DE SAÚDE',aai:['AI','AAI'],pipe:['Saude Pipe','Saúde Pipe','Pipe','Valor'],atual:['Saude Atual','Saúde Atual','Atual','Valor'],sc:['Status Comercial','Status'],pb:['Pendencia Boleta','Pendencia'],todo:['ToDo','TO DO'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp']}
  };
  const cfg=SHEET_CFG[cfgKey];

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const rows=parsePipeCfg(raw,cfg.area,cfg);
      if(!rows.length){st.textContent='⚠️ Nenhuma linha reconhecida';st.style.color='var(--red)';return;}
      if(USER&&USER.perfil!=='diretor')rows.forEach(r=>{if(!r.responsavel)r.responsavel=USER.nome;});
      st.textContent='⏳ Processando '+rows.length+'...';

      const existing=OPPS_ALL.filter(r=>r.area===cfg.area);   // inclui arquivadas, para não duplicar
      const toInsert=[],toUpdate=[];let skipped=0;
      rows.forEach(nr=>{
        const ex=existing.find(x=>norm(x.assessor)===norm(nr.assessor)&&norm(x.cliente)===norm(nr.cliente)&&norm(x.produto||'')===norm(nr.produto||''));
        // boletadas da planilha entram normalmente (regra removida a pedido do diretor)
        if(ex){
          const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
          if(!ex.sc&&nr.sc)upd.sc=nr.sc;
          if(!ex.pb&&nr.pb){upd.pb=nr.pb;if(pbFechada(nr.pb)&&!pbFechada(ex.pb)){const iso2=parseDataBoleta(nr.data_boleta);const dbr2=iso2?iso2.split('-').reverse().join('/'):new Date().toLocaleDateString('pt-BR');upd.historico=[...(ex.historico||[]),{campo:'Pendência boleta',de:ex.pb||'',para:nr.pb,usuario:(USER?USER.nome:'')+' (planilha)',data:dbr2}];}}
          if(nr.todo&&limpaTraco(nr.todo)&&nr.todo!==ex.todo)upd.todo=nr.todo;else if(!ex.todo&&nr.todo)upd.todo=nr.todo;if('todo' in upd){const hhT=upd.historico||[...(ex.historico||[])];hhT.push({campo:'TODO',de:ex.todo||'',para:upd.todo,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhT;}
          if(nr.obs&&limpaTraco(nr.obs)&&nr.obs!==ex.obs)upd.obs=nr.obs;else if(!ex.obs&&nr.obs)upd.obs=nr.obs;if('obs' in upd){const hhO=upd.historico||[...(ex.historico||[])];hhO.push({campo:'Observação',de:ex.obs||'',para:upd.obs,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhO;}
          if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
          // boleta de mês anterior vinda da planilha vai direto pro Histórico da competência dela
          {const rt=arquivoRetroativo(ex,upd.sc||ex.sc,upd.pb||ex.pb,nr.data_boleta||ex.data_boleta,
             new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
           if(rt){rt.usuario=(USER?USER.nome:'')+' (planilha)';upd.historico=[...(upd.historico||ex.historico||[]),rt];}}
          if(nr.responsavel)upd.responsavel=nr.responsavel;
          toUpdate.push(upd);
        }else toInsert.push(nr);
      });
      if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
      for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,'id=eq.'+id);}

      uc.classList.add('done');
      st.textContent='✅ '+toInsert.length+' novas · '+toUpdate.length+' atualizadas'+(skipped?' · '+skipped+' boletas antigas ignoradas':'');
      st.style.color='var(--green)';
      showToast('✅ Área importada!',true);
      await loadData();
    }catch(err){st.textContent='❌ '+err.message.substring(0,60);st.style.color='var(--red)';}
  };
  reader.readAsBinaryString(file);
}

function limpaTraco(v){
  const t=String(v==null?'':v).trim();
  if(/^#(REF|VALUE|N\/A|NAME\?|DIV\/0!|NULL!|NUM!)/i.test(t))return '';   // erro de fórmula do Excel
  return ['-','--','—','.','n/a','na','0','00:00:00'].includes(t.toLowerCase())?'':t;
}
function parsePipeCfg(raw,area,cfg){
  // Find header row
  let hr=-1;
  for(let i=0;i<Math.min(raw.length,6);i++){
    const v=raw[i].map(x=>String(x).trim().toLowerCase());
    if(v.some(x=>x==='ai'||x==='aai'||x.includes('assessor'))){hr=i;break;}
  }
  if(hr<0)return[];
  const h=raw[hr].map(x=>String(x).trim());
  const fi=als=>{for(const a of als){const i=h.findIndex(x=>x.toLowerCase().includes(a.toLowerCase()));if(i>=0)return i;}return -1};
  const ci={
    aai:fi(cfg.aai),cli:fi(['Cliente']),prod:fi(['Produto']),
    pipe:fi(cfg.pipe),atual:fi(cfg.atual||cfg.pipe),
    fonte:fi(['Fonte do $','Fonte']),sc:fi(cfg.sc),pb:fi(cfg.pb),
    data:fi(['DATA DA BOLETA','Data Boleta','data_boleta']),
    todo:fi(cfg.todo),todoData:fi(['DATA TO DO','Data do TODO','Data TODO']),obs:fi(cfg.obs||['Obs']),
    resp:fi(cfg.resp||['Responsável','Responsavel','Resp'])
  };
  const pn=v=>{const s=String(v||0).replace(/[^0-9.,]/g,'').replace(',','.');return parseFloat(s)||0};
  return raw.slice(hr+1).filter(r=>{
    const a=String(r[ci.aai]||'').trim();
    return a&&!['nan','assessor','ai','aai','total',''].includes(a.toLowerCase());
  }).map(r=>({
    area,
    assessor:String(r[ci.aai]||'').trim(),
    cliente:String(r[ci.cli]||'').trim(),
    produto:area==='cons'?'ALAVANCAGEM FINANCEIRA/PAT':(cfg.produtoFixo||String(r[ci.prod]||'').trim()||cfg.produtoPadrao||''),
    pipe:pn(r[ci.pipe]),
    atual:pn(r[ci.atual]),
    fonte:String(r[ci.fonte]||'').trim(),
    sc:String(r[ci.sc]||'').trim(),
    pb:String(r[ci.pb]||'').trim(),
    data_boleta:ci.data>=0&&r[ci.data]&&String(r[ci.data]).trim()!=='nan'?String(r[ci.data]).trim():null,
    todo:limpaTraco(String(r[ci.todo]||'').trim()),
    todo_data:ci.todoData>=0?parseDataBoleta(limpaTraco(r[ci.todoData])):null,
    obs:limpaTraco(String(r[ci.obs]||'').trim()),
    responsavel:ci.resp>=0?String(r[ci.resp]||'').trim():'',
    historico:[]
  })).filter(r=>r.assessor&&r.cliente).map(r=>{
    // carimbo de entrada: quando a oportunidade subiu para o sistema
    const ag=new Date();
    const dHoje=ag.toLocaleDateString('pt-BR');
    const dsHoje=dHoje+' '+ag.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const quem=(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)';
    r.created_at=ag.toISOString();
    r.historico=[{campo:'Criação',de:'',para:'Subida por planilha em '+dHoje,usuario:quem,data:dsHoje},
      marcaEmpresa((cfg&&cfg.empresa)||window._upEmp||empParaGravar(),dsHoje)];
    if(pbFechada(r.pb)){
      const iso=parseDataBoleta(r.data_boleta);
      const dbr=iso?iso.split('-').reverse().join('/'):dHoje;
      r.historico.push({campo:'Pendência boleta',de:'',para:r.pb,usuario:quem,data:dbr});
    }
    return r;
  });
}

function parsePipe(raw,area){
  const cfg={aai:['assessor','ai','aai'],pipe:['volume acordado','pipe atual','rf pipe','rv pipe','seg pipe','pipe','volume','valor'],atual:['atual'],sc:['status comercial'],pb:['pendencia boleta'],todo:['todo'],obs:['obs']};
  return parsePipeCfg(raw,area,cfg);
}

// ── USUARIOS ──
function renderUsuarios(c=document.getElementById('main-content')){
  c.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div style="font-size:14px;font-weight:700">${USUARIOS.length} usuários cadastrados</div>
    <button class="btn wine" onclick="document.getElementById('modal-user').style.display='flex'">+ Novo usuário</button>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Perfil</th><th>Empresa</th><th>Áreas</th><th>PIN</th><th>Status</th><th>Último acesso</th><th></th></tr></thead>
  <tbody>${USUARIOS.map(u=>`<tr>
    <td style="font-weight:700">${u.nome}</td>
    <td><span class="badge ${u.perfil==='diretor'?'b-wine':u.perfil==='gestor'?'b-purple':'b-gray'}">${u.perfil}</span></td>
    <td>${(u.empresas||[EMP_PADRAO]).map(e=>`<span class="emp-chip" style="--ec:${empCor(e)};margin:0 3px 0 0">${empNome(e)}</span>`).join('')}</td>
    <td>${u.perfil==='diretor'?'<span class="badge b-wine">Todas</span>':
      ((u.areas||[]).map(a=>`<span class="badge b-gray" style="margin-right:3px">${AREAS[a]?.name||a}</span>`).join('')||'—')
      +(()=>{const f=areasForaDoPerfil(u.nome);return f.length
        ?`<span class="badge b-amber" style="margin-right:3px" title="Tem oportunidade nessa área mas ela não está no cadastro — clique em ✎ Áreas para incluir">⚠ ${f.map(k=>AREAS[k]?.name||k).join(' · ')}</span>`:''})()}</td>
    <td><code style="background:var(--cream);padding:2px 8px;border-radius:4px;font-size:12px;border:1px solid var(--border)">${u.pin}</code></td>
    <td><span class="badge ${u.ativo?'b-green':'b-red'}">${u.ativo?'Ativo':'Inativo'}</span></td>
    <td>${(()=>{const t=tempoAtras(u.ultimo_acesso);return t.on
      ?'<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#085041"><span style="width:8px;height:8px;border-radius:50%;background:#1D9E75;box-shadow:0 0 0 3px #E1F5EE"></span>Online agora</span>'
      :'<span style="font-size:12px;color:var(--muted)">'+t.txt+'</span>';})()}</td>
    <td><div style="display:flex;gap:6px">
      ${u.perfil!=='diretor'?`<button class="btn sm" onclick="setPerfil('${u.id}','${u.perfil==='gestor'?'assessor':'gestor'}')">${u.perfil==='gestor'?'↓ Voltar a assessor':'★ Tornar gestor'}</button><button class="btn sm" onclick="editAreas('${u.id}')">✎ Áreas</button>`:''}
      <button class="btn sm" onclick="toggleUser('${u.id}',${!u.ativo})">${u.ativo?'Desativar':'Ativar'}</button>
      <button class="btn sm" style="border-color:var(--red-b);background:var(--red-bg);color:var(--red)" onclick="delUser('${u.id}')">Remover</button>
    </div></td>
  </tr>`).join('')}</tbody></table></div>`;
}

async function editAreas(id){
  const u=USUARIOS.find(x=>String(x.id)===String(id));if(!u)return;
  document.getElementById('modal-areas')?.remove();
  const atuais=u.areas||[];
  const ov=document.createElement('div');
  ov.id='modal-areas';
  ov.style.cssText='position:fixed;inset:0;background:rgba(30,15,18,.45);display:flex;align-items:center;justify-content:center;z-index:9000';
  ov.innerHTML='<div style="background:var(--card);border-radius:8px;padding:22px 24px;min-width:280px;box-shadow:0 12px 40px rgba(0,0,0,.25)">'
    +'<div style="font-weight:700;font-size:15px;margin-bottom:4px">✎ Acesso de '+u.nome+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-bottom:14px">Define o que '+(u.perfil==='gestor'?'a gestão enxerga (Daily do time, dashboard, metas)':'o comercial acessa')+'</div>'
    +'<div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-l);margin:4px 0 2px">Empresas</div>'
    +Object.entries(EMPRESAS).map(([k,e])=>'<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px"><input type="checkbox" id="me-'+k+'" '+((u.empresas||[EMP_PADRAO]).includes(k)?'checked':'')+' style="width:15px;height:15px;accent-color:var(--wine)"> '+e.nome+'</label>').join('')
    +'<div style="font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-l);margin:12px 0 2px">Áreas</div>'
    +Object.entries(AREAS).map(([k,a])=>'<label style="display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px"><input type="checkbox" id="ma-'+k+'" '+(atuais.includes(k)?'checked':'')+' style="width:15px;height:15px;accent-color:var(--wine)"> '+a.name+'</label>').join('')
    +'<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">'
    +'<button class="btn sm" onclick="document.getElementById(\'modal-areas\').remove()">Cancelar</button>'
    +'<button class="btn wine sm" onclick="saveAreas(\''+id+'\')">Salvar</button>'
    +'</div></div>';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  document.body.appendChild(ov);
}
async function saveAreas(id){
  const areas=Object.keys(AREAS).filter(k=>document.getElementById('ma-'+k)?.checked);
  const emps=Object.keys(EMPRESAS).filter(k=>document.getElementById('me-'+k)?.checked);
  if(!emps.length){showToast('Escolha pelo menos uma empresa');return}
  try{
    await db('PATCH','usuarios',{areas:areasComEmpresas(areas,emps)},'id=eq.'+id);
    document.getElementById('modal-areas')?.remove();
    USUARIOS=normalizaUsuarios(await db('GET','usuarios','','order=nome.asc'));
    renderUsuarios();
    showToast('✅ Áreas atualizadas!',true);
  }catch(e){showToast('Erro: '+e.message)}
}
function toggleAreas(){
  document.getElementById('u-areas-wrap').style.display=document.getElementById('u-perfil').value==='diretor'?'none':'flex';
}

async function saveUser(){
  const nome=document.getElementById('u-nome').value.trim();
  const pin2=document.getElementById('u-pin').value.trim();
  const perfil=document.getElementById('u-perfil').value;
  if(!nome||!pin2||pin2.length!==4||isNaN(pin2)){showToast('Nome e PIN de 4 dígitos obrigatórios!');return}
  const areas=perfil==='diretor'?Object.keys(AREAS):Object.keys(AREAS).filter(a=>document.getElementById('ua-'+a)?.checked);
  const emps=Object.keys(EMPRESAS).filter(e=>document.getElementById('ue-'+e)?.checked);
  if(!emps.length){showToast('Escolha pelo menos uma empresa');return}
  try{
    await db('POST','usuarios',{nome,pin:pin2,perfil,areas:areasComEmpresas(areas,emps),ativo:true});
    showToast('✅ Usuário criado!',true);
    closeModal('user');
    USUARIOS=normalizaUsuarios(await db('GET','usuarios','','order=nome.asc'));
    renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}

async function toggleUser(id,ativo){
  try{await db('PATCH','usuarios',{ativo},`id=eq.${id}`);USUARIOS=normalizaUsuarios(await db('GET','usuarios','','order=nome.asc'));renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
async function setPerfil(id,perfil){
  const u=USUARIOS.find(x=>x.id===id);
  if(perfil==='gestor'&&u&&!(u.areas||[]).length){showToast('Defina ao menos uma área para este usuário antes de torná-lo gestor');return}
  try{
    await db('PATCH','usuarios',{perfil},`id=eq.${id}`);
    showToast('✅ '+(u?u.nome:'Usuário')+' agora é '+(perfil==='gestor'?'gestor de área':'assessor'),true);
    USUARIOS=normalizaUsuarios(await db('GET','usuarios','','order=nome.asc'));renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}
async function delUser(id){
  if(!confirm('Remover este usuário?'))return;
  try{await db('DELETE','usuarios','',`id=eq.${id}`);USUARIOS=normalizaUsuarios(await db('GET','usuarios','','order=nome.asc'));renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
