<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerencial Comercial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --wine:#8B1C2A;--wine-d:#6B0010;--wine-l:#F5EAE8;--wine-ll:#FDF5F4;
  --cream:#F5F0EB;--card:#FFFFFF;--border:#E8D5CC;--border-l:#F0E8E3;
  --text:#1A0508;--muted:#8A6A6E;--muted-l:#C4A8AC;
  --green:#085041;--green-bg:#E1F5EE;--green-b:#9FD5B0;
  --amber:#854F0B;--amber-bg:#FEF3E2;--amber-b:#FAC775;
  --red:#791F1F;--red-bg:#FCEBEB;--red-b:#E8B0B0;
  --blue:#0C447C;--blue-bg:#E6F1FB;--blue-b:#B5CEF0;
  --purple:#3C3489;--purple-bg:#EEEDFE;--purple-b:#C5C2F8;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);font-size:14px;min-height:100vh}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--cream) 0%,#EDE0D8 100%)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 36px;max-width:360px;width:100%;box-shadow:0 12px 48px rgba(139,28,42,.12);text-align:center}
.login-icon{font-size:52px;margin-bottom:14px;display:block}
.login-box h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px}
.login-box p{font-size:13px;color:var(--muted);margin-bottom:28px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .2s}
.pin-dot.on{background:var(--wine);border-color:var(--wine);transform:scale(1.1)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:230px;margin:0 auto 14px}
.pin-btn{padding:15px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);font-size:20px;font-weight:600;cursor:pointer;color:var(--text);transition:all .15s;user-select:none}
.pin-btn:hover{background:var(--wine-l);border-color:var(--wine);color:var(--wine)}
.pin-btn:active{transform:scale(.93)}
.pin-btn.del{color:var(--muted);font-size:16px}
#login-err{color:var(--red);font-size:12px;min-height:18px;margin-top:4px}
.login-checking{color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}

/* ── APP ── */
#app{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:50}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-brand h1{font-size:16px;font-weight:700;color:var(--text)}
.topbar-date{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;align-items:center;gap:10px}
.user-pill{display:flex;align-items:center;gap:6px;background:var(--wine-l);border:1px solid #C8A0A8;border-radius:999px;padding:4px 12px 4px 6px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--wine);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.user-name{font-size:12px;font-weight:600;color:var(--wine-d)}
.btn-logout{font-size:11px;color:var(--muted);cursor:pointer;background:none;border:none;padding:4px 8px;border-radius:6px}
.btn-logout:hover{background:var(--border-l);color:var(--text)}

/* ── NAV ── */
.nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:2px}
.nav-tab{padding:12px 18px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:6px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--wine);border-bottom-color:var(--wine);font-weight:600}
.nav-tab .badge{background:var(--wine);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-weight:700}

/* ── CONTENT ── */
.content{padding:24px;max-width:1400px;margin:0 auto}

/* ── DIRECTOR DASHBOARD ── */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--border)}
.kpi.wine::before{background:var(--wine)}
.kpi.green::before{background:var(--green)}
.kpi.amber::before{background:#EF9F27}
.kpi.blue::before{background:#378ADD}
.kpi.purple::before{background:#7F77DD}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:800;color:var(--text);line-height:1}
.kpi.wine .kpi-val{color:var(--wine-d)}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px}

.area-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.area-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;border-top:4px solid var(--wine)}
.area-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.area-tag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.area-dot{width:10px;height:10px;border-radius:50%}
.area-bol{font-size:28px;font-weight:800;margin-bottom:4px}
.area-bol-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.area-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.area-stat{background:var(--cream);border-radius:8px;padding:8px;text-align:center}
.area-stat-l{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.area-stat-v{font-size:15px;font-weight:700;color:var(--text)}
.prog-wrap{margin-top:12px}
.prog-bg{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:6px;border-radius:99px;transition:width .6s ease}
.prog-lbl{font-size:10px;color:var(--muted);text-align:right;margin-top:3px}

.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.chart-card h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:16px}
.chart-wrap{position:relative;height:220px}

.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── TABLE ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#FAF5F3;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border-l);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FDF8F6}
tr.bol td{background:var(--green-bg)}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-b)}
.b-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-b)}
.b-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-b)}
.b-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b)}
.b-purple{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-b)}
.b-wine{background:var(--wine-l);color:var(--wine-d);border:1px solid #C8A0A8}
.b-gray{background:#F5F0EB;color:var(--muted);border:1px solid var(--border)}
.b-teal{background:#E1F5EE;color:#085041;border:1px solid #9FD5B0}

/* ── ASSESSOR CARDS ── */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:20px}
.opp-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;transition:all .2s}
.opp-card:hover{box-shadow:0 4px 20px rgba(139,28,42,.1);border-color:#C8A0A8}
.opp-card.bol{border-left:4px solid var(--green);background:linear-gradient(to right,#F0FBF6,var(--card))}
.opp-card-header{padding:14px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.opp-client{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.opp-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opp-card-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.opp-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opp-row-l{color:var(--muted);font-weight:500}
.opp-row-v{font-weight:600;color:var(--text)}
.opp-vol{font-size:18px;font-weight:800;color:var(--wine-d)}
.opp-obs{font-size:11px;color:var(--muted);font-style:italic;padding:8px 12px;background:var(--cream);border-radius:8px;margin:0 16px 10px;border-left:3px solid var(--border)}
.opp-actions{padding:10px 16px;background:#FAF5F3;border-top:1px solid var(--border-l);display:flex;gap:6px;flex-wrap:wrap}
.opp-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.opp-btn.sc{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b)}
.opp-btn.sc:hover{background:var(--blue);color:#fff}
.opp-btn.bol{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.opp-btn.bol:hover{background:var(--green);color:#fff}
.opp-btn.obs{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.opp-btn.obs:hover{background:var(--amber);color:#fff}
.opp-btn.todo{background:var(--purple-bg);color:var(--purple);border-color:var(--purple-b)}
.opp-btn.todo:hover{background:var(--purple);color:#fff}

/* ── COCKPIT / KANBAN ── */
.cockpit-hero{background:linear-gradient(135deg,#8B1C2A,#6B0010);border-radius:16px;padding:22px 26px;color:#fff;margin-bottom:20px;box-shadow:0 8px 24px rgba(139,28,42,.2)}
.cockpit-hello{font-size:20px;font-weight:800}
.cockpit-sub{font-size:12px;opacity:.85;margin-top:2px}
.cockpit-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.cockpit-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:10px 14px;text-align:center}
.cockpit-stat-v{font-size:22px;font-weight:900}
.cockpit-stat-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-top:2px}
.prio-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:8px;transition:all .15s}
.prio-item:hover{border-color:#C8A0A8;box-shadow:0 2px 12px rgba(139,28,42,.08)}
.prio-flag{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prio-info{flex:1;min-width:0}
.prio-cli{font-size:13px;font-weight:800}
.prio-acao{font-size:12px;color:var(--muted);margin-top:2px}
.prio-vol{font-size:14px;font-weight:800;color:var(--wine-d);white-space:nowrap}
.kb-board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kb-col{min-width:235px;max-width:235px;background:#F1E9E4;border-radius:14px;padding:10px;flex-shrink:0}
.kb-col-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.kb-count{background:var(--card);border-radius:999px;padding:1px 8px;font-size:10px;font-weight:800;color:var(--muted)}
.kb-card{background:var(--card);border:1.5px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:grab;transition:all .15s}
.kb-card:active{cursor:grabbing}
.kb-col{transition:background .15s,transform .15s}
.kb-card:hover{border-color:#C8A0A8;box-shadow:0 3px 10px rgba(139,28,42,.1);transform:translateY(-1px)}
.kb-cli{font-size:12px;font-weight:800;line-height:1.3}
.kb-meta{font-size:10px;color:var(--muted);margin-top:3px}
.kb-vol{font-size:13px;font-weight:800;color:var(--wine-d);margin-top:5px}
.kb-adv{width:100%;margin-top:8px;padding:5px;border-radius:8px;border:1.5px solid var(--border);background:var(--cream);font-size:10px;font-weight:700;cursor:pointer;color:var(--text);transition:all .15s}
.kb-adv:hover{background:var(--wine);color:#fff;border-color:var(--wine)}
.kb-adv.bol{background:var(--green-bg);border-color:var(--green-b);color:var(--green)}
.kb-adv.bol:hover{background:var(--green);color:#fff}

/* ── DAILY ── */
.daily-header{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px}
.daily-title{font-size:18px;font-weight:700;margin-bottom:4px}
.daily-subtitle{font-size:12px;color:var(--muted)}
.daily-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.daily-kpi{text-align:center;padding:12px;background:var(--cream);border-radius:10px}
.daily-kpi-v{font-size:22px;font-weight:800;color:var(--wine-d)}
.daily-kpi-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:2px}

.day-group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.day-group-count{background:currentColor;border-radius:999px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;opacity:.9}

.daily-opp{background:var(--card);border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.daily-opp.sel{border-color:var(--wine);background:var(--wine-ll)}
.daily-opp-top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.daily-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;background:var(--card)}
.daily-check.on{background:var(--wine);border-color:var(--wine)}
.daily-check.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.daily-info{flex:1}
.daily-cli{font-size:13px;font-weight:700}
.daily-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.daily-vol{font-size:13px;font-weight:700;color:var(--wine-d)}
.daily-actions{padding:10px 14px;background:#FAF5F3;border-top:1px solid var(--border-l);display:grid;grid-template-columns:1fr 1fr;gap:8px}
select.sel-tipo{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer}
select.sel-tipo:focus{outline:none;border-color:var(--wine)}
input.inp-acao{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit}
input.inp-acao:focus{outline:none;border-color:var(--wine)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,5,8,.35);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:18px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(139,28,42,.2)}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-hdr h2{font-size:16px;font-weight:700}
.modal-x{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:0 4px}
.modal-x:hover{color:var(--text)}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--wine)}
.fg textarea{min-height:72px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ftr{display:flex;gap:8px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border)}
.btn{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--cream)}
.btn.wine{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.wine:hover{background:var(--wine-d)}
.btn.sm{padding:5px 12px;font-size:11px}

/* ── MISC ── */
.mini-bar{height:4px;background:var(--border);border-radius:99px;margin-top:5px;overflow:hidden}
.mini-fill{height:4px;border-radius:99px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:12px;color:var(--muted);text-align:center;padding:40px}
.empty-icon{font-size:40px;opacity:.4}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--wine);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--wine);color:#fff;font-size:12px;font-weight:600;padding:10px 20px;border-radius:10px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:300px;box-shadow:0 4px 20px rgba(139,28,42,.3)}
.hist-item{font-size:11px;padding:6px 0;border-bottom:1px solid var(--border-l);color:var(--muted);line-height:1.5}
.hist-item:last-child{border:none}
.hist-item strong{color:var(--text)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-sel{padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.filter-sel:focus{border-color:var(--wine)}
.filter-inp{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:12px;font-family:inherit;outline:none;flex:1;min-width:140px}
.filter-inp:focus{border-color:var(--wine)}
.upload-card{background:var(--card);border:2px dashed var(--border);border-radius:14px;padding:28px;text-align:center;cursor:pointer;transition:all .2s}
.upload-card:hover{border-color:var(--wine);background:var(--wine-ll)}
.upload-card.done{border-style:solid;border-color:var(--green-b);background:var(--green-bg)}
.upload-icon{font-size:32px;margin-bottom:10px}
.upload-title{font-size:14px;font-weight:700;margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted)}
.upload-status{font-size:12px;font-weight:600;margin-top:10px;min-height:18px}
@media(max-width:768px){
  .charts-row,.area-cards{grid-template-columns:1fr}
  .opp-grid{grid-template-columns:1fr}
  .daily-kpis{grid-template-columns:repeat(2,1fr)}
  .content{padding:14px}
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="login-screen">

const stripAcc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fixMojibake=s=>s.replace(/Ã£/g,'ã').replace(/Ã©/g,'é').replace(/Ã§/g,'ç').replace(/Ã­/g,'í').replace(/Ãº/g,'ú').replace(/Ã³/g,'ó').replace(/Ã¡/g,'á').replace(/Ãª/g,'ê').replace(/Ã¢/g,'â').replace(/Ãµ/g,'õ').replace(/Ã´/g,'ô').replace(/Ã /g,'à');
function lev1(a,b){
  // true se distância de edição <= 1
  if(a===b)return true;
  const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,diff=0;
  while(i<la&&j<lb){
    if(a[i]===b[j]){i++;j++;continue}
    diff++;if(diff>1)return false;
    if(la>lb)i++;else if(lb>la)j++;else{i++;j++}
  }
  diff+=(la-i)+(lb-j);
  return diff<=1;
}
const wordMatch=(w1,w2)=>w1===w2||(w1.length>4&&w2.length>4&&lev1(w1,w2));
const _canonCache={};
function canonAssessor(nome){
  if(!nome)return null;
  if(_canonCache[nome]!==undefined)return _canonCache[nome];
  const n=stripAcc(norm(fixMojibake(String(nome))));
  const nWords=n.split(' ');
  let result=null;
  for(const of2 of ASSESSORES_OFICIAIS){
    const o=stripAcc(norm(of2));
    const oWords=o.split(' ');
    const allOfficialInName=oWords.every(w=>nWords.some(nw=>wordMatch(w,nw)));
    const allNameInOfficial=nWords.every(w=>oWords.some(ow=>wordMatch(w,ow)));
    if(allOfficialInName||allNameInOfficial){result=of2;break;}
  }
  _canonCache[nome]=result;
  return result;
}
const fmt=v=>{if(!v||isNaN(v)||v==0)return'—';if(v>=1e6)return'R$'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return'R$'+(v/1e3).toFixed(0)+'k';return'R$'+Math.round(v)};

function daysSince(dateStr){
  if(!dateStr)return 999;
  try{
    const d=new Date(dateStr);
    if(isNaN(d))return 999;
    return Math.floor((Date.now()-d.getTime())/(1000*60*60*24));
  }catch(e){return 999}
}

function riskColor(days){
  if(days<=3)return{color:'#085041',bg:'#E1F5EE',label:'Em dia',icon:'🟢'};

  return{color:'#791F1F',bg:'#FCEBEB',label:'Parado',icon:'🔴'};
}

function getLastMoveDate(r){
  const hist=r.historico||[];
  if(hist.length){
    const last=hist[hist.length-1];
    if(last.data){
      const parts=last.data.split(' ')[0].split('/');
      if(parts.length===3){
        const d=new Date(parts[2],parts[1]-1,parts[0]);
        if(!isNaN(d))return d.toISOString();
      }
    }
  }
  return r.updated_at||r.created_at||null;
}

function renderTimeline(r){

// ── SUPABASE ──
async function db(method,table,data,filter){
  let url=`${SUPA}/rest/v1/${table}`;
  if(filter)url+=`?${filter}`;
  const headers={'apikey':KEY,'Authorization':`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':method==='POST'?'return=representation':'return=minimal'};
  if(method==='GET')headers['Range']='0-9999';
  const r=await fetch(url,{method,headers,body:data?JSON.stringify(data):undefined});
  if(!r.ok){const e=await r.text();throw new Error(e)}
  if(r.status===204)return null;
  return r.json();
}

async function setView(v,btn){
  curView=v;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  Object.values(charts).forEach(c=>{try{c.destroy()}catch{}});charts={};
  // Recarrega dados frescos ao trocar de aba (pega atualizações do time)
  try{await loadData();}catch(e){}
  renderCurView();
}

function renderCurView(){
  const c=document.getElementById('main-content');
  const v=curView;
  if(v==='diretor')renderDiretor(c);
  else if(v==='d-pipeline')renderDPipeline(c);
  else if(v==='d-guia')renderAssessorOpps(c);
  else if(v==='d-metas')renderMetas(c);
  else if(v==='d-upload')renderUpload(c);
  else if(v==='d-usuarios')renderUsuarios(c);
  else if(v==='a-opps')renderAssessorOpps(c);
  else if(v==='a-dash')renderAssessorDash(c);
  else if(v==='a-daily')renderAssessorDaily(c);
}

// ── AUTO-REFRESH: a cada 60s recarrega dados e re-renderiza (exceto em upload/modal aberto) ──
setInterval(async()=>{

// ── ATIVIDADE (extraída do histórico automático) ──
function getActivity(){
  const acts=[];
  OPPS.forEach(r=>{
    (r.historico||[]).forEach(h=>{
      if(!h.data)return;
      const dp=h.data.split(' ')[0].split('/');
      if(dp.length!==3)return;
      const iso=dp[2]+'-'+String(dp[1]).padStart(2,'0')+'-'+String(dp[0]).padStart(2,'0');
      const paraN=norm(h.para||'');
      const sub=subAreaOf(r);
      if(h.campo==='Pendência boleta'&&paraN==='boletado'){
        acts.push({date:iso,area:r.area,sub,tipo:'boleta',valor:r.atual||r.pipe||0,usuario:h.usuario,cliente:r.cliente});
      }else if(h.campo==='Status comercial'&&paraN.includes('reuni')){
        acts.push({date:iso,area:r.area,sub,tipo:'reuniao',valor:0,usuario:h.usuario,cliente:r.cliente});
      }else if((h.campo==='Status comercial'||h.campo==='Pendência boleta')&&h.para){
        acts.push({date:iso,area:r.area,sub,tipo:'avanco',valor:0,usuario:h.usuario,cliente:r.cliente});
      }
    });
  });
  return acts;
}

function lastNDays(n){
  const days=[];
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    days.push(d.toISOString().split('T')[0]);
  }
  return days;
}

        +'</div></div>'
        +'<div style="display:flex;align-items:center;justify-content:space-between;background:var(--green-bg);border:1px solid var(--green-b);border-radius:10px;padding:10px 14px;margin-bottom:12px">'
        +'<div><div style="font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em">✓ Boletado</div>'
        +'<div style="font-size:18px;font-weight:800;color:var(--green)">'+(fmt(bolVol)||'R$0')+'</div></div>'
        +'<div style="text-align:right"><div style="font-size:15px;font-weight:800;color:var(--green)">'+bolN+'</div>'
        +'<div style="font-size:9px;color:var(--green);font-weight:600">de '+myOpps.length+'</div></div>'
        +'</div>'
        +'<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Status das demais ('+outras.length+')</div>'
        +(scList.length?scList.map(([sc,n])=>{
          const b=matchBadge(sc,SC_BADGE)||'b-gray';
          const pct=outras.length?Math.round(n/outras.length*100):0;
          return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'
            +'<span class="badge '+b+'" style="font-size:10px;min-width:120px;text-align:center;padding:2px 6px">'+sc+'</span>'
            +'<div style="flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden"><div style="width:'+pct+'%;height:4px;background:'+cor+';border-radius:99px"></div></div>'
            +'<span style="font-size:11px;font-weight:700;min-width:18px;text-align:right">'+n+'</span>'
            +'</div>';
        }).join(''):'<div style="font-size:11px;color:var(--muted)">Todas boletadas! 🎉</div>')
        +'</div>';
    }).join('')}
  </div>`;

  // Charts
  requestAnimationFrame(()=>{
    // Area chart
    const actx=document.getElementById('ch-area');
    if(actx){charts.area=new Chart(actx,{type:'doughnut',data:{labels:aData.map(d=>d.a.name),datasets:[{data:aData.map(d=>d.bol),backgroundColor:aData.map(d=>d.a.color),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:12}}}}})}

    // Assessor chart top 8
    const top8=assRank.slice(0,8);
    const bctx=document.getElementById('ch-ass');
    if(bctx){charts.ass=new Chart(bctx,{type:'bar',data:{
      labels:top8.map(([n])=>n.split(' ')[0]),
      datasets:[
        {label:'Pipe',data:top8.map(([,v])=>v.pipe),backgroundColor:'#E8D5CC',borderRadius:4},
        {label:'Boletado',data:top8.map(([,v])=>v.bol),backgroundColor:'#8B1C2A',borderRadius:4}
      ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:11}}}},scales:{y:{ticks:{callback:v=>fmt(v),font:{size:10}},grid:{color:'rgba(0,0,0,0.05)'}},x:{ticks:{font:{size:10}}}}}})
    }

    // ── Activity charts (14 dias) ──
    const acts2=getActivity();
    const days14=lastNDays(14);
    const dayLabels=days14.map(d=>{const p=d.split('-');return p[2]+'/'+p[1];});

    const bctx2=document.getElementById('ch-boletas-dia');
    if(bctx2){
      const dsAreas=Object.entries(SUBAREAS).map(([sk,a])=>({
        label:a.name,
        data:days14.map(d=>acts2.filter(x=>x.tipo==='boleta'&&x.date===d&&(x.sub||x.area)===sk).length),
        backgroundColor:a.color,borderRadius:3
      }));
      charts.boletasDia=new Chart(bctx2,{type:'bar',data:{labels:dayLabels,datasets:dsAreas},
        options:{responsive:true,maintainAspectRatio:false,
          plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:12}}},
          scales:{x:{stacked:true,ticks:{font:{size:9}}},y:{stacked:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,0.05)'}}}}});
    }

    const actx2=document.getElementById('ch-avancos-dia');
    if(actx2){
      charts.avancosDia=new Chart(actx2,{type:'bar',data:{labels:dayLabels,datasets:[
        {label:'Avanços de status',data:days14.map(d=>acts2.filter(x=>x.tipo==='avanco'&&x.date===d).length),backgroundColor:'#EF9F27',borderRadius:3},
        {label:'Reuniões',data:days14.map(d=>acts2.filter(x=>x.tipo==='reuniao'&&x.date===d).length),backgroundColor:'#378ADD',borderRadius:3},
        {label:'Boletas',data:days14.map(d=>acts2.filter(x=>x.tipo==='boleta'&&x.date===d).length),backgroundColor:'#085041',borderRadius:3}
      ]},options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top',labels:{font:{size:10},boxWidth:12}}},
        scales:{x:{stacked:true,ticks:{font:{size:9}}},y:{stacked:true,ticks:{stepSize:1,font:{size:10}},grid:{color:'rgba(0,0,0,0.05)'}}}}});
    }
  });
}

function applyFilter(){
  let rows=[...OPPS];
  const fA=document.getElementById('f-area')?.value;
  const fAss=document.getElementById('f-ass')?.value;
  const fSC=document.getElementById('f-sc')?.value;
  const fPB=document.getElementById('f-pb')?.value;
  const fCli=(document.getElementById('f-cli')?.value||'').toLowerCase();
  if(fA)rows=rows.filter(r=>r.area===fA);
  if(fAss)rows=rows.filter(r=>canonAssessor(r.assessor)===fAss);
  if(fSC)rows=rows.filter(r=>r.sc===fSC);
  if(fPB)rows=rows.filter(r=>r.pb===fPB);
  if(fCli)rows=rows.filter(r=>(r.cliente||'').toLowerCase().includes(fCli));

  const kEl=document.getElementById('pipeline-kpis');
  if(kEl){
    const tP=rows.reduce((s,r)=>s+(r.pipe||0),0);
    const tB=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    kEl.innerHTML=`<div class="kpi wine"><div class="kpi-lbl">Boletado</div><div class="kpi-val">${fmt(tB)||'R$0'}</div></div>
    <div class="kpi"><div class="kpi-lbl">Pipe</div><div class="kpi-val">${fmt(tP)}</div><div class="kpi-sub">${rows.length} opor.</div></div>
    <div class="kpi"><div class="kpi-lbl">Pendências</div><div class="kpi-val">${rows.filter(isPend).length}</div></div>`;
  }

  // Summary cards when assessor or status filtered
  const summaryEl=document.getElementById('pipeline-summary');
  if(summaryEl){
    const hasFilter=fA||fAss||fSC||fPB;
    if(hasFilter&&rows.length){
      // Per area breakdown
      const areaBreak=Object.entries(AREAS).map(([ak,a])=>{
        const ar=rows.filter(r=>r.area===ak);
        if(!ar.length)return'';
        const bol=ar.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
        const bolN=ar.filter(isB).length;
        const pipe=ar.reduce((s,r)=>s+(r.pipe||0),0);
        const ef=ar.length?Math.round(bolN/ar.length*100):0;
        return`<div style="background:var(--card);border:1.5px solid ${a.color}33;border-radius:12px;padding:14px 16px;border-top:3px solid ${a.color}">
          <div style="font-size:10px;font-weight:700;color:${a.color};text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:5px">
            <span style="width:7px;height:7px;border-radius:50%;background:${a.color}"></span>${a.name}
          </div>
          <div style="font-size:20px;font-weight:800;color:${a.color};margin-bottom:2px">${fmt(bol)||'R$0'}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${bolN}/${ar.length} boletar · ${ef}% efetiv.</div>
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-top:1px solid var(--border-l)">
            <span style="color:var(--muted)">Pipe</span><span style="font-weight:600">${fmt(pipe)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-top:1px solid var(--border-l)">
            <span style="color:var(--muted)">Pendências</span><span style="font-weight:600;color:${rows.filter(r=>r.area===ak&&isPend(r)).length>0?'var(--amber)':'var(--green)'}">${rows.filter(r=>r.area===ak&&isPend(r)).length||'—'}</span>
          </div>
        </div>`;
      }).filter(Boolean).join('');

      // Risk summary
      const atRisk=rows.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))>7);
      const attn=rows.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))>3&&daysSince(getLastMoveDate(r))<=7);
      const ok=rows.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))<=3);
      const riskHtml='<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">'
        +'<div style="background:#FCEBEB;border:1px solid #E8B0B0;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:20px">🔴</span><div><div style="font-size:18px;font-weight:800;color:#791F1F">'+atRisk.length+'</div><div style="font-size:10px;color:#791F1F;font-weight:600">Paradas +7 dias</div><div style="font-size:11px;color:var(--muted)">'+fmt(atRisk.reduce((s,r)=>s+(r.pipe||0),0))+'</div></div></div>'
        +'<div style="background:#FEF3E2;border:1px solid #FAC775;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:20px">🟡</span><div><div style="font-size:18px;font-weight:800;color:#854F0B">'+attn.length+'</div><div style="font-size:10px;color:#854F0B;font-weight:600">Atenção 4-7 dias</div><div style="font-size:11px;color:var(--muted)">'+fmt(attn.reduce((s,r)=>s+(r.pipe||0),0))+'</div></div></div>'
        +'<div style="background:#E1F5EE;border:1px solid #9FD5B0;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:20px">🟢</span><div><div style="font-size:18px;font-weight:800;color:#085041">'+ok.length+'</div><div style="font-size:10px;color:#085041;font-weight:600">Em dia ≤3 dias</div><div style="font-size:11px;color:var(--muted)">'+fmt(ok.reduce((s,r)=>s+(r.pipe||0),0))+'</div></div></div>'
        +'</div>';

      // Status breakdown
      const scMap={};
      rows.forEach(r=>{if(r.sc){if(!scMap[r.sc])scMap[r.sc]=0;scMap[r.sc]++;}});
      const scBars=Object.entries(scMap).sort((a,b)=>b[1]-a[1]).map(([sc,n])=>{
        const b=matchBadge(sc,SC_BADGE)||'b-gray';
        return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="badge ${b}" style="min-width:140px;text-align:center">${sc}</span>
          <div style="flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden">
            <div style="width:${Math.round(n/rows.length*100)}%;height:5px;background:var(--wine);border-radius:99px"></div>
          </div>
          <span style="font-size:12px;font-weight:700;min-width:24px;text-align:right">${n}</span>
        </div>`;
      }).join('');

      // Pendencia breakdown
      const pbMap={};
      rows.forEach(r=>{if(r.pb){if(!pbMap[r.pb])pbMap[r.pb]=0;pbMap[r.pb]++;}});
      const pbBars=Object.entries(pbMap).sort((a,b)=>b[1]-a[1]).map(([pb,n])=>{
        const b=matchBadge(pb,PB_BADGE)||'b-gray';
        return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="badge ${b}" style="min-width:140px;text-align:center">${pb}</span>
          <div style="flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden">
            <div style="width:${Math.round(n/rows.length*100)}%;height:5px;background:var(--wine);border-radius:99px"></div>
          </div>
          <span style="font-size:12px;font-weight:700;min-width:24px;text-align:right">${n}</span>
        </div>`;
      }).join('');

      summaryEl.innerHTML=
        '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px">'
        +'<div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:14px">'
        +(fAss?'📊 Resumo — '+fAss:fSC?'📊 Resumo — '+fSC:fPB?'📊 Resumo — '+fPB:'📊 Resumo filtrado')
        +'<span style="font-size:11px;font-weight:400;color:var(--muted);margin-left:8px">'+rows.length+' oportunidades</span></div>'
        +riskHtml
        +(areaBreak?'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px">'+areaBreak+'</div>':'')
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">'
        +'<div><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Status comercial</div>'
        +(scBars||'<div style="font-size:12px;color:var(--muted)">—</div>')+'</div>'
        +'<div><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Pendência boleta</div>'
        +(pbBars||'<div style="font-size:12px;color:var(--muted)">—</div>')+'</div>'
        +'</div></div>';
      summaryEl.style.display='block';
    } else {
      summaryEl.innerHTML='';
      summaryEl.style.display='none';
    }
  }

  const tEl=document.getElementById('pipeline-tbl');
  if(!tEl)return;
  if(!rows.length){tEl.innerHTML='<div class="empty"><div class="empty-icon">📭</div><p>Nenhuma oportunidade encontrada</p></div>';return}

  // Sort: red first, then yellow, then green
  rows.sort((a,b)=>{
    const da=daysSince(getLastMoveDate(a));
    const db2=daysSince(getLastMoveDate(b));
    if(isB(a)&&!isB(b))return 1;
    if(!isB(a)&&isB(b))return -1;
    return db2-da;
  });

  const selCount=SELECTED.size;
  const bulkBar=selCount>0?'<div style="display:flex;align-items:center;gap:12px;background:var(--wine-l);border:1.5px solid #C8A0A8;border-radius:10px;padding:10px 16px;margin-bottom:12px">'
    +'<span style="font-size:13px;font-weight:700;color:var(--wine-d)">'+selCount+' selecionada'+(selCount>1?'s':'')+'</span>'
    +'<button class="btn sm" style="border-color:var(--red-b);background:var(--red-bg);color:var(--red)" onclick="deleteSelected()">🗑️ Excluir selecionadas</button>'
    +'<button class="btn sm" onclick="clearSelection()">Limpar seleção</button>'
    +'</div>':'';

  tEl.innerHTML=bulkBar+`<div class="tbl-wrap"><table><thead><tr>
    <th style="width:36px"><input type="checkbox" id="sel-all" onchange="toggleSelectAll(this.checked)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--wine)"></th>
    <th></th><th>Assessor</th><th>Cliente</th><th>Área</th><th>Produto</th>
    <th style="text-align:right">Pipe</th><th style="text-align:right">Atual</th>
    <th>Status</th><th>Pendência</th><th style="text-align:center">Dias</th><th>TODO</th><th></th>
  </tr></thead><tbody>${rows.map(r=>{
    const bsc=matchBadge(r.sc||'',SC_BADGE)||'b-gray';
    const bpb=matchBadge(r.pb||'',PB_BADGE)||'b-gray';
    const cor=AREAS[r.area]?.color||'#8B1C2A';
    const lastMove=getLastMoveDate(r);
    const days=daysSince(lastMove);
    const risk=riskColor(isB(r)?0:days);
    return`<tr class="${isB(r)?'bol':''}">
      <td><input type="checkbox" ${SELECTED.has(r.id)?'checked':''} onchange="toggleSelect('${r.id}',this.checked)" style="width:15px;height:15px;cursor:pointer;accent-color:var(--wine)"></td>
      <td title="${risk.label} — ${isB(r)?'Boletado':days+' dias sem mover'}" style="text-align:center;font-size:14px;cursor:default">${isB(r)?'✅':risk.icon}</td>
      <td style="font-weight:600">${canonAssessor(r.assessor)||r.assessor||'—'}</td>
      <td style="font-weight:600">${r.cliente||'—'}</td>
      <td><span class="badge" style="background:${cor}15;color:${cor};border:1px solid ${cor}33">${AREAS[r.area]?.name||r.area||'—'}</span></td>
      <td>${r.produto||'—'}${r.responsavel?`<div style="font-size:10px;font-weight:700;color:#7F77DD">👤 ${r.responsavel}</div>`:''}</td>
      <td style="text-align:right;color:var(--muted)">${fmt(r.pipe)}</td>
      <td style="text-align:right;font-weight:700;color:${isB(r)?'var(--green)':'var(--text)'}">${fmt(r.atual)}</td>
      <td>${r.sc?`<span class="badge ${bsc}">${r.sc}</span>`:'—'}</td>
      <td>${r.pb?`<span class="badge ${bpb}">${r.pb}</span>`:'—'}</td>
      <td style="text-align:center"><span style="font-size:11px;font-weight:700;color:${risk.color};background:${risk.bg};padding:2px 7px;border-radius:999px">${isB(r)?'✓':days+'d'}</span></td>
      <td style="font-size:11px;max-width:140px" title="${r.todo||''}">
        ${r.todo?`<div style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.todo}</div>`:'—'}
        ${r.todo_data?(()=>{const atrasado=r.todo_data<today()&&!isB(r);const ehHoje=r.todo_data===today();const cor=atrasado?'var(--red)':ehHoje?'var(--amber)':'var(--muted)';const dt=r.todo_data.split('-');return`<div style="font-size:10px;font-weight:700;color:${cor};margin-top:2px">📅 ${dt[2]}/${dt[1]}${atrasado?' ⚠️':''}${ehHoje?' hoje':''}</div>`;})():''}
      </td>
      <td><button class="btn sm" onclick="openEdit('${r.id}')">Ver</button></td>
    </tr>`;
  }).join('')}</tbody></table></div>`;
}

// ── SELEÇÃO / EXCLUSÃO EM MASSA ──
function toggleSelect(id,checked){
  if(checked)SELECTED.add(id);else SELECTED.delete(id);
  applyFilter();
}
function toggleSelectAll(checked){
  if(checked){
    // Select all currently visible rows
    let rows=[...OPPS];
    const fA=document.getElementById('f-area')?.value;
    const fAss=document.getElementById('f-ass')?.value;
    const fSC=document.getElementById('f-sc')?.value;
    const fPB=document.getElementById('f-pb')?.value;
    const fCli=(document.getElementById('f-cli')?.value||'').toLowerCase();
    if(fA)rows=rows.filter(r=>r.area===fA);
    if(fAss)rows=rows.filter(r=>canonAssessor(r.assessor)===fAss);
    if(fSC)rows=rows.filter(r=>r.sc===fSC);
    if(fPB)rows=rows.filter(r=>r.pb===fPB);
    if(fCli)rows=rows.filter(r=>(r.cliente||'').toLowerCase().includes(fCli));
    rows.forEach(r=>SELECTED.add(r.id));
  }else{
    SELECTED.clear();
  }
  applyFilter();
}
function clearSelection(){SELECTED.clear();applyFilter();}
function toggleSelectG(id,checked,ev){if(ev)ev.stopPropagation();if(checked)SELECTED.add(id);else SELECTED.delete(id);renderAssessorOpps();}
function toggleSelectAllG(checked){
  const ids=window._listIds||[];
  if(checked)ids.forEach(id=>SELECTED.add(id));
  else ids.forEach(id=>SELECTED.delete(id));

  if(!confirm('Excluir '+n+' oportunidade'+(n>1?'s':'')+' permanentemente? Esta ação não pode ser desfeita.'))return;

  try{

function fmtReuniao(s){
  if(!s)return'';
  const [d,h]=s.split('T');
  const p=d.split('-');
  return p[2]+'/'+p[1]+(h?' às '+h.substring(0,5):'');
}

function sugestaoAcao(r){
  if(r.todo)return r.todo;
  const sc=norm(r.sc||'');
  const pb=norm(r.pb||'');
  if(pb.includes('email'))return 'Enviar email/push para o cliente';
  if(pb==='a boletar')return 'Gerar a boleta!';
  if(pb.includes('to do'))return 'Resolver pendência da boleta';
  if(sc==='ligar cliente'||sc==='ligar cliente c ai')return 'Ligar para o cliente';
  if(sc==='agendar reunião')return 'Agendar a reunião';
  if(sc==='reunião agendada')return 'Realizar a reunião';
  if(sc==='cliente confirmar')return 'Cobrar confirmação do cliente';
  if(sc==='cliente topou')return 'Cliente topou — fechar a boleta!';
  return 'Definir próximo passo';
}

const SC_CHAIN=['Ligar Cliente','Agendar Reunião','Reunião Agendada','Cliente Confirmar','Cliente Topou'];

// ── 🤖 INTELIGÊNCIA: análise da próxima ação ──
function analisarProximaAcao(r){
  const dias=daysSince(getLastMoveDate(r));
  const sc=norm(r.sc||''),pb=norm(r.pb||'');
  const vol=r.atual||r.pipe||0;
  const hist=r.historico||[];
  const nMoves=hist.filter(h=>h.campo==='Status comercial').length;
  const temReuniao=!!r.reuniao_data;
  const agora=new Date().toISOString().slice(0,16);
  const reuniaoPassada=temReuniao&&r.reuniao_data<agora;
  let acao='',motivo='',urg='media';

  if(isB(r)){acao='Oportunidade concluída';motivo='Boletada com sucesso. Nenhuma ação necessária.';urg='baixa';}
  else if(pb==='a boletar'){acao='Gerar a boleta AGORA';motivo='Cliente pronto para boletar. '+(dias>2?'Já se passaram '+dias+' dias — risco de esfriar!':'Aproveite o momento quente.');urg='alta';}
  else if(sc==='cliente topou'){acao='Resolver pendência e boletar';motivo='Cliente topou'+(r.pb?' mas há pendência: '+r.pb:'')+'.'+(dias>3?' '+dias+' dias parado — priorize hoje!':'');urg='alta';}
  else if(reuniaoPassada){acao='Registrar o resultado da reunião';motivo='A reunião de '+fmtReuniao(r.reuniao_data)+' já aconteceu. Atualize o status com o desfecho e a próxima etapa.';urg='alta';}
  else if(temReuniao){acao='Preparar a reunião de '+fmtReuniao(r.reuniao_data);motivo='Revise a proposta, o perfil do cliente e o material antes do encontro.';urg='media';}
  else if(sc==='cliente confirmar'){
    if(dias>3){acao='Cobrar resposta do cliente';motivo='Sem resposta há '+dias+' dias. Um follow-up educado recupera boa parte dos silêncios.';urg='alta';}
    else{acao='Aguardar confirmação (follow-up em '+(4-dias)+' dia'+(4-dias>1?'s':'')+')';motivo='Cliente está decidindo. Não pressione ainda.';urg='baixa';}
  }
  else if(sc==='reunião agendada'&&!temReuniao){acao='Registrar data e hora da reunião';motivo='Status indica reunião marcada mas sem data no sistema — registre para aparecer na agenda do dia.';urg='media';}
  else if(sc==='agendar reunião'){acao='Propor 2 horários ao cliente';motivo='Oferecer opções concretas acelera o agendamento.'+(dias>5?' Parado há '+dias+' dias.':'');urg=dias>5?'alta':'media';}
  else if(sc.includes('ligar')){
    if(dias>7){acao='Retomar contato (ligação + WhatsApp)';motivo='Sem avanço há '+dias+' dias'+(nMoves===0?' e nenhum contato registrado':'')+'. Tente um canal alternativo.';urg='alta';}
    else{acao='Ligar para o cliente';motivo='O primeiro contato define o ritmo da negociação.';urg='media';}
  }
  else if(pb.includes('email')){acao='Enviar: '+r.pb;motivo='Pendência operacional travando a boleta há '+dias+' dia'+(dias>1?'s':'')+'.';urg='alta';}
  else if(pb.includes('to do')||pb.includes('aguardando')){acao='Resolver: '+r.pb;motivo='Pendência aberta há '+dias+' dias.';urg=dias>3?'alta':'media';}
  else if(!r.sc){acao='Classificar a oportunidade';motivo='Sem status definido. Defina a etapa para ela entrar no funil e nas prioridades.';urg='media';}
  else{acao=sugestaoAcao(r);motivo=dias>7?'Parada há '+dias+' dias sem movimentação.':'Mantenha o ritmo de acompanhamento.';urg=dias>7?'alta':'baixa';}

  if(!isB(r)&&vol>=500000&&urg!=='alta')motivo+=' 💰 Ticket alto ('+fmt(vol)+') — merece atenção extra.';
  return{acao,motivo,urg};
}

async function advanceStatus(id,ev){
  if(ev)ev.stopPropagation();
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const cur=SC_CHAIN.findIndex(s=>norm(s)===norm(r.sc||''));
  const next=cur<0?SC_CHAIN[0]:SC_CHAIN[Math.min(cur+1,SC_CHAIN.length-1)];
  if(cur>=SC_CHAIN.length-1){quickBoletar(id);return;}
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:'Status comercial',de:r.sc||'',para:next,usuario:USER.nome,data:ds}];
  try{
    await db('PATCH','oportunidades',{sc:next,historico:hist,updated_at:now.toISOString()},'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+next,true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

let _dragId=null;
function kbDragStart(ev,id){_dragId=id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',id)}catch(e){}}
function kbDragOver(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.style.background='#E4D2C6';ev.currentTarget.style.transform='scale(1.01)';}
function kbDragLeave(ev){ev.currentTarget.style.background='';ev.currentTarget.style.transform='';}
async function kbDrop(ev,statusKey){
  ev.preventDefault();
  ev.currentTarget.style.background='';ev.currentTarget.style.transform='';
  const id=_dragId;_dragId=null;
  if(!id)return;
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[])];
  const patch={updated_at:now.toISOString()};
  if(statusKey==='__BOL__'){
    if(isB(r))return;
    hist.push({campo:'Pendência boleta',de:r.pb||'',para:'Boletado',usuario:USER.nome,data:ds});
    patch.pb='Boletado';
  }else{
    if(norm(r.sc||'')===norm(statusKey)&&!isB(r))return;
    if(isB(r)){
      hist.push({campo:'Pendência boleta',de:r.pb||'',para:'(desfeita)',usuario:USER.nome,data:ds});
      patch.pb='';
    }
    hist.push({campo:'Status comercial',de:r.sc||'',para:statusKey,usuario:USER.nome,data:ds});
    patch.sc=statusKey;
  }
  patch.historico=hist;
  try{
    await db('PATCH','oportunidades',patch,'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+(statusKey==='__BOL__'?'Boletado':statusKey),true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

function oppCard(r){
  const cor=AREAS[r.area]?.color||'#8B1C2A';
  const bsc=matchBadge(r.sc||'',SC_BADGE)||'b-gray';
  const bpb=matchBadge(r.pb||'',PB_BADGE)||'b-gray';
  const boletado=isB(r);
  const pending=isPend(r);
  return`<div class="opp-card${boletado?' bol':''}" id="card-${r.id}">
    <div class="opp-card-header">
      <div>
        <div class="opp-client">${r.cliente}</div>
        <div class="opp-meta">
          <span class="badge" style="background:${cor}15;color:${cor};border:1px solid ${cor}33;font-size:10px">${AREAS[r.area]?.name||r.area}</span>
          ${r.produto?`<span class="badge b-gray" style="font-size:10px">${r.produto}</span>`:''}
        </div>
      </div>
      <div class="opp-vol">${fmt(r.atual||r.pipe)}</div>
    </div>
    <div class="opp-card-body">
      <div class="opp-row">
        <span class="opp-row-l">Status</span>
        <span>${r.sc?`<span class="badge ${bsc}">${r.sc}</span>`:'<span style="color:var(--muted);font-size:12px">—</span>'}</span>
      </div>
      <div class="opp-row">
        <span class="opp-row-l">Pendência</span>
        <span>${r.pb?`<span class="badge ${bpb}">${r.pb}</span>`:'<span style="color:var(--muted);font-size:12px">—</span>'}</span>
      </div>
      ${r.todo?`<div class="opp-row"><span class="opp-row-l">📋 TODO</span><span class="opp-row-v" style="font-size:11px;max-width:160px;text-align:right">${r.todo}</span></div>`:''}
    </div>

      <button class="opp-btn sc" onclick="openEdit('${r.id}')">✏️ Atualizar</button>

// ── QUICK ACTIONS ──
async function quickBoletar(id){
  const r=OPPS.find(o=>o.id===id);
  if(!r||!confirm(`Marcar "${r.cliente}" como Boletado?`))return;
  const now=new Date();
  const hist=[...(r.historico||[]),{campo:'Pendência boleta',de:r.pb,para:'Boletado',usuario:USER.nome,data:now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}];
  try{
    await db('PATCH','oportunidades',{pb:'Boletado',historico:hist,updated_at:now.toISOString()},`id=eq.${id}`);
    showToast('✅ Marcado como Boletado!',true);
    await loadData();
    renderAssessorOpps();
  }catch(e){showToast('Erro: '+e.message)}
}

function renderAssessorDash(c=document.getElementById('main-content')){
  const myOpps=OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
  const bolRows=myOpps.filter(isB);
  const bolV=bolRows.reduce((s,r)=>s+(r.atual||0),0);
  const ativos=myOpps.filter(r=>!isB(r));
  const pipeV=ativos.reduce((s,r)=>s+(r.pipe||0),0);
  const pend=ativos.filter(isPend).length;
  const efet=myOpps.length?Math.round(bolRows.length/myOpps.length*100):0;

  // Minhas metas (responsável = eu)
  const minhasMetas=METAS.filter(m=>norm(m.assessor)===norm(USER.nome)).map(m=>{
    const rows=OPPS.filter(r=>{
      if(m.area&&r.area!==m.area)return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const pct=m.meta_valor>0?Math.min(Math.round(boletado/m.meta_valor*100),999):0;
    return{...m,boletado,pct};
  });

  // Por segmento
  const segCards=Object.entries(SUBAREAS).map(([sk,a])=>{
    const so=myOpps.filter(r=>subAreaOf(r)===sk);
    if(!so.length)return'';
    const sb=so.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const sbN=so.filter(isB).length;
    const sp=so.filter(r=>!isB(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const spN=so.filter(r=>!isB(r)).length;
    return '<div style="background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:16px;border-top:4px solid '+a.color+'">'
      +'<div style="font-size:12px;font-weight:800;color:'+a.color+';text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px">'+a.name+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +'<div style="background:var(--green-bg);border-radius:9px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase">✓ Boletado</div>'
      +'<div style="font-size:16px;font-weight:800;color:var(--green)">'+(fmt(sb)||'R$0')+'</div>'
      +'<div style="font-size:10px;color:var(--green)">'+sbN+' opor.</div>'
      +'</div>'
      +'<div style="background:var(--cream);border-radius:9px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">🔄 Em esteira</div>'
      +'<div style="font-size:16px;font-weight:800;color:'+a.color+'">'+(fmt(sp)||'—')+'</div>'
      +'<div style="font-size:10px;color:var(--muted)">'+spN+' opor.</div>'
      +'</div>'
      +'</div></div>';
  }).join('');

  // Esteira por etapa (mini funil)
  const funilRows=SC_CHAIN.map(s=>{
    const rows=ativos.filter(r=>norm(r.sc||'')===norm(s));
    return{s,n:rows.length,v:rows.reduce((s2,r)=>s2+(r.pipe||0),0)};
  });
  const maxF=Math.max(...funilRows.map(f=>f.n),1);

  c.innerHTML=''
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">'
    +'<div class="kpi green"><div class="kpi-lbl">✓ Boletado</div><div class="kpi-val">'+(fmt(bolV)||'R$0')+'</div><div class="kpi-sub">'+bolRows.length+' oportunidades</div></div>'
    +'<div class="kpi wine"><div class="kpi-lbl">🔄 Em esteira</div><div class="kpi-val">'+(fmt(pipeV)||'R$0')+'</div><div class="kpi-sub">'+ativos.length+' em andamento</div></div>'
    +'<div class="kpi amber"><div class="kpi-lbl">⚡ Pendências</div><div class="kpi-val">'+pend+'</div><div class="kpi-sub">aguardando ação</div></div>'
    +'<div class="kpi blue"><div class="kpi-lbl">Efetivação</div><div class="kpi-val">'+efet+'%</div><div class="kpi-sub">boletadas / total</div></div>'
    +'</div>'

    // Minhas metas
    +(minhasMetas.length?'<div class="section-label">🏆 Minhas metas do mês</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:22px">'
      +minhasMetas.map(m=>{
        const a=AREAS[m.area]||{color:'#8B1C2A',name:m.area};
        const pctColor=m.pct>=100?'#085041':m.pct>=60?'#854F0B':a.color;
        return '<div style="background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:16px;border-left:4px solid '+a.color+'">'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
          +'<span style="font-size:12px;font-weight:700;color:'+a.color+'">'+a.name+(m.produto?' · '+m.produto:'')+'</span>'
          +'<span style="font-size:16px;font-weight:800;color:'+pctColor+'">'+m.pct+'%</span>'
          +'</div>'
          +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:8px">'
          +'<span style="font-size:20px;font-weight:800;color:'+pctColor+'">'+(fmt(m.boletado)||'R$0')+'</span>'
          +'<span style="font-size:12px;color:var(--muted)">/ '+fmt(m.meta_valor)+'</span>'
          +'</div>'
          +'<div style="height:8px;background:var(--border);border-radius:99px;overflow:hidden">'
          +'<div style="width:'+Math.min(m.pct,100)+'%;height:8px;background:'+pctColor+';border-radius:99px"></div>'
          +'</div>'
          +'<div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:right">'+(m.meta_valor>m.boletado?'falta '+fmt(m.meta_valor-m.boletado):'✅ meta atingida!')+'</div>'
          +'</div>';
      }).join('')+'</div>':'')

    // Por segmento
    +'<div class="section-label">Por segmento</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px">'+segCards+'</div>'

    // Esteira por etapa
    +'<div class="section-label">🔄 O que está na esteira</div>'
    +'<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px">'
    +funilRows.map(f=>{
      const w=Math.max(Math.round(f.n/maxF*100),3);
      return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'
        +'<div style="min-width:130px;font-size:12px;font-weight:600">'+f.s+'</div>'
        +'<div style="flex:1;background:var(--wine-l);border-radius:8px;height:28px;overflow:hidden">'
        +'<div style="width:'+w+'%;height:28px;background:var(--wine);border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:30px">'
        +'<span style="color:#fff;font-size:11px;font-weight:800">'+f.n+'</span>'
        +'</div></div>'
        +'<div style="min-width:64px;text-align:right;font-size:12px;font-weight:700;color:var(--wine-d)">'+(fmt(f.v)||'—')+'</div>'
        +'</div>';
    }).join('')
    +'</div>';
}

function renderAssessorDaily(c=document.getElementById('main-content')){
  const myOpps=OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
  const selN=Object.keys(DAILY).length;
  const reunN=Object.values(DAILY).filter(v=>v.tipo==='reuniao').length;
  const bolN2=Object.values(DAILY).filter(v=>v.tipo==='boleta').length;
  const todoN=Object.values(DAILY).filter(v=>v.tipo==='todo').length;

  const pendentes=myOpps.filter(r=>isPend(r)&&!isB(r));
  const reunioes=myOpps.filter(r=>norm(r.sc||'').includes('reunião')||norm(r.sc||'').includes('agendar'));
  const outros=myOpps.filter(r=>!isPend(r)&&!isB(r)&&!reunioes.find(x=>x.id===r.id));

  function grp(emoji,title,rows,color){
    if(!rows.length)return'';
    return`<div class="day-group-title" style="color:${color}">${emoji} ${title}
      <span class="badge" style="background:${color};color:#fff;font-size:10px;padding:1px 7px">${rows.length}</span>

async function toggleDaily(oppId,checked){
  const t=today();
  try{
    if(checked){
      const res=await db('POST','daily_selecoes',{data:t,assessor:USER.nome,oportunidade_id:oppId,tipo:'',acao:''});
      DAILY[oppId]={tipo:'',acao:'',id:res?.[0]?.id};
    }else{
      if(DAILY[oppId]?.id)await db('DELETE','daily_selecoes','',`id=eq.${DAILY[oppId].id}`);
      delete DAILY[oppId];
    }
    renderAssessorDaily();
  }catch(e){showToast('Erro: '+e.message)}
}

async function updateDaily(oppId,field,value){
  if(!DAILY[oppId]?.id)return;
  DAILY[oppId][field]=value;
  try{await db('PATCH','daily_selecoes',{[field]:value},`id=eq.${DAILY[oppId].id}`);}catch{}
}

function exportDailyPDF(){
  const myOpps=OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
  const sel=Object.entries(DAILY).filter(([,v])=>v.tipo);
  if(!sel.length){showToast('Defina o tipo das oportunidades antes de exportar!');return}
  const now=new Date();
  const grupos={reuniao:{emoji:'📅',label:'Reuniões',items:[]},boleta:{emoji:'✅',label:'Boletas',items:[]},todo:{emoji:'📋',label:'TODOs e ligações',items:[]}};
  sel.forEach(([id,v])=>{const r=myOpps.find(o=>o.id===id);if(r&&grupos[v.tipo])grupos[v.tipo].items.push({r,acao:v.acao||''})});
  const totalVol=sel.reduce((s,[id])=>{const r=myOpps.find(o=>o.id===id);return s+(r?.atual||r?.pipe||0)},0);

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily ${USER.nome}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;color:#1A0508;font-size:13px;padding:40px}.hdr{border-bottom:3px solid #8B1C2A;padding-bottom:20px;margin-bottom:24px;display:flex;justify-content:space-between}h1{font-size:22px;font-weight:700;color:#8B1C2A}h2{font-size:13px;font-weight:700;margin:16px 0 10px;text-transform:uppercase;letter-spacing:.05em}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.kpi{border:1px solid #E8D5CC;border-radius:8px;padding:12px;text-align:center}.kpi.hl{background:#8B1C2A;color:#fff}.kv{font-size:20px;font-weight:800}.kl{font-size:10px;text-transform:uppercase;opacity:.7;margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}th{background:#F5F0EB;padding:7px 10px;text-align:left;font-size:11px;text-transform:uppercase;border-bottom:2px solid #E8D5CC}td{padding:6px 10px;border-bottom:1px solid #F0E8E3}hr{border:1px solid #E8D5CC;margin:20px 0}.ftr{margin-top:40px;padding-top:12px;border-top:1px solid #E8D5CC;font-size:11px;color:#B4A0A8;display:flex;justify-content:space-between}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="hdr"><div><h1>Daily — ${USER.nome}</h1><div style="color:#8A6A6E;margin-top:4px">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div></div><div style="text-align:right;font-size:12px;color:#8A6A6E">${sel.length} oportunidades<br>${fmt(totalVol)}</div></div><div class="kpis"><div class="kpi hl"><div class="kl">Total</div><div class="kv">${sel.length}</div></div><div class="kpi"><div class="kl">📅 Reuniões</div><div class="kv">${grupos.reuniao.items.length}</div></div><div class="kpi"><div class="kl">✅ Boletas</div><div class="kv">${grupos.boleta.items.length}</div></div><div class="kpi"><div class="kl">📋 TODOs</div><div class="kv">${grupos.todo.items.length}</div></div></div>${secoes}<div class="ftr"><span>Gerencial Comercial — Daily</span><span>${now.toLocaleString('pt-BR')}</span></div></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);
}

// ── DEFINIÇÕES DO MÊS (METAS) ──
function renderMetas(c=document.getElementById('main-content')){
  const mesLabel=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

  // Compute progress for each meta (individual: by area+produto)
  const metasComProgresso=METAS.map(m=>{
    const rows=OPPS.filter(r=>{
      if(m.area&&r.area!==m.area)return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const pipe=rows.reduce((s,r)=>s+(r.pipe||0),0);
    const pct=m.meta_valor>0?Math.min(Math.round(boletado/m.meta_valor*100),999):0;
    return{...m,boletado,pipe,pct,nOpps:rows.length};
  });

  // Group by area
  const porArea={};
  metasComProgresso.forEach(m=>{
    if(!porArea[m.area])porArea[m.area]=[];
    porArea[m.area].push(m);
  });

  // Global totals
  const totalMeta=metasComProgresso.reduce((s,m)=>s+(m.meta_valor||0),0);
  const totalBolGlobal=Object.keys(porArea).reduce((s,ak)=>{
    const rows=OPPS.filter(r=>r.area===ak);
    return s+rows.filter(isB).reduce((s2,r)=>s2+(r.atual||0),0);
  },0);
  const totalPct=totalMeta>0?Math.round(totalBolGlobal/totalMeta*100):0;

  c.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">'
    +'<div><div style="font-size:18px;font-weight:800">🎯 Definições do mês</div>'
    +'<div style="font-size:12px;color:var(--muted);text-transform:capitalize">'+mesLabel+'</div></div>'
    +'<button class="btn wine" onclick="document.getElementById(\'modal-meta\').style.display=\'flex\';fillMetaSelects()">+ Nova meta</button>'
    +'</div>'

    // Global summary
    +(METAS.length?(()=>{
      const areaLine=(getVal)=>'<div style="display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-l);flex-wrap:wrap">'
        +Object.entries(AREAS).filter(([ak])=>porArea[ak]).map(([ak,a])=>{
          const metasA=porArea[ak]||[];
          const metaA=metasA.reduce((s,m)=>s+(m.meta_valor||0),0);
          const bolA=OPPS.filter(r=>r.area===ak&&isB(r)).reduce((s,r)=>s+(r.atual||0),0);
          const pctA=metaA>0?Math.round(bolA/metaA*100):0;
          return '<div style="display:flex;align-items:center;gap:4px" title="'+a.name+'">'
            +'<span style="width:8px;height:8px;border-radius:50%;background:'+a.color+';flex-shrink:0"></span>'
            +'<span style="font-size:11px;font-weight:800;color:'+a.color+'">'+getVal(metaA,bolA,pctA)+'</span>'
            +'</div>';
        }).join('')+'</div>';
      return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px">'
      +'<div class="kpi wine"><div class="kpi-lbl">Meta total do mês</div><div class="kpi-val">'+fmt(totalMeta)+'</div>'+areaLine((m,b,p)=>fmt(m))+'</div>'
      +'<div class="kpi green"><div class="kpi-lbl">Realizado</div><div class="kpi-val">'+(fmt(totalBolGlobal)||'R$0')+'</div>'+areaLine((m,b,p)=>fmt(b)||'R$0')+'</div>'
      +'<div class="kpi '+(totalPct>=100?'green':totalPct>=60?'amber':'')+'"><div class="kpi-lbl">Atingimento</div><div class="kpi-val">'+totalPct+'%</div>'+areaLine((m,b,p)=>p+'%')+'</div>'
      +'</div>';
    })():'')

    // Area groups
    +(Object.keys(porArea).length
      ?Object.entries(AREAS).filter(([ak])=>porArea[ak]).map(([ak,a])=>{
        const metas=porArea[ak];
        const areaMeta=metas.reduce((s,m)=>s+(m.meta_valor||0),0);
        // Realizado da área = boletado total da área
        const areaRows=OPPS.filter(r=>r.area===ak);
        const areaBol=areaRows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
        const areaPipe=areaRows.reduce((s,r)=>s+(r.pipe||0),0);
        const areaPct=areaMeta>0?Math.min(Math.round(areaBol/areaMeta*100),999):0;
        const areaPctColor=areaPct>=100?'#085041':areaPct>=60?'#854F0B':a.color;
        const areaBarW=Math.min(areaPct,100);

        return '<div style="background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden;border-top:5px solid '+a.color+'">'

          // Area header with total
          +'<div style="padding:20px 22px;border-bottom:1px solid var(--border-l)">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
          +'<div style="display:flex;align-items:center;gap:8px">'

            const barW=Math.min(m.pct,100);
            return '<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border-l)">'

              +'</div>';
          }).join('')

          +'</div>';
      }).join('')
      :'<div class="empty"><div class="empty-icon">🎯</div><p>Nenhuma meta definida para este mês ainda.<br>Clique em <strong>+ Nova meta</strong> para começar.</p></div>');
}

function fillMetaSelects(){
  // Responsável = membro do time de vendas (usuários cadastrados no sistema)
  const time=USUARIOS.filter(u=>u.ativo).map(u=>u.nome).sort();
  const selA=document.getElementById('m-assessor');
  selA.innerHTML='<option value="">Selecionar responsável...</option>'+time.map(a=>'<option>'+a+'</option>').join('');
  updateMetaProdutos();
}

function updateMetaProdutos(){
  const area=document.getElementById('m-area').value;
  const produtos=[...new Set(OPPS.filter(r=>!area||r.area===area).map(r=>r.produto).filter(Boolean))].sort();
  const selP=document.getElementById('m-produto');
  selP.innerHTML='<option value="">Todos os produtos</option>'+produtos.map(p=>'<option>'+p+'</option>').join('');
}

async function saveMeta(){
  const assessor=document.getElementById('m-assessor').value;
  const area=document.getElementById('m-area').value;
  const produto=document.getElementById('m-produto').value;
  const valor=parseFloat(document.getElementById('m-valor').value)||0;
  if(!assessor||!area||valor<=0){showToast('Preencha assessor, área e valor da meta!');return}
  const mes=new Date().toISOString().slice(0,7);
  try{
    await db('POST','metas',{mes,assessor,area,produto,meta_valor:valor});
    showToast('✅ Meta criada!',true);
    closeModal('meta');
    document.getElementById('m-valor').value='';
    await loadData();
    renderMetas();
  }catch(e){showToast('Erro: '+e.message)}
}

async function delMeta(id){
  if(!confirm('Remover esta meta?'))return;
  try{
    await db('DELETE','metas','','id=eq.'+id);
    showToast('Meta removida',true);
    await loadData();
    renderMetas();
  }catch(e){showToast('Erro: '+e.message)}
}

// ── UPLOAD ──
function renderUpload(c=document.getElementById('main-content')){
  c.innerHTML=`<p style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6">
    Suba a planilha <strong>uma vez por dia</strong>. O sistema lê as abas <strong>RV, RF, Consórcio e Seguro de Vida</strong> e separa por área automaticamente.<br><br>
<strong>✅ Sem duplicatas:</strong> oportunidades já existentes (mesmo assessor + cliente + produto) têm apenas o volume atualizado — o status, pendência, TODO e observações que o time preencheu <strong>no sistema são preservados</strong>. Só as oportunidades novas são adicionadas.
  </p>
  <div class="upload-card" id="uc-main" onclick="document.getElementById('fi-main').click()" style="max-width:480px;margin:0 auto">
    <div class="upload-icon">📊</div>
    <div class="upload-title" style="color:var(--wine)">Campanha_vX_Mês.xlsx</div>
    <div class="upload-sub">Abas: RV · RF · Consórcio · Seguro de Vida</div>
    <div class="upload-status" id="us-main" style="margin-top:10px;min-height:20px"></div>
    <input type="file" id="fi-main" accept=".xlsx,.xls" style="display:none" onchange="doUploadMain(this)">
  </div>
  <div id="upload-results" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px;display:none"></div>
  <div id="upload-log" style="margin-top:20px"></div>`;
}

async function doUploadMain(input){
  const file=input.files[0];if(!file)return;input.value='';
  const st=document.getElementById('us-main');
  const uc=document.getElementById('uc-main');
  st.textContent='⏳ Lendo planilha...';st.style.color='var(--muted)';

  const SHEET_MAP={
    'rv':'inv','RV':'inv','Rv':'inv',
    'rf':'inv','RF':'inv','Rf':'inv',
    'Consórcio':'cons','Consorcio':'cons','CONSÓRCIO':'cons','CONSORCIO':'cons',
    'Seguro de Vida':'seg','SEGURO DE VIDA':'seg','Seguro':'seg','SEG':'seg'
  };

  const SHEET_CFG={
    rv:{area:'inv',aai:['AAI','AI'],pipe:['RV Pipe'],atual:['RV Atual'],sc:['Status Comercial','Status Comercial RV'],pb:['Pendencia Boleta','Pendencia Boleta RV'],todo:['ToDo','TO DO'],obs:['Obs']},
    rf:{area:'inv',aai:['AI','AAI'],pipe:['RF Pipe'],atual:['RF Atual'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['Obs']},
    cons:{area:'cons',aai:['AI','AAI'],pipe:['Pipe Atual','Carta'],atual:['Pipe Atual'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo','OBS'],obs:['OBS']},
    seg:{area:'seg',aai:['AI','AAI'],pipe:['Seg Pipe'],atual:['Seg atual','Seg Atual'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp','Dono']}
  };

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const results={inv:{rows:[],new:0,upd:0},cons:{rows:[],new:0,upd:0},seg:{rows:[],new:0,upd:0}};

      // Process each relevant sheet
      for(const sname of wb.SheetNames){
        let cfgKey=null;
        const sl=sname.toLowerCase().trim();
        if(sl==='rv')cfgKey='rv';
        else if(sl==='rf')cfgKey='rf';
        else if(sl.includes('cons'))cfgKey='cons';
        else if(sl.includes('seguro')||sl.includes('seg vida')||sl==='seg')cfgKey='seg';
        if(!cfgKey)continue;

        const cfg=SHEET_CFG[cfgKey];
        const raw=XLSX.utils.sheet_to_json(wb.Sheets[sname],{header:1,defval:''});
        const rows=parsePipeCfg(raw,cfg.area,cfg);
        results[cfg.area].rows=[...results[cfg.area].rows,...rows];
      }

      let totalNew=0,totalUpd=0,totalRows=0;
      for(const[area,res]of Object.entries(results)){
        if(!res.rows.length)continue;
        const existing=OPPS.filter(r=>r.area===area);
        const toInsert=[],toUpdate=[];
        let skipped=0;
        res.rows.forEach(nr=>{
          const ex=existing.find(e=>norm(e.assessor)===norm(nr.assessor)&&norm(e.cliente)===norm(nr.cliente)&&norm(e.produto||'')===norm(nr.produto||''));
          // Boletas antigas da planilha NÃO entram como novas (histórico de meses anteriores).
          // Boletas do mês devem ser marcadas dentro do sistema.
          if(!ex&&norm(nr.pb||'')==='boletado'){skipped++;return;}
          if(ex){
            // MERGE DIÁRIO: preserva o trabalho do time no sistema.
            // Só atualiza pipe (volume). Campos vazios no sistema são preenchidos pela planilha.
            const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
            if(!ex.sc&&nr.sc)upd.sc=nr.sc;
            if(!ex.pb&&nr.pb)upd.pb=nr.pb;
            if(!ex.todo&&nr.todo)upd.todo=nr.todo;
            if(!ex.obs&&nr.obs)upd.obs=nr.obs;
            if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
            if(nr.responsavel)upd.responsavel=nr.responsavel;
            toUpdate.push(upd);
          }
          else toInsert.push(nr);
        });
        if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
        for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,`id=eq.${id}`);}
        res.new=toInsert.length;res.upd=toUpdate.length;
        totalNew+=toInsert.length;totalUpd+=toUpdate.length;totalRows+=res.rows.length;
      }

      uc.classList.add('done');
      st.textContent=`✅ ${totalNew+totalUpd} processadas (${totalNew} novas · ${totalUpd} atualizadas)${totalRows-totalNew-totalUpd>0?' · '+(totalRows-totalNew-totalUpd)+' boletas antigas ignoradas':''}`;
      st.style.color='var(--green)';

      // Show per-area results
      const resEl=document.getElementById('upload-results');
      if(resEl){
        resEl.style.display='grid';
        resEl.innerHTML=Object.entries(results).map(([ak,res])=>res.rows.length?`
          <div style="background:var(--green-bg);border:1px solid var(--green-b);border-radius:10px;padding:12px 14px">
            <div style="font-weight:700;color:${AREAS[ak].color};margin-bottom:4px">${AREAS[ak].name}</div>
            <div style="font-size:13px;font-weight:800;color:var(--green)">${res.rows.length} oportunidades</div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px">${res.new} novas · ${res.upd} atualizadas</div>
          </div>`:'').join('');
      }

      showToast(`✅ ${totalRows} oportunidades importadas!`,true);
      const log=document.getElementById('upload-log');
      if(log){const d=document.createElement('div');d.style.cssText='background:var(--green-bg);border:1px solid var(--green-b);border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:12px;color:var(--green)';d.innerHTML=`<strong>${file.name}</strong> — ${totalRows} oportunidades importadas em ${new Date().toLocaleTimeString('pt-BR')}`;log.prepend(d)}
      await loadData();
    }catch(err){
      st.textContent='❌ Erro: '+err.message;st.style.color='var(--red)';
      showToast('Erro: '+err.message);
      console.error(err);
    }
  };
  reader.readAsBinaryString(file);
}

// Keep old doUpload for compatibility
async function doUpload(area,input){doUploadMain(input)}

function parsePipeCfg(raw,area,cfg){
  // Find header row
  let hr=-1;
  for(let i=0;i<Math.min(raw.length,6);i++){
    const v=raw[i].map(x=>String(x).trim().toLowerCase());
    if(v.some(x=>x==='ai'||x==='aai'||x.includes('assessor'))){hr=i;break;}
  }
  if(hr<0)return[];
  const h=raw[hr].map(x=>String(x).trim());
  const fi=als=>{for(const a of als){const i=h.findIndex(x=>x.toLowerCase().includes(a.toLowerCase()));if(i>=0)return i;}return -1};
  const ci={
    aai:fi(cfg.aai),cli:fi(['Cliente']),prod:fi(['Produto']),
    pipe:fi(cfg.pipe),atual:fi(cfg.atual||cfg.pipe),
    fonte:fi(['Fonte do $','Fonte']),sc:fi(cfg.sc),pb:fi(cfg.pb),
    data:fi(['DATA DA BOLETA','Data Boleta','data_boleta']),
    todo:fi(cfg.todo),obs:fi(cfg.obs||['Obs']),
    resp:fi(cfg.resp||['Responsável','Responsavel','Resp'])
  };
  const pn=v=>{const s=String(v||0).replace(/[^0-9.,]/g,'').replace(',','.');return parseFloat(s)||0};
  return raw.slice(hr+1).filter(r=>{
    const a=String(r[ci.aai]||'').trim();
    return a&&!['nan','assessor','ai','aai','total',''].includes(a.toLowerCase());
  }).map(r=>({
    area,
    assessor:String(r[ci.aai]||'').trim(),
    cliente:String(r[ci.cli]||'').trim(),
    produto:String(r[ci.prod]||'').trim(),
    pipe:pn(r[ci.pipe]),
    atual:pn(r[ci.atual]),
    fonte:String(r[ci.fonte]||'').trim(),
    sc:String(r[ci.sc]||'').trim(),
    pb:String(r[ci.pb]||'').trim(),
    data_boleta:ci.data>=0&&r[ci.data]&&String(r[ci.data]).trim()!=='nan'?String(r[ci.data]).trim():null,
    todo:String(r[ci.todo]||'').trim(),
    obs:String(r[ci.obs]||'').trim(),
    responsavel:ci.resp>=0?String(r[ci.resp]||'').trim():'',
    historico:[]
  })).filter(r=>r.assessor&&r.cliente);
}

function parsePipe(raw,area){
  const cfg={aai:['assessor','ai','aai'],pipe:['volume acordado','pipe atual','rf pipe','rv pipe','seg pipe','pipe','volume'],atual:['atual'],sc:['status comercial'],pb:['pendencia boleta'],todo:['todo'],obs:['obs']};
  return parsePipeCfg(raw,area,cfg);
}

function toggleAreas(){
  document.getElementById('u-areas-wrap').style.display=document.getElementById('u-perfil').value==='diretor'?'none':'flex';
}

async function saveUser(){
  const nome=document.getElementById('u-nome').value.trim();
  const pin2=document.getElementById('u-pin').value.trim();
  const perfil=document.getElementById('u-perfil').value;
  if(!nome||!pin2||pin2.length!==4||isNaN(pin2)){showToast('Nome e PIN de 4 dígitos obrigatórios!');return}
  const areas=perfil==='diretor'?['inv','cons','seg']:['inv','cons','seg'].filter(a=>document.getElementById('ua-'+a)?.checked);
  try{
    await db('POST','usuarios',{nome,pin:pin2,perfil,areas,ativo:true});
    showToast('✅ Usuário criado!',true);
    closeModal('user');
    USUARIOS=await db('GET','usuarios','','order=nome.asc');
    renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}

async function toggleUser(id,ativo){
  try{await db('PATCH','usuarios',{ativo},`id=eq.${id}`);USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
async function delUser(id){
  if(!confirm('Remover este usuário?'))return;
  try{await db('DELETE','usuarios','',`id=eq.${id}`);USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
