      +'<div class="fnl-chips">'+chips+'</div></div></div>';
  }
  const base=f.geradas;
  const larg=n=>Math.max(n/base*100,2);
  const etapa=(nome,sub,n,cor,pctTxt,key)=>'<div class="fnl-et'+(n&&key?' clic':'')+'"'
    +(n&&key?' onclick="abrirFunilEtapa(\''+key+'\')" title="Ver as '+n+' oportunidades"':'')+'>'
    +'<div class="fnl-nm">'+nome+'<small>'+sub+'</small></div>'
    +'<div class="fnl-trilho"><div class="fnl-barra" style="width:'+larg(n).toFixed(1)+'%;background:'+cor+'"><b>'+n+'</b></div></div>'
    +'<div class="fnl-dir"><b>'+pctTxt+'</b> das geradas</div></div>';
  // o verbo concorda com quantas AVANÇARAM; o complemento, com quantas PARARAM
  const passo=(taxa,avancaram,vSing,vPlur,perda,pSing,pPlur,cor)=>'<div class="fnl-passo"><div></div>'
    +'<div class="fnl-mid"><span class="fnl-seta">↓</span>'
    +'<span class="fnl-taxa" style="color:'+cor+'">'+taxa+'%</span> '+(avancaram===1?vSing:vPlur)
    +(perda>0?'<span class="fnl-perda">· '+perda+' '+(perda===1?pSing:pPlur)+'</span>':'')
    +'</div><div></div></div>';
  const corTaxa=t=>t>=70?'var(--green)':t>=45?'var(--amber)':'var(--red)';
  // a passagem mais fraca é o gargalo do período
  const passagens=[{n:'geradas → ligação',t:f.tLig},{n:'ligação → reunião',t:f.tReu},{n:'reunião → boleta',t:f.tConv}];
  const pior=passagens.reduce((a,b)=>b.t<a.t?b:a);

  return '<div class="fnl">'
    +'<div class="fnl-top">'
    +'<div><div class="fnl-lbl">Efetividade do funil</div>'
    +'<div class="fnl-per">'+f.geradas+(f.geradas===1?' oportunidade':' oportunidades')+' no período</div>'+rec+'</div>'
    +'<div class="fnl-chips">'+chips+'</div></div>'
    +etapa('Geradas','oportunidades criadas',f.geradas,'var(--wine)','100%','geradas')
    +passo(f.tLig,f.comLig,'foi trabalhada','foram trabalhadas',f.pDeLig,'sem nenhum registro','sem nenhum registro',corTaxa(f.tLig))
    +etapa('Ligaram','atividade registrada no card',f.comLig,'#8E4152',(f.geradas?Math.round(f.comLig/f.geradas*100):0)+'%','ligacao')
    +passo(f.tReu,f.comReu,'chegou à reunião','chegaram à reunião',f.pDeReu,'não virou reunião','não viraram reunião',corTaxa(f.tReu))
    +etapa('Fez reunião','encontro já realizado',f.comReu,'#A66070',(f.geradas?Math.round(f.comReu/f.geradas*100):0)+'%','reuniao')
    +passo(f.tConv,f.convN,'converteu','converteram',f.pDeConv,'reunião sem fechamento','reuniões sem fechamento',corTaxa(f.tConv))
    +etapa('Converteram','boletado'+(f.volume?' · '+fmt(f.volume):''),f.convN,'var(--green)',f.pontaAPonta+'%','conv')
    +'<div class="fnl-nota"><strong>Conversão ponta a ponta: '+f.pontaAPonta+'%</strong>'

    +(f.dePlanilha?'<span class="fnl-obs">'+f.dePlanilha+(f.dePlanilha===1?' veio':' vieram')+' de planilha já em estágio adiantado — as etapas anteriores aconteceram fora do sistema.</span>':'')

// ── DETALHE DA ETAPA: quem exatamente está dentro de cada barra ──
// O clique na barra abre a lista com a PROVA de cada linha: a observação
// registrada, o movimento de status ou a data da reunião que fez a
// oportunidade contar naquela etapa. Sem prova visível, o número é fé.
const dataBR=iso=>{if(!iso)return'';const p=String(iso).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''};
function dtKey(s){
  if(!s)return 0;
  const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m)return +new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));
  const d=new Date(s);return isNaN(d)?0:+d;
}
const aspas=t=>'“'+String(t).trim().replace(/\s+/g,' ').slice(0,90)+(String(t).trim().length>90?'…':'')+'”';
function provaEtapa(k,r){
  if(k==='geradas')return{d:dataBR(r.created_at),txt:'criada'+(veioDePlanilha(r)?' · veio de planilha':'')};
  if(k==='conv')return{d:dataBR(r.data_boleta)||dataBR(r.updated_at),txt:'boleta fechada'};
  const mi=marcaInfo(r,k==='ligacao'?'lig':k==='reuniao'?'reu':'');
  if(mi)return{d:mi.data,txt:'✓ confirmado no card',quem:mi.usuario};
  if(k==='ligacao'){
    for(const h of (r.historico||[])){
      if(h.campo==='Observação'&&String(h.para||'').trim())return{d:h.data,txt:'registrou '+aspas(h.para),quem:h.usuario};
      if(h.campo==='Status comercial'){
        if(ETAPA_IDX(h.de)===0&&norm(h.para||'')!==norm(h.de||''))return{d:h.data,txt:'moveu de “'+(h.de||'—')+'” para “'+(h.para||'—')+'”',quem:h.usuario};
        if(ETAPA_IDX(h.para)>=1)return{d:h.data,txt:'avançou para “'+(h.para||'—')+'”',quem:h.usuario};
      }
    }
    if(r.reuniao_data){
      // a reunião marcada prova que houve contato, mas o contato foi QUANDO ele marcou,
      // não na data da reunião. Sem esse registro, a data do toque é desconhecida.
      const hm=[...(r.historico||[])].reverse().find(h=>h.campo==='Reunião marcada');
      return hm?{d:hm.data,txt:'marcou a reunião de '+dataBR(r.reuniao_data),quem:hm.usuario}
               :{d:'',txt:'reunião agendada para '+dataBR(r.reuniao_data)+' — data do contato não registrada'};
    }
    if(isB(r))return{d:dataBR(r.data_boleta),txt:'⚠ inferido: boletada sem registro de contato'};
    return{d:'',txt:'status atual: '+(r.sc||'—')};
  }
  if(r.reuniao_data&&r.reuniao_data.slice(0,10)<today())return{d:dataBR(r.reuniao_data),txt:'reunião na agenda, data já passou'};
  const h=(r.historico||[]).find(x=>x.campo==='Status comercial'&&ETAPA_IDX(x.de)>=2);
  if(h)return{d:h.data,txt:'saiu de “'+h.de+'” para “'+(h.para||'—')+'”',quem:h.usuario};
  if(ETAPA_IDX(r.sc)>=3)return{d:'',txt:'status atual: '+(r.sc||'—')};
  return{d:dataBR(r.data_boleta),txt:'⚠ inferido: boletada sem registro de reunião'};
}
const ETAPA_DET={
  geradas:{ico:'📋',t:'Oportunidades geradas',sub:'tudo que entrou no período',cor:'var(--wine)',bg:'var(--wine-l)',fn:()=>true,col:'Criada em'},
  ligacao:{ico:'📞',t:'Ligações que aconteceram',sub:'oportunidades com atividade registrada pelo time',cor:'#8E4152',bg:'var(--wine-ll)',fn:r=>teveLigacao(r),col:'Primeiro toque'},
  reuniao:{ico:'🤝',t:'Fez reunião',sub:'encontros já realizados — agendadas para frente não entram',cor:'#A66070',bg:'var(--wine-ll)',fn:r=>teveReuniao(r),col:'Reunião'},

function abrirBoletasArea(ak){
  const a=AREAS[ak]||{name:ak,color:'var(--wine)'};
  const rows=OPPS.filter(r=>r.area===ak);
  const fechadas=rows.filter(isBoletadoFirmado).sort((x,y)=>(y.atual||0)-(x.atual||0));
  const aBoletar=rows.filter(isABoletar).sort((x,y)=>(y.atual||y.pipe||0)-(x.atual||x.pipe||0));
  // mesma regra da caixa "Topadas" do card: topou, ainda não fechou e não foi perdida
  const topadas=rows.filter(r=>!isB(r)&&!isPerdida(r)&&norm(r.sc||'').includes('topou'))
    .sort((x,y)=>(y.atual||y.pipe||0)-(x.atual||x.pipe||0));

  const tabela=(lista,valorDe)=>{
    if(!lista.length)return '<div class="ba-vazio">Nenhuma por aqui.</div>';
    return '<div style="overflow-x:auto"><table class="ba-tbl">'
      +'<thead><tr><th>Cliente</th><th>Produto</th><th>Assessor</th><th>Responsável</th><th class="r">Volume</th></tr></thead><tbody>'
      +lista.map(r=>'<tr onclick="closeModal(\'area\');openEdit(\''+r.id+'\')" title="Abrir oportunidade">'
        +'<td style="font-weight:700">'+(r.cliente||'—')+'</td>'
        +'<td style="color:var(--muted)">'+(r.produto||'—')+'</td>'
        +'<td style="color:var(--muted)">'+(r.assessor||'—')+'</td>'
        +'<td style="color:var(--muted)">'+(r.responsavel||'—')+'</td>'
        +'<td class="r val">'+(fmt(valorDe(r))||'—')+'</td></tr>').join('')
      +'</tbody></table></div>';
  };
  const secao=(ico,titulo,lista,valorDe,cor,bg)=>{
    const tot=lista.reduce((s2,r)=>s2+(valorDe(r)||0),0);
    return '<div class="ba-sec" style="--bc:'+cor+';--bbg:'+bg+'">'
      +'<div class="ba-hdr"><span class="t">'+ico+' '+titulo+'</span>'
      +'<span class="n">'+lista.length+'</span>'
      +'<span class="v">'+(fmt(tot)||'—')+'</span></div>'
      +tabela(lista,valorDe)+'</div>';
  };

  const vFechado=r=>r.atual||0;
  const vAberto=r=>r.atual||r.pipe||0;
  const totFechado=fechadas.reduce((s2,r)=>s2+vFechado(r),0);
  const totTopadas=topadas.reduce((s2,r)=>s2+vAberto(r),0);

  document.getElementById('ba-title').innerHTML='📋 '+a.name
    +' <span style="font-size:11px;font-weight:600;color:var(--muted)">· boletas fechadas e topadas</span>';
  document.getElementById('ba-body').innerHTML=
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">'
    +'<div style="flex:1;min-width:150px;background:var(--green-bg);border:1px solid var(--green-b);border-radius:8px;padding:10px 13px">'
    +'<div style="font-size:9.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.04em">Já fechado</div>'
    +'<div style="font-size:20px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">'+(fmt(totFechado)||'R$0')+'</div>'
    +'<div style="font-size:10px;color:var(--green)">'+fechadas.length+' boleta'+(fechadas.length!==1?'s':'')+'</div></div>'
    +'<div style="flex:1;min-width:150px;background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:8px;padding:10px 13px">'
    +'<div style="font-size:9.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.04em">Topadas p/ fechar</div>'
    +'<div style="font-size:20px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums">'+(fmt(totTopadas)||'R$0')+'</div>'
    +'<div style="font-size:10px;color:var(--amber)">'+topadas.length+' oportunidade'+(topadas.length!==1?'s':'')+'</div></div>'
    +'<div style="flex:1;min-width:150px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 13px">'
    +'<div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Projeção</div>'
    +'<div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums">'+(fmt(totFechado+totTopadas)||'R$0')+'</div>'
    +'<div style="font-size:10px;color:var(--muted)">fechado + topadas</div></div>'
    +'</div>'
    +secao('✅','Boletas fechadas',fechadas,vFechado,'var(--green)','var(--green-bg)')
    +(aBoletar.length?secao('⏳','A boletar — fechou, falta processar',aBoletar,vAberto,'var(--amber)','var(--amber-bg)'):'')
    +secao('🤝','Topadas — para fechar',topadas,vAberto,'var(--amber)','var(--amber-bg)')
    +'<div style="font-size:10px;color:var(--muted-l);margin-top:4px">Clique em qualquer linha para abrir a oportunidade.</div>';
  document.getElementById('modal-area').style.display='flex';
}

// ── GERENCIAL DO ASSESSOR: meta acordada × pipe levantado × realizado ──
// ══════════════════════════════════════════════════════════
// Meta × levantado × realizado por segmento — usado no card do assessor e no modal gerencial
function segmentosDoAssessor(nome){
  const minhas=OPPS.filter(r=>assDe(r)===nome);
  const segs=SEGMENTOS_ACORDO.map(seg=>{
    const rows=minhas.filter(r=>segmentoDaOpp(r)===seg);
    const meta=acordoDe(nome,seg);
    const levantado=rows.reduce((s,r)=>s+(r.pipe||r.atual||0),0);
    const realizado=rows.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
    const aBoletar=rows.filter(isABoletar).reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pct=meta>0?Math.round(realizado/meta*100):null;
    let st;
    if(meta<=0)st={k:'semacordo',txt:'sem acordo',cor:'var(--muted)',bg:'var(--surf3)'};
    else if(realizado>=meta)st={k:'batida',txt:'meta batida',cor:'var(--green)',bg:'var(--green-bg)'};
    else if(levantado<meta)st={k:'semlastro',txt:'pipe não cobre',cor:'var(--amber)',bg:'var(--amber-bg)'};
    else st={k:'converter',txt:'falta converter',cor:'var(--blue)',bg:'var(--blue-bg)'};
    return{seg,rows,meta,levantado,realizado,aBoletar,pct,st};
  }).filter(x=>x.meta>0||x.rows.length);
  const semSeg=minhas.filter(r=>!segmentoDaOpp(r));
  return{segs,semSeg,minhas};
}
// valor curto pra caber no card: "300k", "1.2M"
const fmtC=v=>{if(!v||isNaN(v))return'—';if(v>=1e6)return(v/1e6).toFixed(1).replace('.0','')+'M';if(v>=1e3)return Math.round(v/1e3)+'k';return String(Math.round(v))};

// bloco compacto de metas que aparece na cara do card do assessor
function metasCardHtml(nome){
  const {segs}=segmentosDoAssessor(nome);
  const comAcordo=segs.filter(x=>x.meta>0);
  if(!comAcordo.length){
    return '<div style="font-size:10px;color:var(--muted-l);padding:6px 0 2px">Sem acordo definido — configure na aba Acordos por AI</div>';
  }
  const tMeta=comAcordo.reduce((s,x)=>s+x.meta,0);
  const tReal=comAcordo.reduce((s,x)=>s+x.realizado,0);
  const tLev=comAcordo.reduce((s,x)=>s+x.levantado,0);
  const tPct=tMeta>0?Math.round(tReal/tMeta*100):0;
  return '<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px">'
    +'<span style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Meta × levantado</span>'
    +'<span style="font-size:10px;color:var(--muted)">🎯'+fmtC(tMeta)+' · 📥'+fmtC(tLev)+' · <strong style="color:'+(tPct>=100?'var(--green)':tPct>=60?'var(--amber)':'var(--red)')+'">'+tPct+'%</strong></span>'
    +'</div>'
    +comAcordo.map(x=>{
      const base=Math.max(x.meta,x.levantado,1);
      const wLev=Math.min(x.levantado/base*100,100);
      const wReal=Math.min(x.realizado/base*100,100);
      const posMeta=Math.min(x.meta/base*100,100);
      return '<div style="margin-bottom:7px">'
        +'<div style="display:flex;align-items:baseline;gap:6px">'
        +'<span style="font-size:10.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+x.seg+'</span>'
        +'<span style="font-size:9px;font-weight:700;border-radius:4px;padding:1px 6px;background:'+x.st.bg+';color:'+x.st.cor+';white-space:nowrap">'+x.st.txt+'</span>'
        +'</div>'
        +'<div style="position:relative;height:11px;background:var(--border);border-radius:3px;margin-top:3px">'
        +'<div style="position:absolute;left:0;top:0;height:11px;width:'+wLev.toFixed(1)+'%;background:var(--blue-b);border-radius:3px"></div>'
        +'<div style="position:absolute;left:0;top:0;height:11px;width:'+wReal.toFixed(1)+'%;background:'+x.st.cor+';border-radius:3px"></div>'
        +'<div title="meta '+fmt(x.meta)+'" style="position:absolute;top:-2px;left:calc('+posMeta.toFixed(1)+'% - 1px);width:2px;height:15px;background:var(--text);border-radius:1px"></div>'
        +'</div>'
        +'<div style="font-size:9px;color:var(--muted);margin-top:2px">🎯'+fmtC(x.meta)+' · 📥'+fmtC(x.levantado)+' · ✅'+fmtC(x.realizado)
        +(x.aBoletar?' · <span style="color:var(--amber)">⏳'+fmtC(x.aBoletar)+'</span>':'')
        +' · '+x.rows.length+' opor.</div>'
        +'</div>';
    }).join('');
}

window._gerOpen=window._gerOpen||new Set();
function toggleGerSeg(i){
  const el=document.getElementById('gerseg-'+i);
  if(!el)return;
  const k=String(i);
  if(window._gerOpen.has(k)){window._gerOpen.delete(k);el.classList.remove('open');}
  else{window._gerOpen.add(k);el.classList.add('open');}
}
function abrirGerencial(nome){
  window._gerAss=nome;
  window._gerOpen=new Set();
  const {segs,semSeg,minhas}=segmentosDoAssessor(nome);
  const tMeta=segs.reduce((s,x)=>s+x.meta,0);
  const tLev=segs.reduce((s,x)=>s+x.levantado,0)+semSeg.reduce((s,r)=>s+(r.pipe||r.atual||0),0);
  const tReal=segs.reduce((s,x)=>s+x.realizado,0)+semSeg.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
  const tPct=tMeta>0?Math.round(tReal/tMeta*100):0;
  const cobertura=tMeta>0?Math.round(tLev/tMeta*100):0;

  const kpi=(l,v,s,cor)=>'<div class="ger-kpi" style="--kc:'+cor+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';
  const falta=Math.max(tMeta-tReal,0);

  const cabecalho='<div class="ger-kpis">'
    +kpi('Meta acordada',fmt(tMeta)||'—',tMeta?'somando os segmentos':'nenhum acordo definido','var(--wine)')
    +kpi('Levantado',fmt(tLev)||'—',tMeta?cobertura+'% da meta em pipe':minhas.length+' oportunidades','var(--blue)')
    +kpi('Realizado',fmt(tReal)||'—',tMeta?tPct+'% da meta':'boletado','var(--green)')
    +kpi(falta?'Falta':'Meta batida',falta?fmt(falta):'—',falta?'para bater a meta':'parabéns!',falta?'var(--amber)':'var(--green)')
    +'</div>'
    +(tMeta&&tLev<tMeta
      ?'<div style="background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:6px;padding:9px 12px;font-size:11.5px;color:var(--amber);font-weight:600;margin-bottom:16px">'
        +'⚠️ O pipe levantado ('+fmt(tLev)+') não cobre a meta ('+fmt(tMeta)+'). Antes de cobrar conversão, falta originação: precisa levantar mais '+fmt(tMeta-tLev)+'.</div>'
      :'');

  const blocos=segs.map((x,i)=>{
    const base=Math.max(x.meta,x.levantado,1);
    const wLev=Math.min(x.levantado/base*100,100);
    const wReal=Math.min(x.realizado/base*100,100);
    const posMeta=x.meta>0?Math.min(x.meta/base*100,100):null;
    const pctMeta=x.pct;
    const cor=x.st.cor;
    const cobre=x.st.k==='semlastro';
    const opps=[...x.rows].sort((a,b)=>(b.pipe||b.atual||0)-(a.pipe||a.atual||0));
    return '<div class="ger-seg" id="gerseg-'+i+'">'
      +'<div class="ger-seg-h" onclick="toggleGerSeg('+i+')">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span class="ger-seg-nm">'+x.seg+'</span>'
      +'<span class="ger-seg-n">'+x.rows.length+' opor.</span>'
      +(pctMeta!==null?'<span class="ger-chip" style="background:var(--surf3);color:'+cor+'">'+pctMeta+'% da meta</span>':'<span class="ger-chip" style="background:var(--surf3);color:var(--muted)">sem acordo</span>')
      +(cobre?'<span class="ger-chip" style="background:var(--amber-bg);color:var(--amber)">pipe não cobre</span>':'')
      +'<span style="font-size:11px;color:var(--muted)">⌄</span>'
      +'</div>'
      +'<div class="ger-barra">'
      +'<div class="ger-lev" style="width:'+wLev.toFixed(1)+'%"></div>'
      +'<div class="ger-real" style="width:'+wReal.toFixed(1)+'%;background:'+cor+'"></div>'
      +(posMeta!==null?'<div class="ger-meta-marca" style="left:calc('+posMeta.toFixed(1)+'% - 1px)" title="meta acordada: '+fmt(x.meta)+'"></div>':'')
      +'</div>'
      +'<div class="ger-legenda">'
      +'<span>🎯 meta <b>'+(fmt(x.meta)||'—')+'</b></span>'
      +'<span>📥 levantado <b>'+(fmt(x.levantado)||'—')+'</b></span>'

          +'<span class="ger-opp-v" style="color:'+c+'">'+(fmt(fechada?r.atual:(r.pipe||r.atual))||'—')+'</span>'
          +'<button class="btn sm" style="flex-shrink:0;padding:2px 8px" onclick="event.stopPropagation();closeModal(\'gerencial\');openEdit(\''+r.id+'\')">abrir</button>'

    :'';

  document.getElementById('ger-title').innerHTML='📊 '+nome+' <span style="font-size:11px;font-weight:600;color:var(--muted)">· gerencial da meta</span>';
  const legendaBarra=segs.length
    ?'<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:8px;align-items:center">'

  const a=acordosDoMes().find(m=>norm(m.assessor)===norm(nome)&&norm(m.produto||'')===norm(seg));
  return a?(a.meta_valor||0):0;
}

// soma as colunas e compara com a meta da casa, ao vivo enquanto digita
function recalcAcordos(){
  const ass=window._acordoAss||[];
  if(!document.getElementById('acsumtot'))return;
  const somaCol=SEGMENTOS_ACORDO.map(()=>0);
  let somaGeral=0,invN=0;
  ass.forEach((nome,i)=>{
    let totLinha=0;
    SEGMENTOS_ACORDO.forEach((seg,j)=>{
      const el=document.getElementById('ac-'+i+'-'+j);
      const v=el?parseMoeda(el.value):0;
      somaCol[j]+=v;totLinha+=v;
    });
    somaGeral+=totLinha;
    const cb=document.getElementById('acinv-'+i);
    if(cb&&cb.checked)invN++;
    const td=document.getElementById('actot-'+i);
    if(td)td.textContent=totLinha?fmtMoedaBR(totLinha):'';
  });
  const inv=document.getElementById('acinvtot');
  if(inv)inv.textContent=invN+' / '+ass.length;
  let metaGeral=0;
  SEGMENTOS_ACORDO.forEach((seg,j)=>{
    const sc=document.getElementById('acsum-'+j);
    if(sc)sc.textContent=somaCol[j]?fmtMoedaBR(somaCol[j]):'—';
    const mEl=document.getElementById('acmeta-'+j);
    const meta=mEl?parseMoeda(mEl.value):0;
    metaGeral+=meta;
    const dEl=document.getElementById('acdelta-'+j);
    if(dEl){
      if(!meta){dEl.innerHTML='<span style="color:var(--muted-l)">—</span>';}
      else{
        const d=somaCol[j]-meta;
        const cor=d>=0?'var(--green)':'var(--red)';
        dEl.innerHTML='<span style="color:'+cor+'">'+(d>=0?'+':'−')+fmtMoedaBR(Math.abs(d))+'</span>'
          +'<span class="ac-delta" style="color:'+cor+'">'+(d>=0?'acima da meta':'falta acordar')+'</span>';
      }
    }
  });
  const st=document.getElementById('acsumtot');if(st)st.textContent=somaGeral?fmtMoedaBR(somaGeral):'—';
  const mt=document.getElementById('acmetatot');if(mt)mt.textContent=metaGeral?fmtMoedaBR(metaGeral):'—';
  const dt=document.getElementById('acdeltatot');
  if(dt){
    if(!metaGeral)dt.innerHTML='<span style="color:var(--muted-l)">—</span>';
    else{const d=somaGeral-metaGeral;const cor=d>=0?'var(--green)':'var(--red)';
      dt.innerHTML='<span style="color:'+cor+'">'+(d>=0?'+':'−')+fmtMoedaBR(Math.abs(d))+'</span>';}
  }
}

async function salvarAcordos(){
  if(USER.perfil!=='diretor'){showToast('Só o diretor pode alterar os acordos.');return}
  const btn=document.getElementById('btn-salvar-acordos');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    const mes=new Date().toISOString().slice(0,7);
    const existentes=new Map();
    acordosDoMes().forEach(m=>existentes.set(norm(m.assessor)+'|'+norm(m.produto||''),m));

    // estado desejado a partir do que está na tela
    const desejado=[];
    (window._acordoAss||[]).forEach((nome,i)=>{
      SEGMENTOS_ACORDO.forEach((seg,j)=>{
        const el=document.getElementById('ac-'+i+'-'+j);
        desejado.push({assessor:nome,produto:seg,valor:el?parseMoeda(el.value):0});
      });
      const cb=document.getElementById('acinv-'+i);
      desejado.push({assessor:nome,produto:SEG_INVESTOR,valor:(cb&&cb.checked)?1:0});
    });
    SEGMENTOS_ACORDO.forEach((seg,j)=>{
      const el=document.getElementById('acmeta-'+j);
      desejado.push({assessor:LINHA_CASA,produto:seg,valor:el?parseMoeda(el.value):0});
    });

    const novos=[],patches=[],apagar=[];
    desejado.forEach(d=>{
      const k=norm(d.assessor)+'|'+norm(d.produto);
      const ex=existentes.get(k);
      if(ex){
        if((ex.meta_valor||0)!==d.valor){
          if(d.valor===0)apagar.push(ex.id);
          else patches.push({id:ex.id,valor:d.valor});
        }
      }else if(d.valor!==0){
        novos.push({mes,assessor:d.assessor,area:AREA_ACORDO,produto:d.produto,meta_valor:d.valor});
      }
    });

    if(novos.length)await db('POST','metas',novos);
    for(const p of patches)await db('PATCH','metas',{meta_valor:p.valor},'id=eq.'+p.id);
    for(const id of apagar)await db('DELETE','metas','','id=eq.'+id);

    const mexidos=novos.length+patches.length+apagar.length;
    showToast(mexidos?'✓ Acordos salvos ('+mexidos+' alteraç'+(mexidos>1?'ões':'ão')+')':'Nada mudou.',true);
    await loadData();
    renderCurView();
  }catch(e){
    showToast('Erro ao salvar: '+(e.message||e));
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar acordos';}
  }
}

async function saveMeta(){

  const area=document.getElementById('m-area').value;

  const mes=new Date().toISOString().slice(0,7);

async function doUploadMain(input){
  const file=input.files[0];if(!file)return;input.value='';
  const st=document.getElementById('us-main');
  const uc=document.getElementById('uc-main');
  st.textContent='⏳ Lendo planilha...';st.style.color='var(--muted)';

  const SHEET_MAP={
    'rv':'inv','RV':'inv','Rv':'inv',
    'rf':'inv','RF':'inv','Rf':'inv',
    'Consórcio':'cons','Consorcio':'cons','CONSÓRCIO':'cons','CONSORCIO':'cons',
    'Seguro de Vida':'seg','SEGURO DE VIDA':'seg','Seguro':'seg','SEG':'seg'
  };

  const SHEET_CFG={
    rv:{area:'inv',aai:['AAI','AI'],pipe:['RV Pipe','Valor'],atual:['RV Atual','Valor'],sc:['Status Comercial','Status Comercial RV'],pb:['Pendencia Boleta','Pendencia Boleta RV'],todo:['ToDo','TO DO'],obs:['Obs']},
    rf:{area:'inv',aai:['AI','AAI'],pipe:['RF Pipe','Valor'],atual:['RF Atual','Valor'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['Obs']},
    cons:{area:'cons',aai:['AI','AAI'],pipe:['Pipe Atual','Carta','Valor'],atual:['Pipe Atual','Valor'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo','OBS'],obs:['OBS']},
    seg:{area:'seg',aai:['AI','AAI'],pipe:['Seg Pipe','Valor'],atual:['Seg atual','Seg Atual','Valor'],sc:['Status Comercial RF','Status Comercial'],pb:['Pendencia Boleta RF','Pendencia Boleta'],todo:['ToDo'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp','Dono']}
  };

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const results={inv:{rows:[],new:0,upd:0},cons:{rows:[],new:0,upd:0},seg:{rows:[],new:0,upd:0}};

      // Process each relevant sheet
      for(const sname of wb.SheetNames){
        let cfgKey=null;
        const sl=sname.toLowerCase().trim();
        if(sl==='rv')cfgKey='rv';
        else if(sl==='rf')cfgKey='rf';
        else if(sl.includes('cons'))cfgKey='cons';
        else if(sl.includes('seguro')||sl.includes('seg vida')||sl==='seg')cfgKey='seg';
        if(!cfgKey)continue;

        const cfg=SHEET_CFG[cfgKey];
        const raw=XLSX.utils.sheet_to_json(wb.Sheets[sname],{header:1,defval:''});
        const rows=parsePipeCfg(raw,cfg.area,cfg);
        results[cfg.area].rows=[...results[cfg.area].rows,...rows];
      }

      const nadaReconhecido=Object.values(results).every(res=>!res.rows.length);
      if(nadaReconhecido){
        st.textContent='⚠️ Nenhuma aba reconhecida (esperado: RV, RF, Consórcio, Seguro de Vida). A planilha tem: '+wb.SheetNames.join(', ')+'. 👉 Use os cards de área única abaixo!';
        st.style.color='var(--red)';
        return;
      }
      let totalNew=0,totalUpd=0,totalRows=0;
      for(const[area,res]of Object.entries(results)){
        if(!res.rows.length)continue;
        const existing=OPPS.filter(r=>r.area===area);
        const toInsert=[],toUpdate=[];
        let skipped=0;
        res.rows.forEach(nr=>{
          const ex=existing.find(e=>norm(e.assessor)===norm(nr.assessor)&&norm(e.cliente)===norm(nr.cliente)&&norm(e.produto||'')===norm(nr.produto||''));
          // Boletas antigas da planilha NÃO entram como novas (histórico de meses anteriores).
          // Boletas do mês devem ser marcadas dentro do sistema.
          // boletadas da planilha entram normalmente (regra removida a pedido do diretor)
          if(ex){
            // MERGE DIÁRIO: preserva o trabalho do time no sistema.
            // Só atualiza pipe (volume). Campos vazios no sistema são preenchidos pela planilha.
            const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
            if(!ex.sc&&nr.sc)upd.sc=nr.sc;
            if(!ex.pb&&nr.pb){upd.pb=nr.pb;if(pbFechada(nr.pb)&&!pbFechada(ex.pb)){const iso2=parseDataBoleta(nr.data_boleta);const dbr2=iso2?iso2.split('-').reverse().join('/'):new Date().toLocaleDateString('pt-BR');upd.historico=[...(ex.historico||[]),{campo:'Pendência boleta',de:ex.pb||'',para:nr.pb,usuario:(USER?USER.nome:'')+' (planilha)',data:dbr2}];}}
            if(nr.todo&&limpaTraco(nr.todo)&&nr.todo!==ex.todo)upd.todo=nr.todo;else if(!ex.todo&&nr.todo)upd.todo=nr.todo;if('todo' in upd){const hhT=upd.historico||[...(ex.historico||[])];hhT.push({campo:'TODO',de:ex.todo||'',para:upd.todo,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhT;}
            if(nr.obs&&limpaTraco(nr.obs)&&nr.obs!==ex.obs)upd.obs=nr.obs;else if(!ex.obs&&nr.obs)upd.obs=nr.obs;if('obs' in upd){const hhO=upd.historico||[...(ex.historico||[])];hhO.push({campo:'Observação',de:ex.obs||'',para:upd.obs,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhO;}
            if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
            if(nr.responsavel)upd.responsavel=nr.responsavel;
            toUpdate.push(upd);
          }
          else toInsert.push(nr);
        });
        if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
        for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,`id=eq.${id}`);}
        res.new=toInsert.length;res.upd=toUpdate.length;
        totalNew+=toInsert.length;totalUpd+=toUpdate.length;totalRows+=res.rows.length;
      }

      uc.classList.add('done');
      st.textContent=`✅ ${totalNew+totalUpd} processadas (${totalNew} novas · ${totalUpd} atualizadas)${totalRows-totalNew-totalUpd>0?' · '+(totalRows-totalNew-totalUpd)+' boletas antigas ignoradas':''}`;
      st.style.color='var(--green)';

      // Show per-area results
      const resEl=document.getElementById('upload-results');
      if(resEl){
        resEl.style.display='grid';
        resEl.innerHTML=Object.entries(results).map(([ak,res])=>res.rows.length?`
          <div style="background:var(--green-bg);border:1px solid var(--green-b);border-radius:6px;padding:12px 14px">
            <div style="font-weight:700;color:${AREAS[ak].color};margin-bottom:4px">${AREAS[ak].name}</div>
            <div style="font-size:13px;font-weight:700;color:var(--green)">${res.rows.length} oportunidades</div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px">${res.new} novas · ${res.upd} atualizadas</div>
          </div>`:'').join('');
      }

      showToast(`✅ ${totalRows} oportunidades importadas!`,true);
      const log=document.getElementById('upload-log');
      if(log){const d=document.createElement('div');d.style.cssText='background:var(--green-bg);border:1px solid var(--green-b);border-radius:4px;padding:10px 14px;margin-bottom:8px;font-size:12px;color:var(--green)';d.innerHTML=`<strong>${file.name}</strong> — ${totalRows} oportunidades importadas em ${new Date().toLocaleTimeString('pt-BR')}`;log.prepend(d)}
      await loadData();
    }catch(err){
      st.textContent='❌ Erro: '+err.message;st.style.color='var(--red)';
      showToast('Erro: '+err.message);
      console.error(err);
    }
  };
  reader.readAsBinaryString(file);
}

function exportarOpps(){
  const isDir=USER.perfil==='diretor';
  const isGest=USER.perfil==='gestor';
  let rows=isDir?[...OPPS]
    :isGest?OPPS.filter(r=>(USER.areas||[]).length?(USER.areas||[]).includes(r.area):true)
    :OPPS.filter(r=>{
      if(norm(r.assessor)===norm(USER.nome))return true;
      if(!(USER.areas||[]).includes(r.area))return false;
      if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
      return true;
    });
  if(!rows.length){showToast('Nada para exportar no seu alcance');return}
  const br=iso=>iso&&/^\d{4}-\d{2}-\d{2}/.test(String(iso))?String(iso).slice(0,10).split('-').reverse().join('/'):(iso||'');
  const brDT=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
  const dados=[['Área','Segmento','Cliente','AI','Produto','Valor Pipe','Valor Atual','STATUS COMERCIAL','PENDENCIA BOLETA','Data Boleta','ToDo','Data ToDo','Reunião','Responsável','OBS','Escalada para','Motivo escala','Criada em','Atualizada em','Linha do tempo']];

    const seg=(SUBAREAS[subAreaOf(r)]||{}).name||'';
    const lt=(r.historico||[]).map(h=>(h.data||'')+' · '+(h.campo||'')+': '+(h.de?h.de+' → ':'')+(h.para||'')+(h.usuario?' ('+h.usuario+')':'')).join('  •  ');
    dados.push([(AREAS[r.area]||{}).name||r.area,seg,r.cliente||'',r.assessor||'',r.produto||'',r.pipe||0,r.atual||0,r.sc||'',r.pb||'',br(r.data_boleta),r.todo||'',br(r.todo_data),br(r.reuniao_data),r.responsavel||'',r.obs||'',r.escalado_para||'',r.escala_motivo||'',brDT(r.created_at),brDT(r.updated_at),lt]);
  });
  const ws=XLSX.utils.aoa_to_sheet(dados);
  ws['!cols']=[{wch:12},{wch:14},{wch:26},{wch:26},{wch:22},{wch:12},{wch:12},{wch:20},{wch:20},{wch:11},{wch:26},{wch:11},{wch:11},{wch:16},{wch:32},{wch:14},{wch:20},{wch:16},{wch:16},{wch:60}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Oportunidades');
  XLSX.writeFile(wb,'oportunidades-completo-'+new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')+'.xlsx');
  showToast('✅ '+rows.length+' oportunidades exportadas com tudo dentro!',true);
}

// Upload de UMA área só — lê a primeira aba, qualquer nome
async function doUploadArea(cfgKey,input){
  const file=input.files[0];if(!file)return;input.value='';
  const st=document.getElementById('usa-'+cfgKey);
  const uc=document.getElementById('uca-'+cfgKey);
  st.textContent='⏳ Lendo...';st.style.color='var(--muted)';

  const SHEET_CFG={
    rv:{area:'inv',aai:['AAI','AI'],pipe:['RV Pipe','Pipe','Valor'],atual:['RV Atual','Atual','Valor'],sc:['Status Comercial','Status'],pb:['Pendencia Boleta','Pendencia'],todo:['ToDo','TO DO'],obs:['Obs'],resp:['Responsável','Responsavel','Resp']},
    rf:{area:'inv',aai:['AI','AAI'],pipe:['RF Pipe','Pipe','Valor'],atual:['RF Atual','Atual','Valor'],sc:['Status Comercial RF','Status Comercial','Status'],pb:['Pendencia Boleta RF','Pendencia Boleta','Pendencia'],todo:['ToDo'],obs:['Obs'],resp:['Responsável','Responsavel','Resp']},
    cons:{area:'cons',aai:['AI','AAI'],pipe:['Pipe Atual','Carta','Pipe','Valor'],atual:['Pipe Atual','Atual','Valor'],sc:['Status Comercial RF','Status Comercial','Status'],pb:['Pendencia Boleta RF','Pendencia Boleta','Pendencia'],todo:['ToDo','OBS'],obs:['OBS'],resp:['Responsável','Responsavel','Resp']},
    seg:{area:'seg',aai:['AI','AAI'],pipe:['Seg Pipe','Pipe','Valor'],atual:['Seg atual','Seg Atual','Atual','Valor'],sc:['Status Comercial RF','Status Comercial','Status'],pb:['Pendencia Boleta RF','Pendencia Boleta','Pendencia'],todo:['ToDo'],obs:['OBS','Obs'],resp:['Responsável','Responsavel','Resp']}
  };
  const cfg=SHEET_CFG[cfgKey];

  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const rows=parsePipeCfg(raw,cfg.area,cfg);
      if(!rows.length){st.textContent='⚠️ Nenhuma linha reconhecida';st.style.color='var(--red)';return;}
      if(USER&&USER.perfil!=='diretor')rows.forEach(r=>{if(!r.responsavel)r.responsavel=USER.nome;});
      st.textContent='⏳ Processando '+rows.length+'...';

      const existing=OPPS.filter(r=>r.area===cfg.area);
      const toInsert=[],toUpdate=[];let skipped=0;
      rows.forEach(nr=>{
        const ex=existing.find(x=>norm(x.assessor)===norm(nr.assessor)&&norm(x.cliente)===norm(nr.cliente)&&norm(x.produto||'')===norm(nr.produto||''));
        // boletadas da planilha entram normalmente (regra removida a pedido do diretor)
        if(ex){
          const upd={id:ex.id,pipe:nr.pipe,updated_at:new Date().toISOString()};
          if(!ex.sc&&nr.sc)upd.sc=nr.sc;
          if(!ex.pb&&nr.pb){upd.pb=nr.pb;if(pbFechada(nr.pb)&&!pbFechada(ex.pb)){const iso2=parseDataBoleta(nr.data_boleta);const dbr2=iso2?iso2.split('-').reverse().join('/'):new Date().toLocaleDateString('pt-BR');upd.historico=[...(ex.historico||[]),{campo:'Pendência boleta',de:ex.pb||'',para:nr.pb,usuario:(USER?USER.nome:'')+' (planilha)',data:dbr2}];}}
          if(nr.todo&&limpaTraco(nr.todo)&&nr.todo!==ex.todo)upd.todo=nr.todo;else if(!ex.todo&&nr.todo)upd.todo=nr.todo;if('todo' in upd){const hhT=upd.historico||[...(ex.historico||[])];hhT.push({campo:'TODO',de:ex.todo||'',para:upd.todo,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhT;}
          if(nr.obs&&limpaTraco(nr.obs)&&nr.obs!==ex.obs)upd.obs=nr.obs;else if(!ex.obs&&nr.obs)upd.obs=nr.obs;if('obs' in upd){const hhO=upd.historico||[...(ex.historico||[])];hhO.push({campo:'Observação',de:ex.obs||'',para:upd.obs,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});upd.historico=hhO;}
          if((!ex.atual||ex.atual===0)&&nr.atual)upd.atual=nr.atual;
          if(nr.responsavel)upd.responsavel=nr.responsavel;
          toUpdate.push(upd);
        }else toInsert.push(nr);
      });
      if(toInsert.length){for(let i=0;i<toInsert.length;i+=50)await db('POST','oportunidades',toInsert.slice(i,i+50));}
      for(const u of toUpdate){const{id,...fields}=u;await db('PATCH','oportunidades',fields,'id=eq.'+id);}

      uc.classList.add('done');
      st.textContent='✅ '+toInsert.length+' novas · '+toUpdate.length+' atualizadas'+(skipped?' · '+skipped+' boletas antigas ignoradas':'');
      st.style.color='var(--green)';
      showToast('✅ Área importada!',true);
      await loadData();
    }catch(err){st.textContent='❌ '+err.message.substring(0,60);st.style.color='var(--red)';}
  };
  reader.readAsBinaryString(file);
}

function limpaTraco(v){return ['-','--','—','.','n/a','na'].includes(String(v).toLowerCase())?'':v}
function parsePipeCfg(raw,area,cfg){
  // Find header row
  let hr=-1;
  for(let i=0;i<Math.min(raw.length,6);i++){
    const v=raw[i].map(x=>String(x).trim().toLowerCase());
    if(v.some(x=>x==='ai'||x==='aai'||x.includes('assessor'))){hr=i;break;}
  }
  if(hr<0)return[];
  const h=raw[hr].map(x=>String(x).trim());
  const fi=als=>{for(const a of als){const i=h.findIndex(x=>x.toLowerCase().includes(a.toLowerCase()));if(i>=0)return i;}return -1};
  const ci={
    aai:fi(cfg.aai),cli:fi(['Cliente']),prod:fi(['Produto']),
    pipe:fi(cfg.pipe),atual:fi(cfg.atual||cfg.pipe),
    fonte:fi(['Fonte do $','Fonte']),sc:fi(cfg.sc),pb:fi(cfg.pb),
    data:fi(['DATA DA BOLETA','Data Boleta','data_boleta']),
    todo:fi(cfg.todo),obs:fi(cfg.obs||['Obs']),
    resp:fi(cfg.resp||['Responsável','Responsavel','Resp'])
  };
  const pn=v=>{const s=String(v||0).replace(/[^0-9.,]/g,'').replace(',','.');return parseFloat(s)||0};
  return raw.slice(hr+1).filter(r=>{
    const a=String(r[ci.aai]||'').trim();
    return a&&!['nan','assessor','ai','aai','total',''].includes(a.toLowerCase());
  }).map(r=>({
    area,
    assessor:String(r[ci.aai]||'').trim(),
    cliente:String(r[ci.cli]||'').trim(),
    produto:area==='cons'?'ALAVANCAGEM FINANCEIRA/PAT':String(r[ci.prod]||'').trim(),
    pipe:pn(r[ci.pipe]),
    atual:pn(r[ci.atual]),
    fonte:String(r[ci.fonte]||'').trim(),
    sc:String(r[ci.sc]||'').trim(),
    pb:String(r[ci.pb]||'').trim(),
    data_boleta:ci.data>=0&&r[ci.data]&&String(r[ci.data]).trim()!=='nan'?String(r[ci.data]).trim():null,
    todo:limpaTraco(String(r[ci.todo]||'').trim()),
    obs:limpaTraco(String(r[ci.obs]||'').trim()),
    responsavel:ci.resp>=0?String(r[ci.resp]||'').trim():'',
    historico:[]
  })).filter(r=>r.assessor&&r.cliente).map(r=>{
    if(pbFechada(r.pb)){
      const iso=parseDataBoleta(r.data_boleta);
      const dbr=iso?iso.split('-').reverse().join('/'):new Date().toLocaleDateString('pt-BR');
      r.historico=[{campo:'Pendência boleta',de:'',para:r.pb,usuario:(typeof USER!=='undefined'&&USER?USER.nome:'')+' (planilha)',data:dbr}];
    }
    return r;
  });
}

function parsePipe(raw,area){
  const cfg={aai:['assessor','ai','aai'],pipe:['volume acordado','pipe atual','rf pipe','rv pipe','seg pipe','pipe','volume','valor'],atual:['atual'],sc:['status comercial'],pb:['pendencia boleta'],todo:['todo'],obs:['obs']};
  return parsePipeCfg(raw,area,cfg);
}

async function editAreas(id){
  const u=USUARIOS.find(x=>String(x.id)===String(id));if(!u)return;
  document.getElementById('modal-areas')?.remove();
  const atuais=u.areas||[];
  const ov=document.createElement('div');
  ov.id='modal-areas';
  ov.style.cssText='position:fixed;inset:0;background:rgba(30,15,18,.45);display:flex;align-items:center;justify-content:center;z-index:9000';
  ov.innerHTML='<div style="background:var(--card);border-radius:8px;padding:22px 24px;min-width:280px;box-shadow:0 12px 40px rgba(0,0,0,.25)">'
    +'<div style="font-weight:700;font-size:15px;margin-bottom:4px">✎ Áreas de '+u.nome+'</div>'
    +'<div style="font-size:11px;color:var(--muted);margin-bottom:14px">Define o que '+(u.perfil==='gestor'?'a gestão enxerga (Daily do time, dashboard, metas)':'o comercial acessa')+'</div>'
    +Object.entries(AREAS).map(([k,a])=>'<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:13px"><input type="checkbox" id="ma-'+k+'" '+(atuais.includes(k)?'checked':'')+' style="width:15px;height:15px;accent-color:var(--wine)"> '+a.name+'</label>').join('')
    +'<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">'
    +'<button class="btn sm" onclick="document.getElementById(\'modal-areas\').remove()">Cancelar</button>'
    +'<button class="btn wine sm" onclick="saveAreas(\''+id+'\')">Salvar</button>'
    +'</div></div>';
  ov.onclick=e=>{if(e.target===ov)ov.remove()};
  document.body.appendChild(ov);
}
async function saveAreas(id){
  const areas=Object.keys(AREAS).filter(k=>document.getElementById('ma-'+k)?.checked);
  try{
    await db('PATCH','usuarios',{areas},'id=eq.'+id);
    document.getElementById('modal-areas')?.remove();
    USUARIOS=await db('GET','usuarios','','order=nome.asc');
    renderUsuarios();
    showToast('✅ Áreas atualizadas!',true);
  }catch(e){showToast('Erro: '+e.message)}
}
function toggleAreas(){
  document.getElementById('u-areas-wrap').style.display=document.getElementById('u-perfil').value==='diretor'?'none':'flex';
}

async function saveUser(){
  const nome=document.getElementById('u-nome').value.trim();
  const pin2=document.getElementById('u-pin').value.trim();
  const perfil=document.getElementById('u-perfil').value;
  if(!nome||!pin2||pin2.length!==4||isNaN(pin2)){showToast('Nome e PIN de 4 dígitos obrigatórios!');return}
  const areas=perfil==='diretor'?['inv','cons','seg']:['inv','cons','seg'].filter(a=>document.getElementById('ua-'+a)?.checked);
  try{
    await db('POST','usuarios',{nome,pin:pin2,perfil,areas,ativo:true});
    showToast('✅ Usuário criado!',true);
    closeModal('user');
    USUARIOS=await db('GET','usuarios','','order=nome.asc');
    renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}

async function toggleUser(id,ativo){
  try{await db('PATCH','usuarios',{ativo},`id=eq.${id}`);USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
async function setPerfil(id,perfil){
  const u=USUARIOS.find(x=>x.id===id);
  if(perfil==='gestor'&&u&&!(u.areas||[]).length){showToast('Defina ao menos uma área para este usuário antes de torná-lo gestor');return}
  try{
    await db('PATCH','usuarios',{perfil},`id=eq.${id}`);
    showToast('✅ '+(u?u.nome:'Usuário')+' agora é '+(perfil==='gestor'?'gestor de área':'assessor'),true);
    USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios();
  }catch(e){showToast('Erro: '+e.message)}
}
async function delUser(id){
  if(!confirm('Remover este usuário?'))return;
  try{await db('DELETE','usuarios','',`id=eq.${id}`);USUARIOS=await db('GET','usuarios','','order=nome.asc');renderUsuarios()}catch(e){showToast('Erro: '+e.message)}
}
