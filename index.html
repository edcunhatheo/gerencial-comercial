function agendaContatosHtml(sel){
  const ref=agRef(), [y,m]=ref.split('-').map(Number);
  const hj=localISO(new Date());
  const mapa=agendaDoComercial(sel);
  const f=resumoAgenda(sel,ref);
  const nm=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const nomeMes=nm.charAt(0).toUpperCase()+nm.slice(1);

  const kpi=(k,v,sub,cor)=>'<div class="ag-kpi"><div class="k">'+k+'</div>'
    +'<div class="v"'+(cor?' style="color:'+cor+'"':'')+'>'+v+'</div><div class="s">'+sub+'</div></div>';

  const primeiro=new Date(y,m-1,1), ultimo=new Date(y,m,0);
  const inicio=new Date(y,m-1,1-primeiro.getDay());
  const nCels=Math.ceil((primeiro.getDay()+ultimo.getDate())/7)*7;
  let cels='';
  for(let i=0;i<nCels;i++){
    const d=new Date(inicio.getFullYear(),inicio.getMonth(),inicio.getDate()+i);
    const iso=localISO(d), fora=d.getMonth()!==m-1, dia=mapa[iso]||{lig:[],reu:[]};
    const nL=dia.lig.length, nR=dia.reu.length, tem=nL+nR>0;
    const pend=iso<hj?dia.lig.filter(r=>!cumpriu(r,iso,'lig')).length+dia.reu.filter(r=>!cumpriu(r,iso,'reu')).length:0;
    // o nome do cliente vem primeiro: o assessor precisa saber PARA QUEM vai ligar
    const itens=[...dia.lig.map(r=>({r,k:'lig',ico:'📞',cls:'l'})),...dia.reu.map(r=>({r,k:'reu',ico:'🤝',cls:'r'}))];
    const MAX=3;
    const linhas=itens.slice(0,MAX).map(x=>{
      const feito=cumpriu(x.r,iso,x.k), furo=iso<hj&&!feito;   // hoje ainda não acabou
      const nome=(x.r.cliente||'—');
      return '<span class="ag-item '+(furo?'furo':x.cls)+(feito&&iso<hj?' ok':'')+'" title="'+
        String(nome).replace(/"/g,'&quot;')+' · '+(x.k==='lig'?'ligação':'reunião')+(furo?' · sem registro':'')+'">'
        +x.ico+' '+nome+'</span>';
    }).join('');
    cels+='<div class="ag-cel'+(fora?' fora':'')+(tem?' tem':'')+(iso===hj?' hoje':'')+(iso===window._agDia?' sel':'')+'"'
      +(tem?' onclick="agDia(\''+iso+'\')" title="Ver os '+(nL+nR)+' compromissos de '+brData(iso)+'"':'')+'>'
      +'<span class="ag-num">'+d.getDate()
      +(pend?' <span class="ag-tag pend">'+pend+' sem registro</span>':'')+'</span>'
      +linhas
      +(itens.length>MAX?'<span class="ag-mais">+'+(itens.length-MAX)+' — abrir o dia</span>':'')
      +'</div>';
  }
  const dows=['dom','seg','ter','qua','qui','sex','sáb'].map(x=>'<div class="ag-dow">'+x+'</div>').join('');

  // lista do dia escolhido
  let lista='';
  if(window._agDia&&mapa[window._agDia]){
    const d=mapa[window._agDia];
    const linha=(r,k)=>'<div class="ag-lin">'
      +'<span class="ag-tag '+(k==='lig'?'l">📞 ligação':'r">🤝 reunião')+'</span>'
      +'<span><span class="cli" onclick="openEdit(\''+r.id+'\')">'+(r.cliente||'—')+'</span>'
      +'<div class="sub">'+((SUBAREAS[subAreaOf(r)]||{}).name||'')+' · '+(r.produto||'—')+' · '+(r.sc||'sem status')+'</div></span>'
      +mkChip(r,k)
      +'<span class="vol">'+(fmt(r.atual||r.pipe)||'—')+'</span></div>';
    lista='<div class="ag-lista">'
      +'<div style="font-size:11px;font-weight:700;margin-bottom:6px">'+brData(window._agDia)+' · '
      +(d.lig.length+d.reu.length)+' compromisso'+((d.lig.length+d.reu.length)!==1?'s':'')
      +' <span style="font-weight:400;color:var(--muted-l)">— clique no chip para confirmar que aconteceu</span></div>'
      +d.lig.map(r=>linha(r,'lig')).join('')+d.reu.map(r=>linha(r,'reu')).join('')
      +'</div>';
  }

  return '<div class="ag">'
    +'<div class="ag-top"><div class="ag-tit">📆 Agenda de contatos <small>· ligações e reuniões marcadas nos cards de '+sel.split(' ')[0]+'</small></div>'
    +'<div class="ag-nav"><button onclick="agNav(-1)" title="Mês anterior">‹</button>'
    +'<span class="ag-mes">'+nomeMes+'</span>'
    +'<button onclick="agNav(1)" title="Próximo mês">›</button>'
    +'<button onclick="agHoje()" title="Voltar para o mês atual">hoje</button></div></div>'
    +'<div class="ag-real">'+realizadoHtml(sel,ref,f)+'</div>'
    +'<div class="ag-grid">'+dows+cels+'</div>'
    +lista
    +'<div class="ag-nota">A data do compromisso sai do card — <strong>📞 Vou ligar em</strong> e <strong>📅 Reunião em</strong>, no bloco “Trabalhar oportunidade” ou no modal da oportunidade. '
    +'“Feito” usa a mesma prova do quadro de efetividade: a confirmação no card, o movimento de status ou a data da reunião que já passou.</div>'
    +'</div>';
}

function diaAtuacaoHtml(){
  const isDirG=USER.perfil==='diretor'||USER.perfil==='gestor';
  let comerciais;
  if(isDirG){
    comerciais=USUARIOS.filter(u=>u.ativo&&u.perfil!=='diretor'&&(USER.perfil==='diretor'||(u.areas||[]).some(a=>(USER.areas||[]).includes(a)))).map(u=>u.nome);
  }else comerciais=[USER.nome];
  if(!comerciais.length)return '';
  const sel=(window._paCom&&comerciais.includes(window._paCom))?window._paCom:comerciais[0];
  const b=estudoDoDia(sel);
  const escaladas=OPPS.filter(r=>!isB(r)&&norm(r.escalado_para||'')===norm(sel)).map(r=>({r,m:'🚨 '+(r.escala_motivo||'Escalada para você')}));

  const chips=isDirG?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'
    +comerciais.map(nm=>{
      const n=totalEstudo(estudoDoDia(nm));
      const on=nm===sel;
      return '<button class="btn sm" style="'+(on?'background:var(--wine);color:#fff;border-color:var(--wine)':'')+'" onclick="window._paCom=\''+nm.replace(/'/g,"\\'")+'\';renderDPipeline()">'
        +nm.split(' ')[0]
        +(n?' <span style="background:'+(on?'rgba(255,255,255,.25)':'var(--wine-l)')+';color:'+(on?'#fff':'var(--wine)')+';border-radius:4px;padding:0 6px;font-size:10px;font-weight:700">'+n+'</span>':' ✓')
        +'</button>';
    }).join('')+'</div>':'';

  // ── quadrantes: reaproveita os buckets já calculados pela estudoDoDia ──
  // cores dos quadrantes vêm das variáveis do tema — assim viram sozinhas no modo escuro
  const QUADS=[
    {key:'critico',ico:'🚨',titulo:'Crítico agora — escalado ou atrasado',cor:'var(--red)',bg:'var(--red-bg)',itens:sortPorUrgencia(dedupeItens([...escaladas,...b.atrasado]))},
    {key:'fechar',ico:'🎯',titulo:'Fechar hoje',cor:'var(--green)',bg:'var(--green-bg)',itens:sortPorValor(dedupeItens(b.fechar))},
    {key:'encaminhado',ico:'📋',titulo:'Encaminhado — segue o fluxo',cor:'var(--blue)',bg:'var(--blue-bg)',itens:sortPorValor(dedupeItens([...b.reunioes,...b.fazer]))},
    {key:'semrumo',ico:'🕳️',titulo:'Sem rumo — precisa organizar',cor:'var(--amber)',bg:'var(--amber-bg)',itens:sortPorUrgencia(dedupeItens(b.semData))},
  ];
  const tot=QUADS.reduce((s,q)=>s+q.itens.length,0);
  const valorTotal=QUADS.reduce((s,q)=>s+q.itens.reduce((s2,x)=>s2+(x.r.atual||x.r.pipe||0),0),0);
  const feitos=QUADS.reduce((s,q)=>s+q.itens.filter(x=>tocadoHojePor(x.r,sel)).length,0);
  const streak=streakDe(sel);

  const banner='<div class="dbanner">'
    +'<div class="dbanner-top">'
    +'<div><div class="dbanner-eyebrow">Daily · '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})+'</div>'
    +'<div class="dbanner-title">'+sel+'</div></div>'
    +(streak>1?'<div class="dstreak">🔥 '+streak+' dias seguidos com atividade</div>':'')
    +'</div>'
    +'<div class="dstats-row">'
    +'<div class="dstat"><div class="v">'+tot+' · '+(fmt(valorTotal)||'R$0')+'</div><div class="l">🗂️ Oportunidades no radar hoje</div></div>'
    +'<div class="dstat"><div class="v">'+feitos+'</div><div class="l">✅ Já feito hoje</div></div>'
    +'<div class="dstat"><div class="v">'+(tot-feitos)+'</div><div class="l">📌 Ainda pra fazer</div></div>'
    +'</div>'
    +'<div class="dprog-wrap"><div class="dprog-bar"><div class="dprog-fill" style="width:'+(tot?Math.round(feitos/tot*100):0)+'%"></div></div>'
    +'<div class="dprog-txt">'+feitos+' de '+tot+' já tocadas hoje</div></div>'
    +'</div>';

  // o log usa o mesmo quadrante dos demais: nasce fechado, a seta abre
  const log=logHojeDe(sel);
  const logAberto=window._quadOpen.has('log')&&log.length>0;
  const logHtml='<div class="dquad dlog-quad'+(logAberto?' open':'')+(log.length?'':' vazio')+'" id="dquad-log" style="--qc:var(--wine);--qbg:var(--wine-l)">'
    +'<div class="dquad-hdr"'+(log.length?' onclick="toggleQuad(\'log\')" title="'+(logAberto?'Recolher':'Ver os '+log.length+' registros')+'"':'')+'>'
    +'<span>📋</span>'
    +'<span class="dquad-title">O que '+(sel===USER.nome?'você já fez':sel.split(' ')[0]+' já fez')+' hoje</span>'
    +'<span class="dquad-cnt">'+log.length+'</span>'
    +(log.length?'<span class="dquad-chev">⌄</span>':'')
    +'</div>'
    +'<div class="dquad-body">'
    +(log.length?log.slice(0,20).map(it=>'<div class="dlog-item"><span>'+it.ico+'</span><div class="dlog-txt"><b>'+it.cliente+'</b> — '+it.desc+'<span class="d">'+it.hora+'</span></div></div>').join('')
      +(log.length>20?'<div style="font-size:10.5px;color:var(--muted-l);text-align:center;padding-top:4px">+'+(log.length-20)+' registros anteriores</div>':'')
      :'<div class="dlog-empty">Nada por aqui ainda — marque ✓, registre uma nota ou trabalhe uma oportunidade abaixo que isso vai se preenchendo sozinho.</div>')
    +'</div></div>';

  const q_ico=Object.fromEntries(QUADS.map(q=>[q.key,q.ico]));
  const rowHtml=({r,m},qKey)=>{
    const done=tocadoHojePor(r,sel);
    const key=qKey+'-'+r.id;
    const open=window._dailyOpen.has(key);
    const workOpen=window._dailyWorkOpen.has(key);
    const dias=daysSince(getLastMoveDate(r));
    const risk=riskColor(dias);
    const sub=[(SUBAREAS[subAreaOf(r)]||{}).name,r.produto].filter(Boolean).join(' · ');
    return '<div class="oppd-row'+(open?' open':'')+(done?' done-hoje':'')+'" id="oppd-'+key+'">'
      +'<div class="oppd-top" onclick="toggleRowDaily(\''+qKey+'\',\''+r.id+'\')">'
      +'<div class="oppd-l1">'
      +'<div class="oppd-check'+(done?' done':'')+'" onclick="concluirRapidoDaily(\''+r.id+'\',event)" title="'+(done?'Já tem registro hoje':'Marcar como feito')+'">✓</div>'
      +'<div class="oppd-avatar">'+initials(r.cliente||'?')+'</div>'
      +'<div class="oppd-info"><div class="oppd-nome">'+(r.cliente||'—')+'</div>'
      +(sub?'<div class="oppd-sub">'+sub+'</div>':'')+'</div>'
      +'<div class="oppd-valor">'+(fmt(r.atual||r.pipe)||'—')+'</div>'
      +'<div class="oppd-chev">⌄</div>'
      +'</div>'
      +'<div class="oppd-motivo"><span>'+(q_ico[qKey]||'•')+'</span><span>'+m+'</span></div>'
      +'<div class="oppd-badges">'
      +(r.sc?'<span class="oppd-badge" style="background:var(--wine-l);color:var(--wine)">'+r.sc+'</span>':'')
      +(r.pb?'<span class="oppd-badge" style="background:var(--border-l);color:var(--muted)">'+r.pb+'</span>':'')
      +'<span class="oppd-badge" style="background:'+risk.bg+';color:'+risk.color+'" title="'+(dias?dias+' dias sem movimentação':'movimentada hoje')+'">'+risk.icon+' '+(dias===0?'mexida hoje':dias+'d parado')+'</span>'
      +(done?'<span class="oppd-badge" style="background:var(--green-bg);color:#085041">✓ tocada hoje</span>':'')
      +mkChip(r,'lig')+mkChip(r,'reu')
      +'</div>'
      +'</div>'
      +'<div class="oppd-detail">'
      +'<div class="oppd-nota-row"><input type="text" id="nota-'+key+'" placeholder="O que vai rolar / o que rolou com '+(r.cliente||'este cliente').split(' ')[0]+'?"><button class="btn sm wine" onclick="registrarNotaDaily(\''+qKey+'\',\''+r.id+'\')">Registrar</button></div>'
      +'<div class="oppd-work-toggle" onclick="toggleWorkDaily(\''+qKey+'\',\''+r.id+'\',event)">⚙️ Trabalhar oportunidade — mudar status, pendência, data</div>'
      +'<div class="oppd-work'+(workOpen?' open':'')+'" id="work-'+key+'">'
      +'<div class="oppd-work-row">'
      +'<div class="oppd-work-field"><label>Status comercial</label>'+selectHtmlSC(qKey,r)+'</div>'
      +'<div class="oppd-work-field"><label>Pendência boleta</label>'+selectHtmlPB(qKey,r)+'</div>'
      +'<div class="oppd-work-field"><label>Data boleta</label><input type="date" id="data-'+key+'" value="'+(parseDataBoleta(r.data_boleta)||'')+'"></div>'
      +'<div class="oppd-work-field"><label>📞 Vou ligar em</label><input type="date" id="lig-'+key+'" value="'+(dataLigacao(r)||'')+'"></div>'
      +'<div class="oppd-work-field"><label>📅 Reunião em</label><input type="date" id="reu-'+key+'" value="'+((r.reuniao_data||'').slice(0,10))+'"></div>'
      +'</div>'
      +'<div class="oppd-work-ftr"><button class="btn sm" style="background:var(--green);color:#fff;border-color:var(--green)" onclick="salvarTrabalhoDaily(\''+qKey+'\',\''+r.id+'\')">💾 Salvar e concluir</button>'
      +'<span class="oppd-full" onclick="openEdit(\''+r.id+'\')">abrir oportunidade completa</span></div>'
      +'</div>'
      +'</div>'
      +'</div>';
  };

  // quadrantes nascem fechados: só o cabeçalho com contagem e valor. A seta abre.
  const quadHtml=QUADS.map(q=>{
    const val=q.itens.reduce((s,x)=>s+(x.r.atual||x.r.pipe||0),0);
    const aberto=window._quadOpen.has(q.key)&&q.itens.length>0;
    // --qc/--qbg ficam no quadrante inteiro: os cards lá dentro herdam a cor do quadrante
    return '<div class="dquad'+(aberto?' open':'')+(q.itens.length?'':' vazio')+'" id="dquad-'+q.key+'" style="--qc:'+q.cor+';--qbg:'+q.bg+'">'
      +'<div class="dquad-hdr"'+(q.itens.length?' onclick="toggleQuad(\''+q.key+'\')" title="'+(aberto?'Recolher':'Ver as '+q.itens.length+' oportunidades')+'"':'')+'>'
      +'<span>'+q.ico+'</span><span class="dquad-title">'+q.titulo+'</span>'
      +'<span class="dquad-cnt">'+q.itens.length+'</span>'
      +(q.itens.length?'<span class="dquad-val">'+(fmt(val)||'')+'</span>':'')
      +(q.itens.length?'<span class="dquad-chev">⌄</span>':'')
      +'</div>'
      +'<div class="dquad-body">'
      +(q.itens.length?q.itens.map(x=>rowHtml(x,q.key)).join(''):'<div class="dquad-empty">quadrante limpo</div>')
      +'</div>'
      +'</div>';
  }).join('');

  return banner+logHtml
    +agendaContatosHtml(sel)
    +'<div class="section-label">O que tem pra fazer <span style="text-transform:none;font-weight:400;letter-spacing:0;color:var(--muted-l)">— organizado por quadrante</span></div>'
    +chips
    +'<div class="dquads">'+quadHtml+'</div>';
}

  `;

function applyFilter(){
  let rows=[...OPPS];
  const fA=document.getElementById('f-area')?.value;
  const fAss=document.getElementById('f-ass')?.value;
  const fSC=document.getElementById('f-sc')?.value;
  const fPB=document.getElementById('f-pb')?.value;
  const fCli=(document.getElementById('f-cli')?.value||'').toLowerCase();
  if(fA)rows=rows.filter(r=>r.area===fA);
  if(fAss)rows=rows.filter(r=>assDe(r)===fAss);
  if(fSC)rows=rows.filter(r=>r.sc===fSC);
  if(fPB)rows=rows.filter(r=>r.pb===fPB);
  if(fCli)rows=rows.filter(r=>(r.cliente||'').toLowerCase().includes(fCli));

  const kEl=document.getElementById('pipeline-kpis');
  if(kEl){
    const tP=rows.reduce((s,r)=>s+(r.pipe||0),0);
    const tB=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    kEl.innerHTML=`<div class="kpi wine"><div class="kpi-lbl">Boletado</div><div class="kpi-val">${fmt(tB)||'R$0'}</div></div>
    <div class="kpi"><div class="kpi-lbl">Pipe</div><div class="kpi-val">${fmt(tP)}</div><div class="kpi-sub">${rows.length} opor.</div></div>
    <div class="kpi"><div class="kpi-lbl">Pendências</div><div class="kpi-val">${rows.filter(isPend).length}</div></div>`;
  }

  // Summary cards when assessor or status filtered
  const summaryEl=document.getElementById('pipeline-summary');
  if(summaryEl){
    const hasFilter=fA||fAss||fSC||fPB;
    if(hasFilter&&rows.length){
      // Per area breakdown
      const areaBreak=areasVis().map(([ak,a])=>{
        const ar=rows.filter(r=>r.area===ak);
        if(!ar.length)return'';
        const bol=ar.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
        const bolN=ar.filter(isB).length;
        const pipe=ar.reduce((s,r)=>s+(r.pipe||0),0);
        const ef=ar.length?Math.round(bolN/ar.length*100):0;
        return`<div style="background:var(--card);border:1px solid ${a.color}33;border-radius:6px;padding:14px 16px;border-top:3px solid ${a.color}">
          <div style="font-size:10px;font-weight:700;color:${a.color};text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:5px">
            <span style="width:7px;height:7px;border-radius:50%;background:${a.color}"></span>${a.name}
          </div>
          <div style="font-size:20px;font-weight:700;color:${a.color};margin-bottom:2px">${fmt(bol)||'R$0'}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px">${bolN}/${ar.length} boletar · ${ef}% efetiv.</div>
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-top:1px solid var(--border-l)">
            <span style="color:var(--muted)">Pipe</span><span style="font-weight:600">${fmt(pipe)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-top:1px solid var(--border-l)">
            <span style="color:var(--muted)">Pendências</span><span style="font-weight:600;color:${rows.filter(r=>r.area===ak&&isPend(r)).length>0?'var(--amber)':'var(--green)'}">${rows.filter(r=>r.area===ak&&isPend(r)).length||'—'}</span>
          </div>
        </div>`;
      }).filter(Boolean).join('');

      // Risk summary
      const atRisk=rows.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))>7);
      const attn=rows.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))>3&&daysSince(getLastMoveDate(r))<=7);
      const ok=rows.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))<=3);
      const riskHtml='<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">'
        +'<div style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:20px">🔴</span><div><div style="font-size:18px;font-weight:700;color:#791F1F">'+atRisk.length+'</div><div style="font-size:10px;color:#791F1F;font-weight:600">Paradas +7 dias</div><div style="font-size:11px;color:var(--muted)">'+fmt(atRisk.reduce((s,r)=>s+(r.pipe||0),0))+'</div></div></div>'
        +'<div style="background:var(--amber-bg);border:1px solid var(--amber-b);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:20px">🟡</span><div><div style="font-size:18px;font-weight:700;color:#854F0B">'+attn.length+'</div><div style="font-size:10px;color:#854F0B;font-weight:600">Atenção 4-7 dias</div><div style="font-size:11px;color:var(--muted)">'+fmt(attn.reduce((s,r)=>s+(r.pipe||0),0))+'</div></div></div>'
        +'<div style="background:var(--green-bg);border:1px solid var(--green-b);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:8px">'
        +'<span style="font-size:20px">🟢</span><div><div style="font-size:18px;font-weight:700;color:#085041">'+ok.length+'</div><div style="font-size:10px;color:#085041;font-weight:600">Em dia ≤3 dias</div><div style="font-size:11px;color:var(--muted)">'+fmt(ok.reduce((s,r)=>s+(r.pipe||0),0))+'</div></div></div>'
        +'</div>';

      // Status breakdown
      const scMap={};
      rows.forEach(r=>{if(r.sc){if(!scMap[r.sc])scMap[r.sc]=0;scMap[r.sc]++;}});
      const scBars=Object.entries(scMap).sort((a,b)=>b[1]-a[1]).map(([sc,n])=>{
        const b=matchBadge(sc,SC_BADGE)||'b-gray';
        return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="badge ${b}" style="min-width:140px;text-align:center">${sc}</span>
          <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
            <div style="width:${Math.round(n/rows.length*100)}%;height:5px;background:var(--wine);border-radius:3px"></div>
          </div>
          <span style="font-size:12px;font-weight:700;min-width:24px;text-align:right">${n}</span>
        </div>`;
      }).join('');

      // Pendencia breakdown
      const pbMap={};
      rows.forEach(r=>{if(r.pb){if(!pbMap[r.pb])pbMap[r.pb]=0;pbMap[r.pb]++;}});

function toggleSelectAll(checked){

function fmtReuniao(s){
  if(!s)return'';
  const [d,h]=s.split('T');
  const p=d.split('-');
  return p[2]+'/'+p[1]+(h?' às '+h.substring(0,5):'');
}

function sugestaoAcao(r){
  if(r.todo)return r.todo;
  const sc=norm(r.sc||'');
  const pb=norm(r.pb||'');
  if(pb.includes('email'))return 'Enviar email/push para o cliente';
  if(pb==='a boletar')return 'Gerar a boleta!';
  if(pb.includes('to do'))return 'Resolver pendência da boleta';
  if(sc==='ligar cliente'||sc==='ligar cliente c ai')return 'Ligar para o cliente';
  if(sc==='agendar reunião')return 'Agendar a reunião';
  if(sc==='reunião agendada')return 'Realizar a reunião';
  if(sc==='cliente confirmar')return 'Cobrar confirmação do cliente';
  if(sc==='cliente topou')return 'Cliente topou — fechar a boleta!';
  return 'Definir próximo passo';
}

const SC_CHAIN=['Ligar Cliente','Agendar Reunião','Reunião Agendada','Cliente Confirmar','Cliente Topou'];
// Para os FUNIS: variantes de R2 contam junto da etapa de reunião equivalente
// (o Kanban continua mostrando as colunas R2 separadas)
function scFunil(sc){
  const k=norm(sc||'');
  if(!k)return '';
  const chain=SC_CHAIN.find(s=>norm(s)===k);
  if(chain)return norm(chain);
  if(/r2/.test(k)&&/agendar/.test(k))return norm('Agendar Reunião');
  if(/r2/.test(k)&&/agendad/.test(k))return norm('Reunião Agendada');
  if(/^ligar/.test(k))return norm('Ligar Cliente');   // "Ligar Cliente c AI" e variantes
  return k;
}

// ── 🤖 INTELIGÊNCIA: análise da próxima ação ──
function analisarProximaAcao(r){
  const dias=daysSince(getLastMoveDate(r));
  const sc=norm(r.sc||''),pb=norm(r.pb||'');
  const vol=r.atual||r.pipe||0;
  const hist=r.historico||[];
  const nMoves=hist.filter(h=>h.campo==='Status comercial').length;
  const temReuniao=!!r.reuniao_data;
  const agora=new Date().toISOString().slice(0,16);
  const reuniaoPassada=temReuniao&&r.reuniao_data<agora;
  let acao='',motivo='',urg='media';

  if(isB(r)){acao='Oportunidade concluída';motivo='Boletada com sucesso. Nenhuma ação necessária.';urg='baixa';}
  else if(pb==='a boletar'){acao='Gerar a boleta AGORA';motivo='Cliente pronto para boletar. '+(dias>2?'Já se passaram '+dias+' dias — risco de esfriar!':'Aproveite o momento quente.');urg='alta';}
  else if(sc==='cliente topou'){acao='Resolver pendência e boletar';motivo='Cliente topou'+(r.pb?' mas há pendência: '+r.pb:'')+'.'+(dias>3?' '+dias+' dias parado — priorize hoje!':'');urg='alta';}
  else if(reuniaoPassada){acao='Registrar o resultado da reunião';motivo='A reunião de '+fmtReuniao(r.reuniao_data)+' já aconteceu. Atualize o status com o desfecho e a próxima etapa.';urg='alta';}
  else if(temReuniao){acao='Preparar a reunião de '+fmtReuniao(r.reuniao_data);motivo='Revise a proposta, o perfil do cliente e o material antes do encontro.';urg='media';}
  else if(sc==='cliente confirmar'){
    if(dias>3){acao='Cobrar resposta do cliente';motivo='Sem resposta há '+dias+' dias. Um follow-up educado recupera boa parte dos silêncios.';urg='alta';}
    else{acao='Aguardar confirmação (follow-up em '+(4-dias)+' dia'+(4-dias>1?'s':'')+')';motivo='Cliente está decidindo. Não pressione ainda.';urg='baixa';}
  }
  else if(sc==='reunião agendada'&&!temReuniao){acao='Registrar data e hora da reunião';motivo='Status indica reunião marcada mas sem data no sistema — registre para aparecer na agenda do dia.';urg='media';}
  else if(sc==='agendar reunião'){acao='Propor 2 horários ao cliente';motivo='Oferecer opções concretas acelera o agendamento.'+(dias>5?' Parado há '+dias+' dias.':'');urg=dias>5?'alta':'media';}
  else if(sc.includes('ligar')){
    if(dias>7){acao='Retomar contato (ligação + WhatsApp)';motivo='Sem avanço há '+dias+' dias'+(nMoves===0?' e nenhum contato registrado':'')+'. Tente um canal alternativo.';urg='alta';}
    else{acao='Ligar para o cliente';motivo='O primeiro contato define o ritmo da negociação.';urg='media';}
  }
  else if(pb.includes('email')){acao='Enviar: '+r.pb;motivo='Pendência operacional travando a boleta há '+dias+' dia'+(dias>1?'s':'')+'.';urg='alta';}
  else if(pb.includes('to do')||pb.includes('aguardando')){acao='Resolver: '+r.pb;motivo='Pendência aberta há '+dias+' dias.';urg=dias>3?'alta':'media';}
  else if(!r.sc){acao='Classificar a oportunidade';motivo='Sem status definido. Defina a etapa para ela entrar no funil e nas prioridades.';urg='media';}
  else{acao=sugestaoAcao(r);motivo=dias>7?'Parada há '+dias+' dias sem movimentação.':'Mantenha o ritmo de acompanhamento.';urg=dias>7?'alta':'baixa';}

  if(!isB(r)&&vol>=500000&&urg!=='alta')motivo+=' 💰 Ticket alto ('+fmt(vol)+') — merece atenção extra.';
  return{acao,motivo,urg};
}

async function advanceStatus(id,ev){
  if(ev)ev.stopPropagation();
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const cur=SC_CHAIN.findIndex(s=>norm(s)===norm(r.sc||''));
  const next=cur<0?SC_CHAIN[0]:SC_CHAIN[Math.min(cur+1,SC_CHAIN.length-1)];
  if(cur>=SC_CHAIN.length-1){quickBoletar(id);return;}
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:'Status comercial',de:r.sc||'',para:next,usuario:USER.nome,data:ds}];
  try{
    await db('PATCH','oportunidades',{sc:next,historico:hist,updated_at:now.toISOString()},'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+next,true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

// ── Barra de rolagem horizontal também ACIMA de cada kanban ──
// A posição fica guardada em _kbScroll: toda re-renderização (auto-atualização de 60s,
// mover card, mudar status) recria o board do zero, e sem isso a rolagem voltava pro início.
window._kbScroll=window._kbScroll||{};
function initKbScrollTop(){
  document.querySelectorAll('.kb-board').forEach((board,idx)=>{
    const chave=curView+'#'+idx;
    if(board.scrollWidth<=board.clientWidth+4){delete window._kbScroll[chave];return}
    if(board.previousElementSibling&&board.previousElementSibling.classList.contains('kb-scroll-top'))board.previousElementSibling.remove();
    const proxy=document.createElement('div');
    proxy.className='kb-scroll-top';
    proxy.style.cssText='overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:4px';
    const spacer=document.createElement('div');
    spacer.style.cssText='height:1px;width:'+board.scrollWidth+'px';
    proxy.appendChild(spacer);
    board.parentNode.insertBefore(proxy,board);

    // espelha uma barra na outra. A trava é liberada no próximo quadro (e não pelo
    // evento seguinte): se a atribuição não gerar evento — valor igual ou no limite —
    // a trava não fica presa engolindo a próxima rolagem do usuário.
    let travado=false;
    const espelha=(de,para)=>()=>{
      if(travado)return;
      travado=true;
      para.scrollLeft=de.scrollLeft;
      requestAnimationFrame(()=>{travado=false});
    };
    proxy.addEventListener('scroll',espelha(proxy,board));
    board.addEventListener('scroll',espelha(board,proxy));

    board.addEventListener('scroll',()=>{window._kbScroll[chave]=board.scrollLeft});
    const salvo=window._kbScroll[chave]||0;
    if(salvo>0){board.scrollLeft=salvo;proxy.scrollLeft=board.scrollLeft;}
  });
}

}

function kbVerMais(k){

let _dragId=null;
function kbDragStart(ev,id){_dragId=id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',id)}catch(e){}}
function kbDragOver(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.style.background='#E4D2C6';ev.currentTarget.style.transform='scale(1.01)';}
// Auto-rolagem enquanto arrasta: perto das bordas do board rola horizontal; perto do topo/rodapé rola a página
document.addEventListener('dragover',ev=>{
  const M=90,S=30;
  const el=ev.target&&ev.target.closest?ev.target.closest('.kb-board'):null;
  if(el){
    const r=el.getBoundingClientRect();
    if(ev.clientX-r.left<M)el.scrollLeft-=S;
    else if(r.right-ev.clientX<M)el.scrollLeft+=S;
  }
  if(ev.clientY<110)window.scrollBy(0,-S);
  else if(window.innerHeight-ev.clientY<110)window.scrollBy(0,S);
});
function kbDragLeave(ev){ev.currentTarget.style.background='';ev.currentTarget.style.transform='';}
async function kbDrop(ev,statusKey){
  if(statusKey==='__PERD__')statusKey='Cliente Negou';
  ev.preventDefault();
  ev.currentTarget.style.background='';ev.currentTarget.style.transform='';
  const id=_dragId;_dragId=null;
  if(!id)return;
  const r=OPPS.find(o=>o.id===id);if(!r)return;
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[])];
  const patch={updated_at:now.toISOString()};
  if(statusKey==='__BOL__'){
    if(isB(r))return;
    hist.push({campo:'Pendência boleta',de:r.pb||'',para:'Boletado',usuario:USER.nome,data:ds});
    patch.pb='Boletado';
  }else{
    if(norm(r.sc||'')===norm(statusKey)&&!isB(r))return;
    if(isB(r)){
      hist.push({campo:'Pendência boleta',de:r.pb||'',para:'(desfeita)',usuario:USER.nome,data:ds});
      patch.pb='';
    }
    hist.push({campo:'Status comercial',de:r.sc||'',para:statusKey,usuario:USER.nome,data:ds});
    patch.sc=statusKey;
  }
  patch.historico=hist;
  try{
    await db('PATCH','oportunidades',patch,'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+(statusKey==='__BOL__'?'Boletado':statusKey),true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

// o que este usuário enxerga — diretor/gestor vê tudo, o resto vê o que é seu
function oppsDoUsuario(){
  if(USER.perfil==='diretor'||USER.perfil==='gestor')return [...OPPS];
  return OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
}
function renderAssessorOpps(c=document.getElementById('main-content')){
  const isDir=USER.perfil==='diretor'||USER.perfil==='gestor';
  const myOpps=oppsDoUsuario();
  const hoje=today();


  const ativos=myOpps.filter(r=>!isB(r));

  // Priority buckets
  const reunioesHoje=ativos.filter(r=>r.reuniao_data&&r.reuniao_data.startsWith(hoje)).sort((a,b)=>(a.reuniao_data||'').localeCompare(b.reuniao_data||''));
  const atrasados=ativos.filter(r=>!reunioesHoje.includes(r)&&r.todo_data&&r.todo_data<hoje);
  const hojeList=ativos.filter(r=>!reunioesHoje.includes(r)&&r.todo_data===hoje);
  const quaseLa=ativos.filter(r=>!reunioesHoje.includes(r)&&!atrasados.includes(r)&&!hojeList.includes(r)&&(norm(r.sc||'')==='cliente topou'||norm(r.pb||'')==='a boletar'));
  const parados=ativos.filter(r=>!reunioesHoje.includes(r)&&!atrasados.includes(r)&&!hojeList.includes(r)&&!quaseLa.includes(r)&&daysSince(getLastMoveDate(r))>7);

  function prioLine(r,tipo){
    const cfg={
      reuniao:{icon:'📅',bg:'#E6F1FB',label:'reunião hoje '+(r.reuniao_data&&r.reuniao_data.includes('T')?'às '+r.reuniao_data.split('T')[1].substring(0,5):'')},
      atrasado:{icon:'🔴',bg:'#FCEBEB',label:'há '+(Math.floor((new Date(hoje)-new Date(r.todo_data))/(1000*60*60*24)))+'d atrasado'},
      hoje:{icon:'📅',bg:'#FEF3E2',label:'para hoje'},
      quase:{icon:'🔥',bg:'#E1F5EE',label:'quase lá!'},
      parado:{icon:'💤',bg:'#F5F0EB',label:daysSince(getLastMoveDate(r))+'d parado'}
    }[tipo];
    return '<div class="prio-item">'
      +'<div class="prio-flag" style="background:'+cfg.bg+'">'+cfg.icon+'</div>'
      +'<div class="prio-info">'
      +'<div class="prio-cli">'+r.cliente+' <span style="font-size:10px;font-weight:600;color:var(--muted)">· '+(SUBAREAS[subAreaOf(r)]?.name||'')+(r.produto?' · '+r.produto:'')+(r.responsavel?' · 👤'+r.responsavel:'')+'</span></div>'
      +'<div class="prio-acao">👉 '+analisarProximaAcao(r).acao+' <span style="font-weight:700">('+cfg.label+')</span></div>'
      +'</div>'
      +'<div class="prio-vol">'+fmt(r.atual||r.pipe)+'</div>'
      +'<button class="btn sm wine" onclick="openEdit(\''+r.id+'\')">Atualizar</button>'
      +'</div>';
  }

  const prioHtml=[
    ...reunioesHoje.map(r=>prioLine(r,'reuniao')),
    ...atrasados.map(r=>prioLine(r,'atrasado')),
    ...hojeList.map(r=>prioLine(r,'hoje')),
    ...quaseLa.map(r=>prioLine(r,'quase')),
    ...parados.slice(0,5).map(r=>prioLine(r,'parado'))
  ].join('');

  // Kanban columns
  const _cust=kbCustomCols();
  const _custReuniao=_cust.filter(c=>/r2|reuni/.test(norm(c)));
  const _custOutras=_cust.filter(c=>!/r2|reuni/.test(norm(c)));
  const KB_COLS=[
    ['Ligar Cliente','📞','#5A3A3E'],
    ['Agendar Reunião','🗓️','#854F0B'],
    ['Reunião Agendada','📅','#3C3489'],
    ..._custReuniao.map(c=>[c,'📅','#3C3489']),
    ['Cliente Confirmar','⏳','#0C447C'],
    ['Cliente Topou','🤝','#085041'],
    ..._custOutras.map(c=>[c,'📌','#7A5C8A']),
    ['__BOL__','✅','#085041'],
    ['__PERD__','❌','#A32D2D']
  ];

  function kbCard(r){
    const dias=daysSince(getLastMoveDate(r));
    const risk=isB(r)?null:riskColor(dias);
    const isTopou=norm(r.sc||'')==='cliente topou';
    return '<div class="kb-card" draggable="true" ondragstart="kbDragStart(event,\''+r.id+'\')" onclick="openEdit(\''+r.id+'\')">'

      +'<input type="checkbox" '+(SELECTED.has(r.id)?'checked ':'')+'onclick="event.stopPropagation()" onchange="toggleSelectG(\''+r.id+'\',this.checked,event)" style="width:13px;height:13px;cursor:pointer;accent-color:var(--wine);flex-shrink:0">'
      +'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">'+r.cliente+'</span>'
      +(r.escalado_para?'<span title="Escalada para '+String(r.escalado_para).replace(/"/g,'')+'" style="font-size:11px;flex-shrink:0">🚨</span>':'')
      +'</div>'

        return '<div class="kb-meta" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">'

          +(r.produto?'<span style="border:1px solid '+cr+';color:'+cr+';border-radius:4px;padding:0 6px;font-size:9px;font-weight:700;text-transform:uppercase">'+r.produto+'</span>':'')
          +'</div>';})()
      +(r.assessor?'<div class="kb-meta" style="font-weight:600">🧑‍💼 '+r.assessor+(r.responsavel?' · 👤'+r.responsavel:'')+'</div>':(r.responsavel?'<div class="kb-meta">👤 '+r.responsavel+'</div>':''))

      +(r.obs&&limpaTraco(r.obs)?'<div class="kb-meta" title="'+String(r.obs).replace(/"/g,'&quot;')+'" style="color:#8A6A3B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">💬 '+String(r.obs).substring(0,48)+(r.obs.length>48?'…':'')+'</div>':'')
      +'<div class="kb-meta" style="display:flex;gap:4px;flex-wrap:wrap">'+mkChip(r,'lig')+mkChip(r,'reu')+'</div>'
      +'<div style="display:flex;align-items:center;justify-content:space-between">'
      +'<div class="kb-vol">'+fmt(r.atual||r.pipe)+'</div>'
      +(risk?'<span style="font-size:10px;font-weight:700;color:'+risk.color+'">'+risk.icon+' '+dias+'d</span>':'<span style="font-size:12px">✅</span>')
      +'</div>'
      +(!isB(r)?'<button class="kb-adv'+(isTopou?' bol':'')+'" onclick="advanceStatus(\''+r.id+'\',event)">'+(isTopou?'✅ Boletar agora':'Avançar etapa →')+'</button>':'')
      +'</div>';
  }

  const fArea=window._kbArea||'';
  const fAssKb=window._kbAss||'';
  const fSCKb=window._kbSC||'';
  const fPBKb=window._kbPB||'';
  const fCliKb=window._kbCli||'';
  let kbOpps=myOpps;
  if(fArea)kbOpps=kbOpps.filter(r=>subAreaOf(r)===fArea);
  if(fAssKb)kbOpps=kbOpps.filter(r=>assDe(r)===fAssKb);
  if(fSCKb)kbOpps=kbOpps.filter(r=>norm(r.sc||'')===norm(fSCKb));
  if(fPBKb)kbOpps=kbOpps.filter(r=>r.pb===fPBKb);
  const fAg=window._kbAg||'';
  if(fAg==='todo-hoje')kbOpps=kbOpps.filter(r=>r.todo_data===hoje);
  else if(fAg==='todo-atrasado')kbOpps=kbOpps.filter(r=>r.todo_data&&r.todo_data<hoje&&!isB(r));
  else if(fAg==='reuniao-hoje')kbOpps=kbOpps.filter(r=>r.reuniao_data&&r.reuniao_data.startsWith(hoje));
  else if(fAg==='parado')kbOpps=kbOpps.filter(r=>!isB(r)&&daysSince(getLastMoveDate(r))>7);
  const fResp=window._kbResp||'';
  if(fResp)kbOpps=kbOpps.filter(r=>norm(r.responsavel||'')===norm(fResp));
  const fProd=window._kbProd||'';
  if(fProd)kbOpps=kbOpps.filter(r=>norm(r.produto||'')===norm(fProd));
  if(fCliKb)kbOpps=kbOpps.filter(r=>(r.cliente||'').toLowerCase().includes(fCliKb.toLowerCase()));

  // ── população do funil de efetividade ──
  // Segue os filtros que definem QUEM/O QUÊ: área, assessor, responsável, produto, cliente.
  // NÃO segue status / pendência / agenda: esses selecionam uma etapa do pipeline, e filtrar
  // por etapa faria o funil medir a si mesmo (tudo viraria 100% na etapa escolhida).
  let funilOpps=myOpps;
  const recorte=[];
  if(fArea){funilOpps=funilOpps.filter(r=>subAreaOf(r)===fArea);recorte.push((SUBAREAS[fArea]||{}).name||fArea);}
  if(fAssKb){funilOpps=funilOpps.filter(r=>assDe(r)===fAssKb);recorte.push(fAssKb);}
  if(fResp){funilOpps=funilOpps.filter(r=>norm(r.responsavel||'')===norm(fResp));recorte.push(fResp);}
  if(fProd){funilOpps=funilOpps.filter(r=>norm(r.produto||'')===norm(fProd));recorte.push(fProd);}
  if(fCliKb){funilOpps=funilOpps.filter(r=>(r.cliente||'').toLowerCase().includes(fCliKb.toLowerCase()));recorte.push('cliente "'+fCliKb+'"');}

  function buildKanban(opps,seg){
    seg=seg||'';
    return KB_COLS.map(([key,emoji,cor])=>{
      const mk=(seg+'|'+key).replace(/\\/g,'').replace(/'/g,'');
      window._kbColIds=window._kbColIds||{};
      let rows;
      if(key==='__BOL__')rows=opps.filter(isB);
      else if(key==='__PERD__')rows=opps.filter(r=>!isB(r)&&isPerdida(r));
      else rows=opps.filter(r=>!isB(r)&&norm(r.sc||'')===norm(key));
      const vol=rows.reduce((s,r)=>s+(key==='__BOL__'?(r.atual||0):(r.atual||r.pipe||0)),0);
      window._kbColIds[mk]=rows.map(r=>r.id);
      const colSel=rows.length>0&&rows.every(r=>SELECTED.has(r.id));
      return '<div class="kb-col" ondragover="kbDragOver(event)" ondragleave="kbDragLeave(event)" ondrop="kbDrop(event,\''+key+'\')">'
        +'<div class="kb-col-hdr" style="color:'+cor+'">'
        +'<span style="display:flex;align-items:center;gap:6px">'
        +(rows.length?'<input type="checkbox" '+(colSel?'checked ':'')+'title="Selecionar a coluna inteira" onclick="event.stopPropagation()" onchange="kbSelCol(\''+mk+'\',this.checked)" style="width:13px;height:13px;cursor:pointer;accent-color:'+cor+'">':'')
        +emoji+' '+(key==='__BOL__'?'Boletado':key==='__PERD__'?'Perdido':key)+'</span>'
        +'<span class="kb-count">'+rows.length+'</span>'
        +'</div>'
        +'<div style="font-size:10px;font-weight:700;color:'+cor+';padding:0 8px 8px">'+(fmt(vol)||'—')+'</div>'
        +(()=>{
          const exp=(window._kbMore||{})[mk];
          const lim=exp?rows.length:15;
          return rows.slice(0,lim).map(kbCard).join('')
            +(rows.length>15
              ?'<button class="btn sm" style="width:100%;margin-top:4px" onclick="kbVerMais(\''+mk+'\')">'+(exp?'Ver menos ↑':'Ver mais '+(rows.length-15)+' ↓')+'</button>'
              :'');
        })()
        +'</div>';
    }).join('')
    +'<div style="min-width:150px;flex-shrink:0;display:flex;align-items:flex-start">'
      +'<button class="kb-add-etapa" onclick="kbAddEtapa()">➕ Nova etapa</button>'
    +'</div>';
  }

  function buildLista(opps){
    const ordered=[...opps].sort((a,b)=>{
      if(isB(a)&&!isB(b))return 1;
      if(!isB(a)&&isB(b))return -1;
      return daysSince(getLastMoveDate(b))-daysSince(getLastMoveDate(a));
    });
    ordered.forEach(r=>window._listIds.push(r.id));
    return '<div class="tbl-wrap" style="margin-bottom:14px"><table><thead><tr>'
      +'<th style="width:34px"><input type="checkbox" onchange="toggleSelectAllG(this.checked)" style="width:15px;height:15px;cursor:pointer;accent-color:var(--wine)"></th>'
      +'<th></th><th>Cliente</th><th>Assessor</th><th>Produto</th><th>Status</th><th>Pendência</th><th>TODO</th><th style="text-align:center">Dias</th><th style="text-align:right">Volume</th><th></th>'
      +'</tr></thead><tbody>'

        const dias=daysSince(getLastMoveDate(r));

        const bpb=matchBadge(r.pb||'',PB_BADGE)||'b-gray';
        const isTopou=norm(r.sc||'')==='cliente topou';
        const tdData=r.todo_data?(()=>{const atras=r.todo_data<today()&&!isB(r);const dt=r.todo_data.split('-');return '<div style="font-size:10px;font-weight:700;color:'+(atras?'var(--red)':'var(--muted)')+'">📅 '+dt[2]+'/'+dt[1]+(atras?' ⚠️':'')+'</div>';})():'';
        return '<tr class="'+(isB(r)?'bol':'')+'">'
          +'<td><input type="checkbox" '+(SELECTED.has(r.id)?'checked':'')+' onchange="toggleSelectG(\''+r.id+'\',this.checked,event)" style="width:14px;height:14px;cursor:pointer;accent-color:var(--wine)"></td>'
          +'<td style="text-align:center;font-size:13px">'+(isB(r)?'✅':risk.icon)+'</td>'
          +'<td style="font-weight:700">'+r.cliente+(r.escalado_para?' <span title="Escalada para '+String(r.escalado_para).replace(/"/g,'')+'">🚨</span>':'')+'</td>'
          +'<td style="font-size:11px;font-weight:600">'+(r.assessor||'—')+'</td>'
          +(()=>{const cr=(SUBAREAS[subAreaOf(r)]||{}).color||'#888';
          return '<td style="font-size:11px">'+(r.produto?'<span style="border:1px solid '+cr+';color:'+cr+';border-radius:4px;padding:1px 7px;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap">'+r.produto+'</span>':'—')+(r.responsavel?'<div style="font-size:10px;font-weight:700;color:#7F77DD;margin-top:3px">👤 '+r.responsavel+'</div>':'')+'</td>';})()

          +'<td>'+(r.pb?'<span class="badge '+bpb+'" style="font-size:10px">'+r.pb+'</span>':'—')+'</td>'
          +'<td style="font-size:11px;max-width:130px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+(r.todo||'')+'">'+(r.todo||'—')+'</div>'+tdData+'</td>'

          +'<td style="text-align:right;font-weight:700;color:var(--wine-d)">'+fmt(r.atual||r.pipe)+'</td>'
          +'<td><div style="display:flex;gap:5px;justify-content:flex-end">'
          +(!isB(r)?'<button class="btn sm" style="'+(isTopou?'border-color:var(--green-b);background:var(--green-bg);color:var(--green)':'')+'" onclick="advanceStatus(\''+r.id+'\',event)">'+(isTopou?'✅ Boletar':'Avançar →')+'</button>':'')
          +'<button class="btn sm" onclick="openEdit(\''+r.id+'\')">Editar</button>'
          +'</div></td>'
          +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }

  const viewMode=window._kbView||'kanban';
  window._listIds=[];
  let kbHtml;
  // Funil único: todos os cards juntos; o filtro de área faz o recorte
  kbHtml=viewMode==='lista'?buildLista(kbOpps):'<div class="kb-board">'+buildKanban(kbOpps)+'</div>';

  // Sem status column (só na visão não segmentada)
  const semStatus=kbOpps.filter(r=>!isB(r)&&![...SC_CHAIN,...kbCustomCols()].some(s=>norm(s)===norm(r.sc||''))&&norm(r.sc||'')!=='cliente negou');

  c.innerHTML=''
    // Efetividade do funil (no lugar do banner de saudação)
    +funilHtml(funilOpps,recorte)

    // Nova oportunidade
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:14px">'
    +'<button class="btn wine" onclick="openNewOpp()">+ Nova oportunidade</button>'
    +'</div>'

    // Resumo do funil
    +(()=>{
      const segs=subareasVis().filter(([sk])=>!fArea||sk===fArea).map(([sk,a])=>{
        const so=kbOpps.filter(r=>subAreaOf(r)===sk);
        const etapas=SC_CHAIN.map(s=>so.filter(r=>!isB(r)&&scFunil(r.sc)===norm(s)).length);
        const bolRows=so.filter(isB);
        const perdRows=so.filter(r=>!isB(r)&&isPerdida(r));
        const perdV=perdRows.reduce((s2,r)=>s2+(r.pipe||0),0);
        const pipeAtivo=so.filter(r=>!isB(r)).reduce((s2,r)=>s2+(r.pipe||0),0);
        const bolV=bolRows.reduce((s2,r)=>s2+(r.atual||0),0);
        // quebra por produto dentro do segmento
        const pm=new Map();
        so.forEach(r=>{const k=norm(r.produto||'');if(!pm.has(k))pm.set(k,{nome:r.produto||'(sem produto)',rows:[]});pm.get(k).rows.push(r)});
        const produtos=[...pm.values()].map(p=>{
          const pe=SC_CHAIN.map(s2p=>p.rows.filter(r=>!isB(r)&&scFunil(r.sc)===norm(s2p)).length);
          const pb=p.rows.filter(isB);
          const pp=p.rows.filter(r=>!isB(r)&&isPerdida(r));

  const bpb=matchBadge(r.pb||'',PB_BADGE)||'b-gray';
  const boletado=isB(r);
  const pending=isPend(r);
  return`<div class="opp-card${boletado?' bol':''}" id="card-${r.id}">
    <div class="opp-card-header">
      <div>
        <div class="opp-client">${r.cliente}</div>
        <div class="opp-meta">
          <span class="badge" style="background:${cor}15;color:${cor};border:1px solid ${cor}33;font-size:10px">${AREAS[r.area]?.name||r.area}</span>
          ${r.produto?`<span class="badge b-gray" style="font-size:10px">${r.produto}</span>`:''}
        </div>
      </div>
      <div class="opp-vol">${fmt(r.atual||r.pipe)}</div>
    </div>
    <div class="opp-card-body">
      <div class="opp-row">
        <span class="opp-row-l">Status</span>
        <span>${r.sc?`<span class="badge ${bsc}">${r.sc}</span>`:'<span style="color:var(--muted);font-size:12px">—</span>'}</span>
      </div>
      <div class="opp-row">
        <span class="opp-row-l">Pendência</span>
        <span>${r.pb?`<span class="badge ${bpb}">${r.pb}</span>`:'<span style="color:var(--muted);font-size:12px">—</span>'}</span>
      </div>
      ${r.todo?`<div class="opp-row"><span class="opp-row-l">📋 TODO</span><span class="opp-row-v" style="font-size:11px;max-width:160px;text-align:right">${r.todo}</span></div>`:''}

      <button class="opp-btn sc" onclick="openEdit('${r.id}')">✏️ Atualizar</button>

// ── QUICK ACTIONS ──
async function quickBoletar(id){
  const r=OPPS.find(o=>o.id===id);
  if(!r||!confirm(`Marcar "${r.cliente}" como Boletado?`))return;
  const now=new Date();
  const hist=[...(r.historico||[]),{campo:'Pendência boleta',de:r.pb,para:'Boletado',usuario:USER.nome,data:now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}];
  try{
    await db('PATCH','oportunidades',{pb:'Boletado',historico:hist,updated_at:now.toISOString()},`id=eq.${id}`);
    showToast('✅ Marcado como Boletado!',true);
    await loadData();
    renderAssessorOpps();
  }catch(e){showToast('Erro: '+e.message)}
}

function renderAssessorDash(c=document.getElementById('main-content')){
  const myOpps=OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
  const bolRows=myOpps.filter(isB);
  const bolV=bolRows.reduce((s,r)=>s+(r.atual||0),0);
  const ativos=myOpps.filter(r=>!isB(r));
  const pipeV=ativos.reduce((s,r)=>s+(r.pipe||0),0);
  const pend=ativos.filter(isPend).length;
  const efet=myOpps.length?Math.round(bolRows.length/myOpps.length*100):0;

  // Minhas metas (responsável = eu)
  const minhasMetas=metasDoMes().filter(m=>norm(m.assessor)===norm(USER.nome)).map(m=>{
    const rows=OPPS.filter(r=>{
      if(m.area&&r.area!==m.area)return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const pct=m.meta_valor>0?Math.min(Math.round(boletado/m.meta_valor*100),999):0;
    return{...m,boletado,pct};
  });

  // Por segmento
  const segCards=subareasVis().map(([sk,a])=>{
    const so=myOpps.filter(r=>subAreaOf(r)===sk);
    if(!so.length)return'';
    const sb=so.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const sbN=so.filter(isB).length;
    const sp=so.filter(r=>!isB(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const spN=so.filter(r=>!isB(r)).length;
    return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;border-top:4px solid '+a.color+'">'
      +'<div style="font-size:12px;font-weight:700;color:'+a.color+';text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px">'+a.name+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +'<div style="background:var(--green-bg);border-radius:4px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase">✓ Boletado</div>'
      +'<div style="font-size:16px;font-weight:700;color:var(--green)">'+(fmt(sb)||'R$0')+'</div>'
      +'<div style="font-size:10px;color:var(--green)">'+sbN+' opor.</div>'
      +'</div>'
      +'<div style="background:var(--cream);border-radius:4px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">🔄 Em esteira</div>'
      +'<div style="font-size:16px;font-weight:700;color:'+a.color+'">'+(fmt(sp)||'—')+'</div>'
      +'<div style="font-size:10px;color:var(--muted)">'+spN+' opor.</div>'
      +'</div>'
      +'</div></div>';
  }).join('');

  // Esteira por etapa (mini funil)
  const funilRows=SC_CHAIN.map(s=>{
    const rows=ativos.filter(r=>scFunil(r.sc)===norm(s));
    return{s,n:rows.length,v:rows.reduce((s2,r)=>s2+(r.pipe||0),0)};
  });
  const perdRowsF=OPPS.filter(r=>!isB(r)&&isPerdida(r));
  funilRows.push({s:'❌ Perdido',n:perdRowsF.length,v:perdRowsF.reduce((s2,r)=>s2+(r.pipe||0),0),perd:true});
  const maxF=Math.max(...funilRows.map(f=>f.n),1);

function renderAssessorDaily(c=document.getElementById('main-content')){
  const myOpps=OPPS.filter(r=>{
    if(norm(r.assessor)===norm(USER.nome))return true;
    if(!(USER.areas||[]).includes(r.area))return false;
    if(r.responsavel&&norm(r.responsavel)!==norm(USER.nome))return false;
    return true;
  });
  const selN=Object.keys(DAILY).length;
  const reunN=Object.values(DAILY).filter(v=>v.tipo==='reuniao').length;
  const bolN2=Object.values(DAILY).filter(v=>v.tipo==='boleta').length;
  const todoN=Object.values(DAILY).filter(v=>v.tipo==='todo').length;

  const pendentes=myOpps.filter(r=>isPend(r)&&!isB(r));
  const reunioes=myOpps.filter(r=>norm(r.sc||'').includes('reunião')||norm(r.sc||'').includes('agendar'));
  const outros=myOpps.filter(r=>!isPend(r)&&!isB(r)&&!reunioes.find(x=>x.id===r.id));

  function grp(emoji,title,rows,color){

    return`<div class="day-group-title" style="color:${color}">${emoji} ${title}
      <span class="badge" style="background:${color};color:#fff;font-size:10px;padding:1px 7px">${rows.length}</span>
    </div>
    ${rows.map(r=>{
      const sel=!!DAILY[r.id];
      const tipo=DAILY[r.id]?.tipo||'';
      const acao=DAILY[r.id]?.acao||'';
      const bpb=matchBadge(r.pb||'',PB_BADGE)||'b-gray';
      return`<div class="daily-opp${sel?' sel':''}" id="dopp-${r.id}">
        <div class="daily-opp-top">
          <div class="daily-check${sel?' on':''}" onclick="toggleDaily('${r.id}',${!sel})"></div>
          <div class="daily-info">
            <div class="daily-cli">${r.cliente}</div>
            <div class="daily-meta">
              <span class="badge b-wine" style="font-size:10px">${AREAS[r.area]?.name||r.area}</span>
              ${r.sc?`<span class="badge b-gray" style="font-size:10px">${r.sc}</span>`:''}
              ${r.pb?`<span class="badge ${bpb}" style="font-size:10px">${r.pb}</span>`:''}
            </div>
            ${r.todo?`<div style="font-size:11px;color:var(--muted);margin-top:4px">📋 ${r.todo}</div>`:''}
          </div>
          <div class="daily-vol">${fmt(r.atual||r.pipe)}</div>

        ${sel?`<div class="daily-actions">
          <select class="sel-tipo" onchange="updateDaily('${r.id}','tipo',this.value)">
            <option value="">Tipo de ação...</option>
            <option value="reuniao"${tipo==='reuniao'?' selected':''}>📅 Reunião</option>
            <option value="boleta"${tipo==='boleta'?' selected':''}>✅ Boleta</option>
            <option value="todo"${tipo==='todo'?' selected':''}>📋 TODO/Ligação</option>
          </select>
          <input class="inp-acao" type="text" placeholder="O que vai fazer..." value="${acao}" onchange="updateDaily('${r.id}','acao',this.value)">
        </div>`:''}
      </div>`;
    }).join('')}`;
  }

  c.innerHTML=`
  <div class="daily-header">
    <div class="daily-title">☀️ Meu dia — ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div>
    <div class="daily-subtitle">Selecione as oportunidades que vai trabalhar hoje e defina a ação planejada</div>
    <div class="daily-kpis">
      <div class="daily-kpi"><div class="daily-kpi-v">${selN}</div><div class="daily-kpi-l">Selecionadas</div></div>
      <div class="daily-kpi"><div class="daily-kpi-v" style="color:${corMarca('#185FA5')}">${reunN}</div><div class="daily-kpi-l">📅 Reuniões</div></div>
      <div class="daily-kpi"><div class="daily-kpi-v" style="color:var(--green)">${bolN2}</div><div class="daily-kpi-l">✅ Boletas</div></div>
      <div class="daily-kpi"><div class="daily-kpi-v" style="color:var(--amber)">${todoN}</div><div class="daily-kpi-l">📋 TODOs</div></div>
    </div>
  </div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
    <button class="btn wine" onclick="exportDailyPDF()">📄 Exportar PDF do dia</button>
  </div>
  ${grp('📅','Reuniões agendadas',reunioes,corMarca('#8B1C2A'))}
  ${grp('⚡','Com pendência ativa',pendentes.filter(r=>!reunioes.find(x=>x.id===r.id)),'#854F0B')}
  ${grp('📂','Outras oportunidades',outros,'#5A3A3E')}
  ${!myOpps.length?'<div class="empty"><div class="empty-icon">📭</div><p>Nenhuma oportunidade atribuída a você ainda.</p></div>':''}`;
}

async function toggleDaily(oppId,checked){
  const t=today();
  try{
    if(checked){
      const res=await db('POST','daily_selecoes',{data:t,assessor:USER.nome,oportunidade_id:oppId,tipo:'',acao:''});
      DAILY[oppId]={tipo:'',acao:'',id:res?.[0]?.id};
    }else{
      if(DAILY[oppId]?.id)await db('DELETE','daily_selecoes','',`id=eq.${DAILY[oppId].id}`);
      delete DAILY[oppId];
    }
    renderAssessorDaily();
  }catch(e){showToast('Erro: '+e.message)}
}

async function updateDaily(oppId,field,value){
  if(!DAILY[oppId]?.id)return;
  DAILY[oppId][field]=value;
  try{await db('PATCH','daily_selecoes',{[field]:value},`id=eq.${DAILY[oppId].id}`);}catch{}
}

"kl">📋 TODOs</div><div class="kv">${grupos.todo.items.length}</div></div></div>${secoes}<div class="ftr"><span>Gerencial Comercial — Daily</span><span>${now.toLocaleString('pt-BR')}</span></div></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);

function fillSelect(selId,lista,atual){
  const sel=document.getElementById(selId);if(!sel)return;
  const m=new Map();
  lista.filter(Boolean).forEach(v=>{if(!m.has(norm(v)))m.set(norm(v),v)});
  if(atual&&!m.has(norm(atual)))m.set(norm(atual),atual);
  const vals=[...m.values()].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML='<option value="">— Vazio —</option>'
    +vals.map(v=>'<option value="'+v.replace(/"/g,'&quot;')+'">'+v+'</option>').join('')
    +'<option value="__novo__">➕ Digitar novo...</option>';
  sel.value=(atual&&m.has(norm(atual)))?m.get(norm(atual)):'';
  const nv=document.getElementById(selId+'-novo');
  if(nv){nv.style.display='none';nv.value='';}
}
function scPbChange(selId,novoId){
  const nv=document.getElementById(novoId);
  if(!nv)return;
  nv.style.display=document.getElementById(selId).value==='__novo__'?'block':'none';
  if(nv.style.display==='block')nv.focus();
}
function lerSel(selId){
  const v=document.getElementById(selId).value;
  if(v!=='__novo__')return v;
  const nv=document.getElementById(selId+'-novo');

}

  [['Status comercial',r.sc,newSc],['Pendência boleta',r.pb,newPb],['Volume atual',String(r.atual||0),String(newAtual)]].forEach(([campo,de,para])=>{if(de!==para&&para)hist.push({campo,de,para,usuario:USER.nome,data:ds})});
  const ligNova=document.getElementById('e-ligacao').value||'';
  if(ligNova!==(dataLigacao(r)||''))hist.push({campo:CAMPO_LIG_DATA,de:dataLigacao(r)||'',para:ligNova,usuario:USER.nome,data:ds});
  const newObs=document.getElementById('e-obs').value.trim();
  if(newObs)hist.push({campo:'Observação',de:'',para:newObs,usuario:USER.nome,data:ds});
  const escPara=document.getElementById('e-escala-para')?document.getElementById('e-escala-para').value:'';
  const escMotivoRaw=document.getElementById('e-escala-motivo')?document.getElementById('e-escala-motivo').value.trim():'';
  if((escPara||'')!==(r.escalado_para||'')){
    if(escPara)hist.push({campo:'Escala',de:r.escalado_para||'',para:escPara+(escMotivoRaw?' — '+escMotivoRaw:''),usuario:USER.nome,data:ds});
    else hist.push({campo:'Escala',de:r.escalado_para||'',para:'Resolvida',usuario:USER.nome,data:ds});
  }
  try{
    const dadosPatch={sc:newSc,pb:newPb,atual:newAtual,data_boleta:document.getElementById('e-data').value||null,todo:document.getElementById('e-todo').value,todo_data:document.getElementById('e-todo-data').value||null,reuniao_data:document.getElementById('e-reuniao').value||null,responsavel:document.getElementById('e-resp').value||'',escalado_para:escPara||null,escala_motivo:escPara?(escMotivoRaw?escMotivoRaw+' — por '+USER.nome:'Escalada por '+USER.nome):null,obs:newObs||r.obs||'',historico:hist,updated_at:now.toISOString()};
    await patchOppSeguro(dadosPatch,`id=eq.${editId}`);
    showToast('✅ Salvo com sucesso!',true);
    closeModal('edit');
    await loadData();
    if(curView==='a-opps')renderAssessorOpps();
    else if(curView==='a-daily')renderAssessorDaily();
    else if(curView==='d-pipeline')renderDPipeline();
  }catch(e){showToast('Erro: '+e.message);}
  btn.innerHTML='💾 Salvar';btn.disabled=false;
}

// anel de progresso em SVG — sem dependência, funciona nos dois temas
function anelPct(pct,cor,size,stroke){
  size=size||96;stroke=stroke||10;
  const r=(size-stroke)/2,c=2*Math.PI*r,cx=size/2;
  const p=Math.max(Math.min(pct,100),0);
  const off=c*(1-p/100);
  const fonte=size>=110?24:size>=90?19:16;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;flex-shrink:0">'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="'+stroke+'" stroke-linecap="round"'
    +' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"'
    +' style="transition:stroke-dashoffset .7s ease"/>'
    +'<text x="'+cx+'" y="'+cx+'" text-anchor="middle" dominant-baseline="central" '
    +'style="font-size:'+fonte+'px;font-weight:700;fill:'+cor+';font-family:inherit">'+Math.round(pct)+'%</text>'
    +'</svg>';
}
// barra com marcador de ritmo: onde deveria estar hoje vs onde está
function barraRitmo(real,meta,esperado,cor,alt){
  alt=alt||10;
  const w=meta>0?Math.min(real/meta*100,100):0;
  const we=meta>0?Math.min(esperado/meta*100,100):0;
  return '<div style="position:relative;height:'+alt+'px;background:var(--border);border-radius:'+(alt/2)+'px;overflow:visible">'
    +'<div style="width:'+w.toFixed(1)+'%;height:'+alt+'px;border-radius:'+(alt/2)+'px;background:'+cor+';transition:width .7s ease"></div>'
    +(meta>0&&esperado<meta?'<div title="onde deveria estar hoje" style="position:absolute;top:-3px;left:calc('+we.toFixed(1)+'% - 1px);width:2px;height:'+(alt+6)+'px;background:var(--text);border-radius:1px;opacity:.55"></div>':'')
    +'</div>';
}
function corPct(p){return p>=100?'var(--green)':p>=60?'var(--amber)':'var(--red)'}

// ── DEFINIÇÕES DO MÊS (METAS) ──
function renderMetas(c=document.getElementById('main-content')){
  const ml=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const mesLabel=ml.charAt(0).toUpperCase()+ml.slice(1);
  const du=diasUteis();
  const ehDiretor=USER.perfil==='diretor';

  // oportunidades de um comercial (mesma regra da Gestão do time)
  const oppsDe=nome=>OPPS.filter(r=>norm(r.responsavel||'')===norm(nome)||norm(r.assessor||'')===norm(nome));
  const rowsGrupo=ak=>OPPS.filter(r=>(ak==='rv'||ak==='rf')?subAreaOf(r)===ak:r.area===ak);
  const noGrupo=(r,ak)=>(ak==='rv'||ak==='rf')?subAreaOf(r)===ak:r.area===ak;

  // progresso de cada meta — AGORA filtrando pela pessoa dona da meta
  const metasComProgresso=metasDoMes().map(m=>{
    const rows=oppsDe(m.assessor).filter(r=>{
      if(m.area&&!noGrupo(r,m.area))return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
    const aBoletar=rows.filter(isABoletar).reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pipe=rows.filter(r=>!isB(r)&&!isPerdida(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const pct=m.meta_valor>0?Math.round(boletado/m.meta_valor*100):0;
    return{...m,boletado,aBoletar,pipe,pct,nOpps:rows.length};
  });

  if(!metasComProgresso.length){
    c.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">'
      +'<div><div style="font-size:18px;font-weight:700">Definições do mês</div>'
      +'<div style="font-size:12px;color:var(--muted)">'+mesLabel+'</div></div>'
      +(ehDiretor?'<button class="btn wine" onclick="openNewMeta()">+ Nova meta</button>':'')
      +'</div>'
      +'<div class="empty"><div class="empty-icon">🎯</div><p>Nenhuma meta definida para este mês ainda.<br>Clique em <strong>+ Nova meta</strong> para começar.</p></div>';
    return;
  }

  // ── agrupamentos ──
  const porArea={};
  metasComProgresso.forEach(m=>{(porArea[m.area]=porArea[m.area]||[]).push(m)});
  const GRUPOS=[...subareasVis().filter(([k])=>k==='rv'||k==='rf'),...areasVis()].filter(([ak])=>porArea[ak]&&porArea[ak].length);

  const areas=GRUPOS.map(([ak,a])=>{
    const meta=porArea[ak].reduce((s,m)=>s+(m.meta_valor||0),0);
    const rows=rowsGrupo(ak);
    const real=rows.filter(isBoletadoFirmado).reduce((s,r)=>s+(r.atual||0),0);
    const aBol=rows.filter(isABoletar).reduce((s,r)=>s+(r.atual||r.pipe||0),0);
    const pipe=rows.filter(r=>!isB(r)&&!isPerdida(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const pct=meta>0?Math.round(real/meta*100):0;
    const esperado=meta/du.tot*du.ate;
    return{ak,a,meta,real,aBol,pipe,pct,esperado,delta:real-esperado,precisaDia:Math.max(meta-real,0)/Math.max(du.rest,1)};
  });

  // totais globais somando os GRUPOS (rv/rf entram certo, sem dupla contagem com inv)
  const tMeta=areas.reduce((s,x)=>s+x.meta,0);
  const tReal=areas.reduce((s,x)=>s+x.real,0);
  const tPipe=areas.reduce((s,x)=>s+x.pipe,0);
  const tABol=areas.reduce((s,x)=>s+x.aBol,0);
  const tPct=tMeta>0?Math.round(tReal/tMeta*100):0;
  const tEsp=tMeta/du.tot*du.ate;
  const tDelta=tReal-tEsp;
  const falta=Math.max(tMeta-tReal,0);
  const precisaDia=falta/Math.max(du.rest,1);

  // ── BLOCO DE RITMO (o mesmo desenho para o total do mês e para cada área) ──
  // quebra por produto: trilha clara = pipe em aberto, barra cheia = boletado
  const produtosDaArea=(ak,cor)=>{
    const map={};
    rowsGrupo(ak).forEach(r=>{
      const pk=r.produto||'Outros';
      if(!map[pk])map[pk]={real:0,pipe:0};
      if(isBoletadoFirmado(r))map[pk].real+=(r.atual||0);
      if(!isB(r)&&!isPerdida(r))map[pk].pipe+=(r.pipe||0);
    });
    const itens=Object.entries(map).sort((a,b)=>(b[1].real-a[1].real)||(b[1].pipe-a[1].pipe));
    if(itens.length<2)return '';
    const base=Math.max(...itens.map(([,v])=>v.real+v.pipe),1);
    const track=tint(cor,.82);
    return '<div style="margin-top:16px;padding-top:13px;border-top:1px solid var(--border-l)">'
      +'<div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Por produto</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,340px));gap:5px 26px">'
      +itens.map(([nome,v])=>{
        const wT=Math.min((v.real+v.pipe)/base*100,100);
        const wR=Math.min(v.real/base*100,100);
        return '<div style="display:flex;align-items:center;gap:8px">'
          +'<span title="'+String(nome).replace(/"/g,'&quot;')+'" style="font-size:10.5px;font-weight:600;width:88px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+nome+'</span>'
          +'<div style="flex:1;position:relative;height:9px;min-width:40px">'
          +(wT?'<div style="position:absolute;left:0;top:0;height:9px;width:'+wT.toFixed(1)+'%;background:'+track+';border-radius:3px"></div>':'')
          +(wR?'<div style="position:absolute;left:0;top:0;height:9px;width:'+wR.toFixed(1)+'%;background:'+cor+';border-radius:3px"></div>':'')
          +'</div>'
          +'<span style="font-size:10.5px;font-weight:700;width:58px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;color:'+(v.real?cor:'var(--muted-l)')+'">'+(v.real?fmt(v.real):'—')+'</span>'
          +'</div>';
      }).join('')
      +'</div></div>';
  };

  // rotulo/corBorda mudam; todo o resto do desenho é idêntico entre o total e as áreas
  const blocoRitmo=o=>{
    const meta=o.meta||0, real=o.real||0;
    const pct=meta>0?Math.round(real/meta*100):0;
    const esperado=meta/du.tot*du.ate;
    const delta=real-esperado;
    const falta=Math.max(meta-real,0);
    const precisaDia=falta/Math.max(du.rest,1);
    const cor=corPct(pct);
    const selo=real>=meta&&meta>0
      ?'<span style="background:var(--green-bg);color:var(--green);border:1px solid var(--green-b);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:700">🏁 Meta batida</span>'
      :delta>=0
      ?'<span style="background:var(--green-bg);color:var(--green);border:1px solid var(--green-b);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:700">🔥 Adiantado '+fmt(delta)+'</span>'
      :'<span style="background:var(--red-bg);color:var(--red);border:1px solid var(--red-b);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:700">⚠️ Atrasado '+fmt(-delta)+'</span>';
    const miniStat=(l,v,c)=>'<div style="flex:1;min-width:105px">'
      +'<div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">'+l+'</div>'
      +'<div style="font-size:16px;font-weight:700;color:'+(c||'var(--text)')+';margin-top:2px;font-variant-numeric:tabular-nums">'+v+'</div></div>';
    return '<div style="background:var(--card);border:1px solid var(--border);border-left:4px solid '+o.corBorda+';border-radius:10px;padding:20px 24px;margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">'
      +anelPct(pct,cor,118,12)
      +'<div style="flex:1;min-width:260px">'
      +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">'
      +'<span style="font-size:11px;font-weight:700;color:'+(o.corRotulo||'var(--muted)')+';text-transform:uppercase;letter-spacing:.05em">'+o.rotulo+'</span>'+selo+'</div>'
      +'<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'
      +'<span style="font-size:40px;font-weight:700;line-height:1;color:'+cor+'">'+(fmt(real)||'R$0')+'</span>'
      +'<span style="font-size:15px;color:var(--muted)">de '+fmt(meta)+'</span></div>'
      +'<div style="margin:12px 0 6px">'+barraRitmo(real,meta,esperado,cor,12)+'</div>'
      +'<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);flex-wrap:wrap;gap:8px">'
      +'<span>▮ ritmo esperado hoje: '+fmt(esperado)+'</span>'
      +'<span>dia útil <strong style="color:var(--text)">'+du.ate+'</strong> de '+du.tot+' · faltam '+du.rest+'</span>'
      +'</div></div>'
      +'<div style="display:flex;gap:16px;flex-wrap:wrap;min-width:220px;padding-left:18px;border-left:1px solid var(--border-l)">'
      +miniStat('Falta',falta?fmt(falta):'—',falta?'var(--amber)':'var(--green)')
      +miniStat('Precisa/dia',(du.rest&&falta)?fmt(precisaDia):'—')
      +miniStat('Pipe aberto',fmt(o.pipe)||'—','var(--blue)')
      +(o.aBol?miniStat('A boletar',fmt(o.aBol),'var(--amber)'):'')
      +'</div>'
      +'</div>'
      +(o.produtos||'')
      +'</div>';
  };

  const hero=blocoRitmo({rotulo:'Realizado do mês',corBorda:'var(--wine)',real:tReal,meta:tMeta,pipe:tPipe,aBol:tABol});

  const cardsArea=areas.map(x=>blocoRitmo({
    rotulo:x.a.name, corRotulo:x.a.color, corBorda:x.a.color,
    real:x.real, meta:x.meta, pipe:x.pipe, aBol:x.aBol,
    produtos:produtosDaArea(x.ak,x.a.color),
  })).join('');

  // ── POR COMERCIAL (ranking) ──
  const porPessoa={};
  metasComProgresso.forEach(m=>{
    const k=m.assessor||'—';
    if(!porPessoa[k])porPessoa[k]={nome:k,metas:[],meta:0,real:0,aBol:0,pipe:0};
    const p=porPessoa[k];
    p.metas.push(m);p.meta+=(m.meta_valor||0);p.real+=m.boletado;p.aBol+=m.aBoletar;p.pipe+=m.pipe;
  });
  const pessoas=Object.values(porPessoa).map(p=>{
    p.pct=p.meta>0?Math.round(p.real/p.meta*100):0;
    p.esperado=p.meta/du.tot*du.ate;
    p.delta=p.real-p.esperado;
    return p;
  }).sort((a,b)=>b.pct-a.pct||b.real-a.real);
  const medalha=['🥇','🥈','🥉'];

  const linhasPessoa=pessoas.map((p,ix)=>{
    const cor=corPct(p.pct);
    const inits=String(p.nome).trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
    const subs=p.metas.map(m=>{
      const g=(SUBAREAS[m.area]||AREAS[m.area]||{});
      const pc=m.meta_valor>0?Math.round(m.boletado/m.meta_valor*100):0;
      return '<span style="display:inline-flex;align-items:center;gap:4px;background:var(--surf2);border:1px solid var(--border-l);border-radius:12px;padding:2px 8px;font-size:9.5px;white-space:nowrap">'
        +'<span style="width:6px;height:6px;border-radius:50%;background:'+(g.color||'var(--muted)')+'"></span>'
        +'<span style="font-weight:700">'+(g.name||m.area||'—')+(m.produto?' · '+m.produto:'')+'</span>'
        +'<span style="color:var(--muted)">'+fmtC(m.boletado)+'/'+fmtC(m.meta_valor)+'</span>'
        +'<strong style="color:'+corPct(pc)+'">'+pc+'%</strong>'
        +(ehDiretor?'<span onclick="event.stopPropagation();openEditMeta(\''+m.id+'\')" title="Editar meta" style="cursor:pointer;opacity:.5;margin-left:2px">✏️</span>'
          +'<span onclick="event.stopPropagation();delMeta(\''+m.id+'\')" title="Excluir meta" style="cursor:pointer;opacity:.5">×</span>':'')
        +'</span>';
    }).join(' ');
    return '<div style="display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--border-l)">'
      +'<div style="width:28px;text-align:center;font-size:19px;line-height:1;flex-shrink:0">'+(medalha[ix]||'<span style="font-size:11px;color:var(--muted-l);font-weight:700">'+(ix+1)+'º</span>')+'</div>'
      +'<div style="width:38px;height:38px;border-radius:50%;background:'+cor+';color:var(--card);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+inits+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">'
      +'<span style="font-size:13.5px;font-weight:700">'+p.nome+'</span>'
      +'<span style="font-size:12px;white-space:nowrap"><strong style="color:'+cor+'">'+(fmt(p.real)||'R$0')+'</strong>'
      +'<span style="color:var(--muted)"> / '+fmt(p.meta)+'</span>'

// ══════════════════════════════════════════════════════════
// ── FUNIL DE EFETIVIDADE: geradas > ligação > reunião > conversão ──
// Lê a MAIOR etapa que a oportunidade já alcançou (histórico + status atual).
// Usar só o status de hoje mentiria a favor: quem teve reunião e depois virou
// "Cliente Negou" sumiria da etapa de reunião e inflaria a taxa de conversão.
// ══════════════════════════════════════════════════════════
const ETAPA_IDX=s=>{
  const k=scFunil(s);
  if(!k)return -1;
  const i=SC_CHAIN.findIndex(x=>norm(x)===k);
  return i;
};
function etapaMaxima(r){
  let max=ETAPA_IDX(r.sc);
  (r.historico||[]).forEach(h=>{
    if(h.campo!=='Status comercial')return;
    const a=ETAPA_IDX(h.para), b=ETAPA_IDX(h.de);
    if(a>max)max=a;
    if(b>max)max=b;
  });
  return max;
}
const veioDePlanilha=r=>(r.historico||[]).some(h=>/\(planilha\)\s*$/.test(h.usuario||''));

// ── MARCAÇÃO EXPLÍCITA: o assessor confirma no card que ligou / que reuniu ──
// Vale mais que qualquer inferência: é o próprio time afirmando o fato.
// Guardado no histórico (sem coluna nova no banco); a última marcação de cada
// tipo é a que vale, então desmarcar realmente desmarca.
const MARCAS={
  lig:{campo:'Ligação',on:'Ligou para o cliente',off:'Desmarcou a ligação',ico:'📞',rot:'Ligou'},
  reu:{campo:'Reunião',on:'Reunião aconteceu',off:'Desmarcou a reunião',ico:'🤝',rot:'Fez reunião'},
};
// Data em que o assessor VAI LIGAR. Guardada como marcador no histórico — a
// última entrada é a que vale — para não exigir coluna nova no banco.
const CAMPO_LIG_DATA='Ligação marcada';
function dataLigacao(r){
  let v='';
  (r.historico||[]).forEach(h=>{if(h.campo===CAMPO_LIG_DATA)v=parseDataBoleta(h.para)||''});
  return v;
}
function marcaInfo(r,k){
  const M=MARCAS[k];let e=null;
  (r.historico||[]).forEach(h=>{if(h.campo===M.campo)e=(h.para===M.on)?h:null});
  return e;
}
const marcado=(r,k)=>!!marcaInfo(r,k);
async function toggleMarca(id,k,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  const r=OPPS.find(o=>String(o.id)===String(id));if(!r)return;
  const M=MARCAS[k],liga=!marcado(r,k);
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:M.campo,de:'',para:liga?M.on:M.off,usuario:USER.nome,data:ds}];
  r.historico=hist;                 // pinta na hora, sem esperar o banco
  pintaMarcas();
  const stampAntes=window._funilStamp||0;
  try{
    await db('PATCH','oportunidades',{historico:hist,updated_at:now.toISOString()},'id=eq.'+r.id);
  }catch(e){showToast('Não consegui salvar a marcação: '+e.message);return;}
  await loadData();renderCurView();pintaMarcas();
  // o aviso mostra o número novo do quadro de efetividade — a agulha mexe na hora,
  // mesmo quando o quadro não está visível na tela em que o clique aconteceu
  const naTela=(window._funilStamp||0)!==stampAntes;
  const f=calcFunil(naTela?(window._funilRows||[]):opsDoPeriodo(oppsDoUsuario()));
  const n=(k==='lig'?f.comLig:f.comReu), tot=f.geradas;
  const pct=tot?Math.round(n/tot*100):0;
  const quadro=' · efetividade: '+n+' de '+tot+(k==='lig'?' ligadas':' com reunião')+' ('+pct+'%)';
  showToast((liga?M.ico+' '+M.rot+' em '+(r.cliente||'oportunidade'):'Marcação removida de '+(r.cliente||'oportunidade'))+quadro,liga);
}
// repinta todo chip [data-mk="id|tipo"] a partir do estado atual
function pintaMarcas(){
  document.querySelectorAll('[data-mk]').forEach(el=>{
    const [id,k]=el.getAttribute('data-mk').split('|');
    const r=OPPS.find(o=>String(o.id)===String(id));
    el.classList.toggle('on',!!(r&&marcado(r,k)));
  });
}
function mkChip(r,k,grande){
  const M=MARCAS[k];
  return '<span class="mk'+(grande?' lg':'')+(marcado(r,k)?' on':'')+'" data-mk="'+r.id+'|'+k+'"'
    +' onclick="toggleMarca(\''+r.id+'\',\''+k+'\',event)"'
    +' title="'+(marcado(r,k)?'Marcado — clique para desmarcar':'Marcar que '+(k==='lig'?'ligou para o cliente':'a reunião aconteceu'))+'">'
    +M.ico+' '+(grande?(k==='lig'?'Ligou para o cliente':'Fez reunião'):M.rot)+'</span>';
}

// ── EVIDÊNCIA DE TOQUE REAL ──
// Uma ligação de verdade deixa rastro no card mesmo quando NÃO avança a etapa:
// o cliente não atendeu, pediu para ligar depois, e o card continua em "Ligar Cliente".
// Contam como toque: mexer no status saindo da etapa de ligação, escrever uma
// observação, marcar como feito na Daily (que grava observação) e agendar a reunião.
// Card parado em "Ligar Cliente" sem NENHUM registro é o único caso de "não ligou".
function teveAtividade(r){
  if(r.reuniao_data)return true;
  return (r.historico||[]).some(h=>{
    if(h.campo==='Observação')return !!String(h.para||'').trim();
    if(h.campo==='Status comercial')return ETAPA_IDX(h.de)===0&&norm(h.para||'')!==norm(h.de||'');
    return false;
  });
}
// LIGOU DE FATO = avançou de etapa, ou registrou atividade no card, ou já fechou.
const teveLigacao=r=>marcado(r,'lig')||etapaMaxima(r)>=1||teveAtividade(r)||isB(r);
// REUNIU DE FATO = a data da reunião já passou, ou o card SAIU da etapa de reunião
// (só sai depois do encontro acontecer), ou passou de "Cliente Confirmar", ou fechou.
// Reunião marcada para frente NÃO conta: ainda não aconteceu.
const reuniaoFutura=r=>!!r.reuniao_data&&r.reuniao_data.slice(0,10)>=today()&&!isB(r)&&!marcado(r,'reu');
function teveReuniao(r){
  if(marcado(r,'reu'))return true;   // o time confirmou: acabou a discussão
  if(isB(r))return true;
  if(r.reuniao_data&&r.reuniao_data.slice(0,10)<today())return true;   // a data já passou
  if(ETAPA_IDX(r.sc)>=3)return true;   // já passou de "Reunião Agendada"
  return (r.historico||[]).some(h=>h.campo==='Status comercial'&&ETAPA_IDX(h.de)>=2);
}

function calcFunil(rows){
  const geradas=rows.length;
  const comLig=rows.filter(teveLigacao).length;
  const comReu=rows.filter(teveReuniao).length;
  const conv=rows.filter(isBoletadoFirmado);
  const convN=conv.length;
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;
  return{
    geradas, comLig, comReu, convN,
    volume:conv.reduce((a,r)=>a+(r.atual||0),0),
    tLig:pct(comLig,geradas), tReu:pct(comReu,comLig), tConv:pct(convN,comReu),
    pontaAPonta:pct(convN,geradas),
    pDeLig:geradas-comLig, pDeReu:comLig-comReu, pDeConv:comReu-convN,
    dePlanilha:rows.filter(r=>veioDePlanilha(r)&&etapaMaxima(r)>=1).length,
    reuAgendada:rows.filter(r=>reuniaoFutura(r)&&!teveReuniao(r)).length,
  };
}

// período: 'mes' | 'tri' | 'ano' | 'tudo'
window._funilPer=window._funilPer||'mes';
function setFunilPer(p){window._funilPer=p;renderCurView();}
function opsDoPeriodo(rows){
  const p=window._funilPer;
  if(p==='tudo')return rows;
  const hoje=new Date();
  const ini=new Date(hoje);
  if(p==='mes')ini.setDate(1);
  else if(p==='tri')ini.setMonth(hoje.getMonth()-2,1);
  else if(p==='ano')ini.setMonth(0,1);
  ini.setHours(0,0,0,0);
  return rows.filter(r=>{
    if(!r.created_at)return true;           // sem data conhecida: não some do funil
    const d=new Date(r.created_at);
    return isNaN(d)?true:d>=ini;
  });
}

function funilHtml(rows,recorte){
  const perRows=opsDoPeriodo(rows);
  const f=calcFunil(perRows);
  // guardado para o modal de detalhe: o clique na barra abre exatamente esta população

    return '<div class="fnl">'
      +'<div class="fnl-top"><div><div class="fnl-lbl">Efetividade do funil</div>'
