// ══════════════════════════════════════════════════════════
// ── FOLLOW-UP: a aba de dados do dia ──
// Tudo aqui nasce de EVENTOS COM DATA extraídos do histórico de cada
// oportunidade. Nada de "status atual": o relatório precisa saber o DIA em
// que a ligação aconteceu, em que a reunião foi marcada, em que ela foi
// feita e em que a boleta fechou — senão não existe corte diário/semanal.
// O que não tem registro entra marcado como ⚠ inferido e aparece assim na lista.
// ══════════════════════════════════════════════════════════
const AREA_COMPROMISSO='compromisso';   // objetivos do dia moram na tabela metas, sem coluna nova
const EVTS={
  lig:{ico:'📞',rot:'Ligações feitas',cor:'var(--wine)',base:'',baseRot:''},
  mar:{ico:'📅',rot:'Reuniões marcadas',cor:'#2F6795',base:'lig',baseRot:'das ligações'},
  reu:{ico:'🤝',rot:'Reuniões feitas',cor:'#5E5896',base:'mar',baseRot:'das marcadas'},
  bol:{ico:'✅',rot:'Fechados',cor:'var(--green)',base:'reu',baseRot:'das reuniões feitas'},
};
const EVT_ORDEM=['lig','mar','reu','bol'];
// Boleta se mede em dinheiro. "3 fechados" não diz nada; R$1,2M diz.
// A contagem vira o detalhe, nunca o número principal.
const evDinheiro=t=>t==='bol';
const evValor=(ap,t)=>evDinheiro(t)?ap.vol:ap.n[t];
const evTexto=(ap,t)=>evDinheiro(t)?fmtR(ap.vol):String(ap.n[t]);
const nBoletas=n=>n+' boleta'+(n===1?'':'s');
const fmtR=v=>{const s=fmt(v);return s==='—'?'R$0':s};
const evDetalhe=(ap,t)=>(evDinheiro(t)&&ap.n.bol)?nBoletas(ap.n.bol):'';
const somaVal=itens=>itens.reduce((s,x)=>s+(x.r.atual||x.r.pipe||0),0);
const isoHist=s=>{const k=dtKey(s);return k?localISO(new Date(k)):''};
const isoDia=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||'').slice(0,10))?String(s).slice(0,10):'';

// Cada oportunidade vira uma lista de eventos datados. Cacheado no próprio
// objeto — o loadData recria os objetos, então o cache nunca fica velho.
function eventosDe(r){
  if(r.__ev)return r.__ev;
  const ev=[];
  const add=(t,data,txt,quem,inf)=>{
    const iso=isoDia(data)||isoHist(data);
    if(iso)ev.push({t,iso,txt,quem:quem||'',inf:!!inf});
  };
  (r.historico||[]).forEach(h=>{
    const q=h.usuario;
    if(h.campo===MARCAS.lig.campo&&h.para===MARCAS.lig.on)add('lig',h.data,'✓ marcou “ligou” no card',q);
    if(h.campo===MARCAS.reu.campo&&h.para===MARCAS.reu.on)add('reu',h.data,'✓ marcou “fez reunião” no card',q);
    if(h.campo==='Reunião marcada'&&h.para)add('mar',h.data,'marcou reunião para '+brData(isoDia(h.para)),q);
    if(h.campo==='Status comercial'){
      const di=ETAPA_IDX(h.de),pi=ETAPA_IDX(h.para);
      if(di===0&&pi>di)add('lig',h.data,'saiu de “'+(h.de||'—')+'” para “'+(h.para||'—')+'”',q);
      if(pi>=2&&di<2)add('mar',h.data,'entrou em “'+(h.para||'—')+'”',q);
      if(di>=2&&pi>di)add('reu',h.data,'avançou de “'+(h.de||'—')+'” para “'+(h.para||'—')+'”',q);
    }
    if(h.campo==='Pendência boleta'&&pbFechada(h.para))add('bol',h.data,'boleta → '+h.para,q);
  });
  const rd=isoDia(r.reuniao_data);
  if(rd){
    if(!ev.some(e=>e.t==='mar'))add('mar',rd,'⚠ inferido: reunião na agenda, sem registro de quando foi marcada','',1);
    if(rd<today()&&!ev.some(e=>e.t==='reu'))add('reu',rd,'⚠ inferido: data da reunião já passou','',1);
  }
  if(isBoletadoFirmado(r)&&!ev.some(e=>e.t==='bol')){
    const d=parseDataBoleta(r.data_boleta);
    if(d)add('bol',d,'⚠ inferido: boletada sem registro na linha do tempo','',1);
  }
  ev.sort((a,b)=>a.iso.localeCompare(b.iso));
  try{Object.defineProperty(r,'__ev',{value:ev,enumerable:false,configurable:true})}catch(e){r.__ev=ev}
  return ev;
}
// Conta OPORTUNIDADES DISTINTAS por etapa dentro do intervalo. Duas ligações
// para o mesmo cliente na semana contam uma vez — senão a taxa de conversão
// mentiria (16 reuniões sobre 62 toques não é o mesmo que sobre 62 clientes).
// Atividade é de quem REGISTRA, não de quem é dono do card: se o Jackson
// marca a ligação num card de seguro da Cris, a ligação é dele e o seguro é a
// área dela. Registro sem autor (evento inferido) fica com o dono do card.
let _apQuem='';
function comQuem(nome,fn){
  const ant=_apQuem;_apQuem=nome||'';
  try{return fn()}finally{_apQuem=ant}
}
const tocouAlgumDia=(r,nome)=>(r.historico||[]).some(h=>normUsuario(h.usuario)===norm(nome));
// o que uma pessoa mexe: o que é dela e o que ela trabalhou, dentro das áreas dela
function rowsDoComercial(nome,base){
  return (base||fuBase()).filter(r=>noEscopoDe(r,nome)&&(eDono(r,nome)||tocouAlgumDia(r,nome)));
}
function apurar(rows,de,ate){
  const quem=_apQuem?norm(_apQuem):'';
  const S={lig:[],mar:[],reu:[],bol:[]},vis={lig:new Set(),mar:new Set(),reu:new Set(),bol:new Set()};
  rows.forEach(r=>eventosDe(r).forEach(e=>{
    if(e.iso<de||e.iso>ate)return;
    if(quem){
      const autor=e.quem?normUsuario(e.quem):'';
      if(autor?autor!==quem:!eDono(r,_apQuem))return;
    }
    if(vis[e.t].has(r.id))return;
    vis[e.t].add(r.id);S[e.t].push({r,e});
  }));
  const vol=S.bol.reduce((s,x)=>s+(x.r.atual||0),0);
  return{...S,vol,n:{lig:S.lig.length,mar:S.mar.length,reu:S.reu.length,bol:S.bol.length}};
}
// ── escopo da aba ──
function fuBase(){
  const base=OPPS_ALL.length?OPPS_ALL:OPPS;   // inclui arquivadas: a virada de mês não pode apagar o histórico de eventos
  if(USER.perfil==='diretor'||USER.perfil==='gestor')return base;
  return base.filter(r=>r.responsavel?norm(r.responsavel)===norm(USER.nome)
    :(norm(r.assessor||'')===norm(USER.nome)||(USER.areas||[]).includes(r.area)));
}
function fuRows(){
  let rows=fuBase();
  if(window._fuArea)rows=rows.filter(r=>r.area===window._fuArea);
  if(window._fuCom)rows=rowsDoComercial(window._fuCom,rows);
  return rows;
}
// As áreas de uma pessoa são as do CADASTRO dela. Card em área que não é
// dela não entra na conta dela — se o card está errado, quem se corrige é o
// card, não o número. O desencontro vira aviso, nunca linha na tabela.
function areasDoCadastro(nome){
  const u=USUARIOS.find(x=>norm(x.nome)===norm(nome));
  if(!u)return null;                                  // nome fora da lista: não filtra nada
  if(u.perfil==='diretor')return Object.keys(AREAS);
  return u.areas||[];
}
function noEscopoDe(r,nome){
  const a=areasDoCadastro(nome);
  return !a||!a.length||a.includes(r.area);
}
function trabalhaArea(nome,ak){
  if(!ak)return true;
  const a=areasDoCadastro(nome);
  return !a||!a.length||a.includes(ak);
}
// quem olha só a Quark não pode aparecer na lista da QRK
function trabalhaEmpresa(nome,ek){
  if(!ek)return true;
  const u=USUARIOS.find(x=>norm(x.nome)===norm(nome));
  if(!u)return true;
  if(u.perfil==='diretor')return true;
  return (u.empresas||[EMP_PADRAO]).includes(ek);
}
function fuComerciais(){
  if(USER.perfil==='diretor'||USER.perfil==='gestor')
    return USUARIOS.filter(u=>u.ativo&&u.perfil!=='diretor'&&(USER.perfil==='diretor'||(u.areas||[]).some(a=>(USER.areas||[]).includes(a))))
      .filter(u=>trabalhaArea(u.nome,window._fuArea)&&trabalhaEmpresa(u.nome,empAtual())).map(u=>u.nome);
  return [USER.nome];
}
// as áreas da pessoa, na ordem do sistema
function areasDeFato(nome){
  const a=areasDoCadastro(nome);
  return a?areasVis().filter(([k])=>a.includes(k)):[];
}
// áreas em que a pessoa tem oportunidade e que NÃO estão no cadastro dela
function areasForaDoPerfil(nome){
  const u=USUARIOS.find(x=>norm(x.nome)===norm(nome))||{};
  if(u.perfil==='diretor')return [];
  const perfil=new Set(u.areas||[]);
  const set=new Set();
  (OPPS_ALL.length?OPPS_ALL:OPPS).forEach(r=>{if(!arquivada(r)&&eDono(r,nome)&&!perfil.has(r.area))set.add(r.area)});
  return [...set];
}
function fuPer(){return window._fuPer||'dia'}
function fuRange(p){
  const hj=localISO(new Date());
  if(p==='dia')return[hj,hj,'Hoje',brData(hj)];
  if(p==='semana'){const[a,b]=semanaDe(new Date());return[a,b,'Esta semana',brData(a)+' a '+brData(b)]}
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const a=localISO(new Date(y,m,1)),b=localISO(new Date(y,m+1,0));
  const nm=d.toLocaleDateString('pt-BR',{month:'long'});

}

// Guardados na tabela metas: area='compromisso', produto='AAAA-MM-DD|tipo'.
// É o que fecha o ciclo que o diretor pediu — o que prometi ontem vira a
// cobrança de hoje, sem ninguém precisar lembrar de cabeça.
const compKey=(iso,t)=>iso+'|'+t;
function compromissoDe(nome,iso,t){
  const m=METAS.find(x=>x.area===AREA_COMPROMISSO&&norm(x.assessor||'')===norm(nome)&&x.produto===compKey(iso,t));
  return m?{id:m.id,v:m.meta_valor||0}:null;
}
function temCompromisso(nome,iso){return EVT_ORDEM.some(t=>compromissoDe(nome,iso,t))}
async function salvarObjetivos(nome,iso){
  const ops=[];let algum=0;
  for(const t of EVT_ORDEM){
    const el=document.getElementById('fu-obj-'+t);if(!el)continue;
    const v=evDinheiro(t)?Math.max(0,Math.round(parseMoeda(el.value))):Math.max(0,parseInt(el.value||'0',10)||0);
    if(v)algum=1;
    const ex=compromissoDe(nome,iso,t);
    if(ex&&ex.v===v)continue;
    if(ex)ops.push(db('PATCH','metas',{meta_valor:v},'id=eq.'+ex.id));
    else if(v>0)ops.push(db('POST','metas',{mes:iso.slice(0,7),assessor:nome,
      area:areaComEmpresa(AREA_COMPROMISSO,empParaGravar()),produto:compKey(iso,t),meta_valor:v}));
  }
  if(!ops.length){showToast(algum?'Os objetivos já estavam salvos assim':'Escreva quantos você vai fazer hoje');return}
  try{
    await Promise.all(ops);
    showToast('🎯 Objetivos de '+brData(iso)+' registrados — amanhã eu cobro',true);
    await loadData();renderCurView();
  }catch(e){showToast('Erro ao salvar objetivos: '+e.message)}
}

// ══ PERDAS: onde o negócio morreu ══
// Quando alguém arrasta o card para "Cliente Negou", o histórico guarda de
// qual coluna ele saiu. É esse "de" que responde a pergunta que importa:
// perdemos antes de conseguir a reunião, ou depois de tê-la feito?
function perdaDe(r){
  let ev=null;
  (r.historico||[]).forEach(h=>{
    if(h.campo==='Status comercial'&&norm(h.para||'')==='cliente negou')ev=h;
  });
  if(ev)return{etapa:(ev.de||'').trim(),quando:isoHist(ev.data),quem:ev.usuario||'',inf:false};
  return{etapa:'',quando:isoDia(r.updated_at)||isoDia(r.created_at),quem:'',inf:true};
}
const ETAPA_PERDA_SEM='⚠ sem registro da etapa';
function perdidasDoPeriodo(rows,de,ate){
  const quem=_apQuem?norm(_apQuem):'';
  const out=[];
  rows.forEach(r=>{
    if(!isPerdida(r))return;
    const p=perdaDe(r);
    if(!p.quando||p.quando<de||p.quando>ate)return;
    if(quem){
      const autor=p.quem?normUsuario(p.quem):'';
      if(autor?autor!==quem:!eDono(r,_apQuem))return;
    }
    out.push({r,quando:p.quando,etapa:p.etapa||ETAPA_PERDA_SEM,inf:p.inf,
      txt:'perdida'+(p.etapa?' em "'+p.etapa+'"':' — sem registro da etapa')+(p.quem?' · '+p.quem:'')});
  });
  return out.sort((a,b)=>String(b.quando).localeCompare(String(a.quando)));
}
function perdasPorEtapa(lista){
  const m=new Map();
  lista.forEach(x=>{if(!m.has(x.etapa))m.set(x.etapa,[]);m.get(x.etapa).push(x)});
  return [...m.entries()]
    .map(([rot,itens])=>({rot,n:itens.length,vol:itens.reduce((s,x)=>s+(x.r.pipe||x.r.atual||0),0),itens}))
    .sort((a,b)=>b.n-a.n||b.vol-a.vol);
}
const volPerdas=l=>l.reduce((s,x)=>s+(x.r.pipe||x.r.atual||0),0);

    {k:'reu',rot:'realizar a reunião',t:tx(ap.n.reu,ap.n.mar),de:'reuniões marcadas',n:ap.n.mar,p:ap.n.reu},
    {k:'bol',rot:'fechar a boleta',t:tx(ap.n.bol,ap.n.reu),de:'reuniões feitas',n:ap.n.reu,p:ap.n.bol},
  ].filter(x=>x.t!==null&&x.n>0);

  const parado=ativas.filter(r=>daysSince(getLastMoveDate(r))>=7).map(r=>({r,txt:daysSince(getLastMoveDate(r))+' dias sem nenhum registro'}));

  ];

function fuAgendadoHoje(rows,t){
  const hj=localISO(new Date());
  const a=rows.filter(r=>!arquivada(r)&&!isB(r));
  if(t==='lig')return a.filter(r=>dataLigacao(r)===hj).map(r=>({r,txt:'ligação marcada para hoje'}));
  if(t==='reu')return a.filter(r=>isoDia(r.reuniao_data)===hj).map(r=>({r,txt:'reunião marcada para hoje'}));
  if(t==='bol')return rows.filter(r=>!arquivada(r)&&parseDataBoleta(r.data_boleta)===hj).map(r=>({r,txt:'boleta marcada para hoje'}));
  return null;   // "reuniões a marcar" não tem data em card nenhum: só existe como promessa
}

function fuMetaValor(){
  let ms=metasDoMes();
  if(window._fuArea)ms=ms.filter(m=>m.area===window._fuArea);
  if(window._fuCom)ms=ms.filter(m=>norm(m.assessor||'')===norm(window._fuCom));
  else if(USER.perfil!=='diretor'&&USER.perfil!=='gestor')ms=ms.filter(m=>norm(m.assessor||'')===norm(USER.nome));
  return ms.reduce((s,m)=>s+(m.meta_valor||0),0);
}

// ══ RITMO PARA A META ══
// A conta é de trás para frente: a meta é volume, então divide pelo ticket
// médio para saber quantas boletas faltam; sobe o funil pelas taxas de
// conversão do próprio time para saber quantas reuniões e ligações isso exige;
// e divide pelo número de dias úteis (ou semanas) para virar ritmo.
// A base histórica são os últimos 90 dias — o mês corrente sozinho é curto
// demais e faria a taxa pular todo dia.
const FU_BASE_DIAS=90;
function fuRitmo(rows){
  const hoje=new Date();
  const ini=new Date(hoje);ini.setDate(ini.getDate()-FU_BASE_DIAS);
  const h=apurar(rows,localISO(ini),localISO(hoje));
  const ticket=h.n.bol?h.vol/h.n.bol:0;
  const meta=fuMetaValor();
  const taxa=(n,b)=>b?n/b:0;
  const tMar=taxa(h.n.mar,h.n.lig), tReu=taxa(h.n.reu,h.n.mar), tBol=taxa(h.n.bol,h.n.reu);
  const alvo={bol:0,reu:0,mar:0,lig:0};
  if(meta&&ticket){
    alvo.bol=meta/ticket;
    if(tBol)alvo.reu=alvo.bol/tBol;
    if(tBol&&tReu)alvo.mar=alvo.reu/tReu;
    if(tBol&&tReu&&tMar)alvo.lig=alvo.mar/tMar;
  }
  return{meta,ticket,tMar,tReu,tBol,alvo,hist:h};
}
// alvo do mês distribuído no eixo do gráfico, acumulado
function fuAlvoSerie(serie,t,rt,p){
  const alvoMes=evDinheiro(t)?rt.meta:rt.alvo[t];
  if(!alvoMes)return null;
  const du=diasUteis();
  const porBucket=p==='dia'?alvoMes/Math.max(du.tot,1)
                 :p==='semana'?alvoMes/Math.max(du.tot/5,1)
                 :alvoMes;
  let a=0;
  return serie.map(b=>{
    if(p==='dia'){const d=new Date(b.de+'T00:00:00').getDay();if(d!==0&&d!==6)a+=porBucket;}
    else a+=porBucket;
    return evDinheiro(t)?Math.round(a):Math.round(a*10)/10;
  });
}
// quanto precisa por dia e por semana, em número redondo
function fuRitmoTexto(rt){
  if(!rt.meta)return{ok:false,txt:'Sem meta definida para este recorte — a tracejada mostra a janela anterior.'};
  if(!rt.ticket)return{ok:false,txt:'Nenhuma boleta nos últimos '+FU_BASE_DIAS+' dias: sem ticket médio não dá para calcular o ritmo. A tracejada mostra a janela anterior.'};
  const du=diasUteis();
  const nSem=Math.max(du.tot/5,1);
  const ar=n=>n>=10?Math.round(n):Math.round(n*10)/10;
  const pd=n=>String(ar(n/Math.max(du.tot,1))).replace('.',',');
  const ps=n=>String(ar(n/nSem)).replace('.',',');
  const etapa=(t,rot)=>rt.alvo[t]?rot+': <b>'+Math.ceil(rt.alvo[t])+'</b> no mês · '+pd(rt.alvo[t])+'/dia · '+ps(rt.alvo[t])+'/semana':'';
  const partes=[etapa('lig','📞 ligações'),etapa('mar','📅 reuniões marcadas'),etapa('reu','🤝 reuniões feitas')].filter(Boolean);
  const pct=n=>(n*100).toFixed(0)+'%';
  return{ok:true,
    cab:'Ticket médio <b>'+fmtR(rt.ticket)+'</b> · meta <b>'+fmtR(rt.meta)+'</b> = <b>'+Math.ceil(rt.alvo.bol)+' boletas</b>'
        +(rt.alvo.reu?'. Pelas conversões do time ('+pct(rt.tMar)+' → '+pct(rt.tReu)+' → '+pct(rt.tBol)+'), isso pede:':'.'),
    linhas:partes,
    falta:partes.length?'':'Faltam conversões registradas nos últimos '+FU_BASE_DIAS+' dias para transformar a meta em número de reuniões e ligações.'};
}

// ══ GRÁFICOS DE EVOLUÇÃO — um painel por indicador ══
// São small multiples: cada painel tem ícone, título e o próprio número, então
// a identidade nunca depende só da cor. A paleta foi validada para daltonismo
// nos dois temas (pares vizinhos ΔE ≥ 8).
const EV_COR_LIGHT={lig:'#B32D3F',mar:'#1C7FD0',reu:'#B8791A',bol:'#0F8A66'};
const EV_COR_DARK ={lig:'#D05063',mar:'#3F92D4',reu:'#BC8526',bol:'#189672'};
const evCor=t=>(document.documentElement.getAttribute('data-theme')==='dark'?EV_COR_DARK:EV_COR_LIGHT)[t];
// buckets do período: 14 dias, 8 semanas ou 6 meses
const FU_JANELA={dia:14,semana:8,mes:6};
function fuBuckets(p,off){
  const N=FU_JANELA[p]||FU_JANELA.dia, o=(off||0)*N, out=[], hoje=new Date();
  for(let i=N-1;i>=0;i--){
    const k=i+o;
    if(p==='dia'){const d=new Date(hoje);d.setDate(d.getDate()-k);const iso=localISO(d);
      out.push({rot:brData(iso),de:iso,ate:iso,atual:!off&&i===0,futuro:false});}
    else if(p==='semana'){const d=new Date(hoje);d.setDate(d.getDate()-k*7);const[a,b]=semanaDe(d);
      out.push({rot:brData(a),de:a,ate:b,atual:!off&&i===0,futuro:false});}
    else{const d=new Date(hoje.getFullYear(),hoje.getMonth()-k,1);
      const a=localISO(d),b=localISO(new Date(d.getFullYear(),d.getMonth()+1,0));
      const nm=d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
      out.push({rot:nm.charAt(0).toUpperCase()+nm.slice(1),de:a,ate:b,atual:!off&&i===0,futuro:false});}
  }
  return out;
}
function fuSerie(rows,p,off){
  return fuBuckets(p,off).map(b=>{const ap=apurar(rows,b.de,b.ate);
    return Object.assign({},b,{n:ap.n,vol:ap.vol,ap})});
}
// soma corrida: é assim que a curva da meta lê, e é assim que o diretor
// enxerga "estou à frente ou atrás do que eu já fui"
function fuAcumula(serie,t){let a=0;return serie.map(b=>{a+=b.n[t];return a})}
function fuAcumulaVol(serie){let a=0;return serie.map(b=>{a+=b.vol;return a})}
function fuGraficosHtml(rows){
  const p=fuPer();
  const serie=fuSerie(rows,p,0), ant=fuSerie(rows,p,1);
  window._fuSerie=serie;window._fuSerieAnt=ant;
  const N=FU_JANELA[p];
  const unidade=p==='dia'?'últimos '+N+' dias':p==='semana'?'últimas '+N+' semanas':'últimos '+N+' meses';
  const soma=(s,t)=>s.reduce((a,b)=>a+b.n[t],0);
  const pills=[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([v,l])=>
    '<button class="'+(v===p?'on':'')+'" onclick="setFuPer(\''+v+'\')">'+l+'</button>').join('');

  const somaVol=s=>s.reduce((a,b)=>a+b.vol,0);
  const rt=fuRitmo(rows), rtx=fuRitmoTexto(rt);
  window._fuAlvo={};
  const paineis=EVT_ORDEM.map(t=>{
    const E=EVTS[t],money=evDinheiro(t);
    const tot=money?somaVol(serie):soma(serie,t), totAnt=money?somaVol(ant):soma(ant,t);
    const txt=v=>money?fmtR(v):(Math.round(v*10)/10).toString().replace('.',',');
    const serieAlvo=fuAlvoSerie(serie,t,rt,p);
    window._fuAlvo[t]=serieAlvo;
    // o alvo do painel é o do último balde: é onde a tracejada está agora
    const alvoJanela=serieAlvo?serieAlvo[serieAlvo.length-1]:null;
    const dif=alvoJanela?Math.round((tot-alvoJanela)/alvoJanela*100):(totAnt?Math.round((tot-totAnt)/totAnt*100):null);
    const ref=alvoJanela?'ritmo pede '+txt(alvoJanela):'anterior '+txt(totAnt);
    return '<div class="fu-ch">'
      +'<div class="fu-ch-hdr"><span class="ico">'+E.ico+'</span>'
      +'<div class="tt">'+E.rot+'</div>'
      +'<div class="nn'+(money?' dinheiro':'')+'">'+txt(tot)+'</div></div>'
      +'<div class="fu-ch-sub">'+(money&&soma(serie,t)?nBoletas(soma(serie,t))+' · ':'')
      +ref
      +(dif===null?'':' · <b style="color:'+(dif>=0?'var(--green)':'var(--red)')+'">'+(dif>=0?'+':'')+dif+'%</b>')
      +'</div>'
      +'<div class="fu-ch-box"><canvas id="fu-ch-'+t+'"></canvas></div>'
      +'</div>';
  }).join('');
  const conta=rtx.ok
    ? '<div class="fu-conta"><div class="c1">'+rtx.cab+'</div>'
      +(rtx.linhas.length?'<div class="c2">'+rtx.linhas.map(x=>'<span>'+x+'</span>').join('')+'</div>':'')
      +(rtx.falta?'<div class="c3">'+rtx.falta+'</div>':'')+'</div>'
    : '<div class="fu-conta neutra"><div class="c3">'+rtx.txt+'</div></div>';

  return '<div class="fu-sec">'
    +'<div class="fu-sec-hdr"><div><div class="fu-sec-t">Evolução dos indicadores</div>'
    +'<div class="fu-sec-s">acumulado nos '+unidade+' · a tracejada é o ritmo necessário para bater a meta</div></div>'
    +'<div class="fu-seg">'+pills+'</div></div>'
    +conta+'<div class="fu-chs">'+paineis+'</div>'
    +'<div class="fu-nota">Clique num ponto para abrir as oportunidades daquele '
    +(p==='dia'?'dia':p==='semana'?'semana':'mês')+'.</div>'
    +'</div>';
}
function fuDesenhaGraficos(){
  const serie=window._fuSerie||[],ant=window._fuSerieAnt||[];
  if(!serie.length||typeof Chart==='undefined')return;
  const css=v=>(getComputedStyle(document.body).getPropertyValue(v)||'').trim();
  const grid=css('--border-l')||'#eee', ink=css('--muted-l')||'#999', comp=css('--muted')||'#888';
  EVT_ORDEM.forEach(t=>{
    const el=document.getElementById('fu-ch-'+t);if(!el)return;
    const k='fuCh'+t;
    if(charts[k]){try{charts[k].destroy()}catch(e){}}
    const cor=evCor(t);
    const money=evDinheiro(t);
    const alvo=(window._fuAlvo||{})[t];
    const acum=money?fuAcumulaVol(serie):fuAcumula(serie,t);
    const acumAnt=money?fuAcumulaVol(ant):fuAcumula(ant,t);
    const rotV=v=>money?fmtR(v):v;
    charts[k]=new Chart(el,{type:'line',data:{labels:serie.map(b=>b.rot),datasets:[
      {label:'Acumulado',data:acum,borderColor:cor,backgroundColor:cor+'26',borderWidth:2,
       fill:true,tension:.25,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:cor,
       pointHoverBorderColor:css('--card')||'#fff',pointHoverBorderWidth:2,order:1},
      {label:alvo?'Ritmo para a meta':'Janela anterior',data:alvo||acumAnt,borderColor:comp,borderWidth:2,
       borderDash:[5,4],fill:false,tension:alvo?0:.25,pointRadius:0,pointHoverRadius:0,order:2}
    ]},options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      onClick:(e,els)=>{if(!els.length)return;const b=serie[els[0].index];if(!b)return;
        const lista=fuItens(b.ap[t]);
        if(lista.length)fuAbrir(fuKey(lista,EVTS[t].ico+' '+EVTS[t].rot,b.rot));},
      plugins:{legend:{display:true,position:'bottom',align:'start',
          labels:{boxWidth:9,boxHeight:9,font:{size:9},color:ink,padding:8,usePointStyle:false}},
        tooltip:{callbacks:{title:c=>c[0].label,
          label:c=>c.dataset.label+': '+rotV(c.parsed.y)+' acum.',
          afterBody:c=>{const i=c[0].dataIndex,b=serie[i];
            return b?['no '+(b.rot)+': '+(money?fmtR(b.vol)+' · '+nBoletas(b.n[t]):b.n[t])]:[]}}}},
      scales:{x:{grid:{display:false},ticks:{font:{size:9},color:ink,maxRotation:0,autoSkip:true,maxTicksLimit:7}},
        y:{beginAtZero:true,grid:{color:grid},border:{display:false},
           ticks:{font:{size:9},color:ink,precision:money?undefined:0,maxTicksLimit:4,
                  callback:v=>money?(fmt(v)||'0'):v}}}}});
  });
}

// ══ QUEBRA POR ÁREA ══
// Quem atende duas áreas não pode ser lido por um número só: "ligou para 50"
// não diz se o seguro andou ou se foi tudo consórcio.
// Quais oportunidades amarram essa pessoa a essa área — e por qual campo.
// É o que responde "por que o Jackson está aparecendo em Investimentos?".
function oppsQuePrendem(nome,ak){
  return (OPPS_ALL.length?OPPS_ALL:OPPS)
    .filter(r=>r.area===ak&&!arquivada(r)&&eDono(r,nome))
    .map(r=>({r,quando:isoDia(r.updated_at)||isoDia(r.created_at),
      txt:r.responsavel?('responsável: '+r.responsavel):('sem responsável — entrou pelo assessor: '+(r.assessor||'—'))}));
}
function fuAbrirVinculo(nome,ak){
  const itens=oppsQuePrendem(nome,ak);
  const a=AREAS[ak]||{name:ak};
  fuAbrir(fuKey(itens,'⚠ '+nome+' em '+a.name,
    itens.length+' oportunidade'+(itens.length!==1?'s':'')+' — corrija o responsável no card ou inclua a área no cadastro'));
}
// as áreas que a pessoa cuida, direto do cadastro — mesmo as que ainda estão zeradas
function areasDoComercial(nome){return areasDeFato(nome);}
function linhaPorArea(rot,cor,rs,de,ate,quem){
  const ap=apurar(rs,de,ate);
  const cel=t=>'<td class="'+(evValor(ap,t)?'':'zero')+(evDinheiro(t)?' dinheiro':'')+'"'
    +fuClick(fuItens(ap[t]),EVTS[t].ico+' '+EVTS[t].rot+' · '+rot,quem||'')+'>'+evTexto(ap,t)+'</td>';
  const ponta=ap.n.lig?(ap.n.bol/ap.n.lig*100):null;
  return{ap,html:'<td class="nm"><span class="dot" style="background:'+cor+'"></span>'+rot+'</td>'
    +EVT_ORDEM.map(cel).join('')
    +'<td class="'+(ponta?'':'zero')+'">'+(ponta===null?'—':ponta.toFixed(0)+'%')+'</td>'};
}
function fuPorAreaHtml(nome,rows){
  const areas=areasDoComercial(nome);
  if(areas.length<2)return '';          // uma área só: o número de cima já basta
  const p=fuPer(),[de,ate,rot,intervalo]=fuRange(p);
  const linhas=areas.map(([k,a])=>'<tr>'+linhaPorArea(a.name,a.color,rows.filter(r=>r.area===k),de,ate,nome).html+'</tr>').join('');
  void 0;
  const tot=linhaPorArea('Total','var(--text)',rows,de,ate,nome);
  return '<div class="fu-sec">'
    +'<div class="fu-sec-hdr"><div><div class="fu-sec-t">'+nome.split(' ')[0]+' por área</div>'
    +'<div class="fu-sec-s">'+rot+' · '+intervalo+' — cuida de '+areas.length+' áreas, '
    +'então o número só faz sentido separado</div></div></div>'
    +'<div style="overflow-x:auto"><table class="fu-tb fu-tb-area"><thead><tr><th>Área</th>'
    +EVT_ORDEM.map(t=>'<th class="c" title="'+EVTS[t].rot+'">'+EVTS[t].ico+' '+EVTS[t].rot+'</th>').join('')
    +'<th class="c" title="de cada 100 ligações, quantas viraram boleta">ponta a ponta</th>'
    +'</tr></thead><tbody>'+linhas
    +'<tr class="tot">'+tot.html+'</tr>'
    +'</tbody></table></div></div>';
}

// ══ A CAIXINHA DO RESPONSÁVEL ══
function fuPessoaHtml(nome,rows){
  const p=fuPer(),[de,ate,rot,intervalo]=fuRange(p);
  const ap=apurar(rows,de,ate);
  const fora=areasForaDoPerfil(nome);
  const esc=String(nome).replace(/'/g,"\\'");
  const ars=areasDeFato(nome).map(([k,a])=>a.name).join(' · ');
  const abertas=rows.filter(r=>!arquivada(r)&&!isB(r)&&!isPerdida(r));
  const pipe=abertas.reduce((s,r)=>s+(r.pipe||0),0);
  const meta=fuMetaValor();
  const [mIni,mFim]=fuRange('mes');
  const mes=apurar(rows,mIni,mFim);
  const pct=meta?Math.min(Math.round(mes.vol/meta*100),999):null;
  const tile=(t)=>'<div class="fu-p-tile'+(evDinheiro(t)?' destaque':'')+'"'
    +fuClick(fuItens(ap[t]),EVTS[t].ico+' '+EVTS[t].rot,nome+' · '+intervalo)+'>'
    +'<div class="k"><span style="color:'+evCor(t)+'">'+EVTS[t].ico+'</span> '+EVTS[t].rot+'</div>'
    +'<div class="v'+(evDinheiro(t)?' dinheiro':'')+'">'+evTexto(ap,t)+'</div>'
    +(evDetalhe(ap,t)?'<div class="s">'+evDetalhe(ap,t)+'</div>':'')+'</div>';
  return '<div class="fu-pessoa">'
    +'<div class="fu-p-top">'
    +'<div class="fu-p-av">'+initials(nome)+'</div>'
    +'<div class="fu-p-id"><div class="nm">'+nome+'</div>'
    +'<div class="sb">'+(ars||'sem área no cadastro')+' · '+abertas.length+' oportunidades abertas · pipe '+fmtR(pipe)+'</div>'
    +(fora.length?'<div class="sb aviso">⚠ há cards de '
      +fora.map(k=>'<b class="fora" onclick="fuAbrirVinculo(\''+esc+'\',\''+k+'\')" title="Ver esses cards">'
        +((AREAS[k]||{}).name||k)+'</b>').join(' e ')
      +' com o nome dele, fora das áreas que ele atende — não entram nas contas acima</div>':'')+'</div>'
    +'<div class="fu-p-per">'+rot+'<small>'+intervalo+'</small></div>'
    +'</div>'
    +'<div class="fu-p-tiles">'+EVT_ORDEM.map(tile).join('')
    +'<div class="fu-p-tile"><div class="k">📈 Pipe em aberto</div><div class="v dinheiro">'+fmtR(pipe)+'</div>'
    +'<div class="s">'+abertas.length+' oportunidades</div></div>'
    +'</div>'
    +(meta?'<div class="fu-p-meta"><div class="lbl">Meta do mês · '+fmt(meta)
      +' <b>'+fmtR(mes.vol)+' realizados ('+pct+'%)</b></div>'
      +'<div class="bar"><i style="width:'+Math.min(pct,100)+'%"></i></div></div>':'')
    +'</div>';
}
// ══ RELATÓRIO: baixar, enviar, imprimir ══
function fuEscopo(){
  return [window._fuCom,window._fuArea?(AREAS[window._fuArea]||{}).name:''].filter(Boolean).join(' · ')||'Time todo';
}
// ══ RELATÓRIO: um documento por área, com tabela e gráficos ══
// Os gráficos do documento são desenhados à parte, fora da tela, com a
// paleta clara — o papel é branco mesmo quando o sistema está no escuro.
function fuRelGraficos(rows,p){
  const out={img:{},tot:{}};
  if(typeof Chart==='undefined')return out;
  const serie=fuSerie(rows,p,0),ant=fuSerie(rows,p,1),rt=fuRitmo(rows);
  EVT_ORDEM.forEach(t=>{out.tot[t]=serie.reduce((s,b)=>s+(evDinheiro(t)?b.vol:b.n[t]),0)});
  const box=document.createElement('div');
  box.style.cssText='position:fixed;left:-10000px;top:0;width:560px;height:240px';
  document.body.appendChild(box);
  EVT_ORDEM.forEach(t=>{
    const cv=document.createElement('canvas');
    // 404px é a largura real do gráfico no documento. Com responsive:false o Chart.js
    // trata width/height como medida lógica e infla o bitmap pelo devicePixelRatio.
    cv.width=404;cv.height=170;
    box.appendChild(cv);
    const cor=EV_COR_LIGHT[t];
    let ch=null;
    try{
      ch=new Chart(cv,{type:'line',data:{labels:serie.map(b=>b.rot),datasets:[
        {label:'Acumulado',data:evDinheiro(t)?fuAcumulaVol(serie):fuAcumula(serie,t),
         borderColor:cor,backgroundColor:cor+'26',borderWidth:2.5,fill:true,tension:.25,pointRadius:0},
        {label:'Ritmo para a meta',data:fuAlvoSerie(serie,t,rt,p)||(evDinheiro(t)?fuAcumulaVol(ant):fuAcumula(ant,t)),
         borderColor:'#9A9490',borderWidth:2,borderDash:[5,4],fill:false,
         tension:fuAlvoSerie(serie,t,rt,p)?0:.25,pointRadius:0}]},
        options:{responsive:false,animation:false,devicePixelRatio:2,
          layout:{padding:{top:4,right:4}},
          plugins:{legend:{display:false}},
          scales:{x:{grid:{display:false},ticks:{font:{size:10},color:'#B3AFAA',maxRotation:0,autoSkip:true,maxTicksLimit:6}},
            y:{beginAtZero:true,grid:{color:'#E7E4E0'},border:{display:false},
               ticks:{font:{size:10},color:'#B3AFAA',precision:evDinheiro(t)?undefined:0,maxTicksLimit:4,
                      callback:v=>evDinheiro(t)?(fmt(v)||'0'):v}}}}});
      out.img[t]=cv.toDataURL('image/png');
    }catch(e){out.img[t]=''}
    if(ch)try{ch.destroy()}catch(e){}
  });
  box.remove();
  return out;
}
const fuPc=(n,b)=>b?(n/b*100).toFixed(1).replace('.',',')+'%':'—';
// Numa área, cada vendedor com o seu próprio número. Em seguro, o que a Cris
// fez e o que o Vovo fez — somar os dois esconde quem está parado.
function comerciaisDaArea(ak){
  return USUARIOS.filter(u=>u.ativo&&u.perfil!=='diretor'&&(u.areas||[]).includes(ak))
    .filter(u=>USER.perfil==='diretor'||USER.perfil==='gestor'||norm(u.nome)===norm(USER.nome))
    .filter(u=>trabalhaEmpresa(u.nome,empAtual()))
    .map(u=>u.nome);
}
function porVendedor(ak,rowsArea,de,ate){
  return comerciaisDaArea(ak).map(nome=>{
    const rs=rowsDoComercial(nome,rowsArea);
    return{nome,ap:comQuem(nome,()=>apurar(rs,de,ate))};
  }).sort((a,b)=>(b.ap.vol-a.ap.vol)||(b.ap.n.lig-a.ap.n.lig)||a.nome.localeCompare(b.nome));
}
function fuGargalo(ap){
  const ps=[['marcar a reunião','ligações',ap.n.lig,ap.n.mar],
            ['realizar a reunião','reuniões marcadas',ap.n.mar,ap.n.reu],
            ['fechar a boleta','reuniões feitas',ap.n.reu,ap.n.bol]]
    .filter(x=>x[2]>0).map(x=>({rot:x[0],base:x[1],t:x[3]/x[2]*100,de:x[2],p:x[3]}));
  return ps.length?ps.reduce((a,b)=>b.t<a.t?b:a):null;
}
// uma seção completa: números, tabela de conversão, gargalo e os 4 gráficos
function fuRelSecao(titulo,cor,rows,de,ate,p,comGraficos,ak){
  const ap=apurar(rows,de,ate);
  const nOpp=rows.filter(r=>!arquivada(r)).length;
  const g=fuGargalo(ap);
  const tile=(t)=>'<div class="kp'+(evDinheiro(t)?' destaque':'')+'"><div class="k">'+EVTS[t].rot+'</div>'
    +'<div class="v" style="color:'+(evDinheiro(t)?'#1F5741':EV_COR_LIGHT[t])+'">'+evTexto(ap,t)+'</div>'
    +(evDetalhe(ap,t)?'<div class="d">'+evDetalhe(ap,t)+'</div>':'')+'</div>';
  const janela=p==='dia'?'14 dias':p==='semana'?'8 semanas':'6 meses';
  const perd=perdidasDoPeriodo(rows,de,ate);
  const grupos=perdasPorEtapa(perd);
  const tabPerd=!perd.length
    ? '<div class="vend perd"><div class="vend-t">Perdidas no período — nenhuma</div></div>'
    : '<div class="vend perd"><div class="vend-t">❌ Perdidas no período — '+perd.length+' · '+fmtR(volPerdas(perd))+'</div>'
      +'<table class="tv"><thead><tr><th>Status quando foi perdida</th><th>Qtd</th><th>Volume</th></tr></thead><tbody>'
      +grupos.map(g=>'<tr><td class="nm">'+g.rot+'</td><td>'+g.n+'</td><td>'+fmtR(g.vol)+'</td></tr>').join('')
      +'</tbody></table>'
      +'<div class="perd-lista">'+perd.slice(0,12).map(x=>'<div><b>'+(x.r.cliente||'—')+'</b> · '
        +fmtR(x.r.pipe||x.r.atual||0)+' · saiu de <i>'+x.etapa+'</i> em '+brData(x.quando)+'</div>').join('')
      +(perd.length>12?'<div class="mais">+'+(perd.length-12)+' outras</div>':'')+'</div></div>';
  const vend=(!window._fuCom&&ak)?porVendedor(ak,rows,de,ate):[];
  const tabVend=vend.length>1
    ? '<div class="vend"><div class="vend-t">Por vendedor</div><table class="tv"><thead><tr><th>Vendedor</th>'
      +EVT_ORDEM.map(t=>'<th>'+EVTS[t].rot+'</th>').join('')+'<th>Conversão</th></tr></thead><tbody>'
      +vend.map(v=>'<tr'+(EVT_ORDEM.some(t=>v.ap.n[t])?'':' class="zerado"')+'><td class="nm">'+v.nome+'</td>'
        +EVT_ORDEM.map(t=>'<td>'+evTexto(v.ap,t)+(evDetalhe(v.ap,t)?' <span class="d">'+evDetalhe(v.ap,t)+'</span>':'')+'</td>').join('')
        +'<td>'+fuPc(v.ap.n.bol,v.ap.n.lig)+'</td></tr>').join('')
      +'</tbody></table></div>'
    : '';
  const gr=comGraficos?fuRelGraficos(rows,p):null;
  const temCurva=gr&&EVT_ORDEM.some(t=>gr.tot[t]>0);
  const imgs=(gr&&temCurva)?(()=>{
    const cel=EVT_ORDEM.filter(t=>gr.img[t]).map(t=>'<div class="ch"><div class="ch-t">'+EVTS[t].rot
      +' <b>'+(evDinheiro(t)?fmtR(gr.tot[t]):gr.tot[t])+'</b></div>'
      +'<img src="'+gr.img[t]+'" alt="'+EVTS[t].rot+'"></div>').join('');
    const temRitmo=!!fuAlvoSerie(fuSerie(rows,p,0),'bol',fuRitmo(rows),p);
    return cel?'<div class="leg"><b>Evolução · últimos '+janela+'</b>'
      +'<span class="l1"></span>acumulado<span class="l2"></span>'+(temRitmo?'ritmo para a meta':'janela anterior')+'</div>'
      +'<div class="chs">'+cel+'</div>':'';
  })():'';
  return '<section class="sec" style="--ac:'+cor+'">'
    +'<div class="sec-h"><span class="dot"></span><h2>'+titulo+'</h2>'
    +'<span class="tag">'+nOpp+' oportunidade'+(nOpp!==1?'s':'')+' no funil</span></div>'
    +'<div class="kps">'+EVT_ORDEM.map(tile).join('')
    +'<div class="kp"><div class="k">Oportunidades</div><div class="v">'+nOpp+'</div>'
    +'<div class="d">no funil da área</div></div></div>'
    +'<table><thead><tr><th>Indicador</th><th>Quantidade</th><th>Taxa de conversão</th></tr></thead><tbody>'
    +'<tr><td>Ligações feitas</td><td>'+ap.n.lig+'</td><td class="d">—</td></tr>'
    +'<tr><td>Reuniões marcadas</td><td>'+ap.n.mar+'</td><td>'+fuPc(ap.n.mar,ap.n.lig)+' <span class="d">das ligações</span></td></tr>'
    +'<tr><td>Reuniões feitas</td><td>'+ap.n.reu+'</td><td>'+fuPc(ap.n.reu,ap.n.mar)+' <span class="d">das marcadas</span></td></tr>'
    +'<tr class="fim"><td><b>Fechados</b></td><td><b>'+fmtR(ap.vol)+'</b> <span class="d">'+nBoletas(ap.n.bol)+'</span></td>'
    +'<td><b>'+fuPc(ap.n.bol,ap.n.reu)+'</b> <span class="d">das reuniões feitas</span></td></tr></tbody></table>'
    +(g?'<div class="gap"><b>Gargalo: '+g.rot+'</b> — de '+g.de+' '+g.base+', '+g.p+' avançaram ('
       +g.t.toFixed(1).replace('.',',')+'%).</div>'
      :'<div class="gap neutro">Sem etapas suficientes no período para apontar um gargalo.</div>')
    +tabVend+tabPerd
    +(imgs||(comGraficos?'<div class="vazio">Sem movimento registrado nos últimos '+janela+'.</div>':''))
    +'</section>';
}
function fuDocRelatorio(){return comQuem(window._fuCom||'',()=>fuDocRelatorioInterno())}
function fuDocRelatorioInterno(){
  const rows=fuRows(),p=fuPer(),[de,ate,rot,intervalo]=fuRange(p);

function carregarJsPDF(){
  if(window.jspdf&&window.jspdf.jsPDF)return Promise.resolve(window.jspdf.jsPDF);
  if(_pdfLib)return _pdfLib;
  _pdfLib=new Promise((ok,err)=>{
    const s=document.createElement('script');
    s.src=PDF_CDN;
    s.onload=()=>window.jspdf&&window.jspdf.jsPDF?ok(window.jspdf.jsPDF):err(new Error('jsPDF não carregou'));

}

const semEmoji=s=>String(s==null?'':s)

function pdfTxt(doc,txt,x,y,o){
  o=o||{};

function pdfCaixa(doc,x,y,w,h,fill,stroke,r){
  if(fill){doc.setFillColor(fill)}

  if(r)doc.roundedRect(x,y,w,h,r,r,est); else doc.rect(x,y,w,h,est);

// corta o texto na largura disponível, com reticências
function pdfCurto(doc,txt,size,bold,max){
  doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);
  let t=semEmoji(txt);
  if(doc.getTextWidth(t)<=max)return t;

    const col=i%2, lin=Math.floor(i/2);
    const x=PDF.m+col*(w+gap), y=doc.__y+lin*hCel;

    pdfTxt(doc,EVTS[t].rot.toUpperCase(),x+8,y+13,{size:6.2,bold:true,cor:PDF_COR.muted});
    pdfTxt(doc,evDinheiro(t)?fmtR(tot[t]):String(tot[t]),x+w-8,y+14,{size:10,bold:true,align:'right'});

  });

function pdfSecao(doc,titulo,cor,rows,de,ate,p,janela,ak){
  const ap=apurar(rows,de,ate);
  const nOpp=rows.filter(r=>!arquivada(r)).length;
  const gr=fuRelGraficos(rows,p);
  const temCurva=EVT_ORDEM.some(t=>gr.tot[t]>0);
  // reserva a seção inteira: cabeçalho, números, tabela, gargalo e gráficos.
  // Meia seção no pé da página com os gráficos órfãos na seguinte fica feio.
  const nCels=EVT_ORDEM.filter(t=>gr.img[t]).length;
  const hImg=((PDF.w-10)/2)*170/404;
  const hGraf=temCurva?(16+Math.ceil(nCels/2)*(hImg+20)):34;
  const vend=(!window._fuCom&&ak)?porVendedor(ak,rows,de,ate):[];
  const hVend=vend.length>1?(18+15+17*vend.length+8):0;
  const perd=perdidasDoPeriodo(rows,de,ate);
  const hPerd=perd.length?(18+15+17*perasN(perd)+8):0;
  pdfEspaco(doc,22+56+(16+4*19+10)+34+hVend+hPerd+hGraf+6);
  const y=doc.__y;
  doc.setFillColor(cor);doc.rect(PDF.m,y,3,14,'F');
  pdfTxt(doc,titulo.toUpperCase(),PDF.m+10,y+11,{size:10.5,bold:true,cor:cor});
  pdfTxt(doc,nOpp+' oportunidade'+(nOpp!==1?'s':'')+' no funil',PDF.m+PDF.w,y+11,{size:7.5,cor:PDF_COR.fraco,align:'right'});
  doc.__y=y+22;
  pdfKpis(doc,EVT_ORDEM.map(t=>({k:EVTS[t].rot,v:evTexto(ap,t),cor:evDinheiro(t)?PDF_COR.verde:EV_COR_LIGHT[t],
      bg:evDinheiro(t)?PDF_COR.verdeBg:PDF_COR.surf,s:evDetalhe(ap,t),big:evDinheiro(t)?12:14}))
    .concat([{k:'Oportunidades',v:String(nOpp),s:'no funil da área'}]));
  pdfTabela(doc,[
    {rot:'Ligações feitas',qtd:String(ap.n.lig),taxa:'—'},
    {rot:'Reuniões marcadas',qtd:String(ap.n.mar),taxa:fuPc(ap.n.mar,ap.n.lig),base:'das ligações'},
    {rot:'Reuniões feitas',qtd:String(ap.n.reu),taxa:fuPc(ap.n.reu,ap.n.mar),base:'das marcadas'},
    {rot:'Fechados',qtd:fmtR(ap.vol),det:ap.n.bol?nBoletas(ap.n.bol):'',taxa:fuPc(ap.n.bol,ap.n.reu),base:'das reuniões feitas'},
  ]);
  const g=fuGargalo(ap);
  if(g)pdfAviso(doc,'Gargalo: '+g.rot,'de '+g.de+' '+g.base+', '+g.p+' avançaram ('+g.t.toFixed(1).replace('.',',')+'%).');
  else pdfAviso(doc,'','Sem etapas suficientes no período para apontar um gargalo.',true);
  pdfVendedores(doc,vend);
  pdfPerdas(doc,perd);
  if(temCurva)pdfGraficos(doc,gr,gr.tot,janela);
  else pdfAviso(doc,'','Sem movimento registrado nos últimos '+janela+'.',true);
  doc.__y+=6;
}
function pdfRodape(doc,quando){
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(PDF_COR.linha);doc.setLineWidth(.5);
    doc.line(PDF.m,PDF.H-40,PDF.W-PDF.m,PDF.H-40);
    pdfTxt(doc,'Gerencial Comercial · '+quando,PDF.m,PDF.H-28,{size:6.8,cor:PDF_COR.fraco});
    pdfTxt(doc,'página '+i+' de '+n,PDF.W-PDF.m,PDF.H-28,{size:6.8,cor:PDF_COR.fraco,align:'right'});
  }
}
function pdfMontar(jsPDF){
  return comQuem(window._fuCom||'',()=>{
    const rows=fuRows(),p=fuPer(),[de,ate,rot,intervalo]=fuRange(p);
    const foco=window._fuCom||'';
    const janela=p==='dia'?'14 dias':p==='semana'?'8 semanas':'6 meses';
    const per=p==='dia'?'Diário':p==='semana'?'Semanal':'Mensal';
    const quando=new Date().toLocaleString('pt-BR');
    const areas=(window._fuArea?areasVis().filter(([k])=>k===window._fuArea):areasVis())
      .map(([ak,a])=>[ak,a,rows.filter(r=>r.area===ak)])
      .filter(([ak,a,rs])=>rs.length>0);
    const geral=apurar(rows,de,ate);
    const doc=pdfNovo(new jsPDF({unit:'pt',format:'a4',compress:true}));
    doc.setProperties({title:'Relatório de Desempenho '+per+' — '+fuEscopo()});
    pdfCapa(doc,{titulo:'Relatório de Desempenho '+per,intervalo,escopo:fuEscopo(),janela,quando});
    pdfKpis(doc,EVT_ORDEM.map(t=>({k:EVTS[t].ico?EVTS[t].rot:EVTS[t].rot,v:evTexto(geral,t),
        cor:evDinheiro(t)?PDF_COR.verde:EV_COR_LIGHT[t],bg:evDinheiro(t)?PDF_COR.verdeBg:PDF_COR.surf,
        big:evDinheiro(t)?13:16,
        s:evDinheiro(t)?(geral.n.bol?nBoletas(geral.n.bol)+' fechadas':'nenhuma boleta')
          :(EVTS[t].base?fuPc(geral.n[t],geral.n[EVTS[t].base])+' '+EVTS[t].baseRot:'ponto de partida')}))
      .concat([{k:'Pipe em aberto',v:fmtR(rows.filter(r=>!arquivada(r)&&!isB(r)&&!isPerdida(r)).reduce((s,r)=>s+(r.pipe||0),0)),
        s:'ainda em jogo',big:13}]),56);
    const gg=fuGargalo(geral);
    if(gg)pdfAviso(doc,'Gargalo geral: '+gg.rot,
      'de '+gg.de+' '+gg.base+', '+gg.p+' avançaram ('+gg.t.toFixed(1).replace('.',',')+'%). É onde a área está perdendo negócio.');
    if(!areas.length)pdfAviso(doc,'','Nenhuma oportunidade neste recorte.',true);
    areas.forEach(([ak,a,rs])=>pdfSecao(doc,(foco?foco.split(' ')[0]+' · ':'')+a.name,a.color,rs,de,ate,p,janela,ak));
    if(areas.length>1)pdfSecao(doc,foco?'Consolidado — '+foco:'Consolidado — todas as áreas',PDF_COR.vinho,rows,de,ate,p,janela);
    pdfEspaco(doc,40);
    doc.setFont('helvetica','normal');doc.setFontSize(6.8);doc.setTextColor(PDF_COR.fraco);
    doc.text(doc.splitTextToSize('Cada indicador conta oportunidades distintas com registro no período. A taxa de conversão é a razão entre os totais do período, não uma coorte: uma reunião feita hoje pode ter vindo de uma ligação do mês passado. Nos gráficos, a linha cheia é o acumulado e a tracejada é o ritmo necessário para bater a meta.',PDF.w),PDF.m,doc.__y+8);
    pdfRodape(doc,quando);
    return doc;
  });
}

function fuTextoRelatorio(){return comQuem(window._fuCom||'',()=>fuTextoRelatorioInterno())}
function fuTextoRelatorioInterno(){
  const rows=fuRows(),p=fuPer(),[de,ate,rot,intervalo]=fuRange(p);
  const ap=apurar(rows,de,ate);
  const tx=(n,b)=>b?(n/b*100).toFixed(1).replace('.',',')+'%':'—';
  const L=['*Relatório '+(p==='dia'?'diário':p==='semana'?'semanal':'mensal')+' — '+fuEscopo()+'*',
    intervalo,'',
    '📞 Ligações feitas: '+ap.n.lig,
    '📅 Reuniões marcadas: '+ap.n.mar+'  ('+tx(ap.n.mar,ap.n.lig)+' das ligações)',
    '🤝 Reuniões feitas: '+ap.n.reu+'  ('+tx(ap.n.reu,ap.n.mar)+' das marcadas)',
    '✅ Fechados: '+fmtR(ap.vol)+' em '+nBoletas(ap.n.bol)+'  ('+tx(ap.n.bol,ap.n.reu)+' das reuniões feitas)'];
  const passos=[['marcar reunião',ap.n.lig,ap.n.mar],['realizar a reunião',ap.n.mar,ap.n.reu],['fechar a boleta',ap.n.reu,ap.n.bol]]
    .filter(x=>x[1]>0).map(x=>({rot:x[0],t:x[2]/x[1]*100}));
  if(passos.length){const pior=passos.reduce((a,b)=>b.t<a.t?b:a);
    L.push('','⚠️ Gargalo: '+pior.rot+' ('+pior.t.toFixed(1).replace('.',',')+'%)');}
  return L.join('\n');
}

function toggleSelect(id,checked){

}
function toggleSelectAll(checked){
  if(checked){
    // Select all currently visible rows
    let rows=[...OPPS];

    const fAss=document.getElementById('f-ass')?.value;
    const fSC=document.getElementById('f-sc')?.value;

    const fCli=(document.getElementById('f-cli')?.value||'').toLowerCase();
    if(fA)rows=rows.filter(r=>r.area===fA);
    if(fAss)rows=rows.filter(r=>assDe(r)===fAss);

function fmtReuniao(s){
  if(!s)return'';
  const [d,h]=s.split('T');
  const p=d.split('-');
  return p[2]+'/'+p[1]+(h?' às '+h.substring(0,5):'');
}

function sugestaoAcao(r){
  if(r.todo)return r.todo;
  const sc=norm(r.sc||'');
  const pb=norm(r.pb||'');
  if(pb.includes('email'))return 'Enviar email/push para o cliente';
  if(pb==='a boletar')return 'Gerar a boleta!';
  if(pb.includes('to do'))return 'Resolver pendência da boleta';
  if(sc==='ligar cliente'||sc==='ligar cliente c ai')return 'Ligar para o cliente';
  if(sc==='agendar reunião')return 'Agendar a reunião';
  if(sc==='reunião agendada')return 'Realizar a reunião';
  if(sc==='cliente confirmar')return 'Cobrar confirmação do cliente';
  if(sc==='cliente topou')return 'Cliente topou — fechar a boleta!';
  return 'Definir próximo passo';
}

const SC_CHAIN=['Ligar Cliente','Agendar Reunião','Reunião Agendada','Cliente Confirmar','Cliente Topou'];
// Para os FUNIS: variantes de R2 contam junto da etapa de reunião equivalente
// (o Kanban continua mostrando as colunas R2 separadas)
function scFunil(sc){
  const k=norm(sc||'');
  if(!k)return '';
  const chain=SC_CHAIN.find(s=>norm(s)===k);
  if(chain)return norm(chain);
  if(/r2/.test(k)&&/agendar/.test(k))return norm('Agendar Reunião');
  if(/r2/.test(k)&&/agendad/.test(k))return norm('Reunião Agendada');
  if(/^ligar/.test(k))return norm('Ligar Cliente');   // "Ligar Cliente c AI" e variantes
  return k;
}

// ── 🤖 INTELIGÊNCIA: análise da próxima ação ──
function analisarProximaAcao(r){
  const dias=daysSince(getLastMoveDate(r));
  const sc=norm(r.sc||''),pb=norm(r.pb||'');
  const vol=r.atual||r.pipe||0;
  const hist=r.historico||[];
  const nMoves=hist.filter(h=>h.campo==='Status comercial').length;
  const temReuniao=!!r.reuniao_data;
  const agora=new Date().toISOString().slice(0,16);
  const reuniaoPassada=temReuniao&&r.reuniao_data<agora;
  let acao='',motivo='',urg='media';

  if(isB(r)){acao='Oportunidade concluída';motivo='Boletada com sucesso. Nenhuma ação necessária.';urg='baixa';}
  else if(pb==='a boletar'){acao='Gerar a boleta AGORA';motivo='Cliente pronto para boletar. '+(dias>2?'Já se passaram '+dias+' dias — risco de esfriar!':'Aproveite o momento quente.');urg='alta';}
  else if(sc==='cliente topou'){acao='Resolver pendência e boletar';motivo='Cliente topou'+(r.pb?' mas há pendência: '+r.pb:'')+'.'+(dias>3?' '+dias+' dias parado — priorize hoje!':'');urg='alta';}
  else if(reuniaoPassada){acao='Registrar o resultado da reunião';motivo='A reunião de '+fmtReuniao(r.reuniao_data)+' já aconteceu. Atualize o status com o desfecho e a próxima etapa.';urg='alta';}
  else if(temReuniao){acao='Preparar a reunião de '+fmtReuniao(r.reuniao_data);motivo='Revise a proposta, o perfil do cliente e o material antes do encontro.';urg='media';}
  else if(sc==='cliente confirmar'){
    if(dias>3){acao='Cobrar resposta do cliente';motivo='Sem resposta há '+dias+' dias. Um follow-up educado recupera boa parte dos silêncios.';urg='alta';}
    else{acao='Aguardar confirmação (follow-up em '+(4-dias)+' dia'+(4-dias>1?'s':'')+')';motivo='Cliente está decidindo. Não pressione ainda.';urg='baixa';}
  }
  else if(sc==='reunião agendada'&&!temReuniao){acao='Registrar data e hora da reunião';motivo='Status indica reunião marcada mas sem data no sistema — registre para aparecer na agenda do dia.';urg='media';}
  else if(sc==='agendar reunião'){acao='Propor 2 horários ao cliente';motivo='Oferecer opções concretas acelera o agendamento.'+(dias>5?' Parado há '+dias+' dias.':'');urg=dias>5?'alta':'media';}
  else if(sc.includes('ligar')){
    if(dias>7){acao='Retomar contato (ligação + WhatsApp)';motivo='Sem avanço há '+dias+' dias'+(nMoves===0?' e nenhum contato registrado':'')+'. Tente um canal alternativo.';urg='alta';}
    else{acao='Ligar para o cliente';motivo='O primeiro contato define o ritmo da negociação.';urg='media';}
  }
  else if(pb.includes('email')){acao='Enviar: '+r.pb;motivo='Pendência operacional travando a boleta há '+dias+' dia'+(dias>1?'s':'')+'.';urg='alta';}
  else if(pb.includes('to do')||pb.includes('aguardando')){acao='Resolver: '+r.pb;motivo='Pendência aberta há '+dias+' dias.';urg=dias>3?'alta':'media';}
  else if(!r.sc){acao='Classificar a oportunidade';motivo='Sem status definido. Defina a etapa para ela entrar no funil e nas prioridades.';urg='media';}
  else{acao=sugestaoAcao(r);motivo=dias>7?'Parada há '+dias+' dias sem movimentação.':'Mantenha o ritmo de acompanhamento.';urg=dias>7?'alta':'baixa';}

  if(!isB(r)&&vol>=500000&&urg!=='alta')motivo+=' 💰 Ticket alto ('+fmt(vol)+') — merece atenção extra.';
  return{acao,motivo,urg};
}

async function advanceStatus(id,ev){

  const cur=SC_CHAIN.findIndex(s=>norm(s)===norm(r.sc||''));

  const now=new Date();

    showToast('✅ '+r.cliente+' → '+next,true);

}

// ── Barra de rolagem horizontal também ACIMA de cada kanban ──
// A posição fica guardada em _kbScroll: toda re-renderização (auto-atualização de 60s,
// mover card, mudar status) recria o board do zero, e sem isso a rolagem voltava pro início.
window._kbScroll=window._kbScroll||{};
function initKbScrollTop(){
  document.querySelectorAll('.kb-board').forEach((board,idx)=>{
    const chave=curView+'#'+idx;
    if(board.scrollWidth<=board.clientWidth+4){delete window._kbScroll[chave];return}
    if(board.previousElementSibling&&board.previousElementSibling.classList.contains('kb-scroll-top'))board.previousElementSibling.remove();
    const proxy=document.createElement('div');
    proxy.className='kb-scroll-top';
    proxy.style.cssText='overflow-x:auto;overflow-y:hidden;height:14px;margin-bottom:4px';
    const spacer=document.createElement('div');
    spacer.style.cssText='height:1px;width:'+board.scrollWidth+'px';
    proxy.appendChild(spacer);
    board.parentNode.insertBefore(proxy,board);

    // espelha uma barra na outra. A trava é liberada no próximo quadro (e não pelo
    // evento seguinte): se a atribuição não gerar evento — valor igual ou no limite —
    // a trava não fica presa engolindo a próxima rolagem do usuário.
    let travado=false;
    const espelha=(de,para)=>()=>{
      if(travado)return;
      travado=true;
      para.scrollLeft=de.scrollLeft;
      requestAnimationFrame(()=>{travado=false});
    };
    proxy.addEventListener('scroll',espelha(proxy,board));

// Auto-rolagem enquanto arrasta: perto das bordas do board rola horizontal; perto do topo/rodapé rola a página
document.addEventListener('dragover',ev=>{
  if(!window._arrastando)return;                    // só quando é card do Kanban
  const M=90,S=24;
  const el=ev.target&&ev.target.closest?ev.target.closest('.kb-board'):null;
  if(el){
    const r=el.getBoundingClientRect();
    if(ev.clientX-r.left<M)el.scrollLeft-=S;
    else if(r.right-ev.clientX<M)el.scrollLeft+=S;
  }
  if(ev.clientY<80)window.scrollBy(0,-S);
  else if(window.innerHeight-ev.clientY<80)window.scrollBy(0,S);
},{passive:true});
function kbDragLeave(ev){ev.currentTarget.style.background='';ev.currentTarget.style.transform='';}
async function kbDrop(ev,statusKey){
  window._arrastando=false;
  if(statusKey==='__PERD__')statusKey='Cliente Negou';
  if(statusKey==='__NSA__')statusKey='Não se Aplica';
  ev.preventDefault();
  ev.currentTarget.style.background='';ev.currentTarget.style.transform='';
  const id=_dragId;_dragId=null;
  if(!id)return;
  const r=acharOpp(id);if(!r)return;
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[])];
  const patch={updated_at:now.toISOString()};
  if(statusKey==='__BOL__'){
    if(isB(r))return;
    hist.push({campo:'Pendência boleta',de:r.pb||'',para:'Boletado',usuario:USER.nome,data:ds});
    patch.pb='Boletado';
  }else{
    if(norm(r.sc||'')===norm(statusKey)&&!isB(r))return;
    if(isB(r)){
      hist.push({campo:'Pendência boleta',de:r.pb||'',para:'(desfeita)',usuario:USER.nome,data:ds});
      patch.pb='';
    }
    hist.push({campo:'Status comercial',de:r.sc||'',para:statusKey,usuario:USER.nome,data:ds});
    patch.sc=statusKey;
  }
  patch.historico=hist;
  try{
    await db('PATCH','oportunidades',patch,'id=eq.'+id);
    showToast('✅ '+r.cliente+' → '+(statusKey==='__BOL__'?'Boletado':statusKey),true);
    await loadData();
    renderCurView();
  }catch(e){showToast('Erro: '+e.message)}
}

// o que este usuário enxerga — diretor/gestor vê tudo, o resto vê o que é seu
function oppsDoUsuario(){
  const base=OPPS.filter(r=>!arquivada(r));      // arquivadas moram no Histórico
  if(USER.perfil==='diretor'||USER.perfil==='gestor')return base;
  return base.filter(r=>{
    // responsável definido manda: a oportunidade é dele, não do assessor
    if(r.responsavel)return norm(r.responsavel)===norm(USER.nome);
    if(norm(r.assessor)===norm(USER.nome))return true;
    return (USER.areas||[]).includes(r.area);
  });
}

const _pal=t=>norm(t).replace(/\bluiz\b/g,'luis').split(' ').filter(x=>!['da','de','do','das','dos','el'].includes(x));
// casa o nome curto do card com o nome completo da lista: todas as palavras do
// card têm de existir no nome completo; se não achar, tenta pelo primeiro nome
function respSeguroDe(assessor){
  const a=_pal(assessor); if(!a.length)return null;
  const exatos=RESP_SEGURO.filter(([n])=>a.every(t=>_pal(n).includes(t)));
  if(exatos.length===1)return{quem:exatos[0][1],como:'nome completo',alvo:exatos[0][0]};
  if(exatos.length>1)return null;
  const prim=RESP_SEGURO.filter(([n])=>_pal(n)[0]===a[0]);
  if(prim.length===1)return{quem:prim[0][1],como:'primeiro nome',alvo:prim[0][0]};
  return null;
}
async function aplicarRespSeguro(){
  const alvo=OPPS.filter(r=>r.area==='seg'&&!arquivada(r));
  if(!alvo.length){showToast('Nenhuma oportunidade de Seguro de vida no fluxo');return}
  const plano=[],semRegra={},jaOk={};
  alvo.forEach(r=>{
    const m=respSeguroDe(r.assessor||'');
    if(!m){semRegra[r.assessor||'(sem assessor)']=(semRegra[r.assessor||'(sem assessor)']||0)+1;return}
    if(norm(r.responsavel||'')===norm(m.quem)){jaOk[m.quem]=(jaOk[m.quem]||0)+1;return}
    plano.push({r,quem:m.quem});
  });
  const cont={};plano.forEach(x=>cont[x.quem]=(cont[x.quem]||0)+1);
  const faltam=Object.entries(semRegra).map(([k,v])=>'  · '+k+': '+v).join('\n');
  if(!plano.length){
    alert('Nada a mudar.\n\nJá corretas: '+Object.entries(jaOk).map(([k,v])=>k+' '+v).join(' · ')
      +(faltam?'\n\nSem regra na lista (seguem sem responsável):\n'+faltam:''));
    return;
  }
  if(!confirm('Atribuir o comercial de seguros pelo assessor?\n\n'
    +Object.entries(cont).map(([k,v])=>'  '+k+': '+v+' oportunidade'+(v>1?'s':'')).join('\n')
    +(Object.keys(jaOk).length?'\n\nJá corretas: '+Object.entries(jaOk).map(([k,v])=>k+' '+v).join(' · '):'')
    +(faltam?'\n\nFicam de fora (assessor não está na lista):\n'+faltam:'')
    +'\n\nCom responsável definido, a oportunidade passa a aparecer no CRM dele.'))return;
  const ag=new Date();
  const ds=ag.toLocaleDateString('pt-BR')+' '+ag.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  let ok=0,err=0;
  for(const x of plano){
    const hist=[...(x.r.historico||[]),{campo:'Responsável',de:x.r.responsavel||'',para:x.quem,usuario:USER.nome,data:ds}];
    try{await db('PATCH','oportunidades',{responsavel:x.quem,historico:hist,updated_at:ag.toISOString()},'id=eq.'+x.r.id);ok++;}
    catch(e){err++}
  }
  showToast('🛡️ '+ok+' oportunidade'+(ok!==1?'s':'')+' de seguro atribuída'+(ok!==1?'s':'')+(err?' · '+err+' com erro':''),!err);
  await loadData();renderCurView();
}

function histOpps(){
  const arq=OPPS_ALL.filter(arquivada);
  if(USER.perfil==='diretor'||USER.perfil==='gestor')return arq;
  return arq.filter(r=>norm(r.assessor||'')===norm(USER.nome)
    ||norm(r.responsavel||'')===norm(USER.nome)
    ||(USER.areas||[]).includes(r.area));
}
const volBoletado=r=>r.atual||0;
const volPerdido=r=>r.pipe||r.atual||0;
function competenciasDisponiveis(){
  return [...new Set(histOpps().map(arquivadaEm))].filter(Boolean).sort().reverse();
}
function histDoMes(comp){
  const rows=histOpps().filter(r=>comp==='tudo'||arquivadaEm(r)===comp);
  return{rows,
    bol:rows.filter(isBoletadoFirmado), aBol:rows.filter(isABoletar), perd:rows.filter(isPerdida)};
}
function setHistComp(c){window._histComp=c;renderCurView();}

  const h=histDoMes(comp);
  const vB=h.bol.reduce((a,r)=>a+volBoletado(r),0)+h.aBol.reduce((a,r)=>a+volBoletado(r),0);
  const vP=h.perd.reduce((a,r)=>a+volPerdido(r),0);
  const nFech=h.bol.length+h.aBol.length;

  const chips='<div class="hs-chips">'

  // quebra por área (mesma régua de área do Kanban: RV, RF, Consórcio, Seguro)

      return vb-va;

      +'<span class="hs-area-nm">'+A.name+'</span><span class="hs-area-n">'+rows.length+' no total</span></div>'

  }).join('');

  c.innerHTML=chips
    +'<div class="hs-kpis">'
    +kpi('✅ Boletado',(fmt(vB)||'R$0'),nFech+' boleta'+(nFech!==1?'s':'')+(h.aBol.length?' · '+h.aBol.length+' a processar':''),'var(--green)',nFech?"abrirHistArea('','bol')":'')
    +kpi('❌ Perdido',(fmt(vP)||'R$0'),h.perd.length+' oportunidade'+(h.perd.length!==1?'s':'')+' negada'+(h.perd.length!==1?'s':''),'var(--red)',h.perd.length?"abrirHistArea('','perd')":'')
    +kpi('🎯 Aproveitamento',aprov===null?'—':aprov+'%',
         aprov===null?'sem oportunidades fechadas':nFech+' fechadas de '+(nFech+h.perd.length)+' decididas',

    +kpi('📦 Arquivadas',h.rows.length,comp==='tudo'?'em todas as competências':'na competência de '+mesExtenso(comp),'var(--wine)',"abrirHistArea('','tudo')")

// ── VIRADA DE MÊS ──
// Fecha o ciclo: tudo que já acabou (boletado ou perdido) sai do fluxo do dia
// e vai para o Histórico, carimbado na competência em que fechou. Nada é
// apagado, e metas/dashboard seguem contando essas oportunidades.
function alvoDaVirada(){
  return OPPS_ALL.filter(r=>!arquivada(r)&&(isB(r)||isPerdida(r)));
}
async function viradaDeMes(){
  const alvo=alvoDaVirada();
  if(!alvo.length){showToast('Nada para arquivar — nenhuma boletada ou perdida no fluxo');return;}
  const bol=alvo.filter(isB), perd=alvo.filter(isPerdida);
  const vol=bol.reduce((a,r)=>a+(r.atual||0),0);
  const porComp={};
  alvo.forEach(r=>{const c=competenciaDe(r);porComp[c]=(porComp[c]||0)+1});
  const resumoComp=Object.keys(porComp).sort().map(c=>'  · '+mesExtenso(c)+': '+porComp[c]).join('\n');
  if(!confirm('VIRADA DE MÊS\n\n'
    +bol.length+' boletada'+(bol.length!==1?'s':'')+' — '+(fmt(vol)||'R$0')+'\n'
    +perd.length+' perdida'+(perd.length!==1?'s':'')+'\n\n'
    +'Competências:\n'+resumoComp+'\n\n'
    +'Elas saem do Guia do dia e da Daily e passam para o Histórico.\n'
    +'Nada é apagado: metas, ranking e dashboard seguem contando.\n\nConfirmar?'))return;

  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  let ok=0, erro=0;
  for(const r of alvo){
    const comp=competenciaDe(r);
    const hist=[...(r.historico||[]),{campo:CAMPO_ARQ,de:'',para:comp,usuario:USER.nome,data:ds}];
    try{
      await db('PATCH','oportunidades',{historico:hist,updated_at:now.toISOString()},'id=eq.'+r.id);
      r.historico=hist;ok++;
    }catch(e){erro++}
  }
  showToast('📦 '+ok+' oportunidade'+(ok!==1?'s':'')+' arquivada'+(ok!==1?'s':'')+(erro?' · '+erro+' com erro':'')+' — veja na aba Histórico',!erro);
  await loadData();renderCurView();
}
async function reabrirOpp(id){
  const r=acharOpp(id);if(!r)return;
  if(!arquivada(r))return;
  const now=new Date();
  const ds=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const hist=[...(r.historico||[]),{campo:CAMPO_ARQ,de:arquivadaEm(r),para:'',usuario:USER.nome,data:ds}];
  try{
    await db('PATCH','oportunidades',{historico:hist,updated_at:now.toISOString()},'id=eq.'+r.id);
    r.historico=hist;
    showToast('↩ '+(r.cliente||'Oportunidade')+' voltou para o fluxo do dia',true);
  }catch(e){showToast('Erro ao reabrir: '+e.message);return}
  await loadData();renderCurView();
}

// ── BALDES DO BANNER DO GUIA DO DIA ──
// Uma função só alimenta o número do quadro E a lista que abre no clique:
// assim os dois nunca discordam.
function cockpitBuckets(){
  const hoje=today();
  const myOpps=oppsDoUsuario();
  const ativos=myOpps.filter(r=>!isB(r));
  const reunioesHoje=ativos.filter(r=>r.reuniao_data&&r.reuniao_data.startsWith(hoje)).sort((a,b)=>(a.reuniao_data||'').localeCompare(b.reuniao_data||''));
  const atrasados=ativos.filter(r=>!reunioesHoje.includes(r)&&r.todo_data&&r.todo_data<hoje);
  const hojeList=ativos.filter(r=>!reunioesHoje.includes(r)&&r.todo_data===hoje);
  const quaseLa=ativos.filter(r=>!reunioesHoje.includes(r)&&!atrasados.includes(r)&&!hojeList.includes(r)&&(norm(r.sc||'')==='cliente topou'||norm(r.pb||'')==='a boletar'));
  const parados=ativos.filter(r=>!reunioesHoje.includes(r)&&!atrasados.includes(r)&&!hojeList.includes(r)&&!quaseLa.includes(r)&&daysSince(getLastMoveDate(r))>7);
  return{hoje,myOpps,ativos,reunioesHoje,atrasados,hojeList,quaseLa,parados,boletadas:myOpps.filter(isB)};
}
const COCKPIT_DET={
  acoes:{ico:'🎯',t:'Ações para hoje',sub:'TODOs marcados para hoje e os que já venceram',cor:'var(--wine)',bg:'var(--wine-l)',col:'O que fazer'},
  reunioes:{ico:'📅',t:'Reuniões de hoje',sub:'com data de reunião marcada para hoje',cor:'var(--blue)',bg:'var(--blue-bg)',col:'Horário'},
  quase:{ico:'🔥',t:'Prontas para fechar',sub:'cliente topou e a boleta ainda não saiu',cor:'var(--amber)',bg:'var(--amber-bg)',col:'Por que está pronta'},
  boletado:{ico:'✅',t:'Já boletado',sub:'boletas fechadas e as que faltam processar',cor:'var(--green)',bg:'var(--green-bg)',col:'Fechada em'},
};
function abrirCockpit(k){
  const E=COCKPIT_DET[k];if(!E)return;
  const b=cockpitBuckets();
  let lista=[];
  if(k==='acoes')      lista=[...b.atrasados,...b.hojeList];
  else if(k==='reunioes') lista=b.reunioesHoje;
  else if(k==='quase')  lista=b.quaseLa;
  else                  lista=b.boletadas;
  const vol=r=>k==='boletado'?(r.atual||0):(r.atual||r.pipe||0);
  if(k!=='reunioes')lista=[...lista].sort((x,y)=>vol(y)-vol(x));
  const tot=lista.reduce((a,r)=>a+vol(r),0);

  const porque=r=>{
    if(k==='acoes'){
      const d=(r.todo_data||'').slice(0,10), atr=d&&d<b.hoje;
      return '<span'+(atr?' style="color:var(--red);font-weight:700"':'')+'>'
        +(r.todo||'TODO sem descrição')+(d?' · '+(atr?'venceu '+brData(d):'para hoje'):'')+'</span>';
    }
    if(k==='reunioes')return (r.reuniao_data||'').includes('T')
      ? 'às '+r.reuniao_data.split('T')[1].substring(0,5) : 'hoje, sem horário definido';
    if(k==='quase')return norm(r.pb||'')==='a boletar'?'pendência: A Boletar':'status: '+(r.sc||'—');
    return (parseDataBoleta(r.data_boleta)?brData(parseDataBoleta(r.data_boleta)):'sem data')
      +(isABoletar(r)?' <span style="color:var(--amber);font-weight:700">· falta processar</span>':'');
  };

  const linhas=lista.map(r=>'<tr onclick="closeModal(\'area\');openEdit(\''+r.id+'\')" title="Abrir oportunidade">'
    +'<td style="font-weight:700">'+(r.cliente||'—')
      +'<div class="fn-ev" style="font-weight:400">'+((AREAS[r.area]||{}).name||r.area||'—')+' · '+(r.produto||'—')+'</div></td>'
    +'<td style="color:var(--muted)">'+(r.assessor||'—')+'</td>'
    +'<td class="fn-ev fn-prova">'+porque(r)+'</td>'
    +'<td style="color:var(--muted);font-size:11px">'+(r.sc||'—')+'</td>'
    +'<td class="r val">'+(fmt(vol(r))||'—')+'</td></tr>').join('');

  document.getElementById('ba-title').innerHTML=E.ico+' '+E.t
    +' <span style="font-size:11px;font-weight:600;color:var(--muted)">· '+E.sub+'</span>';
  document.getElementById('ba-body').innerHTML=
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">'
    +'<div style="flex:1;min-width:150px;background:'+E.bg+';border:1px solid var(--border);border-radius:8px;padding:10px 13px">'
    +'<div style="font-size:9.5px;font-weight:700;color:'+E.cor+';text-transform:uppercase;letter-spacing:.04em">Oportunidades</div>'
    +'<div style="font-size:20px;font-weight:700;color:'+E.cor+';font-variant-numeric:tabular-nums">'+lista.length+'</div></div>'
    +'<div style="flex:1;min-width:150px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:10px 13px">'
    +'<div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">'+(k==='boletado'?'Volume boletado':'Volume em jogo')+'</div>'
    +'<div style="font-size:20px;font-weight:700;font-variant-numeric:tabular-nums">'+fmtR(tot)+'</div></div>'
    +'</div>'
    +(lista.length
      ? '<div class="ba-sec" style="--bc:'+E.cor+';--bbg:'+E.bg+'"><div style="overflow-x:auto"><table class="ba-tbl">'
        +'<thead><tr><th>Cliente</th><th>Assessor</th><th>'+E.col+'</th><th>Status hoje</th><th class="r">Volume</th></tr></thead>'
        +'<tbody>'+linhas+'</tbody></table></div></div>'
      : '<div class="ba-vazio">Nada por aqui — nenhuma oportunidade neste grupo.</div>')
    +'<div style="font-size:10px;color:var(--muted-l);margin-top:6px">Clique em qualquer linha para abrir a oportunidade.</div>';
  document.getElementById('modal-area').style.display='flex';
}

  // Kanban columns

  const KB_COLS=[
    ['Ligar Cliente','📞','#5A3A3E'],

    ..._custReuniao.map(c=>[c,'📅','#3C3489']),

  function buildKanban(opps,seg){

function oppCard(r){
  const cor=AREAS[r.area]?.color||corMarca('#8B1C2A');
  const bsc=matchBadge(r.sc||'',SC_BADGE)||'b-gray';
  const bpb=matchBadge(r.pb||'',PB_BADGE)||'b-gray';
  const boletado=isB(r);
  const pending=isPend(r);
  return`<div class="opp-card${boletado?' bol':''}" id="card-${r.id}">
    <div class="opp-card-header">
      <div>
        <div class="opp-client">${r.cliente}</div>

async function quickBoletar(id){
  const r=acharOpp(id);
  if(!r||!confirm(`Marcar "${r.cliente}" como Boletado?`))return;
  const now=new Date();
  const hist=[...(r.historico||[]),{campo:'Pendência boleta',de:r.pb,para:'Boletado',usuario:USER.nome,data:now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}];
  try{
    await db('PATCH','oportunidades',{pb:'Boletado',historico:hist,updated_at:now.toISOString()},`id=eq.${id}`);
    showToast('✅ Marcado como Boletado!',true);
    await loadData();
    renderAssessorOpps();
  }catch(e){showToast('Erro: '+e.message)}
}

function renderAssessorDash(c=document.getElementById('main-content')){
  const myOpps=oppsDoUsuario();   // arquivadas ficam só no Histórico
  const bolRows=myOpps.filter(isB);
  const bolV=bolRows.reduce((s,r)=>s+(r.atual||0),0);
  const ativos=myOpps.filter(r=>!isB(r));
  const pipeV=ativos.reduce((s,r)=>s+(r.pipe||0),0);
  const pend=ativos.filter(isPend).length;
  const efet=myOpps.length?Math.round(bolRows.length/myOpps.length*100):0;

  // Minhas metas (responsável = eu)
  const minhasMetas=metasDoMes().filter(m=>norm(m.assessor)===norm(USER.nome)).map(m=>{
    const rows=OPPS.filter(r=>{
      if(m.area&&r.area!==m.area)return false;
      if(m.produto&&norm(r.produto||'')!==norm(m.produto))return false;
      return true;
    });
    const boletado=rows.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const pct=m.meta_valor>0?Math.min(Math.round(boletado/m.meta_valor*100),999):0;
    return{...m,boletado,pct};
  });

  // Por segmento
  const segCards=subareasVis().map(([sk,a])=>{
    const so=myOpps.filter(r=>subAreaOf(r)===sk);
    if(!so.length)return'';
    const sb=so.filter(isB).reduce((s,r)=>s+(r.atual||0),0);
    const sbN=so.filter(isB).length;
    const sp=so.filter(r=>!isB(r)).reduce((s,r)=>s+(r.pipe||0),0);
    const spN=so.filter(r=>!isB(r)).length;
    return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;border-top:4px solid '+a.color+'">'
      +'<div style="font-size:12px;font-weight:700;color:'+a.color+';text-transform:uppercase;letter-spacing:.03em;margin-bottom:12px">'+a.name+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +'<div style="background:var(--green-bg);border-radius:4px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase">✓ Boletado</div>'
      +'<div style="font-size:16px;font-weight:700;color:var(--green)">'+(fmt(sb)||'R$0')+'</div>'
      +'<div style="font-size:10px;color:var(--green)">'+sbN+' opor.</div>'
      +'</div>'
      +'<div style="background:var(--cream);border-radius:4px;padding:10px">'
      +'<div style="font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase">🔄 Em esteira</div>'
      +'<div style="font-size:16px;font-weight:700;color:'+a.color+'">'+(fmt(sp)||'—')+'</div>'
      +'<div style="font-size:10px;color:var(--muted)">'+spN+' opor.</div>'
      +'</div>'
      +'</div></div>';
  }).join('');

  // Esteira por etapa (mini funil)
  const funilRows=SC_CHAIN.map(s=>{
    const rows=ativos.filter(r=>scFunil(r.sc)===norm(s));
    return{s,n:rows.length,v:rows.reduce((s2,r)=>s2+(r.pipe||0),0)};
  });
  const perdRowsF=OPPS.filter(r=>!isB(r)&&isPerdida(r));
  funilRows.push({s:'❌ Perdido',n:perdRowsF.length,v:perdRowsF.reduce((s2,r)=>s2+(r.pipe||0),0),perd:true});
  const maxF=Math.max(...funilRows.map(f=>f.n),1);

  c.innerHTML=''
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px">'
    +'<div class="kpi green"><div class="kpi-lbl">✓ Boletado</div><div class="kpi-val">'+(fmt(bolV)||'R$0')+'</div><div class="kpi-sub">'+bolRows.length+' oportunidades</div></div>'
    +'<div class="kpi wine"><div class="kpi-lbl">🔄 Em esteira</div><div class="kpi-val">'+(fmt(pipeV)||'R$0')+'</div><div class="kpi-sub">'+ativos.length+' em andamento</div></div>'
    +'<div class="kpi amber"><div class="kpi-lbl">⚡ Pendências</div><div class="kpi-val">'+pend+'</div><div class="kpi-sub">aguardando ação</div></div>'
    +'<div class="kpi blue"><div class="kpi-lbl">Efetivação</div><div class="kpi-val">'+efet+'%</div><div class="kpi-sub">boletadas / total</div></div>'
    +'</div>'

    // Minhas metas
    +(minhasMetas.length?'<div class="section-label">Minhas metas do mês</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:22px">'
      +minhasMetas.map(m=>{
        const a=AREAS[m.area]||{color:corMarca('#8B1C2A'),name:m.area};
        const pctColor=m.pct>=100?'#085041':m.pct>=60?'#854F0B':a.color;
        return '<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;border-left:4px solid '+a.color+'">'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
          +'<span style="font-size:12px;font-weight:700;color:'+a.color+'">'+a.name+(m.produto?' · '+m.produto:'')+'</span>'
          +'<span style="font-size:16px;font-weight:700;color:'+pctColor+'">'+m.pct+'%</span>'
          +'</div>'
          +'<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:8px">'
          +'<span style="font-size:20px;font-weight:700;color:'+pctColor+'">'+(fmt(m.boletado)||'R$0')+'</span>'
          +'<span style="font-size:12px;color:var(--muted)">/ '+fmt(m.meta_valor)+'</span>'
          +'</div>'
          +'<div style="height:8px;background:var(--border);border-radius:3px;overflow:hidden">'
          +'<div style="width:'+Math.min(m.pct,100)+'%;height:8px;background:'+pctColor+';border-radius:3px"></div>'
          +'</div>'
          +'<div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:right">'+(m.meta_valor>m.boletado?'falta '+fmt(m.meta_valor-m.boletado):'✅ meta atingida!')+'</div>'
          +'</div>';
      }).join('')+'</div>':'')

    // Por segmento
    +'<div class="section-label">Por segmento</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px">'+segCards+'</div>'

    // Esteira por etapa
    +'<div class="section-label">O que está na esteira</div>'
    +'<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin-bottom:20px">'
    +funilRows.map(f=>{
      const w=Math.max(Math.round(f.n/maxF*100),3);
      const cf=f.perd?'#A32D2D':'var(--wine)';
      const bf=f.perd?'#FCEBEB':'var(--wine-l)';
      return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">'
        +'<div style="min-width:130px;font-size:12px;font-weight:600;color:'+(f.perd?'#A32D2D':'inherit')+'">'+f.s+'</div>'
        +'<div style="flex:1;background:'+bf+';border-radius:4px;height:28px;overflow:hidden">'
        +'<div style="width:'+w+'%;height:28px;background:'+cf+';border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:30px">'
        +'<span style="color:'+corTexto(cf)+';font-size:11px;font-weight:700">'+f.n+'</span>'
        +'</div></div>'
        +'<div style="min-width:64px;text-align:right;font-size:12px;font-weight:700;color:var(--wine-d)">'+(fmt(f.v)||'—')+'</div>'
        +'</div>';
    }).join('')
    +'</div>';
}

async function toggleDaily(oppId,checked){
  const t=today();
  try{
    if(checked){
      const res=await db('POST','daily_selecoes',{data:t,assessor:USER.nome,oportunidade_id:oppId,tipo:'',acao:''});
      DAILY[oppId]={tipo:'',acao:'',id:res?.[0]?.id};
    }else{
      if(DAILY[oppId]?.id)await db('DELETE','daily_selecoes','',`id=eq.${DAILY[oppId].id}`);
      delete DAILY[oppId];
    }
    renderAssessorDaily();
  }catch(e){showToast('Erro: '+e.message)}
}

async function updateDaily(oppId,field,value){
  if(!DAILY[oppId]?.id)return;
  DAILY[oppId][field]=value;
  try{await db('PATCH','daily_selecoes',{[field]:value},`id=eq.${DAILY[oppId].id}`);}catch{}
}

function exportDailyPDF(){

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily ${USER.nome}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;color:#1A0508;font-size:13px;padding:40px}.hdr{border-bottom:3px solid #8B1C2A;padding-bottom:20px;margin-bottom:24px;display:flex;justify-content:space-between}h1{font-size:22px;font-weight:700;color:#8B1C2A}h2{font-size:13px;font-weight:700;margin:16px 0 10px;text-transform:uppercase;letter-spacing:.05em}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.kpi{border:1px solid #E8D5CC;border-radius:4px;padding:12px;text-align:center}.kpi.hl{background:#8B1C2A;color:#fff}.kv{font-size:20px;font-weight:700}.kl{font-size:10px;text-transform:uppercase;opacity:.7;margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:12px}th{background:#F5F0EB;padding:7px 10px;text-align:left;font-size:11px;text-transform:uppercase;border-bottom:2px solid #E8D5CC}td{padding:6px 10px;border-bottom:1px solid #F0E8E3}hr{border:1px solid #E8D5CC;margin:20px 0}.ftr{margin-top:40px;padding-top:12px;border-top:1px solid #E8D5CC;font-size:11px;color:#B4A0A8;display:flex;justify-content:space-between}@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="hdr"><div><h1>Daily — ${USER.nome}</h1><div style="color:#8A6A6E;margin-top:4px">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</div></div><div style="text-align:right;font-size:12px;color:#8A6A6E">${sel.length} oportunidades<br>${fmt(totalVol)}</div></div><div class="kpis"><div class="kpi hl"><div class="kl">Total</div><div class="kv">${sel.length}</div></div><div class="kpi"><div class="kl">📅 Reuniões</div><div class="kv">${grupos.reuniao.items.length}</div></div><div class="kpi"><div class="kl">✅ Boletas</div><div class="kv">${grupos.boleta.items.length}</div></div><div class="kpi"><div class="kl">📋 TODOs</div><div class="kv">${grupos.todo.items.length}</div></div></div>${secoes}<div class="ftr"><span>Gerencial Comercial — Daily</span><span>${now.toLocaleString('pt-BR')}</span></div></body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);
}

// ── EDIT MODAL ──

const SC_PADRAO=['Ligar Cliente','Ligar Cliente c AI','Agendar Reunião','Reunião Agendada','Cliente Confirmar','Cliente Topou','Cliente Negou','Não se Aplica'];
const PB_PADRAO=['To Do Comercial','To Do Operacional','Email/Push + Saldo','Email + Suit + Saldo','Email + Suita','Email/Push','Email','A Boletar','Aguardando Comercial','Boletado','Não se Aplica'];
function fillSelect(selId,lista,atual){
  const sel=document.getElementById(selId);if(!sel)return;
  const m=new Map();
  lista.filter(Boolean).forEach(v=>{if(!m.has(norm(v)))m.set(norm(v),v)});
  if(atual&&!m.has(norm(atual)))m.set(norm(atual),atual);
  const vals=[...m.values()].sort((a,b)=>a.localeCompare(b));
  sel.innerHTML='<option value="">— Vazio —</option>'
    +vals.map(v=>'<option value="'+v.replace(/"/g,'&quot;')+'">'+v+'</option>').join('')
    +'<option value="__novo__">➕ Digitar novo...</option>';
  sel.value=(atual&&m.has(norm(atual)))?m.get(norm(atual)):'';
  const nv=document.getElementById(selId+'-novo');
  if(nv){nv.style.display='none';nv.value='';}
}
function scPbChange(selId,novoId){
  const nv=document.getElementById(novoId);
  if(!nv)return;
  nv.style.display=document.getElementById(selId).value==='__novo__'?'block':'none';
  if(nv.style.display==='block')nv.focus();
}
function lerSel(selId){
  const v=document.getElementById(selId).value;
  if(v!=='__novo__')return v;
  const nv=document.getElementById(selId+'-novo');
  return nv?nv.value.trim():'';
}
function fillStatusDatalists(){
  const scAll=[...new Set([...SC_PADRAO,...OPPS.map(r=>r.sc).filter(Boolean)])].sort();
  const pbAll=[...new Set([...PB_PADRAO,...OPPS.map(r=>r.pb).filter(Boolean)])].sort();
  document.getElementById('dl-sc-opts').innerHTML=scAll.map(s=>'<option value="'+s.replace(/"/g,'&quot;')+'">').join('');
  document.getElementById('dl-pb-opts').innerHTML=pbAll.map(s=>'<option value="'+s.replace(/"/g,'&quot;')+'">').join('');
}

function openEdit(id){
  fillStatusDatalists();

// anel de progresso em SVG — sem dependência, funciona nos dois temas
function anelPct(pct,cor,size,stroke){
  size=size||96;stroke=stroke||10;
  const r=(size-stroke)/2,c=2*Math.PI*r,cx=size/2;
  const p=Math.max(Math.min(pct,100),0);
  const off=c*(1-p/100);
  const fonte=size>=110?24:size>=90?19:16;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="display:block;flex-shrink:0">'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+cor+'" stroke-width="'+stroke+'" stroke-linecap="round"'
    +' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cx+')"'
    +' style="transition:stroke-dashoffset .7s ease"/>'
    +'<text x="'+cx+'" y="'+cx+'" text-anchor="middle" dominant-baseline="central" '
    +'style="font-size:'+fonte+'px;font-weight:700;fill:'+cor+';font-family:inherit">'+Math.round(pct)+'%</text>'
    +'</svg>';
}
// barra com marcador de ritmo: onde deveria estar hoje vs onde está
function barraRitmo(real,meta,esperado,cor,alt){
  alt=alt||10;
  const w=meta>0?Math.min(real/meta*100,100):0;
  const we=meta>0?Math.min(esperado/meta*100,100):0;
  return '<div style="position:relative;height:'+alt+'px;background:var(--border);border-radius:'+(alt/2)+'px;overflow:visible">'
    +'<div style="width:'+w.toFixed(1)+'%;height:'+alt+'px;border-radius:'+(alt/2)+'px;background:'+cor+';transition:width .7s ease"></div>'
    +(meta>0&&esperado<meta?'<div title="onde deveria estar hoje" style="position:absolute;top:-3px;left:calc('+we.toFixed(1)+'% - 1px);width:2px;height:'+(alt+6)+'px;background:var(--text);border-radius:1px;opacity:.55"></div>':'')
    +'</div>';
}
